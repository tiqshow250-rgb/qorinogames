function drawSwimmer(g, sx, sy, ppm, s){
  var viewAngle = s.viewAngle || 0;
  var depth = Math.cos(viewAngle);
  var absDepth = Math.max(0.16, Math.abs(depth));
  var isBack = depth < 0;

  var B = getBundle(s.bundleId || 'starter');
  var skin  = SKINS[s.skinIdx != null ? s.skinIdx : 0] || SKINS[0];
  var capC  = B.cap || CAP_COLORS[s.hairIdx || 0];
  var suitC = B.suit;
  var goggleC = B.goggle;
  var phase = s.phase || 0;

  g.save();
  g.translate(sx, sy);
  g.scale(ppm * absDepth, ppm);
  g.lineCap = 'round';
  g.lineJoin = 'round';

  /* ---- WATER RIPPLE around body (drawn under everything) ---- */
  g.fillStyle = 'rgba(180,230,255,.28)';
  g.beginPath(); g.ellipse(0.05, -0.02, 0.55, 0.11, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.45)';
  g.beginPath(); g.ellipse(0.05, -0.02, 0.42, 0.06, 0, 0, 7); g.fill();

  /* ---- WAKE TRAIL behind (left side) ---- */
  g.fillStyle = 'rgba(255,255,255,.30)';
  g.beginPath(); g.ellipse(-0.55, -0.03, 0.30, 0.045, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.15)';
  g.beginPath(); g.ellipse(-0.95, -0.03, 0.35, 0.030, 0, 0, 7); g.fill();

  /* ---- SUBMERGED BODY (visible through water) ---- */
  g.fillStyle = 'rgba(20,60,90,.35)';
  g.beginPath(); g.ellipse(0.10, 0.02, 0.48, 0.085, 0, 0, 7); g.fill();

  /* ---- TORSO (back, above water) ---- */
  g.fillStyle = suitC;
  g.beginPath();
  g.moveTo(-0.28,-0.10);
  g.quadraticCurveTo(-0.30,-0.24, -0.12,-0.27);
  g.lineTo(0.18,-0.27);
  g.quadraticCurveTo(0.32,-0.24, 0.30,-0.10);
  g.quadraticCurveTo(0.15,-0.02, 0,-0.02);
  g.quadraticCurveTo(-0.15,-0.02, -0.28,-0.10);
  g.closePath(); g.fill();

  /* skin shoulders (upper back) */
  g.fillStyle = skin;
  g.beginPath();
  g.ellipse(0.08,-0.24, 0.20, 0.055, 0, 0, 7);
  g.fill();

  /* ---- ARMS (freestyle stroke) ---- */
  var armPhase = phase;
  var leftArmA  = Math.sin(armPhase);              /* -1..1 */
  var rightArmA = Math.sin(armPhase + Math.PI);

  /* Back arm (opposite side to viewer) */
  drawSwimArm(g, -0.12, -0.24, isBack ? rightArmA : leftArmA, skin, 0.055, true);

  /* ---- HEAD ---- */
  g.fillStyle = skin;
  g.beginPath(); g.arc(0.26,-0.30, 0.115, 0, 7); g.fill();

  /* cap */
  g.fillStyle = capC;
  if (isBack){
    g.beginPath(); g.arc(0.26,-0.30, 0.118, 0, 7); g.fill();
    g.fillStyle = shadeHex(capC, -0.15);
    g.beginPath(); g.arc(0.26,-0.30, 0.118, Math.PI*0.15, Math.PI*0.85); g.closePath(); g.fill();
  } else {
    g.beginPath(); g.arc(0.26,-0.315, 0.118, Math.PI, Math.PI*2); g.closePath(); g.fill();
    /* face plate */
    g.fillStyle = shadeHex(skin, -0.06);
    g.beginPath(); g.ellipse(0.28,-0.265, 0.075, 0.045, 0, 0, 7); g.fill();
    /* goggles */
    g.fillStyle = goggleC;
    g.beginPath(); g.ellipse(0.30,-0.275, 0.048, 0.028, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(30,220,255,.7)';
    g.beginPath(); g.ellipse(0.30,-0.275, 0.036, 0.020, 0, 0, 7); g.fill();
    /* mouth splash */
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.arc(0.36,-0.245, 0.018, 0, 7); g.fill();
  }

  /* Cap accessories */
  if (B.acc === 'cap'){
    g.fillStyle = shadeHex(suitC,-0.15);
    g.beginPath(); g.arc(0.26,-0.30, 0.125, Math.PI*1.05, Math.PI*1.95); g.closePath(); g.fill();
  } else if (B.acc === 'visor'){
    g.fillStyle = 'rgba(30,220,255,.85)';
    g.beginPath(); g.arc(0.26,-0.30, 0.125, Math.PI*1.05, Math.PI*1.95); g.closePath(); g.fill();
  } else if (B.acc === 'headband'){
    g.fillStyle = goggleC;
    g.fillRect(0.14,-0.405, 0.24, 0.035);
  } else if (B.acc === 'crown'){
    g.fillStyle = '#ffd166';
    g.beginPath();
    g.moveTo(0.16,-0.415); g.lineTo(0.20,-0.48); g.lineTo(0.24,-0.44);
    g.lineTo(0.28,-0.49); g.lineTo(0.32,-0.44); g.lineTo(0.36,-0.48);
    g.lineTo(0.38,-0.41); g.closePath(); g.fill();
  } else if (B.acc === 'flower' && !isBack){
    g.fillStyle = '#ff6b9d';
    for (var i=0;i<5;i++){
      var a = i/5*Math.PI*2;
      g.beginPath(); g.arc(0.20+Math.cos(a)*0.032, -0.40+Math.sin(a)*0.032, 0.024, 0, 7); g.fill();
    }
    g.fillStyle = '#ffe066';
    g.beginPath(); g.arc(0.20,-0.40, 0.018, 0, 7); g.fill();
  }

  /* Front arm (nearest to viewer) */
  drawSwimArm(g, -0.12, -0.24, isBack ? leftArmA : rightArmA, skin, 0.06, false);

  /* ---- KICK SPLASH at back ---- */
  var kickPh = phase * 1.6;
  var kx1 = -0.42, ky1 = 0.02 + Math.sin(kickPh)*0.03;
  var kx2 = -0.44, ky2 = 0.02 + Math.sin(kickPh+Math.PI)*0.03;
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.beginPath(); g.arc(kx1, ky1, 0.022, 0, 7); g.fill();
  g.beginPath(); g.arc(kx2, ky2, 0.022, 0, 7); g.fill();
  g.fillStyle = 'rgba(200,240,255,.7)';
  g.beginPath(); g.arc(-0.55, 0.01, 0.030, 0, 7); g.fill();
  g.beginPath(); g.arc(-0.62, 0.02, 0.022, 0, 7); g.fill();

  /* ---- ARM SPLASH droplets near active arm ---- */
  var front = isBack ? leftArmA : rightArmA;
  var activeArmX = 0.10 + front*0.32;
  if (Math.abs(front) > 0.4){
    g.fillStyle = 'rgba(255,255,255,.75)';
    for (var d=0; d<3; d++){
      var dx = activeArmX + (Math.random()-0.5)*0.10;
      var dy = -0.34 + (Math.random()-0.5)*0.08;
      g.beginPath(); g.arc(dx, dy, 0.014, 0, 7); g.fill();
    }
  }

  g.restore();
}

function drawSwimArm(g, shoulderX, shoulderY, strokeAngle, skinColor, thickness, isBack){
  /* strokeAngle: -1 (arm down, pulling back) .. +1 (arm forward, reaching) */
  var angle = strokeAngle;                 /* -1..1 */
  var armLen = 0.30;

  /* angle in radians: -1 => -70° (down-back), +1 => +70° (up-forward) */
  var a = angle * (-Math.PI*0.38);

  /* arm tip */
  var ex = shoulderX + Math.cos(a) * armLen * (isBack ? 1 : 1);
  var ey = shoulderY + Math.sin(a) * armLen * -1;

  /* elbow at midpoint (bent) */
  var mx = shoulderX + (ex - shoulderX) * 0.5 + (isBack ? -0.04 : 0.04);
  var my = shoulderY + (ey - shoulderY) * 0.5 - 0.02;

  g.strokeStyle = isBack ? shadeHex(skinColor, -0.20) : skinColor;
  g.lineWidth = thickness;
  g.beginPath();
  g.moveTo(shoulderX, shoulderY);
  g.lineTo(mx, my);
  g.lineTo(ex, ey);
  g.stroke();

  /* hand */
  g.fillStyle = isBack ? shadeHex(skinColor, -0.20) : skinColor;
  g.beginPath(); g.arc(ex, ey, thickness*0.8, 0, 7); g.fill();
}

/* =========================================================
   BOATS & SHIPS
   ========================================================= */
function drawBoat(g, sx, sy, ppm, v){
  g.save();
  g.translate(sx, sy);
  g.scale(ppm, ppm);

  /* Water shadow / bow wave */
  g.fillStyle = 'rgba(0,0,0,.22)';
  g.beginPath(); g.ellipse(0, 0.05, v.len*0.52, 0.14, 0, 0, 7); g.fill();

  switch(v.type){
    case 'ship':      drawShip(g,v); break;
    case 'launch':    drawLaunch(g,v); break;
    case 'trawler':   drawTrawler(g,v); break;
    case 'speedboat': drawSpeedboat(g,v); break;
    case 'dinghy':    drawDinghy(g,v); break;
    case 'watertaxi': drawWaterTaxi(g,v); break;
  }
  g.restore();
}

/* Big cargo ship — like a bus */
function drawShip(g,v){
  var L = v.len;
  /* hull */
  g.fillStyle = v.c1;
  g.beginPath();
  g.moveTo(-L/2, 0.15);
  g.lineTo(-L/2+0.5, -0.65);
  g.lineTo(L/2-1.0, -0.65);
  g.quadraticCurveTo(L/2-0.2, -0.55, L/2, 0.15);
  g.closePath(); g.fill();
  /* waterline */
  g.fillStyle = '#c0392b';
  g.beginPath();
  g.moveTo(-L/2, 0.15);
  g.lineTo(L/2, 0.15);
  g.lineTo(L/2-0.15, -0.05);
  g.lineTo(-L/2+0.15, -0.05);
  g.closePath(); g.fill();
  /* deck */
  g.fillStyle = shadeHex(v.c1,-0.20);
  g.fillRect(-L/2+0.6, -0.75, L-1.2, 0.14);
  /* containers */
  var cols = ['#e63946','#f4a261','#2a9d8f','#e9c46a','#457b9d','#e76f51'];
  var cw = (L-1.4)/6;
  for (var i=0;i<6;i++){
    g.fillStyle = cols[i % cols.length];
    g.fillRect(-L/2+0.7+i*cw, -1.05, cw-0.08, 0.30);
    if (i % 2 === 0){
      g.fillStyle = cols[(i+2) % cols.length];
      g.fillRect(-L/2+0.7+i*cw, -1.38, cw-0.08, 0.30);
    }
  }
  /* bridge */
  g.fillStyle = v.c2;
  g.fillRect(L/2-1.9, -1.55, 1.2, 0.90);
  g.fillStyle = '#7fc8e8';
  g.fillRect(L/2-1.78, -1.45, 0.95, 0.24);
  /* funnel */
  g.fillStyle = shadeHex(v.c2,-0.25);
  g.fillRect(L/2-1.55, -1.92, 0.36, 0.40);
  /* flag */
  g.fillStyle = '#06d6a0';
  g.fillRect(L/2-1.9, -2.15, 0.20, 0.14);
}

/* Passenger launch — common on Bangladeshi rivers */
function drawLaunch(g,v){
  var L = v.len;
  /* hull */
  g.fillStyle = v.c1;
  g.beginPath();
  g.moveTo(-L/2, 0.15);
  g.quadraticCurveTo(-L/2+0.3, -0.85, -L/2+1.0, -0.85);
  g.lineTo(L/2-0.9, -0.85);
  g.quadraticCurveTo(L/2-0.2, -0.85, L/2, 0.15);
  g.closePath(); g.fill();
  /* waterline stripe */
  g.fillStyle = '#c0392b';
  g.fillRect(-L/2+0.2, -0.05, L-0.4, 0.16);
  /* deck 1 */
  g.fillStyle = shadeHex(v.c1,-0.15);
  g.fillRect(-L/2+0.4, -1.25, L-0.8, 0.42);
  /* windows */
  g.fillStyle = '#cfeaf7';
  var n = 8, seg = (L-1.2)/n;
  for (var i=0;i<n;i++) g.fillRect(-L/2+0.5+i*seg, -1.18, seg-0.22, 0.24);
  /* deck 2 */
  g.fillStyle = v.c2;
  g.fillRect(-L/2+1.0, -1.60, L-2.0, 0.38);
  for (var j=0;j<n-2;j++) g.fillRect(-L/2+1.1+j*seg, -1.54, seg-0.22, 0.20);
  /* wheelhouse */
  g.fillStyle = '#0e1a24';
  g.fillRect(L/2-1.5, -1.95, 0.75, 0.40);
}

/* Fishing trawler */
function drawTrawler(g,v){
  var L = v.len;
  g.fillStyle = v.c1;
  g.beginPath();
  g.moveTo(-L/2, 0.15);
  g.lineTo(-L/2+0.4, -0.55);
  g.lineTo(L/2-0.8, -0.55);
  g.quadraticCurveTo(L/2-0.15, -0.5, L/2, 0.15);
  g.closePath(); g.fill();
  /* deck house */
  g.fillStyle = v.c2;
  g.fillRect(-L/2+0.7, -1.05, 1.4, 0.55);
  g.fillStyle = '#7fc8e8';
  g.fillRect(-L/2+0.85, -0.98, 0.9, 0.20);
  /* mast + net */
  g.strokeStyle = '#5a3a22';
  g.lineWidth = 0.06;
  g.beginPath();
  g.moveTo(L/2-1.5, -0.55);
  g.lineTo(L/2-1.5, -1.80);
  g.stroke();
  g.beginPath();
  g.moveTo(L/2-2.0, -0.55);
  g.lineTo(L/2-1.5, -1.80);
  g.stroke();
  /* net */
  g.strokeStyle = 'rgba(230,230,230,.55)';
  g.lineWidth = 0.03;
  for (var i=0;i<5;i++){
    g.beginPath();
    g.moveTo(L/2-1.5 - i*0.14, -0.55);
    g.lineTo(L/2-1.5 - i*0.14 - 0.06, 0.0);
    g.stroke();
  }
}

/* Fast speedboat — like a car */
function drawSpeedboat(g,v){
  var L = v.len;
  /* hull */
  g.fillStyle = v.c1;
  g.beginPath();
  g.moveTo(-L/2, 0.10);
  g.quadraticCurveTo(-L/2+0.5, -0.55, -L/2+1.3, -0.60);
  g.lineTo(L/2-0.3, -0.55);
  g.quadraticCurveTo(L/2+0.1, -0.35, L/2, 0.10);
  g.closePath(); g.fill();
  /* white waterline */
  g.fillStyle = '#ffffff';
  g.fillRect(-L/2+0.2, -0.05, L-0.5, 0.10);
  /* windshield */
  g.fillStyle = '#7fc8e8';
  g.beginPath();
  g.moveTo(-L/2+1.4, -0.62);
  g.lineTo(-L/2+2.0, -0.90);
  g.lineTo(-L/2+2.8, -0.86);
  g.lineTo(-L/2+2.4, -0.60);
  g.closePath(); g.fill();
  /* driver */
  g.fillStyle = '#2b2b2b';
  g.beginPath(); g.arc(-L/2+2.1, -0.68, 0.14, 0, 7); g.fill();
  g.fillStyle = '#c98a5e';
  g.beginPath(); g.arc(-L/2+2.1, -0.82, 0.12, 0, 7); g.fill();
  /* wake */
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.beginPath();
  g.moveTo(-L/2-0.2, 0.05);
  g.lineTo(-L/2-1.2, 0.30);
  g.lineTo(-L/2-1.2, -0.15);
  g.closePath(); g.fill();
}

/* Small wooden dinghy / rowboat */
function drawDinghy(g,v){
  g.fillStyle = v.c1;
  g.beginPath();
  g.moveTo(-1.15, 0.05);
  g.quadraticCurveTo(-0.9, -0.50, 0.20, -0.55);
  g.quadraticCurveTo(1.0, -0.50, 1.20, 0.05);
  g.quadraticCurveTo(0, 0.20, -1.15, 0.05);
  g.closePath(); g.fill();
  /* water inside */
  g.fillStyle = shadeHex(v.c1, -0.28);
  g.beginPath();
  g.moveTo(-0.85, 0.02);
  g.quadraticCurveTo(0, -0.30, 0.85, 0.02);
  g.quadraticCurveTo(0, 0.10, -0.85, 0.02);
  g.closePath(); g.fill();
  /* bench */
  g.fillStyle = shadeHex(v.c1, -0.35);
  g.fillRect(-0.40, -0.30, 0.75, 0.06);
  /* boatman */
  g.fillStyle = '#2b2b2b';
  g.beginPath(); g.arc(0.10, -0.46, 0.13, 0, 7); g.fill();
  g.fillStyle = '#c98a5e';
  g.beginPath(); g.arc(0.10, -0.60, 0.11, 0, 7); g.fill();
  /* paddle */
  g.strokeStyle = '#7a5a3c';
  g.lineWidth = 0.05;
  g.beginPath();
  g.moveTo(-0.10,-0.40);
  g.lineTo(-0.55,-0.05);
  g.stroke();
}

/* Water taxi */
function drawWaterTaxi(g,v){
  var L = v.len;
  g.fillStyle = v.c1;
  g.beginPath();
  g.moveTo(-L/2, 0.10);
  g.lineTo(-L/2+0.4, -0.60);
  g.lineTo(L/2-0.4, -0.60);
  g.quadraticCurveTo(L/2, -0.50, L/2+0.1, 0.10);
  g.closePath(); g.fill();
  /* cabin */
  g.fillStyle = v.c2;
  g.fillRect(-L/2+0.5, -1.05, L-1.2, 0.48);
  g.fillStyle = '#cfeaf7';
  for (var i=0;i<4;i++) g.fillRect(-L/2+0.6+i*0.42, -0.98, 0.34, 0.32);
}

/* =========================================================
   RIVER / WATER RENDERING
   ========================================================= */
function drawWater(g, loc, camX){
  /* base gradient */
  var grd = g.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOT);
  grd.addColorStop(0, shadeHex(loc.water, 0.14));
  grd.addColorStop(0.5, loc.water);
  grd.addColorStop(1, shadeHex(loc.water, -0.16));
  g.fillStyle = grd;
  g.fillRect(0, RIVER_TOP, W, RIVER_BOT-RIVER_TOP);

  /* horizon ripple band */
  g.fillStyle = 'rgba(255,255,255,.14)';
  g.fillRect(0, RIVER_TOP, W, 3);

  /* animated wave rows */
  var rows = 22;
  for (var r=0; r<rows; r++){
    var t = r/rows;
    var y = RIVER_TOP + (RIVER_BOT-RIVER_TOP)*t;
    var amp = 2 + t*6;
    var speed = 0.6 + t*0.9;
    var off = mod(camX*0.05*speed + r*37, 160);
    g.strokeStyle = 'rgba(255,255,255,' + (0.05 + t*0.06) + ')';
    g.lineWidth = 1.2 + t;
    g.beginPath();
    for (var x=-40; x<W+40; x+=12){
      var wy = y + Math.sin((x+off)*0.025) * amp;
      if (x === -40) g.moveTo(x, wy); else g.lineTo(x, wy);
    }
    g.stroke();
  }

  /* bottom bank (behind HUD) */
  g.fillStyle = shadeHex(loc.water, -0.30);
  g.fillRect(0, RIVER_BOT, W, H-RIVER_BOT);
  g.fillStyle = 'rgba(255,255,255,.06)';
  g.fillRect(0, RIVER_BOT, W, 3);

  /* lane buoys */
  for (var i=0; i<LANES-1; i++){
    var y = (laneY(i)+laneY(i+1))/2;
    var off2 = -mod(camX*1.0, 55);
    for (var k=-1; k<25; k++){
      var bx = k*55 + off2 + i*18;
      if (bx < -20 || bx > W+20) continue;
      /* buoy: orange float */
      g.fillStyle = '#ff9f1c';
      g.beginPath(); g.ellipse(bx, y, 4.5, 3, 0, 0, 7); g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.ellipse(bx-1.2, y-1, 1.6, 1, 0, 0, 7); g.fill();
    }
  }

  /* start / finish lines */
  drawRiverMarker(g, 0, loc.accent, camX, false);
  drawRiverMarker(g, RACE_LEN, '#ffd166', camX, true);
}

function drawRiverMarker(g, worldX, color, camX, checkered){
  var sx = (worldX - camX);
  if (sx < -80 || sx > W+80) return;
  var grd = g.createLinearGradient(sx-10, 0, sx+10, 0);
  grd.addColorStop(0, 'rgba(255,255,255,0)');
  grd.addColorStop(.5, color);
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(sx-14, RIVER_TOP, 28, RIVER_BOT-RIVER_TOP);
  if (checkered){
    var size = 14;
    for (var y = RIVER_TOP; y < RIVER_BOT; y += size){
      for (var k=0;k<2;k++){
        var idx = Math.floor((y-RIVER_TOP)/size) + k;
        g.fillStyle = (idx % 2 === 0) ? '#ffffff' : '#0a1a26';
        g.fillRect(sx - size + k*size, y, size, size);
      }
    }
  }
}

/* =========================================================
   BACKGROUND / SKYLINE / BRIDGES
   ========================================================= */
function makeBuildings(seed, baseY, hMul){
  var rng = mulberry32(seed);
  var arr = [], x = 0;
  while (x < 3200){
    var w = 55 + rng()*120;
    var h = (70 + rng()*140) * hMul;
    arr.push({
      x: x, w: w, h: h,
      tone: (rng()-0.5)*0.30,
      lit: rng(),
      cols: Math.max(2, Math.floor(w/24)),
      rows: Math.max(2, Math.floor(h/30)),
      seed: rng()
    });
    x += w + 6 + rng()*34;
  }
  return arr;
}
var defaultFar = makeBuildings(1337, 300, 0.55);
var defaultMid = makeBuildings(9021, 300, 1.0);

function drawSkyline(g, arr, par, baseY, colorHex, camX){
  var off = -mod(camX*par, 3200);
  for (var rep=0; rep<2; rep++){
    for (var bi=0; bi<arr.length; bi++){
      var b = arr[bi];
      var x = b.x + off + rep*3200;
      if (x < -260 || x > W+260) continue;
      g.fillStyle = shadeHex(colorHex, b.tone);
      g.fillRect(x, baseY-b.h, b.w, b.h);
      g.fillStyle = shadeHex(colorHex, b.tone-0.12);
      g.fillRect(x, baseY-b.h, b.w, 4);
      if (b.lit > 0.25){
        var rng = mulberry32(Math.floor(b.seed*100000));
        var cw = b.w/b.cols, ch = b.h/b.rows;
        for (var r=1;r<b.rows;r++){
          for (var cc=0;cc<b.cols;cc++){
            if (rng() > 0.55){
              g.fillStyle = rng() > 0.5 ? 'rgba(255,225,150,.5)' : 'rgba(180,220,255,.35)';
              g.fillRect(x + cc*cw + cw*0.25, baseY - b.h + r*ch + ch*0.2, cw*0.5, ch*0.42);
            }
          }
        }
      }
    }
  }
}

/* Landmark props */
function drawProp(g, x, baseY, type, color){
  g.fillStyle = color;
  switch (type){
    case 'launch':
      g.fillRect(x, baseY-30, 130, 30);
      g.fillRect(x+10, baseY-110, 7, 80);
      g.fillRect(x+10, baseY-110, 70, 7);
      g.fillRect(x+73, baseY-110, 6, 35);
      g.fillStyle = shadeHex(color, 0.35);
      g.fillRect(x+40, baseY-60, 60, 30);
      break;
    case 'heritage':
      g.fillRect(x, baseY-52, 66, 52);
      g.beginPath(); g.arc(x+33, baseY-52, 22, Math.PI, 0); g.fill();
      g.fillRect(x+78, baseY-44, 46, 44);
      g.beginPath(); g.arc(x+101, baseY-44, 14, Math.PI, 0); g.fill();
      g.fillStyle = shadeHex(color, 0.35);
      g.fillRect(x+30, baseY-72, 6, 20);
      g.fillRect(x+98, baseY-62, 6, 18);
      break;
    case 'kiln':
      for (var i=0;i<3;i++){
        g.beginPath();
        g.moveTo(x+i*44, baseY);
        g.lineTo(x+i*44+12, baseY-58);
        g.lineTo(x+i*44+32, baseY-58);
        g.lineTo(x+i*44+44, baseY);
        g.closePath(); g.fill();
      }
      g.fillStyle = 'rgba(255,255,255,.35)';
      g.beginPath(); g.arc(x+22, baseY-70, 12, 0, 7); g.fill();
      g.beginPath(); g.arc(x+66, baseY-72, 10, 0, 7); g.fill();
      break;
    case 'char':
      g.beginPath();
      g.moveTo(x, baseY);
      g.quadraticCurveTo(x+50, baseY-30, x+120, baseY);
      g.closePath(); g.fill();
      g.fillStyle = shadeHex(color, 0.25);
      g.fillRect(x+30, baseY-20, 20, 20);
      g.fillRect(x+70, baseY-16, 18, 16);
      break;
    case 'tannery':
      for (var t=0;t<4;t++){
        g.fillRect(x+t*36, baseY-40-(t%2)*12, 30, 40+(t%2)*12);
      }
      break;
    case 'bridge':
      g.fillRect(x, baseY-90, 200, 10);
      g.fillRect(x+30, baseY-80, 10, 80);
      g.fillRect(x+160, baseY-80, 10, 80);
      break;
    case 'towers':
      g.fillRect(x, baseY-120, 32, 120);
      g.fillRect(x+38, baseY-155, 34, 155);
      g.fillRect(x+78, baseY-100, 32, 100);
      g.fillRect(x+116, baseY-135, 28, 135);
      break;
    case 'suburb':
      for (var s=0;s<5;s++){
        g.fillRect(x+s*40, baseY-60-(s%2)*18, 34, 60+(s%2)*18);
      }
      g.fillStyle = shadeHex(color, 0.35);
      for (var a=0;a<5;a++){
        for (var b=0;b<4;b++){
          g.fillRect(x+a*40+6, baseY-54-(a%2)*18+b*13, 22, 6);
        }
      }
      break;
    case 'port':
      g.fillRect(x, baseY-30, 130, 30);
      g.fillRect(x+10, baseY-115, 8, 85);
      g.fillRect(x+10, baseY-115, 80, 8);
      g.fillRect(x+83, baseY-115, 7, 40);
      g.fillRect(x+95, baseY-100, 7, 70);
      g.fillRect(x+95, baseY-100, 45, 7);
      g.fillStyle = shadeHex(color, 0.3);
      g.fillRect(x+20, baseY-20, 30, 20);
      g.fillRect(x+70, baseY-20, 30, 20);
      break;
    case 'mango':
      for (var m=0;m<4;m++){
        g.beginPath(); g.arc(x+m*46+22, baseY-38, 32, 0, 7); g.fill();
        g.fillRect(x+m*46+20, baseY-38, 5, 38);
      }
      break;
    case 'water':
      g.fillRect(x, baseY-6, 140, 6);
      for (var w=0;w<10;w++) g.fillRect(x+8+w*14, baseY-28, 2, 28);
      break;
    case 'boat':
      for (var bo=0;bo<3;bo++){
        g.beginPath();
        g.moveTo(x+bo*46, baseY-10);
        g.quadraticCurveTo(x+bo*46+22, baseY-22, x+bo*46+44, baseY-10);
        g.lineTo(x+bo*46+38, baseY);
        g.lineTo(x+bo*46+6, baseY);
        g.closePath(); g.fill();
        g.fillRect(x+bo*46+20, baseY-44, 3, 34);
      }
      break;
    case 'hills':
      g.beginPath();
      g.moveTo(x, baseY);
      g.quadraticCurveTo(x+40, baseY-85, x+95, baseY);
      g.quadraticCurveTo(x+140, baseY-60, x+200, baseY);
      g.closePath(); g.fill();
      break;
    case 'plains':
      g.fillRect(x, baseY-3, 180, 3);
      g.beginPath(); g.arc(x+30, baseY-18, 18, 0, 7); g.fill();
      g.beginPath(); g.arc(x+90, baseY-14, 14, 0, 7); g.fill();
      g.beginPath(); g.arc(x+140, baseY-16, 16, 0, 7); g.fill();
      break;
    case 'river':
      g.fillRect(x, baseY-4, 220, 4);
      g.fillStyle = shadeHex(color, 0.3);
      g.fillRect(x+20, baseY-12, 30, 8);
      break;
    case 'factory':
      g.fillRect(x, baseY-32, 110, 32);
      g.fillRect(x+18, baseY-105, 13, 73);
      g.fillRect(x+65, baseY-88, 13, 56);
      g.fillStyle = shadeHex(color, 0.35);
      g.beginPath(); g.arc(x+24, baseY-112, 10, 0, 7); g.fill();
      g.beginPath(); g.arc(x+71, baseY-95, 8, 0, 7); g.fill();
      break;
    case 'jute':
      g.fillRect(x, baseY-40, 110, 40);
      g.fillRect(x+15, baseY-115, 15, 75);
      g.fillRect(x+72, baseY-92, 15, 52);
      g.fillStyle = shadeHex(color, 0.35);
      g.beginPath(); g.arc(x+22, baseY-122, 11, 0, 7); g.fill();
      g.beginPath(); g.arc(x+79, baseY-100, 9, 0, 7); g.fill();
      break;
    case 'cotton':
      g.fillRect(x, baseY-22, 90, 22);
      g.fillStyle = shadeHex(color, 0.35);
      for (var ct=0;ct<10;ct++){
        g.beginPath(); g.arc(x+10+ct*16, baseY-12, 6, 0, 7); g.fill();
      }
      break;
    default:
      g.fillRect(x, baseY-52, 42, 52);
      g.fillRect(x+48, baseY-82, 32, 82);
      g.fillRect(x+86, baseY-42, 42, 42);
      break;
  }
}

function drawFarProps(g, loc, camX){

/* Metro rail bridge (top) — like previous game */
function drawMetroBridge(g, camX){
  var baseY = 205;
  var pOff = -mod(camX*0.24, 460);
  for (var i=-1;i<4;i++){
    var px = i*460 + pOff;
    g.fillStyle = 'rgba(120,132,150,.85)';
    g.fillRect(px-13, baseY, 26, 300-baseY);
    g.fillStyle = 'rgba(150,162,182,.9)';

  }
  g.fillStyle = '#5a6472'; g.fillRect(0, baseY-24, W, 20);
  g.fillStyle = '#79848f'; g.fillRect(0, baseY-30, W, 8);
  g.fillStyle = '#3d4552'; g.fillRect(0, baseY-6, W, 8);
  var tOff = -mod(camX*0.36, 2200);
  for (var t=0;t<2;t++) drawTrain(g, tOff + t*2200, baseY-30);
}
function drawTrain(g, x, baseY){
  var cars = 5, cw = 150, gap = 6;
  for (var i=0;i<cars;i++){
    var cx = x + i*(cw+gap);
    if (cx > W+200 || cx+cw < -200) continue;
    g.fillStyle = '#e8eef5'; rr(g, cx, baseY-56, cw, 54, 12); g.fill();
    g.fillStyle = '#2a9d8f'; g.fillRect(cx, baseY-30, cw, 9);
    g.fillStyle = '#7fc8e8';
    for (var w=0; w<4; w++) g.fillRect(cx+10+w*34, baseY-48, 26, 18);
    g.fillStyle = '#1d2b38'; g.fillRect(cx, baseY-8, cw, 6);
  }
}

/* Road bridge (mid) — like flyover */

/* =========================================================
   TRAFFIC GENERATION (boats)
   ========================================================= */
var VEH_TYPES = [
  {type:'ship',      len:13.0, w:1, speed:[1.0,2.4], c1:['#1f4a7a','#7a2c1f','#2a5c3a'], c2:['#e8eef5','#f4d35e','#f7f7f7']},
  {type:'launch',    len:9.0,  w:3, speed:[1.2,2.6], c1:['#1f7a3f','#c0392b','#2b6cb0'], c2:['#f4d35e','#f7f7f7','#e8eef5']},
  {type:'trawler',   len:6.0,  w:2, speed:[1.4,2.6], c1:['#d97706','#0e7490','#7c3aed'], c2:['#3f3f46','#f1f5f9','#fbbf24']},
  {type:'watertaxi', len:4.5,  w:2, speed:[2.4,4.6], c1:['#e63946','#457b9d','#2a9d8f'], c2:['#a8dadc','#f1faee','#ffe066']},
  {type:'speedboat', len:3.5,  w:4, speed:[3.2,5.8], c1:['#e63946','#457b9d','#f1faee','#2a9d8f','#e9c46a'], c2:['#a8dadc']},
  {type:'dinghy',    len:2.2,  w:3, speed:[0.7,1.8], c1:['#8b5a2b','#7a4a1f','#5a3a1f'], c2:['#c98a5e']}
];
var VEH_WEIGHT = 0;
for (var vt=0; vt<VEH_TYPES.length; vt++) VEH_WEIGHT += VEH_TYPES[vt].w;
function pickVehicleType(){
  var r = Math.random()*VEH_WEIGHT;
  for (var i=0;i<VEH_TYPES.length;i++){
    r -= VEH_TYPES[i].w;
    if (r <= 0) return VEH_TYPES[i];
  }
  return VEH_TYPES[4];
}
function generateTraffic(loc){
  var list = [];
  var dens = loc.dens;
  for (var lane=0; lane<LANES; lane++){
    var x = 34 + Math.random()*24;
    while (x < RACE_LEN + 60){
      var t = pickVehicleType();
      var c1 = t.c1[Math.floor(Math.random()*t.c1.length)];
      var c2 = t.c2[Math.floor(Math.random()*t.c2.length)];
      list.push({
        lane: lane, x: x, type: t.type, len: t.len,
        speed: t.speed[0] + Math.random()*(t.speed[1]-t.speed[0]),
        c1: c1, c2: c2
      });
      x += t.len + (10 + Math.random()*38)/dens;
    }
  }
  return list;
}

/* =========================================================
   RACE
   ========================================================= */
function startRace(cityId, areaId){
  var loc = getRaceLocation(cityId, areaId);
  var seed = hashStr(loc.id);
  var skyFar = makeBuildings(seed ^ 0x1234, 300, 0.55);
  var skyMid = makeBuildings(seed ^ 0x5678, 300, 1.0);

  var aiLanes = [0,1,2,3,5,6,7,8,9];

  var player = {
    isPlayer:true, name: user.id,
    lane: 4, laneTarget: 4, x: 0, speed: 0, phase: 0,
    stun: 0, finishTime: null, place: null,
    bundleId: user.equipped, skinIdx: user.skin, hairIdx: user.hair, styleIdx: user.style || 0,
    lean: 0
  };

  var ai = [];
  for (var k=0;k<aiLanes.length;k++){
    var ln = aiLanes[k];
    var bid = BUNDLES[1 + Math.floor(Math.random()*(BUNDLES.length-1))].id;
    ai.push({
      isPlayer:false, name: AI_NAMES[k] || ('Swimmer '+(k+1)),
      lane: ln, laneTarget: ln, x: 0, speed: 0,
      phase: Math.random()*6.28,
      stun: 0, finishTime: null, place: null,
      base: 6.8 + Math.random()*2.3,
      seed: Math.random()*100,
      laneTimer: 0,
      bundleId: bid,
      skinIdx: Math.floor(Math.random()*SKINS.length),
      hairIdx: Math.floor(Math.random()*CAP_COLORS.length),
      styleIdx: Math.floor(Math.random()*CAP_STYLES.length),
      lean: 0
    });
  }

  var vehicles = generateTraffic(loc);
  var byLane = [];
  for (var l=0;l<LANES;l++) byLane.push([]);
  for (var vi=0; vi<vehicles.length; vi++) byLane[vehicles[vi].lane].push(vehicles[vi]);
  for (var la=0; la<byLane.length; la++) byLane[la].sort(function(a,b){ return a.x-b.x; });

  race = {
    loc: loc, skyFar: skyFar, skyMid: skyMid,
    runners: [player].concat(ai),
    player: player, ai: ai,
    vehicles: vehicles, byLane: byLane,
    t: 0, countdown: 3.6, state: 'countdown', cameraX: -9,
    resultShown: false
  };
}

function findBlocker(r){
  var lane = Math.round(r.lane);
  var arr = race.byLane[lane];
  if (!arr) return null;
  var look = 5 + r.speed*0.45;
  for (var i=0;i<arr.length;i++){
    var v = arr[i];
    var d = v.x - r.x;
    if (d > 0.4 && d < look && v.speed < r.speed - 0.3) return v;
  }
  return null;
}
function laneClear(lane, x, range){
  var arr = race.byLane[lane];
  if (!arr) return true;
  for (var i=0;i<arr.length;i++){
    var v = arr[i];
    var d = v.x - x;
    if (d > -v.len*0.5 - 1.5 && d < range) return false;
  }
  return true;
}
function updateAI(r, dt){
  r.laneTimer -= dt;
  var blocker = findBlocker(r);
  if (blocker){
    if (r.laneTimer <= 0){
      var opts = [Math.round(r.lane)-1, Math.round(r.lane)+1].filter(function(l){ return l>=0 && l<LANES; });
      opts.sort(function(){ return Math.random()-0.5; });
      for (var i=0;i<opts.length;i++){
        var l = opts[i];
        if (laneClear(l, r.x, 10 + r.speed*0.6)){ r.laneTarget = l; r.laneTimer = 0.8; break; }
      }
    }
    if (Math.round(r.lane) === blocker.lane){
      var d = blocker.x - r.x;
      if (d < 4.5) r.speed = Math.min(r.speed, blocker.speed*0.92);
    }
  }
  var target = r.base * (1 + 0.045*Math.sin(race.t*0.6 + r.seed));
  if (r.x > 300) target *= 0.96;
  if (r.stun > 0){ r.stun -= dt; target = 0.6; }
  var accel = target > r.speed ? 5.5 : 12;
  r.speed += clamp(target - r.speed, -accel*dt, accel*dt);
  r.lane = lerp(r.lane, r.laneTarget, 1-Math.pow(0.0008, dt));
  r.x += r.speed*dt;
  r.phase += (r.speed*1.1 + 2.5) * dt * 2.2;
}
function updatePlayer(dt){
  var p = race.player;
  if (p.stun > 0){
    p.stun -= dt;
    p.speed = lerp(p.speed, 0.4, dt*5);
  } else {
    var target;
    if (ctrl.stop) target = 0;
    else if (ctrl.left) target = Math.max(1.0, MODES[ctrl.mode]*0.32);
    else if (ctrl.right) target = MODES[ctrl.mode];
    else target = MODES[ctrl.mode]*0.82;

    if (ctrl.mode === 'boost' && ctrl.right && !ctrl.stop && p.speed > 5){
      var cost = BOOST_COST*dt;
      if (user.coins > 0) user.coins = Math.max(0, user.coins - cost);
      if (user.coins <= 0){ ctrl.mode = 'run'; updateModeButtons(); }
    }
    var accel = target > p.speed ? 11 : 15;
    p.speed += clamp(target - p.speed, -accel*dt, accel*dt);
  }
  p.x += p.speed*dt;
  p.phase += (p.speed*1.15 + 2.5) * dt * 2.2;
  p.lane = lerp(p.lane, p.laneTarget, 1-Math.pow(0.0004, dt));

  if (p.stun <= 0){
    var lane = Math.round(p.lane);
    var arr = race.byLane[lane] || [];
    for (var i=0;i<arr.length;i++){
      var v = arr[i];
      var d = Math.abs(v.x - p.x);
      if (d < v.len*0.5 + 0.55){ p.stun = 1.15; p.speed = 0.3; shakeScreen(14); break; }
    }
  }
}
var shake = 0;
function shakeScreen(v){ shake = Math.max(shake, v); }

function updateRace(dt){
  if (!race) return;
  if (race.state === 'countdown'){
    race.countdown -= dt;
    if (race.countdown <= 0) race.state = 'racing';
    return;
  }
  race.t += dt;
  updatePlayer(dt);
  for (var i=0;i<race.ai.length;i++) updateAI(race.ai[i], dt);
  for (var v=0;v<race.vehicles.length;v++) race.vehicles[v].x += race.vehicles[v].speed*dt;
  race.cameraX = lerp(race.cameraX, race.player.x - 9, 1-Math.pow(0.00005, dt));
  if (shake > 0) shake = Math.max(0, shake - dt*45);

  for (var r=0;r<race.runners.length;r++){
    var run = race.runners[r];
    if (run.finishTime === null && run.x >= RACE_LEN){
      var overshoot = run.x - RACE_LEN;
      run.finishTime = race.t - (run.speed > 0.01 ? overshoot/run.speed : 0);
    }
  }
  var finished = race.runners.filter(function(r){ return r.finishTime !== null; })
                              .sort(function(a,b){ return a.finishTime-b.finishTime; });
  for (var f=0; f<finished.length; f++){
    if (finished[f].place === null) finished[f].place = f+1;
  }

  if (race.player.finishTime !== null && !race.resultShown){
    race.resultShown = true; resultTimer = 1.6; pendingResult = true;
  }
  if (pendingResult){
    resultTimer -= dt;
    if (resultTimer <= 0){ pendingResult = false; finishRace(); }
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  var g = ctx;
  var loc = race ? race.loc : null;
  var sky1 = loc ? loc.sky1 : '#7db8e0';
  var sky2 = loc ? loc.sky2 : '#e2f2fb';
  var farC = loc ? loc.far : '#a3b8cc';
  var midC = loc ? loc.mid : '#6e8aa5';
  var waterC = loc ? loc.water : '#2f6a90';
  var accent = loc ? loc.accent : '#4cc9f0';
  var camX = race ? race.cameraX*PPM : menuCam;
  var camXU = race ? race.cameraX : -9;

  g.save();
  if (shake > 0) g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  /* sky */
  var sky = g.createLinearGradient(0,0,0,RIVER_TOP+20);
  sky.addColorStop(0, sky1); sky.addColorStop(1, sky2);
  g.fillStyle = sky; g.fillRect(-40,-40,W+80,RIVER_TOP+60);

  /* sun */
  g.fillStyle = 'rgba(255,240,200,.55)';
  g.beginPath(); g.arc(1010, 110, 52, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,245,220,.9)';
  g.beginPath(); g.arc(1010, 110, 32, 0, 7); g.fill();

  var farArr = race ? race.skyFar : defaultFar;
  var midArr = race ? race.skyMid : defaultMid;

  drawSkyline(g, farArr, 0.12, 302, farC, camX);
  drawFarProps(g, loc, camX);
  drawMetroBridge(g, camX);
  drawSkyline(g, midArr, 0.36, 302, midC, camX);
  drawRoadBridge(g, camX);

  /* water */
  drawWater(g, loc || {water:waterC, accent:accent}, camX);

  var viewL = camXU - 12, viewR = camXU + 36;

  for (var lane=LANES-1; lane>=0; lane--){
    var gy = laneY(lane);
    var sc = laneScale(lane);
    var ppm = PPM * sc;

    if (race){
      var traffic = race.byLane[lane];
      for (var t=0;t<traffic.length;t++){
        var v = traffic[t];
        if (v.x < viewL - 14 || v.x > viewR + 14) continue;
        drawBoat(g, (v.x - camXU)*PPM, gy, ppm, v);
      }
    }

    if (race){
      for (var ri=0; ri<race.runners.length; ri++){
        var r = race.runners[ri];
        if (Math.round(r.lane) !== lane) continue;
        if (r.x < viewL - 4 || r.x > viewR + 4) continue;
        var sx = (r.x - camXU)*PPM;

        if (r.isPlayer && r.speed > 10){
          var fl = 24 + Math.random()*22;
          var grd = g.createLinearGradient(sx-fl, gy-8*sc, sx, gy-8*sc);
          grd.addColorStop(0,'rgba(120,220,255,0)');
          grd.addColorStop(1,'rgba(180,240,255,.85)');
          g.fillStyle = grd;
          g.beginPath();
          g.moveTo(sx-18*sc, gy-8*sc);
          g.lineTo(sx-fl, gy+2*sc);
          g.lineTo(sx-18*sc, gy+8*sc);
          g.closePath(); g.fill();
        }

        drawSwimmer(g, sx, gy, ppm, r);

        if (!r.isPlayer){
          g.fillStyle = 'rgba(0,0,0,.55)';
          g.font = 'bold ' + Math.round(11*sc+3) + 'px system-ui,sans-serif';
          g.textAlign = 'center';
          g.fillText(r.name, sx, gy - 55*sc);
        }
      }
    }
  }

  if (race && race.player.x > RACE_LEN - 60 && race.player.x < RACE_LEN + 30){
    g.fillStyle = 'rgba(255,209,102,.9)';
    g.font = 'bold 46px system-ui,sans-serif';
    g.textAlign = 'center';
    g.fillText('FINISH', W/2, 260);
  }

  if (race && race.state === 'countdown'){
    var c = race.countdown;
    g.fillStyle = 'rgba(2,10,18,.5)'; g.fillRect(0,0,W,H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (c > 0.6){
      g.fillStyle = '#ffd166';
      g.font = 'bold 180px system-ui,sans-serif';
      g.fillText(Math.ceil(c - 0.6), W/2, H/2);
    } else {
      g.fillStyle = '#06d6a0';
      g.font = 'bold 150px system-ui,sans-serif';
      g.fillText('GO!', W/2, H/2);
    }
    g.textBaseline = 'alphabetic';
  }

  g.restore();
}

/* =========================================================
   GAME LOOP
   ========================================================= */
function loop(ts){
  var dt = Math.min(0.05, (ts - lastTS)/1000 || 0);
  lastTS = ts;

  if (screen === 'game'){
    updateRace(dt);
    render();
    updateHUD();
  } else {
    menuCam += dt * 40;
    render();
    if (screen === 'home'){
      if (previewAutoRotate){
        previewAngle += dt * 0.7;
      } else {
        previewAngle += previewVelocity * dt;
        previewVelocity *= Math.pow(0.01, dt);
        if (Math.abs(previewVelocity) < 0.05) previewVelocity = 0;
        previewResumeTimer -= dt;
        if (previewResumeTimer <= 0 && !previewDragging) previewAutoRotate = true;
      }
      drawPreview();
    }
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   HUD
   ========================================================= */
var elHudPos   = document.getElementById('hud-pos');
var elHudTime  = document.getElementById('hud-time');
var elHudCoins = document.getElementById('hud-coins');
var elHudProg  = document.getElementById('hud-prog');
var elHudLoc   = document.getElementById('hud-loc');
var elLaneInd  = document.getElementById('lane-ind');

for (var li=LANES-1; li>=0; li--){
  var dot = document.createElement('div');
  dot.className = 'lane-dot';
  dot.setAttribute('data-lane', li);
  elLaneInd.appendChild(dot);
}

function updateHUD(){
  if (!race) return;
  var p = race.player;
  var finished = race.runners.filter(function(r){ return r.finishTime !== null; })
                              .sort(function(a,b){ return a.finishTime-b.finishTime; });
  var pos = finished.indexOf(p) + 1;
  if (pos === 0){
    pos = 1;
    for (var i=0;i<race.runners.length;i++){
      var r = race.runners[i];
      if (r !== p && r.x > p.x) pos++;
    }
  }
  elHudPos.textContent = pos;
  elHudTime.textContent = race.t.toFixed(2);
  elHudCoins.textContent = Math.floor(user.coins);
  elHudProg.style.width = clamp(p.x/RACE_LEN*100, 0, 100) + '%';
  elHudLoc.textContent = race.loc.fullLabel;
  var lane = Math.round(p.lane);
  var dots = elLaneInd.querySelectorAll('.lane-dot');
  for (var d=0; d<dots.length; d++){
    dots[d].classList.toggle('on', parseInt(dots[d].getAttribute('data-lane'),10) === lane);
  }
}

/* =========================================================
   RESULT
   ========================================================= */
function finishRace(){
  var p = race.player;
  var place = p.place || 10;
  var time = p.finishTime || race.t;
  var loc = race.loc;

  var reward = place === 1 ? WIN_COINS : 0;
  user.coins += reward;
  user.races = (user.races || 0) + 1;
  if (place === 1) user.wins = (user.wins || 0) + 1;
  if (!user.best) user.best = {};
  var prevBest = user.best[loc.id];
  if (!prevBest || time < prevBest) user.best[loc.id] = time;
  saveGuest();

  var suffixes = ['th','st','nd','rd'];
  var v = place % 100;
  var suffix = suffixes[(v-20)%10] || suffixes[v] || suffixes[0];
  var el = document.getElementById('res-place');
  el.textContent = place + suffix;
  el.className = 'place';
  if (place === 1) el.classList.add('gold');
  else if (place === 2) el.classList.add('silver');
  else if (place === 3) el.classList.add('bronze');
  else el.classList.add('none');

  document.getElementById('res-loc').textContent = loc.fullLabel;
  document.getElementById('res-time').textContent = time.toFixed(2) + 's';
  document.getElementById('res-best').textContent = user.best[loc.id].toFixed(2) + 's';
  document.getElementById('res-pos').textContent = place + ' / 10';

  var rEl = document.getElementById('res-reward');
  if (reward > 0){
    rEl.textContent = '+100 🪙  First Place Prize!';
    rEl.className = 'reward';
  } else {
    rEl.textContent = 'No reward — only 1st place earns coins.';
    rEl.className = 'reward none';
  }

  var list = document.getElementById('res-list');
  list.innerHTML = '';
  var sorted = race.runners.filter(function(r){ return r.finishTime !== null; })
                           .sort(function(a,b){ return a.finishTime-b.finishTime; });
  for (var i=0;i<sorted.length;i++){
    var r = sorted[i];
    var row = document.createElement('div');
    if (r.isPlayer) row.classList.add('me');
    row.innerHTML = '<span>' + (i+1) + '. ' + (r.isPlayer ? user.id : r.name) + '</span><span>' + r.finishTime.toFixed(2) + 's</span>';
    list.appendChild(row);
  }

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
}

/* =========================================================
   SCREEN MANAGEMENT
   ========================================================= */
function showScreen(id){
  var ids = ['scr-auth','scr-home','scr-shop','scr-city','scr-area','scr-result'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (ids[i] === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  }
}

/* =========================================================
   AUTH
   ========================================================= */
document.getElementById('guest-id-display').textContent = user.id;
document.getElementById('btn-enter').addEventListener('click', function(){ enterHome(); });

/* =========================================================
   HOME
   ========================================================= */
var prevCanvas = document.getElementById('prev');
var prevCtx = prevCanvas.getContext('2d');
var charPanel = document.getElementById('char-panel');

function enterHome(){
  screen = 'home';
  showScreen('scr-home');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  refreshHome();
  previewAngle = 0;
  previewAutoRotate = true;
  previewVelocity = 0;
}

function refreshHome(){
  document.getElementById('home-coins').textContent = Math.floor(user.coins);
  document.getElementById('home-user').textContent = user.id;
  document.getElementById('equipped-name').textContent = getBundle(user.equipped).name;

  var sg = document.getElementById('stats-grid');
  sg.innerHTML = '<div class="it"><div class="v">' + (user.wins || 0) + '</div><div class="l">WINS</div></div>' +
                 '<div class="it"><div class="v blue">' + (user.races || 0) + '</div><div class="l">RACES</div></div>' +
                 '<div class="it"><div class="v green">' + user.owned.length + '</div><div class="l">KITS</div></div>';

  buildSwatches();
  buildOutfitRow();
  drawPreview();
}

function drawPreview(){
  var g = prevCtx;
  g.clearRect(0,0,prevCanvas.width, prevCanvas.height);

  /* water pool beneath swimmer */
  var poolY = 330;
  var grd = g.createRadialGradient(190, poolY, 20, 190, poolY, 200);
  grd.addColorStop(0, 'rgba(76,201,240,.35)');
  grd.addColorStop(1, 'rgba(76,201,240,0)');
  g.fillStyle = grd;
  g.fillRect(0,0,prevCanvas.width, prevCanvas.height);

  /* water surface ellipse */
  var depth = Math.cos(previewAngle);
  var absDepth = Math.max(0.16, Math.abs(depth));
  g.fillStyle = 'rgba(30,120,180,.55)';
  g.beginPath(); g.ellipse(190, poolY, 130*absDepth, 22, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(120,200,240,.35)';
  g.beginPath(); g.ellipse(190, poolY, 110*absDepth, 15, 0, 0, 7); g.fill();

  /* ripple rings */
  g.strokeStyle = 'rgba(255,255,255,.20)';
  g.lineWidth = 1;
  g.beginPath(); g.ellipse(190, poolY, 150*absDepth, 26, 0, 0, 7); g.stroke();

  drawSwimmer(g, 190, poolY - 55, 200, {
    bundleId: user.equipped,
    skinIdx: user.skin,
    hairIdx: user.hair,
    styleIdx: user.style || 0,
    phase: 0.8,
    viewAngle: previewAngle
  });

  /* angle indicator */
  var deg = (mod(previewAngle, Math.PI*2) * 180 / Math.PI).toFixed(0);
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.font = '600 11px system-ui,sans-serif';
  g.textAlign = 'center';
  g.fillText(deg + '°', 190, 425);
}

/* ---------- DRAG ROTATION ---------- */
var pointerActive = false;
function onPointerDown(e){
  pointerActive = true; previewDragging = true; previewAutoRotate = false;
  previewLastX = e.clientX; previewVelocity = 0;
  if (charPanel.setPointerCapture) charPanel.setPointerCapture(e.pointerId);
}
function onPointerMove(e){
  if (!pointerActive) return;
  var dx = e.clientX - previewLastX;
  previewLastX = e.clientX;
  var delta = dx * 0.014;
  previewAngle += delta;
  previewVelocity = delta * 60;
}
function onPointerUp(){
  if (!pointerActive) return;
  pointerActive = false; previewDragging = false;
  previewResumeTimer = 2.2; previewVelocity *= 0.4;
}
charPanel.addEventListener('pointerdown', onPointerDown);
charPanel.addEventListener('pointermove', onPointerMove);
charPanel.addEventListener('pointerup', onPointerUp);
charPanel.addEventListener('pointercancel', onPointerUp);
charPanel.addEventListener('pointerleave', onPointerUp);

function buildSwatches(){
  var skinBox = document.getElementById('skin-swatches');
  skinBox.innerHTML = '';
  for (var si=0; si<SKINS.length; si++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'sw' + (user.skin === i ? ' on' : '');
      d.style.background = SKINS[i];
      d.onclick = function(){ user.skin = i; saveGuest(); buildSwatches(); drawPreview(); };
      skinBox.appendChild(d);
    })(si);
  }

  var hairBox = document.getElementById('hair-swatches');
  hairBox.innerHTML = '';
  for (var hi=0; hi<CAP_COLORS.length; hi++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'sw' + (user.hair === i ? ' on' : '');
      d.style.background = CAP_COLORS[i];
      d.onclick = function(){ user.hair = i; saveGuest(); buildSwatches(); drawPreview(); };
      hairBox.appendChild(d);
    })(hi);
  }

  var styleBox = document.getElementById('style-swatches');
  styleBox.innerHTML = '';
  for (var sti=0; sti<CAP_STYLES.length; sti++){
    (function(i){
      var b = document.createElement('button');
      b.className = 'stylebtn' + ((user.style||0) === i ? ' on' : '');
      var s = CAP_STYLES[i];
      b.textContent = s.charAt(0).toUpperCase() + s.slice(1);
      b.onclick = function(){ user.style = i; saveGuest(); buildSwatches(); drawPreview(); };
      styleBox.appendChild(b);
    })(sti);
  }
}

function buildOutfitRow(){
  var row = document.getElementById('owned-outfits');
  row.innerHTML = '';
  for (var i=0; i<user.owned.length; i++){
    (function(id){
      var B = getBundle(id);
      var card = document.createElement('div');
      card.className = 'outfit-card' + (user.equipped === id ? ' on' : '');
      var c = document.createElement('canvas');
      c.width = 70; c.height = 84;
      var cg = c.getContext('2d');
      cg.fillStyle = 'rgba(255,255,255,.04)';
      cg.fillRect(0,0,70,84);
      /* waterline in card */
      cg.fillStyle = 'rgba(60,160,220,.30)';
      cg.beginPath(); cg.ellipse(35, 62, 30, 6, 0, 0, 7); cg.fill();
      drawSwimmer(cg, 35, 58, 62, {
        bundleId: id, skinIdx: user.skin, hairIdx: user.hair, styleIdx: user.style||0,
        phase: 0.6, viewAngle: 0
      });
      var span = document.createElement('span');
      span.textContent = B.name;
      card.appendChild(c);
      card.appendChild(span);
      card.onclick = function(){ user.equipped = id; saveGuest(); refreshHome(); };
      row.appendChild(card);
    })(user.owned[i]);
  }
}

document.getElementById('btn-play').onclick = function(){
  buildCityGrid();
  screen = 'city';
  showScreen('scr-city');
  document.getElementById('city-coins').textContent = Math.floor(user.coins);
};
document.getElementById('btn-shop').onclick = function(){
  buildShop();
  screen = 'shop';
  showScreen('scr-shop');
};
document.getElementById('btn-shop-back').onclick = function(){ enterHome(); };
document.getElementById('btn-city-back').onclick = function(){ enterHome(); };
document.getElementById('btn-area-back').onclick = function(){
  buildCityGrid();
  screen = 'city';
  showScreen('scr-city');
};

document.getElementById('btn-newid').onclick = function(){
  if (!window.confirm('Start a new swimmer ID?\nThis will reset your coins, kits and best times.')) return;
  storage.removeItem(GUEST_KEY);
  user = loadOrCreateGuest();
  document.getElementById('guest-id-display').textContent = user.id;
  refreshHome();
};

/* =========================================================
   SHOP
   ========================================================= */
function buildShop(){
  document.getElementById('shop-coins').textContent = Math.floor(user.coins);
  var grid = document.getElementById('shop-grid');
  grid.innerHTML = '';

  for (var bi=0; bi<BUNDLES.length; bi++){
    (function(B){
      var owned = user.owned.indexOf(B.id) !== -1;
      var equipped = user.equipped === B.id;
      var card = document.createElement('div');
      card.className = 'bcard' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '');

      var c = document.createElement('canvas');
      c.width = 110; c.height = 140;
      var cg = c.getContext('2d');
      cg.fillStyle = 'rgba(255,255,255,.03)'; cg.fillRect(0,0,110,140);
      cg.fillStyle = 'rgba(60,160,220,.28)';
      cg.beginPath(); cg.ellipse(55, 105, 48, 10, 0, 0, 7); cg.fill();
      drawSwimmer(cg, 55, 100, 100, {
        bundleId: B.id, skinIdx: user.skin, hairIdx: user.hair, styleIdx: user.style||0,
        phase: 0.6, viewAngle: 0
      });

      var h4 = document.createElement('h4'); h4.textContent = B.name;
      var p = document.createElement('p'); p.textContent = B.desc;
      var price = document.createElement('div'); price.className = 'price';
      price.textContent = B.price === 0 ? 'FREE' : ('🪙 ' + B.price);
      var btn = document.createElement('button');
      btn.className = 'buybtn';
      if (equipped){
        btn.textContent = 'EQUIPPED'; btn.disabled = true;
      } else if (owned){
        btn.textContent = 'EQUIP'; btn.classList.add('eq');
        btn.onclick = function(){ user.equipped = B.id; saveGuest(); buildShop(); };
      } else {
        btn.textContent = 'BUY'; btn.disabled = user.coins < B.price;
        btn.onclick = function(){
          if (user.coins < B.price) return;
          user.coins -= B.price;
          user.owned.push(B.id);
          user.equipped = B.id;
          saveGuest(); buildShop();
        };
      }
      card.appendChild(c); card.appendChild(h4); card.appendChild(p);
      card.appendChild(price); card.appendChild(btn);
      grid.appendChild(card);
    })(BUNDLES[bi]);
  }
}

/* =========================================================
   CITY / RIVER SELECT
   ========================================================= */
function buildCityGrid(){
  var grid = document.getElementById('city-grid');
  grid.innerHTML = '';

  for (var ci=0; ci<CITIES.length; ci++){
    (function(city){
      var card = document.createElement('div');
      card.className = 'ccard' + (city.hasAreas ? ' dhaka-card' : '');

      var bar = document.createElement('div');
      bar.className = 'swatchbar';
      if (city.hasAreas){
        bar.style.background = 'linear-gradient(135deg, #ffd166, #ff9f1c 45%, #2a6a90 70%, #1a4a6a)';
      } else {
        bar.style.background = 'linear-gradient(180deg, ' + city.sky1 + ', ' + city.sky2 + ' 45%, ' + city.water + ' 55%, ' + city.water + ')';
      }

      var mini = document.createElement('div');
      mini.style.cssText = 'position:absolute;bottom:48%;left:0;right:0;height:26px;display:flex;align-items:flex-end;gap:3px;padding:0 6px';
      var midCol = city.hasAreas ? '#7a5c4a' : city.mid;
      for (var m=0;m<7;m++){
        var b = document.createElement('div');
        b.style.cssText = 'flex:1;background:' + midCol + ';height:' + (35 + Math.random()*65) + '%;border-radius:2px 2px 0 0';
        mini.appendChild(b);
      }
      bar.appendChild(mini);

      var h4 = document.createElement('h4'); h4.textContent = city.name;
      var sm = document.createElement('small'); sm.textContent = city.sub;

      card.appendChild(bar); card.appendChild(h4); card.appendChild(sm);

      if (city.hasAreas){
        var badge = document.createElement('div');
        badge.className = 'badge10'; badge.textContent = '10 GHATS';
        card.appendChild(badge);
      } else if (user.best && user.best[city.id]){
        var best = document.createElement('div');
        best.className = 'best';
        best.textContent = '🏆 ' + user.best[city.id].toFixed(2) + 's';
        card.appendChild(best);
      }

      card.onclick = function(){
        if (city.hasAreas){
          currentCityId = city.id;
          buildAreaGrid();
          screen = 'area';
          showScreen('scr-area');
        } else {
          enterRace(city.id, null);
        }
      };
      grid.appendChild(card);
    })(CITIES[ci]);
  }
}

/* =========================================================
   DHAKA GHAT SELECT
   ========================================================= */
function buildAreaGrid(){
  var grid = document.getElementById('area-grid');
  grid.innerHTML = '';

  for (var ai=0; ai<DHAKA_AREAS.length; ai++){
    (function(area){
      var card = document.createElement('div');
      card.className = 'ccard';

      var bar = document.createElement('div');
      bar.className = 'swatchbar';
      bar.style.background = 'linear-gradient(180deg, ' + area.sky1 + ', ' + area.sky2 + ' 45%, ' + area.water + ' 55%, ' + area.water + ')';

      var mini = document.createElement('div');
      mini.style.cssText = 'position:absolute;bottom:48%;left:0;right:0;height:26px;display:flex;align-items:flex-end;gap:3px;padding:0 6px';
      for (var m=0;m<7;m++){
        var b = document.createElement('div');
        b.style.cssText = 'flex:1;background:' + area.mid + ';height:' + (35 + Math.random()*65) + '%;border-radius:2px 2px 0 0';
        mini.appendChild(b);
      }
      bar.appendChild(mini);

      var h4 = document.createElement('h4'); h4.textContent = area.name;
      var sm = document.createElement('small'); sm.textContent = area.sub;

      card.appendChild(bar); card.appendChild(h4); card.appendChild(sm);

      var key = 'dhaka_' + area.id;
      if (user.best && user.best[key]){
        var best = document.createElement('div');
        best.className = 'best';
        best.textContent = '🏆 ' + user.best[key].toFixed(2) + 's';
        card.appendChild(best);
      }

      card.onclick = function(){ enterRace('dhaka', area.id); };
      grid.appendChild(card);
    })(DHAKA_AREAS[ai]);
  }
}

/* =========================================================
   ENTER RACE
   ========================================================= */
function enterRace(cityId, areaId){
  startRace(cityId, areaId);
  screen = 'game';
  showScreen('');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  ctrl.mode = 'run';
  ctrl.left = ctrl.right = ctrl.stop = false;
  updateModeButtons();
}

/* =========================================================
   CONTROLS
   ========================================================= */
function bindHold(el, on, off){
  function start(e){ if (e.preventDefault) e.preventDefault(); on(); el.classList.add('active'); }
  function end(){ off(); el.classList.remove('active'); }
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindHold(document.getElementById('btnLeft'),  function(){ ctrl.left=true; },  function(){ ctrl.left=false; });
bindHold(document.getElementById('btnRight'), function(){ ctrl.right=true; }, function(){ ctrl.right=false; });
bindHold(document.getElementById('btnStop'),  function(){ ctrl.stop=true; },  function(){ ctrl.stop=false; });
bindHold(document.getElementById('btnUp'),    function(){ changeLane(1); },   function(){});
bindHold(document.getElementById('btnDown'),  function(){ changeLane(-1); },  function(){});

function changeLane(dir){
  if (!race || race.state === 'countdown') return;
  var p = race.player;
  p.laneTarget = clamp(p.laneTarget + dir, 0, LANES-1);
}

var modeBtns = document.querySelectorAll('.modebtn');
for (var mbi=0; mbi<modeBtns.length; mbi++){
  (function(b){
    b.addEventListener('click', function(){
      if (b.getAttribute('data-mode') === 'boost' && user.coins < 5) return;
      ctrl.mode = b.getAttribute('data-mode');
      updateModeButtons();
    });
  })(modeBtns[mbi]);
}
function updateModeButtons(){
  for (var i=0;i<modeBtns.length;i++){
    modeBtns[i].classList.toggle('on', modeBtns[i].getAttribute('data-mode') === ctrl.mode);
  }
}

window.addEventListener('keydown', function(e){
  if (screen !== 'game') return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ctrl.right = true;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') ctrl.left  = true;
  if (e.key === ' ') { ctrl.stop = true; if (e.preventDefault) e.preventDefault(); }
  if (e.key === 'ArrowUp'    || e.key === 'w' || e.key === 'W') changeLane(1);
  if (e.key === 'ArrowDown'  || e.key === 's' || e.key === 'S') changeLane(-1);
  if (e.key === '1'){ ctrl.mode='walk'; updateModeButtons(); }
  if (e.key === '2'){ ctrl.mode='run';  updateModeButtons(); }
  if (e.key === '3'){ if(user.coins>=5){ ctrl.mode='boost'; updateModeButtons(); } }
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ctrl.right = false;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') ctrl.left  = false;
  if (e.key === ' ') ctrl.stop = false;
});

/* =========================================================
   RESULT BUTTONS
   ========================================================= */
document.getElementById('btn-again').onclick = function(){
  if (race){
    var loc = race.loc;
    if (loc.id.indexOf('dhaka_') === 0){
      enterRace('dhaka', loc.id.replace('dhaka_',''));
    } else {
      enterRace(loc.id, null);
    }
  }
};
document.getElementById('btn-result-home').onclick = function(){
  race = null;
  enterHome();
};

/* =========================================================
   RESIZE
   ========================================================= */
function resizeApp(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('guest-id-display').textContent = user.id;
race = null;
menuCam = 0;
requestAnimationFrame(loop);
</script>

<template id="game-hockey"><!DOCTYPE html>

  .court-card h5,.country-card h5{font-size:12px;font-weight:800}

  .country-card .flag{width:34px;height:22px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}

  .diff-card:hover{background:rgba(255,255,255,.09)}

  .diff-card .name{font-size:13px;font-weight:800}

  .diff-card .desc{font-size:10px;color:#7d90a8;margin-top:2px}

  #hud-match{position:absolute;inset:0;z-index:15;pointer-events:none}

  .scoreboard{display:flex;align-items:center;gap:16px;background:rgba(4,12,8,.88);border:1px solid rgba(255,255,255,.15);
    border-radius:14px;padding:8px 22px}

  .scoreboard .team .flag{width:26px;height:17px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
  .scoreboard .score{font-size:26px;font-weight:900;color:#ffd166;letter-spacing:2px;line-height:1}
  .scoreboard .timer{font-size:20px;font-weight:800;color:#8cdc8c;font-family:'Courier New',monospace;
    padding-left:16px;border-left:1px solid rgba(255,255,255,.15);margin-left:6px}

  .joystick{position:absolute;left:34px;bottom:34px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,0,0,.55),rgba(0,0,0,.30));border:2px solid rgba(255,255,255,.28);
    pointer-events:auto;touch-action:none;z-index:25}
  .knob{position:absolute;left:50%;top:50%;width:74px;height:74px;margin-left:-37px;margin-top:-37px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.7),rgba(140,220,140,.55));
    border:2px solid rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
  .joystick .lbl{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);
    font-size:9px;letter-spacing:2px;color:#7dba8e;font-weight:800;text-transform:uppercase;white-space:nowrap}
  .actionbtn{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:900;color:#fff;cursor:pointer;user-select:none;touch-action:none;pointer-events:auto;z-index:25;
    border:2px solid rgba(255,255,255,.4);box-shadow:0 6px 16px rgba(0,0,0,.5);transition:.06s}
  .actionbtn .ico{font-size:22px;line-height:1}

  .actionbtn.active{transform:scale(.92);filter:brightness(1.25)}
  #btnShoot{right:34px;bottom:130px;width:96px;height:96px;background:radial-gradient(circle at 35% 35%,#ff8a5c,#c93a1a)}
  #btnPass{right:150px;bottom:64px;width:78px;height:78px;background:radial-gradient(circle at 35% 35%,#6ec5f0,#2a6a9a)}
  #btnSprint{right:34px;bottom:34px;width:78px;height:78px;background:radial-gradient(circle at 35% 35%,#ffd166,#a86a00)}
  #btnSwitch{right:150px;bottom:158px;width:64px;height:64px;background:radial-gradient(circle at 35% 35%,#c88ae8,#5a2a7a)}

    background:rgba(4,12,8,.8);border:1px solid rgba(255,255,255,.2);pointer-events:auto;z-index:25;
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#c3d3e4}

  #scr-pause,#scr-result{align-items:center;justify-content:center;background:rgba(2,6,4,.88);backdrop-filter:blur(9px);z-index:30}
  .pause-box{width:420px;padding:34px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(12,28,20,.97),rgba(4,12,8,.97));border:1px solid rgba(140,220,140,.28)}

    font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px;transition:.15s;
    background:linear-gradient(135deg,#8cdc8c,#4cc9f0);color:#0a1f14}
  .pause-box button.ghost{background:rgba(255,255,255,.08);color:#c3d3e4;border:1px solid rgba(255,255,255,.16)}

  .res-box{width:560px;padding:28px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(12,28,20,.97),rgba(4,12,8,.97));border:1px solid rgba(140,220,140,.28)}
  .res-box h2{font-size:14px;letter-spacing:5px;color:#7dba8e;text-transform:uppercase;margin-bottom:4px}
  .res-loc{font-size:12px;color:#8cdc8c;letter-spacing:2px;font-weight:700;margin-bottom:8px}
  .res-outcome{font-size:52px;font-weight:900;line-height:1;margin:6px 0;
    background:linear-gradient(90deg,#8cdc8c,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-outcome.loss{background:linear-gradient(90deg,#ff8a5c,#ff5a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-outcome.draw{background:linear-gradient(90deg,#c3d3e4,#7d90a8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-score{font-size:38px;font-weight:900;color:#ffd166;letter-spacing:6px;margin:14px 0 6px}
  .res-teams{font-size:13px;color:#9fb2c8;letter-spacing:1.5px;margin-bottom:14px}
  .res-stats{display:flex;justify-content:center;gap:24px;margin-bottom:16px;font-size:11px;color:#9fb2c8}
  .res-stats b{display:block;color:#4cc9f0;font-size:17px;font-weight:800;margin-bottom:2px}
  .reward{font-size:17px;font-weight:800;color:#ffd166;margin-bottom:14px}
  .reward.none{color:#6b7c8f;font-size:13px}
  .res-actions{display:flex;gap:12px}
  .res-actions button{flex:1;padding:13px;border-radius:12px;border:0;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:1px;transition:.2s}
  .res-actions .again{background:linear-gradient(135deg,#8cdc8c,#4cc9f0);color:#0a1f14}
  .res-actions .home{background:rgba(255,255,255,.08);color:#c3d3e4;border:1px solid rgba(255,255,255,.16)}

  #notice{position:absolute;left:50%;top:120px;transform:translateX(-50%);z-index:28;
    background:rgba(4,12,8,.92);border:1px solid rgba(140,220,140,.5);border-radius:14px;
    padding:12px 30px;font-size:18px;font-weight:900;color:#8cdc8c;letter-spacing:3px;
    opacity:0;pointer-events:none;transition:opacity .3s}
  #notice.on{opacity:1}

  /* Tournament bracket */
  .bracket{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px;overflow-y:auto}
  .bracket-col{display:flex;flex-direction:column;gap:14px}
  .bracket-match{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:12px;
    padding:10px 14px;min-width:200px;position:relative}
  .bracket-match.done{border-color:rgba(140,220,140,.4);background:rgba(140,220,140,.08)}
  .bracket-match.current{border-color:#ffd166;background:rgba(255,209,102,.12);box-shadow:0 0 20px rgba(255,209,102,.3)}
  .bracket-match.locked{opacity:.35}
  .bracket-match .bm-team{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:3px 0}
  .bracket-match .bm-team.win{color:#8cdc8c}
  .bracket-match .bm-team .code{font-family:'Courier New',monospace;font-size:11px;color:#7d90a8;margin-left:auto}
  .bracket-title{text-align:center;font-size:11px;letter-spacing:3px;color:#5e9e6e;text-transform:uppercase;
    margin-bottom:6px;font-weight:800}
  .trophy{text-align:center;padding:20px}
  .trophy .emoji{font-size:60px;margin-bottom:10px}
  .trophy h3{font-size:24px;letter-spacing:3px;color:#ffd166;margin-bottom:6px;font-weight:900}
  .trophy p{color:#9fb2c8;font-size:13px}
</style>

<div id="app">
  <canvas id="cv" width="1280" height="720"></canvas>

  <!-- AUTH -->
  <div class="screen" id="scr-auth">
    <div class="auth-box">
      <svg class="logo full" viewBox="0 0 360 110"><use href="#logo-mark"/></svg>
      <div class="tag">Field Hockey Championship</div>
      <div class="guest-id-card">
        <div class="gid-label">Your Player ID</div>
        <div class="gid-value" id="guest-id-display">DH-XXXXX</div>
        <div class="gid-note">No sign-up needed. Progress auto-saves on this device.</div>
      </div>
      <button class="primary" id="btn-enter">▶  ENTER STADIUM</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen hidden" id="scr-home">
    <div class="topbar">
      <svg class="logo small" viewBox="0 0 360 110"><use href="#logo-mark"/></svg>

        <span class="coin">🪙 <b id="home-coins">0</b></span>
        <span class="uname" id="home-user">DH-XXXXX</span>
        <button class="mini" id="btn-newid">New ID</button>

        <div class="row"><label>Skin Tone</label><div class="swatches" id="skin-swatches"></div></div>
        <div class="row"><label>Stick Colour</label><div class="swatches" id="stick-swatches"></div></div>
        <div class="row"><label>Position</label><div class="swatches" id="style-swatches"></div></div>
        <h3>Your Kits</h3>
        <div id="kit-row" style="display:flex;gap:10px;flex-wrap:wrap"></div>
        <h3>Career Stats</h3>

function shade(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1),16);
  var r = clamp(Math.round(((n>>16)&255)+amt*255),0,255);
  var g = clamp(Math.round(((n>>8)&255)+amt*255),0,255);
  var b = clamp(Math.round((n&255)+amt*255),0,255);
  return 'rgb('+r+','+g+','+b+')';
}

var prevCanvas = document.getElementById('prev');

function drawPlayerFigure(g, x, y, scale, kitId, skinIdx, stickIdx){
  var kit = getKit(kitId);
  var skin = SKINS[skinIdx];
  var stick = STICKS[stickIdx];

  g.save();
  g.translate(x, y);
  g.scale(scale, scale);

  g.fillStyle = 'rgba(0,0,0,.30)';
  g.beginPath(); g.ellipse(0, 2, 12, 4, 0, 0, 7); g.fill();

  g.fillStyle = kit.sock;
  g.beginPath(); g.arc(-3.5, -4, 3, 0, 7); g.fill();
  g.beginPath(); g.arc( 3.5, -4, 3, 0, 7); g.fill();

  g.fillStyle = kit.shoe;
  g.beginPath(); g.arc(-3.5, -1, 2.6, 0, 7); g.fill();
  g.beginPath(); g.arc( 3.5, -1, 2.6, 0, 7); g.fill();

  g.fillStyle = kit.primary;
  g.beginPath(); g.ellipse(0, -8, 11, 13, 0, 0, 7); g.fill();

  g.fillStyle = kit.secondary;
  g.fillRect(-11, -14, 22, 3);

  g.fillStyle = skin;
  g.beginPath(); g.arc(-11, -8, 3.2, 0, 7); g.fill();
  g.beginPath(); g.arc( 11, -8, 3.2, 0, 7); g.fill();

  g.beginPath(); g.arc(0, -23, 6.5, 0, 7); g.fill();

  g.strokeStyle = stick;
  g.lineWidth = 2.6;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-9, -6);
  g.lineTo(-16, 6);
  g.lineTo(-9, 10);
  g.stroke();

  g.restore();
}

function drawPreview(){
  var g = prevCtx;
  g.clearRect(0,0,prevCanvas.width, prevCanvas.height);

  var grd = g.createRadialGradient(190, 260, 20, 190, 260, 200);
  grd.addColorStop(0, 'rgba(140,220,140,.22)');
  grd.addColorStop(1, 'rgba(140,220,140,0)');
  g.fillStyle = grd;
  g.fillRect(0,0,prevCanvas.width, prevCanvas.height);

  g.fillStyle = 'rgba(20,80,40,.55)';
  g.fillRect(80, 260, 220, 140);
  g.strokeStyle = 'rgba(255,255,255,.15)';
  g.lineWidth = 1.4;
  g.beginPath(); g.arc(190, 330, 60, Math.PI, 0); g.stroke();

  var depth = Math.cos(prevAngle);
  var absDepth = Math.max(0.22, Math.abs(depth));

  g.fillStyle = 'rgba(0,0,0,.35)';
  g.beginPath(); g.ellipse(190, 345, 55*absDepth, 14, 0, 0, 7); g.fill();

  drawPlayerFigure(g, 190, 300, 3.2 * (0.6 + 0.4*absDepth), user.equipped, user.skin, user.stick);

  var deg = Math.round(mod(prevAngle * 180 / Math.PI, 360));
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.font = '600 11px system-ui,sans-serif';
  g.textAlign = 'center';
  g.fillText(deg + '°', 190, 425);
}
function mod(n,m){ return ((n%m)+m)%m; }

}

      if (equipped){ btn.textContent = 'EQUIPPED'; btn.disabled = true; }
      else if (owned){ btn.textContent = 'EQUIP'; btn.classList.add('eq');
        btn.onclick = function(){ user.equipped = K.id; saveGuest(); buildShop(); };
      } else {
        btn.textContent = 'BUY'; btn.disabled = user.coins < K.price;
        btn.onclick = function(){
          if (user.coins < K.price) return;
          user.coins -= K.price; user.ownedKits.push(K.id); user.equipped = K.id;
          saveGuest(); buildShop();
        };
      }
      card.appendChild(c); card.appendChild(h4); card.appendChild(p);
      card.appendChild(price); card.appendChild(btn);
      grid.appendChild(card);
    })(KITS[i]);
