/* =========================================================
   PLAYER CONSTRUCTOR
   ========================================================= */
function Player(team, role, bx, by, num, country){
  this.team = team;
  this.role = role;
  this.x = bx; this.y = by;
  this.bx = bx; this.by = by;
  this.vx = 0; this.vy = 0;
  this.dirX = (team === 'user') ? 1 : -1;
  this.dirY = 0;
  this.num = num;
  this.country = country;
  this.isGK = (role === 'GK');
  this.isControlled = false;
  this.laneTimer = 0;
}

/* =========================================================
   START MATCH
   ========================================================= */
function startMatch(oppCountryId, courtId, diffId){
  var court = getCourt(courtId || selCourt);
  var countryA = getCountry(selCountry);
  var countryB;
  if (oppCountryId) countryB = getCountry(oppCountryId);
  else {
    var pool = [];
    for (var i=0;i<COUNTRIES.length;i++) if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
    countryB = pool[Math.floor(Math.random()*pool.length)];
  }
  var diff = getDiff(diffId || selDiff);

  var teamA = [
    new Player('user', 'GK',  3, 30, 1, countryA),
    new Player('user', 'DEF', 25, 18, 4, countryA),
    new Player('user', 'DEF', 25, 42, 5, countryA),
    new Player('user', 'MID', 42, 30, 8, countryA),
    new Player('user', 'FWD', 48, 30, 10, countryA)
  ];
  var teamB = [
    new Player('opp', 'GK',  97, 30, 1, countryB),
    new Player('opp', 'DEF', 75, 18, 4, countryB),
    new Player('opp', 'DEF', 75, 42, 5, countryB),
    new Player('opp', 'MID', 58, 30, 8, countryB),
    new Player('opp', 'FWD', 52, 30, 10, countryB)
  ];

  /* User controls the FWD initially */
  var ctrlIdx = 4;
  if (user.position === 1) ctrlIdx = 3;
  else if (user.position === 2) ctrlIdx = 1;
  else if (user.position === 3) ctrlIdx = 0;
  for (var ci=0;ci<teamA.length;ci++) teamA[ci].isControlled = (ci === ctrlIdx);

  match = {
    court: court,
    teamA: teamA, teamB: teamB,
    allPlayers: teamA.concat(teamB),
    ctrlIdx: ctrlIdx,
    countryA: countryA, countryB: countryB,
    diff: diff,
    ball: { x: 50, y: 30, vx: 0, vy: 0, lastShotBy: null, lastFromCircle: false },
    state: 'kickoff',
    stateTimer: KICKOFF_PAUSE,
    scoreA: 0, scoreB: 0,
    matchTime: 0,
    possA: 0, possB: 0,
    shotsA: 0, shotsB: 0,
    saves: 0,
    goalsByUser: 0,
    kickoffTeam: 'user',
    goalFlash: 0
  };

  ctrl.sprintActive = false; ctrl.sprintTimer = 0; ctrl.sprintCd = 0;
  shootQueued = false; passQueued = false;

  screen = 'match';
  showScreen('');
  document.getElementById('hud-match').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('notice').classList.add('on');
  document.getElementById('notice').textContent = 'KICK OFF!';
  setTimeout(function(){ document.getElementById('notice').classList.remove('on'); }, 1200);
  updateScoreboard();
}

/* =========================================================
   MATCH LOGIC
   ========================================================= */
function controlledPlayer(){
  if (!match) return null;
  return match.teamA[match.ctrlIdx];
}

function getMoveInput(){
  var mx = 0, my = 0;
  if (joy.active){ mx = joy.dx; my = joy.dy; }
  if (keys.left) mx = -1;
  if (keys.right) mx = 1;
  if (keys.up) my = -1;
  if (keys.down) my = 1;
  var m = hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  return { x: mx, y: my };
}

function movePlayer(p, dt, mx, my, maxSpeed){
  p.vx += mx * PLAYER_ACCEL * dt;
  p.vy += my * PLAYER_ACCEL * dt;
  var fr = Math.pow(0.0008, dt);
  p.vx *= fr;
  p.vy *= fr;
  var sp = hypot(p.vx, p.vy);
  if (sp > maxSpeed){
    p.vx = p.vx / sp * maxSpeed;
    p.vy = p.vy / sp * maxSpeed;
  }
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (Math.abs(p.vx) > 0.3 || Math.abs(p.vy) > 0.3){
    var d = hypot(p.vx, p.vy) || 1;
    p.dirX = p.vx / d;
    p.dirY = p.vy / d;
  }
  p.x = clamp(p.x, PLAYER_R, FW - PLAYER_R);
  p.y = clamp(p.y, PLAYER_R, FH - PLAYER_R);
}

function shootBall(p, tx, ty, power){
  var b = match.ball;
  var dx = tx - p.x, dy = ty - p.y;
  var d = hypot(dx, dy) || 1;
  b.vx = dx / d * power;
  b.vy = dy / d * power;
  b.x = p.x + dx / d * (PLAYER_R + BALL_R + 0.1);
  b.y = p.y + dy / d * (PLAYER_R + BALL_R + 0.1);
  b.lastShotBy = p.team;
  b.lastFromCircle = isInCircle(p);
  if (p.team === 'user') match.shotsA++;
  else match.shotsB++;
}

function isInCircle(p){
  var gx = (p.team === 'user') ? FW : 0;
  var dx = p.x - gx, dy = p.y - GOAL_CY;
  return dx*dx + dy*dy < CIRCLE_R*CIRCLE_R;
}

function tryShoot(p){
  if (!p) return;
  if (dist(p.x, p.y, match.ball.x, match.ball.y) > CONTROL_DIST) return;
  var gx = (p.team === 'user') ? FW : 0;
  var aim = GOAL_CY + rnd(-2.2, 2.2);
  shootBall(p, gx, aim, SHOOT_POWER);
}

function tryPass(p){
  if (!p) return;
  if (dist(p.x, p.y, match.ball.x, match.ball.y) > CONTROL_DIST) return;
  var mates = (p.team === 'user') ? match.teamA : match.teamB;
  var fwd = (p.team === 'user') ? 1 : -1;
  var best = null, bestScore = -Infinity;
  for (var i=0;i<mates.length;i++){
    var t = mates[i];
    if (t === p) continue;
    var dx = t.x - p.x, dy = t.y - p.y;
    var d = hypot(dx, dy);
    if (d > 45 || d < 0.5) continue;
    var score = dx * fwd * 1.6 - d * 0.7;
    if (score > bestScore){ bestScore = score; best = t; }
  }
  if (best) shootBall(p, best.x, best.y, PASS_POWER);
  else {
    var gx = (p.team === 'user') ? FW : 0;
    shootBall(p, gx, p.y, PASS_POWER * 0.9);
  }
}

function updateAI(p, dt, aiSpeed){
  if (p.isGK){ updateGK(p, dt); return; }

  var b = match.ball;
  var myTeam = (p.team === 'user') ? match.teamA : match.teamB;
  var otherTeam = (p.team === 'user') ? match.teamB : match.teamA;

  /* Find nearest teammate to ball */
  var nearest = null, nearestD = Infinity;
  for (var i=0;i<myTeam.length;i++){
    var m = myTeam[i];
    if (m.isGK) continue;
    var dd = dist(m.x, m.y, b.x, b.y);
    if (dd < nearestD){ nearestD = dd; nearest = m; }
  }
  var iAmNearest = (nearest === p);

  /* Who has the ball? */
  var ownerTeam = null;
  var ownerD = Infinity;
  for (var j=0;j<match.allPlayers.length;j++){
    var pl = match.allPlayers[j];
    var dj = dist(pl.x, pl.y, b.x, b.y);
    if (dj < CONTROL_DIST && dj < ownerD){ ownerD = dj; ownerTeam = pl.team; }
  }

  var oppGoalX = (p.team === 'user') ? FW : 0;
  var fwd = (p.team === 'user') ? 1 : -1;
  var tX = p.bx, tY = p.by;

  if (ownerTeam === p.team && iAmNearest && nearestD < CONTROL_DIST + 0.5){
    /* I have the ball */
    var distGoal = Math.abs(p.x - oppGoalX);
    tX = lerp(p.x, oppGoalX, 0.4);
    tY = lerp(p.y, GOAL_CY + rnd(-3,3), 0.3);
    if (distGoal < 32){
      if (Math.random() < match.diff.aiShoot * dt * 3){
        tryShoot(p);
      }
    } else if (Math.random() < match.diff.aiPass * dt * 0.8){
      tryPass(p);
    }
  } else if (ownerTeam === p.team){
    /* Support attack */
    tX = p.bx + fwd * 10;
    tY = p.by + (b.y - FH/2) * 0.2;
    if (p.role === 'FWD'){
      tX = p.bx + fwd * 15;
      tY = lerp(p.by, GOAL_CY, 0.2);
    }
  } else if (iAmNearest){
    /* Chase ball */
    tX = b.x + b.vx * 0.12;
    tY = b.y + b.vy * 0.12;
  } else {
    /* Defend - hold shape, drift slightly toward ball side */
    var ballInOurHalf = (p.team === 'user') ? (b.x < FW/2) : (b.x > FW/2);
    if (ballInOurHalf){
      tX = p.bx - fwd * 6;
      tY = lerp(p.by, b.y, 0.25);
    }
  }

  var dx = tX - p.x, dy = tY - p.y;
  var d = hypot(dx, dy);
  if (d > 0.4){
    dx /= d; dy /= d;
    var sp = aiSpeed * (d > 4 ? 1 : d/4);
    movePlayer(p, dt, dx, dy, sp);
  } else {
    movePlayer(p, dt, 0, 0, aiSpeed);
  }
}

function updateGK(p, dt){
  var b = match.ball;
  var goalX = (p.team === 'user') ? 2.5 : FW - 2.5;
  var tY = clamp(GOAL_CY + (b.y - GOAL_CY) * 0.75, GOAL_Y1 - 4, GOAL_Y2 + 4);

  var dToBall = dist(p.x, p.y, b.x, b.y);
  var distBallToOwnGoal = (p.team === 'user') ? b.x : (FW - b.x);
  if (distBallToOwnGoal < 12 && dToBall < 14){
    var dx = b.x - p.x, dy = b.y - p.y;
    var dd = hypot(dx, dy) || 1;
    movePlayer(p, dt, dx/dd, dy/dd, match.diff.gkSpeed * 1.05);
    return;
  }

  var dx2 = goalX - p.x, dy2 = tY - p.y;
  var d = hypot(dx2, dy2);
  if (d > 0.15){
    dx2 /= d; dy2 /= d;
    movePlayer(p, dt, dx2, dy2, match.diff.gkSpeed);
  } else {
    movePlayer(p, dt, 0, 0, match.diff.gkSpeed);
  }
}

function updateBallPhysics(dt){
  var b = match.ball;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  var fr = Math.pow(BALL_FRICTION, dt);
  b.vx *= fr;
  b.vy *= fr;

  if (b.x - BALL_R < 0){
    if (b.y > GOAL_Y1 && b.y < GOAL_Y2){
      if (b.lastFromCircle && b.lastShotBy === 'opp'){ scoreGoal('opp'); return; }
      resetBallSide('left'); return;
    } else { b.x = BALL_R; b.vx = -b.vx * 0.65; }
  }
  if (b.x + BALL_R > FW){
    if (b.y > GOAL_Y1 && b.y < GOAL_Y2){
      if (b.lastFromCircle && b.lastShotBy === 'user'){ scoreGoal('user'); return; }
      resetBallSide('right'); return;
    } else { b.x = FW - BALL_R; b.vx = -b.vx * 0.65; }
  }
  if (b.y - BALL_R < 0){ b.y = BALL_R; b.vy = -b.vy * 0.65; }
  if (b.y + BALL_R > FH){ b.y = FH - BALL_R; b.vy = -b.vy * 0.65; }
}

function resetBallSide(side){
  var b = match.ball;
  b.x = (side === 'left') ? 15 : FW - 15;
  b.y = GOAL_CY;
  b.vx = 0; b.vy = 0;
  b.lastShotBy = null; b.lastFromCircle = false;
}

function scoreGoal(team){
  if (!match) return;
  if (team === 'user'){ match.scoreA++; match.goalsByUser++; }
  else match.scoreB++;
  match.state = 'goal';
  match.stateTimer = GOAL_PAUSE;
  match.kickoffTeam = (team === 'user') ? 'opp' : 'user';
  match.goalFlash = 0.55;
  match.ball.vx = 0; match.ball.vy = 0;
  var n = document.getElementById('notice');
  n.textContent = (team === 'user') ? '⚡ GOAL!' : 'OPPONENT SCORES';
  n.classList.add('on');
  setTimeout(function(){ n.classList.remove('on'); }, 1300);
  updateScoreboard();
}

function resetKickoff(startingTeam){
  var teamAPos = [
    {x:3, y:30}, {x:25, y:18}, {x:25, y:42}, {x:42, y:30}, {x:48, y:30}
  ];
  var teamBPos = [
    {x:97, y:30}, {x:75, y:18}, {x:75, y:42}, {x:58, y:30}, {x:52, y:30}
  ];
  if (startingTeam === 'user'){
    teamAPos[4] = {x:48, y:30};
    teamBPos[4] = {x:62, y:30};
  } else {
    teamAPos[4] = {x:38, y:30};
    teamBPos[4] = {x:52, y:30};
  }
  for (var i=0;i<match.teamA.length;i++){
    var pa = match.teamA[i];
    pa.x = teamAPos[i].x; pa.y = teamAPos[i].y;
    pa.vx = 0; pa.vy = 0;
  }
  for (var j=0;j<match.teamB.length;j++){
    var pb = match.teamB[j];
    pb.x = teamBPos[j].x; pb.y = teamBPos[j].y;
    pb.vx = 0; pb.vy = 0;
  }
  var b = match.ball;
  b.x = 50; b.y = 30; b.vx = 0; b.vy = 0;
  b.lastShotBy = null; b.lastFromCircle = false;
}

function updateMatch(dt){
  if (!match) return;
  if (match.goalFlash > 0) match.goalFlash -= dt;

  if (match.state === 'kickoff'){
    match.stateTimer -= dt;
    if (match.stateTimer <= 0) match.state = 'playing';
    updateBallPhysics(dt);
    resolveBallCollision();
    return;
  }

  if (match.state === 'goal'){
    match.stateTimer -= dt;
    if (match.stateTimer <= 0){
      resetKickoff(match.kickoffTeam);
      match.state = 'kickoff';
      match.stateTimer = KICKOFF_PAUSE;
    }
    return;
  }

  if (match.state === 'ended') return;

  /* Playing */
  match.matchTime += dt;
  if (match.matchTime >= MATCH_TIME){
    match.matchTime = MATCH_TIME;
    endMatch();
    return;
  }

  if (ctrl.sprintActive){
    ctrl.sprintTimer -= dt;
    if (ctrl.sprintTimer <= 0){ ctrl.sprintActive = false; ctrl.sprintCd = SPRINT_CD; }
  } else if (ctrl.sprintCd > 0){
    ctrl.sprintCd -= dt;
  }

  /* Possession */
  var ownerTeam = null, ownerD = Infinity;
  for (var i=0;i<match.allPlayers.length;i++){
    var pp = match.allPlayers[i];
    var dd = dist(pp.x, pp.y, match.ball.x, match.ball.y);
    if (dd < CONTROL_DIST && dd < ownerD){ ownerD = dd; ownerTeam = pp.team; }
  }
  if (ownerTeam === 'user') match.possA += dt;
  else if (ownerTeam === 'opp') match.possB += dt;

  /* Controlled player */
  var cp = controlledPlayer();
  if (cp){
    var mv = getMoveInput();
    var sp = BASE_SPEED;
    if (ctrl.sprintActive) sp *= SPRINT_MULT;
    movePlayer(cp, dt, mv.x, mv.y, sp);

    if (shootQueued){ tryShoot(cp); shootQueued = false; }
    if (passQueued){ tryPass(cp); passQueued = false; }
  } else {
    shootQueued = false; passQueued = false;
  }

  /* AI teammates */
  for (var k=0;k<match.teamA.length;k++){
    var pa = match.teamA[k];
    if (pa === cp) continue;
    if (pa.isGK) updateGK(pa, dt);
    else updateAI(pa, dt, BASE_SPEED * 0.85);
  }

  /* AI opponents */
  for (var m=0;m<match.teamB.length;m++){
    var pb = match.teamB[m];
    if (pb.isGK) updateGK(pb, dt);
    else updateAI(pb, dt, match.diff.aiSpeed);
  }

  /* Player-player separation */
  for (var a=0;a<match.allPlayers.length;a++){
    for (var b=a+1;b<match.allPlayers.length;b++){
      var pa2 = match.allPlayers[a], pb2 = match.allPlayers[b];
      var dx = pb2.x - pa2.x, dy = pb2.y - pa2.y;
      var d2 = hypot(dx, dy);
      if (d2 < PLAYER_R*2 && d2 > 0.0001){
        var nx = dx/d2, ny = dy/d2;
        var ov = (PLAYER_R*2 - d2) * 0.5;
        pa2.x -= nx*ov; pa2.y -= ny*ov;
        pb2.x += nx*ov; pb2.y += ny*ov;
      }
    }
  }

  updateBallPhysics(dt);
  resolveBallCollision();

  for (var q=0;q<match.allPlayers.length;q++){
    var pq = match.allPlayers[q];
    pq.x = clamp(pq.x, PLAYER_R, FW - PLAYER_R);
    pq.y = clamp(pq.y, PLAYER_R, FH - PLAYER_R);
  }

  updateScoreboard();
}

function resolveBallCollision(){
  var b = match.ball;
  for (var i=0;i<match.allPlayers.length;i++){
    var p = match.allPlayers[i];
    var d = dist(p.x, p.y, b.x, b.y);
    var minD = PLAYER_R + BALL_R;
    if (d < minD && d > 0.0001){
      var nx = (b.x - p.x) / d;
      var ny = (b.y - p.y) / d;
      var ov = minD - d;
      b.x += nx * ov;
      b.y += ny * ov;
      b.vx = p.vx * 1.08 + nx * 2.5;
      b.vy = p.vy * 1.08 + ny * 2.5;
    }
  }
}

function updateScoreboard(){
  if (!match) return;
  document.getElementById('sb-name-a').textContent = match.countryA.code;
  document.getElementById('sb-name-b').textContent = match.countryB.code;
  document.getElementById('sb-score-a').textContent = match.scoreA;
  document.getElementById('sb-score-b').textContent = match.scoreB;
  var remain = Math.max(0, MATCH_TIME - match.matchTime);
  var mm = Math.floor(remain/60);
  var ss = Math.floor(remain%60);
  document.getElementById('sb-timer').textContent = mm + ':' + (ss<10?'0':'') + ss;
  document.getElementById('sb-flag-a').style.background = 'linear-gradient(180deg,' + match.countryA.primary + ' 50%,' + match.countryA.secondary + ' 50%)';
  document.getElementById('sb-flag-b').style.background = 'linear-gradient(180deg,' + match.countryB.primary + ' 50%,' + match.countryB.secondary + ' 50%)';
}

/* =========================================================
   RENDER MATCH
   ========================================================= */
function renderMatch(){
  if (!match) return;
  var g = ctx;
  var court = match.court;

  /* Sky */
  var skyG = g.createLinearGradient(0,0,0,FOY);
  skyG.addColorStop(0, court.sky);
  skyG.addColorStop(1, shade(court.sky, -0.20));
  g.fillStyle = skyG;
  g.fillRect(0,0,W,FOY + 4);

  /* Bottom */
  g.fillStyle = shade(court.sky, -0.40);
  g.fillRect(0,H-60,W,60);

  /* Crowd bands */
  drawCrowd(g, 0, 0, W, FOY, court);
  drawCrowd(g, 0, FOY + FH*FSCALE, W, H - (FOY + FH*FSCALE), court);

  /* Side stands */
  g.fillStyle = shade(court.crowd, -0.20);
  g.fillRect(0, FOY, FOX, FH*FSCALE);
  g.fillRect(FOX + FW*FSCALE, FOY, W - (FOX + FW*FSCALE), FH*FSCALE);

  /* Field */
  drawField(g, court);

  /* Goals */
  drawGoals(g, court);

  /* Ball trail */
  var b = match.ball;
  var bsx = w2sx(b.x), bsy = w2sy(b.y);
  g.fillStyle = 'rgba(0,0,0,.30)';
  g.beginPath(); g.ellipse(bsx, bsy + 4, BALL_R*FSCALE*0.9, BALL_R*FSCALE*0.45, 0, 0, 7); g.fill();

  /* Players (sorted by Y) */
  var sorted = match.allPlayers.slice();
  sorted.sort(function(a,b){ return a.y - b.y; });
  for (var i=0;i<sorted.length;i++) drawPlayerOnField(g, sorted[i]);

  /* Ball */
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(bsx, bsy, BALL_R*FSCALE, 0, 7); g.fill();
  g.fillStyle = 'rgba(200,230,255,.85)';
  g.beginPath(); g.arc(bsx - 1, bsy - 1.5, BALL_R*FSCALE*0.4, 0, 7); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.4)';
  g.lineWidth = 1;
  g.beginPath(); g.arc(bsx, bsy, BALL_R*FSCALE, 0, 7); g.stroke();

  /* Goal flash */
  if (match.goalFlash > 0){
    g.fillStyle = 'rgba(255,255,255,' + (match.goalFlash * 0.4) + ')';
    g.fillRect(0,0,W,H);
  }

  /* Countdown overlay */
  if (match.state === 'kickoff'){
    g.fillStyle = 'rgba(0,0,0,.55)';
    g.fillRect(0,0,W,H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var t = match.stateTimer;
    if (t > 0.4){
      g.fillStyle = '#ffd166';
      g.font = 'bold 180px system-ui,sans-serif';
      g.fillText(Math.ceil(t), W/2, H/2);
    } else {
      g.fillStyle = '#8cdc8c';
      g.font = 'bold 140px system-ui,sans-serif';
      g.fillText('GO!', W/2, H/2);
    }
    g.textBaseline = 'alphabetic';
  }
}

function drawCrowd(g, x, y, w, h, court){
  if (h < 4) return;
  g.fillStyle = shade(court.crowd, -0.30);
  g.fillRect(x, y, w, h);
  var colors = [shade(court.crowd, 0.20), shade(court.crowd, -0.10), '#ffd166', '#f72585', '#4cc9f0'];
  var spacing = 14;
  for (var py = y+6; py < y+h-4; py += spacing){
    for (var px = x+6; px < x+w-4; px += spacing){
      var r = Math.random();
      g.fillStyle = colors[Math.floor(r * colors.length)];
      g.beginPath();
      g.arc(px + (Math.random()-0.5)*4, py + (Math.random()-0.5)*4, 2, 0, 7);
      g.fill();
    }
  }
}

function drawField(g, court){
  var x = FOX, y = FOY, w = FW*FSCALE, h = FH*FSCALE;

  g.fillStyle = court.bg;
  g.fillRect(x, y, w, h);

  /* Mow stripes */
  var stripes = 14;
  var sw = w / stripes;
  for (var i=0;i<stripes;i++){
    g.fillStyle = (i % 2 === 0) ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)';
    g.fillRect(x + i*sw, y, sw, h);
  }

  /* Border */
  g.strokeStyle = court.line;
  g.lineWidth = 3;
  g.strokeRect(x+1.5, y+1.5, w-3, h-3);

  /* Halfway line */
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(x + w/2, y); g.lineTo(x + w/2, y + h);
  g.stroke();

  /* Center circle */
  g.beginPath();
  g.arc(x + w/2, y + h/2, 8*FSCALE, 0, 7);
  g.stroke();

  /* Center dot */
  g.fillStyle = court.line;
  g.beginPath();
  g.arc(x + w/2, y + h/2, 2.4, 0, 7);
  g.fill();

  /* Shooting circles */
  g.lineWidth = 2.2;
  g.beginPath();
  g.arc(x, y + GOAL_CY*FSCALE, CIRCLE_R*FSCALE, -Math.PI/2, Math.PI/2);
  g.stroke();
  g.beginPath();
  g.arc(x + w, y + GOAL_CY*FSCALE, CIRCLE_R*FSCALE, Math.PI/2, Math.PI*3/2);
  g.stroke();

  /* Goal lines */
  g.beginPath();
  g.moveTo(x, y + GOAL_Y1*FSCALE); g.lineTo(x, y + GOAL_Y2*FSCALE);
  g.moveTo(x + w, y + GOAL_Y1*FSCALE); g.lineTo(x + w, y + GOAL_Y2*FSCALE);
  g.lineWidth = 4;
  g.stroke();
}

function drawGoals(g, court){
  var y1 = FOY + GOAL_Y1*FSCALE;
  var y2 = FOY + GOAL_Y2*FSCALE;
  var depth = 1.4*FSCALE;

  /* Left */
  g.fillStyle = shade(court.line, -0.15);
  g.fillRect(FOX - depth, y1, depth, y2-y1);
  g.strokeStyle = court.line;
  g.lineWidth = 3;
  g.strokeRect(FOX - depth, y1, depth, y2-y1);
  g.strokeStyle = 'rgba(255,255,255,.35)';
  g.lineWidth = 1;
  for (var i=0;i<6;i++){
    g.beginPath();
    g.moveTo(FOX - depth + i*depth/6, y1);
    g.lineTo(FOX - depth + i*depth/6, y2);
    g.stroke();
  }
  for (var j=0;j<8;j++){
    g.beginPath();
    g.moveTo(FOX - depth, y1 + j*(y2-y1)/8);
    g.lineTo(FOX, y1 + j*(y2-y1)/8);
    g.stroke();
  }

  /* Right */
  g.fillStyle = shade(court.line, -0.15);
  g.fillRect(FOX + FW*FSCALE, y1, depth, y2-y1);
  g.strokeStyle = court.line;
  g.lineWidth = 3;
  g.strokeRect(FOX + FW*FSCALE, y1, depth, y2-y1);
  g.strokeStyle = 'rgba(255,255,255,.35)';
  g.lineWidth = 1;
  for (var k=0;k<6;k++){
    g.beginPath();
    g.moveTo(FOX + FW*FSCALE + k*depth/6, y1);
    g.lineTo(FOX + FW*FSCALE + k*depth/6, y2);
    g.stroke();
  }
  for (var l=0;l<8;l++){
    g.beginPath();
    g.moveTo(FOX + FW*FSCALE, y1 + l*(y2-y1)/8);
    g.lineTo(FOX + FW*FSCALE + depth, y1 + l*(y2-y1)/8);
    g.stroke();
  }
}

function drawPlayerOnField(g, p){
  var sx = w2sx(p.x), sy = w2sy(p.y);
  var isUser = (p.team === 'user');
  var kit = isUser ? getKit(user.equipped) :
    { primary: p.country.primary, secondary: p.country.secondary, shoe:'#1a1a1a', sock: p.country.primary };
  var skin = isUser ? SKINS[user.skin] : SKINS[3];
  var stick = isUser ? STICKS[user.stick] : STICKS[0];
  var r = PLAYER_R * FSCALE;

  /* Shadow */
  g.fillStyle = 'rgba(0,0,0,.35)';
  g.beginPath(); g.ellipse(sx, sy + r*0.65, r*1.05, r*0.45, 0, 0, 7); g.fill();

  /* Highlight controlled player with strong ring + "YOU" label */
  if (p.isControlled){
    var pulse = 0.7 + Math.sin(Date.now() / 180) * 0.3;
    g.strokeStyle = 'rgba(255,209,102,' + pulse + ')';
    g.lineWidth = 3.5;
    g.beginPath(); g.arc(sx, sy, r*1.55, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.85)';
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(sx, sy, r*1.75, 0, 7); g.stroke();
    /* Label */
    g.fillStyle = '#ffd166';
    g.font = 'bold 12px system-ui,sans-serif';
    g.textAlign = 'center';
    g.fillText('YOU', sx, sy - r*2.2);
  }

  /* Body */
  g.fillStyle = kit.primary;
  g.beginPath(); g.arc(sx, sy, r, 0, 7); g.fill();

  g.strokeStyle = kit.secondary;
  g.lineWidth = 2;
  g.beginPath(); g.arc(sx, sy, r, 0, 7); g.stroke();

  /* Head */
  var hx = sx + p.dirX * r * 0.35;
  var hy = sy + p.dirY * r * 0.35;
  g.fillStyle = skin;
  g.beginPath(); g.arc(hx, hy, r*0.55, 0, 7); g.fill();

  /* Stick */
  var ang = Math.atan2(p.dirY, p.dirX);
  var sbx = sx + Math.cos(ang) * r * 0.9;
  var sby = sy + Math.sin(ang) * r * 0.9;
  var stx = sx + Math.cos(ang) * r * 2.1;
  var sty = sy + Math.sin(ang) * r * 2.1;
  g.strokeStyle = stick;
  g.lineWidth = 3;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(sbx, sby); g.lineTo(stx, sty);
  g.stroke();
  g.beginPath();
  g.arc(stx, sty, r*0.35, ang - Math.PI/2, ang + Math.PI/2);
  g.stroke();

  /* Number */
  if (r > 8){
    g.fillStyle = kit.secondary;
    g.font = 'bold ' + Math.round(r*0.9) + 'px system-ui,sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(p.num, sx, sy);
    g.textBaseline = 'alphabetic';
  }

  /* GK ring */
  if (p.isGK){
    g.strokeStyle = 'rgba(255,209,102,.6)';
    g.lineWidth = 2;
    g.beginPath(); g.arc(sx, sy, r*1.15, 0, 7); g.stroke();
  }
}

/* =========================================================
   END MATCH
   ========================================================= */
function endMatch(){
  if (!match) return;
  match.state = 'ended';

  var outcome, reward = 0;
  if (match.scoreA > match.scoreB){
    outcome = 'WIN'; user.wins = (user.wins || 0) + 1; reward = 100;
  } else if (match.scoreA < match.scoreB){
    outcome = 'LOSS'; user.losses = (user.losses || 0) + 1;
  } else {
    outcome = 'DRAW'; user.draws = (user.draws || 0) + 1; reward = 25;
  }
  user.matches = (user.matches || 0) + 1;
  user.goals = (user.goals || 0) + match.goalsByUser;
  user.coins = (user.coins || 0) + reward;
  saveGuest();

  document.getElementById('res-loc').textContent =
    match.court.name.toUpperCase() + ' • ' + match.diff.name.toUpperCase();
  var outcomeEl = document.getElementById('res-outcome');
  outcomeEl.textContent = outcome === 'WIN' ? 'VICTORY' : (outcome === 'LOSS' ? 'DEFEAT' : 'DRAW');
  outcomeEl.className = 'res-outcome' + (outcome === 'LOSS' ? ' loss' : outcome === 'DRAW' ? ' draw' : '');
  document.getElementById('res-score').textContent = match.scoreA + ' – ' + match.scoreB;
  document.getElementById('res-teams').textContent =
    match.countryA.name.toUpperCase() + '  vs  ' + match.countryB.name.toUpperCase();

  var totalPoss = match.possA + match.possB;
  var possPct = totalPoss > 0 ? Math.round(match.possA / totalPoss * 100) : 50;
  document.getElementById('res-poss').textContent = possPct + '%';
  document.getElementById('res-shots-a').textContent = match.shotsA;
  document.getElementById('res-goals-a').textContent = match.scoreA;
  document.getElementById('res-saves').textContent = match.saves;

  var rewardEl = document.getElementById('res-reward');
  if (reward > 0){
    rewardEl.textContent = '+' + reward + ' 🪙  ' + (outcome === 'WIN' ? 'Victory Bonus!' : 'Draw Reward');
    rewardEl.className = 'reward';
  } else {
    rewardEl.textContent = 'No reward — win to earn coins.';
    rewardEl.className = 'reward none';
  }

  /* Tournament progress */
  if (tournament && tournament.active){
    tournament.recordResult(match.scoreA, match.scoreB);
  }

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud-match').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('notice').classList.remove('on');
}

/* =========================================================
   TOURNAMENT
   ========================================================= */
function buildTournament(){
  /* 8-team single elimination bracket */
  var pool = [];
  for (var i=0;i<COUNTRIES.length;i++){
    if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
  }
  /* Shuffle */
  for (var s=0;s<pool.length;s++){
    var r = Math.floor(Math.random()*pool.length);
    var tmp = pool[s]; pool[s] = pool[r]; pool[r] = tmp;
  }
  var teams = [getCountry(selCountry)].concat(pool.slice(0, 7));

  /* Build rounds: Round 0 (QF) has 8 teams -> 4 matches; Round 1 (SF) 4 -> 2; Round 2 (F) 2 -> 1 */
  var rounds = [];
  var r0 = [];
  for (var q=0;q<8;q+=2){
    r0.push({ a: teams[q], b: teams[q+1], scoreA:null, scoreB:null, winner:null, played:false });
  }
  rounds.push(r0);
  rounds.push([{ a:null, b:null, scoreA:null, scoreB:null, winner:null, played:false },
               { a:null, b:null, scoreA:null, scoreB:null, winner:null, played:false }]);
  rounds.push([{ a:null, b:null, scoreA:null, scoreB:null, winner:null, played:false }]);

  tournament = {
    active: true,
    rounds: rounds,
    userCountry: getCountry(selCountry),
    userMatchRound: 0,
    userMatchIdx: -1,
    difficulty: selDiff,
    court: selCourt,
    reward: 0,
    champion: null,
    recordResult: function(scoreA, scoreB){
      var r = this.userMatchRound, i = this.userMatchIdx;
      if (r < 0 || i < 0) return;
      var m = this.rounds[r][i];
      m.scoreA = scoreA; m.scoreB = scoreB;
      m.played = true;
      m.winner = (scoreA > scoreB) ? m.a : m.b;
      /* Simulate other matches in this round */
      this.simulateRound(r);
      /* Advance */
      if (r < this.rounds.length - 1){
        this.userMatchRound = r + 1;
        /* Find the user's match in next round */
        this.userMatchIdx = -1;
        var nextRound = this.rounds[r+1];
        for (var k=0;k<nextRound.length;k++){
          if (nextRound[k].a === this.userCountry || nextRound[k].b === this.userCountry){
            this.userMatchIdx = k; break;
          }
        }
        if (this.userMatchIdx === -1) this.userMatchIdx = 0;
      }
      /* Check champion */
      if (r === this.rounds.length - 1){
        this.champion = m.winner;
        if (this.champion === this.userCountry){
          user.trophies = (user.trophies || 0) + 1;
          this.reward = 500;
          user.coins += 500;
          saveGuest();
        }
      }
    },
    simulateRound: function(r){
      var matches = this.rounds[r];
      for (var i=0;i<matches.length;i++){
        var m = matches[i];
        if (m.played) continue;
        /* Skip user's match */
        if (m.a === this.userCountry || m.b === this.userCountry) continue;
        if (!m.a || !m.b) continue;
        /* Simulate */
        var strengthA = m.a.id === 'nl' || m.a.id === 'au' || m.a.id === 'de' ? 1.2 : 1.0;
        var strengthB = m.b.id === 'nl' || m.b.id === 'au' || m.b.id === 'de' ? 1.2 : 1.0;
        var sA = Math.floor(Math.random() * 4 * strengthA);
        var sB = Math.floor(Math.random() * 4 * strengthB);
        while (sA === sB) sB = Math.floor(Math.random() * 4 * strengthB);
        m.scoreA = sA; m.scoreB = sB;
        m.played = true;
        m.winner = (sA > sB) ? m.a : m.b;
      }
      /* Advance winners to next round */
      if (r < this.rounds.length - 1){
        var next = this.rounds[r + 1];
        for (var j=0;j<matches.length;j++){
          var winner = matches[j].winner;
          var slot = next[Math.floor(j / 2)];
          if (j % 2 === 0) slot.a = winner;
          else slot.b = winner;
        }
      }
    }
  };

  /* Find first user match */
  var round0 = tournament.rounds[0];
  for (var i=0;i<round0.length;i++){
    if (round0[i].a === tournament.userCountry || round0[i].b === tournament.userCountry){
      tournament.userMatchRound = 0;
      tournament.userMatchIdx = i;
      break;
    }
  }
}

function renderTournament(){
  var body = document.getElementById('bracket-body');
  body.innerHTML = '';

  var rounds = tournament.rounds;
  var titles = ['QUARTER-FINALS','SEMI-FINALS','FINAL'];

  for (var r=0;r<rounds.length;r++){
    var col = document.createElement('div');
    col.className = 'bracket-col';
    var title = document.createElement('div');
    title.className = 'bracket-title';
    title.textContent = titles[r];
    col.appendChild(title);

    for (var i=0;i<rounds[r].length;i++){
      var m = rounds[r][i];
      var el = document.createElement('div');
      el.className = 'bracket-match';
      var isCurrent = (r === tournament.userMatchRound && i === tournament.userMatchIdx && !m.played && tournament.champion === null);
      var isDone = m.played;
      var isLocked = !m.a || !m.b;
      if (isCurrent) el.className += ' current';
      else if (isDone) el.className += ' done';
      else if (isLocked) el.className += ' locked';

      var nameA = m.a ? m.a.name : 'TBD';
      var codeA = m.a ? m.a.code : '—';
      var nameB = m.b ? m.b.name : 'TBD';
      var codeB = m.b ? m.b.code : '—';
      var winA = (m.winner && m.a === m.winner) ? ' win' : '';
      var winB = (m.winner && m.b === m.winner) ? ' win' : '';

      el.innerHTML =
        '<div class="bm-team' + winA + '">' + nameA + '<span class="code">' + codeA + '</span></div>' +
        '<div class="bm-team' + winB + '">' + nameB + '<span class="code">' + codeB + '</span></div>';
      col.appendChild(el);
    }
    body.appendChild(col);
  }

  /* Champion trophy */
  if (tournament.champion){
    var trophy = document.createElement('div');
    trophy.className = 'trophy';
    var won = (tournament.champion === tournament.userCountry);
    trophy.innerHTML =
      '<div class="emoji">' + (won ? '🏆' : '🥈') + '</div>' +
      '<h3>' + (won ? 'CHAMPION!' : tournament.champion.name.toUpperCase()) + '</h3>' +
      '<p>' + (won ? '+' + tournament.reward + ' 🪙  TROPHY EARNED' : 'Better luck next time') + '</p>';
    body.appendChild(trophy);
  }

  document.getElementById('tour-coins').textContent = Math.floor(user.coins);

  /* Update play button */
  var btn = document.getElementById('btn-next-tour-match');
  if (tournament.champion){
    btn.textContent = '🏆  NEW TOURNAMENT';
    btn.onclick = function(){ buildTournament(); renderTournament(); };
  } else {
    btn.textContent = '▶  PLAY NEXT MATCH';
    btn.onclick = startTournamentMatch;
  }
}

function startTournamentMatch(){
  if (!tournament) return;
  if (tournament.champion) return;
  var m = tournament.rounds[tournament.userMatchRound][tournament.userMatchIdx];
  if (!m || !m.a || !m.b) return;
  var opp = (m.a === tournament.userCountry) ? m.b : m.a;
  startMatch(opp.id, tournament.court, tournament.difficulty);
}

/* =========================================================
   SCREEN SWITCH
   ========================================================= */
function showScreen(id){
  var ids = ['scr-auth','scr-home','scr-shop','scr-setup','scr-tournament','scr-pause','scr-result'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (ids[i] === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  }

/* =========================================================
   JOYSTICK
   ========================================================= */
var joyEl = document.getElementById('joystick');
var knobEl = document.getElementById('knob');

function joyStart(e){
  if (e.preventDefault) e.preventDefault();
  joy.active = true;
  joyUpdate(e);
  if (joyEl.setPointerCapture) try { joyEl.setPointerCapture(e.pointerId); } catch(err){}
}
function joyUpdate(e){
  var rect = joyEl.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  var dx = (e.clientX - cx) / (rect.width/2);
  var dy = (e.clientY - cy) / (rect.height/2);
  var m = hypot(dx, dy);
  if (m > 1){ dx /= m; dy /= m; }
  joy.dx = dx; joy.dy = dy;
  var kx = dx * (rect.width/2 - 36);
  var ky = dy * (rect.height/2 - 36);
  knobEl.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
}
function joyEnd(){
  joy.active = false;
  joy.dx = 0; joy.dy = 0;
  knobEl.style.transform = 'translate(0,0)';
}
joyEl.addEventListener('pointerdown', joyStart);
window.addEventListener('pointermove', function(e){ if (joy.active) joyUpdate(e); });
window.addEventListener('pointerup', joyEnd);
window.addEventListener('pointercancel', joyEnd);

/* =========================================================
   ACTION BUTTONS (single-shot on tap)
   ========================================================= */
function bindTap(id, action){
  var el = document.getElementById(id);
  var lastFire = 0;
  function down(e){
    if (e.preventDefault) e.preventDefault();
    el.classList.add('active');
    var now = Date.now();
    if (now - lastFire > 200){
      lastFire = now;
      try { action(); } catch(err){ if (window.console) console.error(err); }
    }
  }
  function up(){ el.classList.remove('active'); }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindTap('btnShoot', function(){
  if (screen === 'match') shootQueued = true;
});
bindTap('btnPass', function(){
  if (screen === 'match') passQueued = true;
});
bindTap('btnSprint', function(){
  if (screen !== 'match') return;
  if (!ctrl.sprintActive && ctrl.sprintCd <= 0){
    ctrl.sprintActive = true;
    ctrl.sprintTimer = SPRINT_DUR;
  }
});
bindTap('btnSwitch', function(){
  if (screen !== 'match' || !match) return;
  /* Switch to next non-GK teammate */
  var cur = match.ctrlIdx;
  var n = match.teamA.length;
  for (var step=1; step<=n; step++){
    var next = (cur + step) % n;
    if (next === cur) continue;
    if (match.teamA[next].isGK && match.teamA.length > 1) continue;
    match.ctrlIdx = next;
    for (var i=0;i<match.teamA.length;i++) match.teamA[i].isControlled = (i === next);
    break;
  }
});

/* =========================================================
   KEYBOARD
   ========================================================= */
window.addEventListener('keydown', function(e){
  if (screen !== 'match') return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'ArrowUp'   || e.key === 'w' || e.key === 'W') keys.up = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
  if (e.key === ' '){ if (e.preventDefault) e.preventDefault(); shootQueued = true; }
  if (e.key === 'e' || e.key === 'E') passQueued = true;
  if (e.key === 'Shift' && !ctrl.sprintActive && ctrl.sprintCd <= 0){
    ctrl.sprintActive = true; ctrl.sprintTimer = SPRINT_DUR;
  }
  if (e.key === 'Escape') pauseMatch();
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowUp'   || e.key === 'w' || e.key === 'W') keys.up = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
});

/* =========================================================
   PAUSE
   ========================================================= */
function pauseMatch(){
  if (screen !== 'match') return;
  screen = 'pause';
  showScreen('scr-pause');
}
function resumeMatch(){
  if (screen !== 'pause') return;
  screen = 'match';
  showScreen('');
  lastTS = 0;
}
function quitMatch(){
  match = null;
  tournament = null;
  screen = 'home';
  showScreen('scr-home');
  document.getElementById('hud-match').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  buildHome();
}
document.getElementById('btnPause').addEventListener('click', pauseMatch);
document.getElementById('btn-resume').addEventListener('click', resumeMatch);
document.getElementById('btn-quit').addEventListener('click', quitMatch);

/* =========================================================
   UI WIRING
   ========================================================= */
document.getElementById('btn-enter').addEventListener('click', function(){
  screen = 'home';
  showScreen('scr-home');
  buildHome();
});

document.getElementById('btn-play').onclick = function(){
  tournament = null;
  buildSetup();
  screen = 'setup';
  showScreen('scr-setup');
};

document.getElementById('btn-tournament').onclick = function(){
  buildTournament();
  renderTournament();
  screen = 'tournament';
  showScreen('scr-tournament');
};

document.getElementById('btn-shop').onclick = function(){
  buildShop();
  screen = 'shop';
  showScreen('scr-shop');
};

document.getElementById('btn-shop-back').onclick = function(){
  buildHome();
  screen = 'home';
  showScreen('scr-home');
};

document.getElementById('btn-setup-back').onclick = function(){
  buildHome();
  screen = 'home';
  showScreen('scr-home');
};

document.getElementById('btn-tour-back').onclick = function(){
  tournament = null;
  buildHome();
  screen = 'home';
  showScreen('scr-home');
};

document.getElementById('btn-start-match').onclick = function(){
  startMatch(null, selCourt, selDiff);
};

document.getElementById('btn-newid').onclick = function(){
  if (!window.confirm('Start a new player ID?\nThis will reset your coins, kits and stats.')) return;
  storage.removeItem(GUEST_KEY);
  user = loadGuest();
  buildHome();
};

document.getElementById('btn-rematch').onclick = function(){
  if (tournament && tournament.active){
    /* Return to bracket */
    renderTournament();
    screen = 'tournament';
    showScreen('scr-tournament');
  } else {
    startMatch(null, selCourt, selDiff);
  }
};

document.getElementById('btn-result-home').onclick = function(){
  match = null;
  if (tournament && tournament.active){
    renderTournament();
    screen = 'tournament';
    showScreen('scr-tournament');
  } else {
    buildHome();
    screen = 'home';
    showScreen('scr-home');
  }
};

/* =========================================================
   RESIZE
   ========================================================= */
function resizeApp(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

/* =========================================================
   MAIN LOOP — wrapped in try/catch so one bad frame can't kill the game
   ========================================================= */
function loop(ts){
  try {
    var dt = Math.min(0.05, (ts - lastTS)/1000 || 0);
    lastTS = ts;

    if (screen === 'match' && match){
      updateMatch(dt);
      renderMatch();
    } else if (screen === 'home'){
      if (prevAuto) prevAngle += dt * 0.7;
      else {
        prevAngle += prevVel * dt;
        prevVel *= Math.pow(0.01, dt);
        if (Math.abs(prevVel) < 0.05) prevVel = 0;
        prevResume -= dt;
        if (prevResume <= 0 && !prevDrag) prevAuto = true;
      }
      drawPreview();
    } else {
      ctx.fillStyle = '#05080f';
      ctx.fillRect(0,0,W,H);
    }
  } catch(err){
    /* Log but don't stop the loop */
    if (window.console && console.error) console.error('Loop error:', err);
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('guest-id-display').textContent = user.id;
requestAnimationFrame(loop);
</script>
</body>

  try {
    var t = '__ddx_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return window.localStorage;
  } catch(e){
    var mem = {};
    return {
      getItem: function(k){ return mem[k] === undefined ? null : mem[k]; },

function clamp(v,a,b){ if (v<a) return a; if (v>b) return b; return v; }
function lerp(a,b,t){ return a + (b-a)*t; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function mod(n,m){ return ((n%m)+m)%m; }
function hashStr(s){ var h=5381; for (var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shade(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1),16);
  var r = clamp(Math.round(((n>>16)&255)+amt*255),0,255);
  var g = clamp(Math.round(((n>>8)&255)+amt*255),0,255);
  var b = clamp(Math.round((n&255)+amt*255),0,255);
  return 'rgb('+r+','+g+','+b+')';
}

/* ---------- GUEST ACCOUNT ---------- */
var GUEST_KEY = 'dhakaDerbyX.guest.v1';
function genId(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='DY-';
  for (var i=0;i<5;i++) s+=c.charAt(Math.floor(Math.random()*c.length));

}
function loadGuest(){

    if (raw){
      var u = JSON.parse(raw);
      if (u && u.id && u.id.indexOf('DY-')===0){

/* ---------- STATE ---------- */

var screen = 'auth';

/* Controls */

/* =========================================================
   HORSE DRAWING — pure side view, faces right
   ========================================================= */
function drawHorse(g, cx, groundY, scale, opts){
  var coat = opts.coat;
  var maneCol = opts.mane;
  var kit = opts.kit;
  var phase = opts.phase;
  var jumpT = opts.jumpT;   /* -1 = grounded, 0..1 = jump progress */
  var isPlayer = opts.isPlayer;
  var lean = opts.lean || 0;

  var inAir = jumpT >= 0;
  var tuck = inAir ? Math.min(1, jumpT * 5) : 0;

  g.save();
  g.translate(cx, groundY);
  g.scale(scale, scale);
  g.rotate(-lean);

  /* Shadow */
  if (!inAir){
    g.fillStyle = 'rgba(0,0,0,.32)';
    g.beginPath(); g.ellipse(0, 4, 68, 8, 0, 0, 7); g.fill();
  } else {
    /* Shadow shrinks in air */
    var shScale = 1 - jumpT * 0.4;
    var shAlpha = 0.22 * shScale;
    g.fillStyle = 'rgba(0,0,0,' + shAlpha + ')';
    g.beginPath(); g.ellipse(0, 4, 68*shScale, 8*shScale, 0, 0, 7); g.fill();
  }

  /* Dimensions (in local units where body length ~ 100) */
  var bodyCX = 0;
  var bodyCY = -85;
  var bodyRx = 55;
  var bodyRy = 24;

  /* ============ BACK LEGS (far side, then near side) ============ */
  drawLeg(g, -32, bodyCY + 6, phase + 0.5, coat, tuck, -1, 'back');
  drawLeg(g, -25, bodyCY + 12, phase + 0.0, coat, tuck, -1, 'back');

  /* ============ TAIL ============ */
  var tailWave = Math.sin(phase * 6.0) * 5;
  g.strokeStyle = maneCol;
  g.lineWidth = 8;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-bodyRx + 4, bodyCY - 6);
  g.quadraticCurveTo(-bodyRx - 18, bodyCY - 4 + tailWave, -bodyRx - 38, bodyCY + 18 + tailWave);
  g.stroke();
  g.lineWidth = 5;
  g.strokeStyle = shade(maneCol, 0.15);
  g.beginPath();
  g.moveTo(-bodyRx + 4, bodyCY - 10);
  g.quadraticCurveTo(-bodyRx - 18, bodyCY - 10 + tailWave, -bodyRx - 40, bodyCY + 8 + tailWave);
  g.stroke();

  /* ============ BODY ============ */
  g.fillStyle = coat.body;
  g.beginPath();
  g.ellipse(bodyCX, bodyCY, bodyRx, bodyRy, 0, 0, 7);
  g.fill();

  /* Belly shading */
  g.fillStyle = coat.dark;
  g.beginPath();
  g.ellipse(bodyCX, bodyCY + 8, bodyRx - 6, bodyRy - 8, 0, 0, 7);
  g.fill();

  /* Chest highlight */
  g.fillStyle = shade(coat.body, 0.10);
  g.beginPath();
  g.ellipse(bodyCX + 30, bodyCY - 4, 20, 14, 0, 0, 7);
  g.fill();

  /* ============ NECK (angled up-right) ============ */
  var neckBaseX = bodyRx - 12;
  var neckBaseY = bodyCY - 14;
  var neckTopX = bodyRx + 22;
  var neckTopY = bodyCY - 52;
  var neckAngle = inAir ? 0.30 : 0.15;

  g.fillStyle = coat.body;
  g.beginPath();
  g.moveTo(neckBaseX - 8, neckBaseY + 16);
  g.quadraticCurveTo(neckBaseX + 6, neckBaseY - 22, neckTopX - 6, neckTopY);
  g.lineTo(neckTopX + 14, neckTopY + 8);
  g.quadraticCurveTo(neckBaseX + 24, neckBaseY - 12, neckBaseX + 14, neckBaseY + 20);
  g.closePath();
  g.fill();

  /* ============ HEAD ============ */
  var headCX = neckTopX + 10;
  var headCY = neckTopY - 2;

  g.fillStyle = coat.body;
  g.beginPath();
  g.ellipse(headCX, headCY, 20, 13, -0.15 - neckAngle*0.2, 0, 7);
  g.fill();

  /* Muzzle */
  g.beginPath();
  g.ellipse(headCX + 16, headCY + 4, 10, 8, -0.15 - neckAngle*0.2, 0, 7);
  g.fill();
  /* Nostril */
  g.fillStyle = '#1a1008';
  g.beginPath();
  g.arc(headCX + 22, headCY + 4, 1.8, 0, 7);
  g.fill();

  /* Eye */
  g.fillStyle = '#1a1008';
  g.beginPath();
  g.arc(headCX + 3, headCY - 3, 2.2, 0, 7);
  g.fill();
  /* Eye highlight */
  g.fillStyle = '#ffffff';
  g.beginPath();
  g.arc(headCX + 3.5, headCY - 3.5, 0.8, 0, 7);
  g.fill();

  /* Ears */
  g.fillStyle = coat.body;
  g.beginPath();
  g.moveTo(headCX - 8, headCY - 10);
  g.lineTo(headCX - 6, headCY - 24);
  g.lineTo(headCX + 1, headCY - 11);
  g.closePath();
  g.fill();
  g.beginPath();
  g.moveTo(headCX + 1, headCY - 11);
  g.lineTo(headCX + 6, headCY - 22);
  g.lineTo(headCX + 10, headCY - 10);
  g.closePath();
  g.fill();

  /* ============ MANE ============ */
  g.strokeStyle = maneCol;
  g.lineWidth = 9;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(neckBaseX + 8, neckBaseY - 4);
  g.quadraticCurveTo(neckBaseX + 20, neckBaseY - 30, neckTopX + 2, neckTopY + 4);
  g.stroke();
  g.lineWidth = 5;
  g.strokeStyle = shade(maneCol, 0.15);
  g.beginPath();
  g.moveTo(neckBaseX + 8, neckBaseY - 8);
  g.quadraticCurveTo(neckBaseX + 22, neckBaseY - 34, neckTopX + 2, neckTopY + 1);
  g.stroke();

  /* ============ FRONT LEGS ============ */
  drawLeg(g, 38, bodyCY + 6, phase + 0.75, coat, tuck, 1, 'front');
  drawLeg(g, 30, bodyCY + 12, phase + 0.25, coat, tuck, 1, 'front');

  /* ============ RIDER ============ */
  var saddleY = bodyCY - bodyRy + 2;

  /* Saddle */
  g.fillStyle = '#3a2010';
  g.fillRect(-28, saddleY - 2, 54, 8);
  g.fillStyle = '#5a3a18';
  g.fillRect(-28, saddleY - 2, 54, 3);

  /* Rider legs */
  g.fillStyle = kit.p;
  g.beginPath();
  g.moveTo(20, saddleY + 4);
  g.lineTo(10, saddleY + 26);
  g.lineTo(24, saddleY + 30);
  g.lineTo(30, saddleY + 4);
  g.closePath();
  g.fill();
  /* Boot */
  g.fillStyle = kit.boot;
  g.fillRect(4, saddleY + 28, 24, 8);

  /* Torso */
  g.fillStyle = kit.p;
  g.beginPath();
  g.moveTo(-8, saddleY - 4);
  g.lineTo(-4, saddleY - 32);
  g.lineTo(18, saddleY - 32);
  g.lineTo(22, saddleY - 4);
  g.closePath();
  g.fill();
  /* Silks stripe */
  g.fillStyle = kit.s;
  g.fillRect(-6, saddleY - 22, 26, 6);

  /* Arm holding rein */
  g.strokeStyle = kit.p;
  g.lineWidth = 7;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(8, saddleY - 26);
  g.lineTo(30, saddleY - 22);
  g.lineTo(44, saddleY - 36);
  g.stroke();

  /* Hand */
  g.fillStyle = '#e0b080';
  g.beginPath();
  g.arc(44, saddleY - 36, 4.5, 0, 7);
  g.fill();

  /* Rein */
  g.strokeStyle = '#3a2a1a';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(44, saddleY - 36);
  g.quadraticCurveTo(60, saddleY - 42, headCX + 20, headCY + 2);
  g.stroke();

  /* Back arm */
  g.strokeStyle = kit.p;
  g.lineWidth = 6;
  g.beginPath();
  g.moveTo(-2, saddleY - 24);
  g.lineTo(-14, saddleY - 10);
  g.lineTo(-8, saddleY + 4);
  g.stroke();

  /* Neck */
  g.fillStyle = '#e8c090';
  g.fillRect(0, saddleY - 42, 12, 14);

  /* Head */
  g.fillStyle = '#f0c8a0';
  g.beginPath();
  g.arc(6, saddleY - 48, 11, 0, 7);
  g.fill();

  /* Helmet */
  g.fillStyle = kit.s;
  g.beginPath();
  g.arc(6, saddleY - 50, 12, Math.PI, Math.PI * 2);
  g.closePath();
  g.fill();
  /* Helmet stripe */
  g.fillStyle = shade(kit.s, -0.20);
  g.beginPath();
  g.arc(6, saddleY - 50, 12, Math.PI * 1.1, Math.PI * 1.9);
  g.closePath();
  g.fill();
  /* Visor */
  g.fillStyle = '#1a1008';
  g.fillRect(8, saddleY - 53, 11, 3);
  /* Goggles */
  g.fillStyle = 'rgba(60,220,255,.75)';
  g.beginPath();
  g.arc(11, saddleY - 48, 3.5, 0, 7);
  g.fill();

  /* Highlight player */
  if (isPlayer){
    g.strokeStyle = 'rgba(232,200,120,.55)';
    g.lineWidth = 2.5;
    g.setLineDash([6,5]);
    g.beginPath();
    g.ellipse(0, bodyCY, bodyRx + 12, bodyRy + 12, 0, 0, 7);
    g.stroke();
    g.setLineDash([]);
  }

  g.restore();
}

function drawLeg(g, hipX, hipY, phase, coat, tuck, facing, whichLeg){
  var thighLen = 22;
  var shinLen = 26;

  /* Gallop cycle: use sin for swing */
  var swing = Math.sin(phase * 2 * Math.PI);

  /* Base angles from vertical */
  var thighAngle = 0;
  var shinAngle = 0;

  if (whichLeg === 'back'){
    /* Back legs push back */
    thighAngle = -0.35 - swing * 0.55;
    shinAngle = 0.9 - swing * 0.35;
  } else {
    /* Front legs reach forward */
    thighAngle = 0.25 + swing * 0.55;
    shinAngle = 0.7 + swing * 0.4;
  }

  /* Tuck the leg in air */
  if (tuck > 0){
    if (whichLeg === 'front'){
      thighAngle = lerp(thighAngle, -0.9, tuck);
      shinAngle = lerp(shinAngle, 2.1, tuck);
    } else {
      thighAngle = lerp(thighAngle, 1.0, tuck);
      shinAngle = lerp(shinAngle, 2.0, tuck);
    }
  }

  /* Knee */
  var kneeX = hipX + Math.sin(thighAngle) * thighLen;
  var kneeY = hipY + Math.cos(thighAngle) * thighLen;

  /* Hoof */
  var hoofX = kneeX + Math.sin(thighAngle - shinAngle) * shinLen;
  var hoofY = kneeY + Math.cos(thighAngle - shinAngle) * shinLen;

  /* Upper leg */
  g.strokeStyle = coat.body;
  g.lineWidth = 9;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(hipX, hipY);
  g.lineTo(kneeX, kneeY);
  g.stroke();

  /* Lower leg */
  g.lineWidth = 7;
  g.beginPath();
  g.moveTo(kneeX, kneeY);
  g.lineTo(hoofX, hoofY);
  g.stroke();

  /* Hoof */
  g.fillStyle = '#1a1008';
  g.beginPath();
  g.ellipse(hoofX, hoofY, 6, 4.5, thighAngle*0.3, 0, 7);
  g.fill();
}

var prevCanvas = document.getElementById('prev');
var prevCtx = prevCanvas.getContext('2d');
var prevPhase = 0;
var prevJump = -1;
var prevJumpTimer = 0;

function drawPreview(dt){
  var g = prevCtx;
  g.clearRect(0, 0, prevCanvas.width, prevCanvas.height);

  /* Ground line */
  g.fillStyle = 'rgba(60,45,25,.55)';
  g.fillRect(0, 340, prevCanvas.width, 100);
  g.fillStyle = 'rgba(255,255,255,.10)';
  g.fillRect(0, 340, prevCanvas.width, 2);

  /* Glow */
  var grd = g.createRadialGradient(190, 280, 30, 190, 280, 200);
  grd.addColorStop(0, 'rgba(232,200,120,.18)');
  grd.addColorStop(1, 'rgba(232,200,120,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, prevCanvas.width, prevCanvas.height);

  /* Update gallop phase */
  prevPhase += dt * 3.0;

  /* Jump cycle every 3 seconds */
  prevJumpTimer += dt;
  if (prevJump >= 0){
    prevJump += dt / 0.85;
    if (prevJump >= 1) prevJump = -1;
  } else if (prevJumpTimer > 3.0){
    prevJumpTimer = 0;
    prevJump = 0;
  }

  var jumpH = 0;
  if (prevJump >= 0){
    jumpH = Math.sin(prevJump * Math.PI) * 80;
  }

  drawHorse(g, 190, 340 - jumpH, 1.25, {
    coat: getCoat(user.coat),
    mane: MANE_COLORS[user.mane],
    kit: getKit(user.equipped),
    phase: prevPhase,
    jumpT: prevJump,
    isPlayer: false,
    lean: 0
  });
}

/* =========================================================
   OBSTACLE TYPES (heights in meters)
   ========================================================= */
var OBSTACLE_TYPES = [
  {type:'stone',    name:'Stone',    height:0.55, width:1.2, c1:'#8a8a8a', c2:'#5a5a5a', w:1.3},
  {type:'wood',     name:'Log',      height:0.95, width:2.0, c1:'#8b5a2b', c2:'#5a3a1a', w:1.4},
  {type:'hay',      name:'Hay Bale', height:1.15, width:1.6, c1:'#e8c878', c2:'#a89850', w:1.2},
  {type:'barrel',   name:'Barrel',   height:1.45, width:1.2, c1:'#c0392b', c2:'#7a1a10', w:1.0},
  {type:'barricade',name:'Barricade',height:1.75, width:1.6, c1:'#e8e8e8', c2:'#c0392b', w:0.9},
  {type:'metal',    name:'Metal Fence',height:2.25, width:1.5, c1:'#a8a8b0', c2:'#5a5a60', w:0.7}
];
var OBST_WEIGHT = 0;
for (var oi=0; oi<OBSTACLE_TYPES.length; oi++) OBST_WEIGHT += OBSTACLE_TYPES[oi].w;

function pickObstacle(diff){
  /* Harder difficulty = more tall obstacles */
  var r = Math.random() * OBST_WEIGHT;
  for (var i=0;i<OBSTACLE_TYPES.length;i++){
    r -= OBSTACLE_TYPES[i].w;
    if (r <= 0) return OBSTACLE_TYPES[i];
  }
  return OBSTACLE_TYPES[0];
}

function generateObstacles(mapId){
  var seed = hashStr(mapId);
  var rng = mulberry32(seed);
  var arr = [];
  var x = 30 + rng() * 10;
  while (x < RACE_LEN - 12){
    var t = pickObstacle();
    arr.push({ x: x, type: t, checkedBy: {} });
    /* Spacing tightens as race progresses */
    var baseGap = 20 - (x / RACE_LEN) * 6;
    x += baseGap + rng() * 12;
  }
  return arr;
}
