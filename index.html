<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khelo Dhaka</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
#bg{position:fixed;inset:0;z-index:0}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;z-index:0}
.o1{width:400px;height:400px;background:#4cc9f0;top:5%;left:-100px}
.o2{width:500px;height:500px;background:#a06cd5;top:40%;right:-150px}
.o3{width:350px;height:350px;background:#ff3b3b;bottom:5%;left:35%;opacity:.2}

/* ---------- AUTH SCREEN ---------- */
#auth{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#1a0a3a 0%,#05060f 60%);padding:20px}
#auth.off{display:none}
.abox{width:100%;max-width:420px;padding:36px 32px 28px;border-radius:24px;
  background:linear-gradient(160deg,rgba(20,24,40,.98),rgba(10,12,24,.98));
  border:1px solid rgba(76,201,240,.28);box-shadow:0 30px 80px rgba(0,0,0,.8);text-align:center}
.abox .logo{width:72px;height:72px;margin:0 auto 16px;display:block}
.abox h1{font-size:32px;font-weight:900;letter-spacing:4px;margin-bottom:4px;
  background:linear-gradient(90deg,#4cc9f0,#a06cd5,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
.abox .sub{font-size:11px;letter-spacing:5px;color:#7d8aa8;font-weight:700;text-transform:uppercase;margin-bottom:26px}
.gbtn{width:100%;padding:14px;border-radius:12px;border:0;font-size:14px;font-weight:800;letter-spacing:.5px;
  cursor:pointer;background:#fff;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .2s;margin-bottom:12px}
.gbtn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,255,255,.2)}
.gbtn svg{width:20px;height:20px;flex-shrink:0}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#5a6a8a;font-size:11px;letter-spacing:2px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(255,255,255,.05);padding:5px;border-radius:12px}
.tab{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;color:#8fa4bb;font-weight:700;
  font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.tab.active{background:linear-gradient(135deg,#4cc9f0,#06d6a0);color:#05060f}
.ainp{width:100%;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.ainp:focus{border-color:#4cc9f0;background:rgba(76,201,240,.07)}
.ainp::placeholder{color:#5a6a8a}
.abtn{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,#4cc9f0,#06d6a0);color:#05060f;letter-spacing:1px;transition:.2s;font-family:inherit}
.abtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(76,201,240,.4)}
.abtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.guestlink{margin-top:18px;font-size:13px;color:#7d8aa8}
.guestlink a{color:#ffd166;cursor:pointer;font-weight:800;text-decoration:underline;text-decoration-style:dotted}
.amsg{min-height:18px;font-size:12px;color:#ff6b6b;margin-top:8px;text-align:center}
.amsg.ok{color:#06d6a0}

/* ---------- HUB ---------- */
#hub{position:relative;z-index:10;height:100%;overflow-y:auto}
#hub.off{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;position:relative}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px}
.bt .l1{font-size:12px;letter-spacing:8px;color:#7fd8ff;font-weight:800}
.bt .l2{font-size:26px;letter-spacing:4px;font-weight:900;
  background:linear-gradient(90deg,#ffd166,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;gap:12px;align-items:center}
.pill{padding:8px 16px;border-radius:20px;background:rgba(76,201,240,.1);
  border:1px solid rgba(76,201,240,.35);font-family:'Courier New',monospace;font-weight:800;font-size:14px;color:#7fd8ff}
.pill.gold{background:rgba(255,209,102,.1);border-color:rgba(255,209,102,.35);color:#ffd166}
.userbtn{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:24px;
  background:rgba(76,201,240,.1);border:1px solid rgba(76,201,240,.3);cursor:pointer;transition:.2s;font-family:inherit}
.userbtn:hover{background:rgba(76,201,240,.2)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4cc9f0,#06d6a0);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#05060f}
.uname{font-size:13px;font-weight:800;color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown{position:absolute;top:70px;right:40px;background:linear-gradient(160deg,rgba(20,24,40,.99),rgba(10,12,24,.99));
  border:1px solid rgba(76,201,240,.3);border-radius:14px;padding:8px;min-width:200px;display:none;z-index:50;
  box-shadow:0 20px 50px rgba(0,0,0,.7)}
.dropdown.on{display:block}
.dditem{display:block;width:100%;padding:11px 16px;background:transparent;border:0;border-radius:9px;
  color:#c3d3e4;font-size:13px;font-weight:700;text-align:left;cursor:pointer;font-family:inherit;transition:.15s}
.dditem:hover{background:rgba(76,201,240,.12);color:#fff}
.dditem.logout{color:#ff8a8a}
.dditem.logout:hover{background:rgba(255,107,107,.15);color:#ff6b6b}

.hero{text-align:center;padding:20px 40px 40px}
.hero h1{font-size:clamp(48px,7vw,88px);font-weight:900;letter-spacing:6px;line-height:1;
  background:linear-gradient(90deg,#4cc9f0,#a06cd5,#ffd166,#ff3b3b,#4cc9f0);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sh 8s linear infinite;margin-bottom:14px}
@keyframes sh{100%{background-position:200% 50%}}
.hero p{font-size:14px;letter-spacing:5px;color:#7d8aa8;font-weight:600;text-transform:uppercase}
.hero p b{color:#4cc9f0}
.stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:0 40px 40px;max-width:1200px;margin:0 auto}
.chip{flex:1;min-width:150px;max-width:220px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(160deg,rgba(20,24,40,.85),rgba(10,12,24,.85));
  border:1px solid rgba(76,201,240,.2)}
.chip .lbl{font-size:10px;letter-spacing:2px;color:#7d8aa8;font-weight:800;text-transform:uppercase;margin-bottom:6px}
.chip .val{font-size:22px;font-weight:900;color:#fff}
.chip .val.c{color:#4cc9f0}.chip .val.g{color:#ffd166}.chip .val.gr{color:#06d6a0}.chip .val.p{color:#ff3b3b}
.games{max-width:1300px;margin:0 auto;padding:0 40px 80px}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.sh2 h2{font-size:15px;letter-spacing:4px;color:#7fd8ff;font-weight:800;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{position:relative;background:linear-gradient(160deg,rgba(20,24,40,.85),rgba(10,12,24,.9));
  border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px 16px;cursor:pointer;transition:.35s;text-align:center}
.card:hover{transform:translateY(-8px);border-color:var(--ac);box-shadow:0 24px 48px -12px var(--acg)}
.card .ico{font-size:48px;line-height:1;margin-bottom:12px;display:block}
.card h3{font-size:14px;font-weight:900;letter-spacing:1px;margin-bottom:5px}
.card .sub{font-size:10px;letter-spacing:1px;color:#7d8aa8;font-weight:600;text-transform:uppercase}
.card .badge{position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--ac);color:#0a0a14}
.card .empty{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:8px;color:#ff6b6b;font-weight:800;text-transform:uppercase}
footer{text-align:center;padding:30px;font-size:11px;letter-spacing:2px;color:#5a6a8a;border-top:1px solid rgba(255,255,255,.05)}
footer b{color:#4cc9f0;font-weight:800}
#viewer{position:fixed;inset:0;z-index:100;background:#05060f;display:none}
#viewer.on{display:block}
#gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#05060f}
#backBtn{position:fixed;top:14px;left:14px;z-index:101;padding:10px 20px;border-radius:12px;
  background:linear-gradient(135deg,#4cc9f0,#06d6a0);border:0;color:#05060f;font-size:13px;
  font-weight:900;letter-spacing:2px;cursor:pointer;display:none;font-family:inherit}
#backBtn.on{display:block}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.uname{display:none}}
</style>
</head>

<!-- ============ AUTH SCREEN ============ -->

  <div class="abox">

<html lang="en">
<head>
<meta charset="utf-8">
<title>Dhaka Tennis</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; background:#050810; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; color:#fff; user-select:none; }

    border-radius:14px; padding:10px 30px; font-size:15px; font-weight:700;
  }
  #hud .sets { color:#ffd166; margin-right:18px; }

  .msg-banner.show { opacity:1; }

  .screen-overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(2,6,4,.9); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:50;
  }
  .screen-overlay h1 { font-size:56px; font-weight:900; letter-spacing:4px; margin-bottom:20px; }
  .screen-overlay.win h1 { color:#d4ff50; }
  .screen-overlay.loss h1 { color:#ff5c5c; }
  .screen-overlay p { font-size:20px; color:#9fb2c8; margin-bottom:8px; letter-spacing:1px; }
  .screen-overlay .stat { font-size:14px; color:#7d90a8; margin-bottom:4px; }
  .screen-overlay button {
    margin-top:30px; padding:14px 40px; font-size:16px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(135deg,#d4ff50,#8ac926); color:#0a1a05;
    border:0; border-radius:12px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div id="hud" style="display:none;">
    <div class="scoreboard">
      <span class="sets" id="hud-sets">SETS 0-0</span>
      <span class="games" id="hud-games">GAMES 0-0</span>
      <span class="points" id="hud-points">0 - 0</span>
    </div>
  </div>

  <div id="controls">
    <div class="action" id="btnMoveL"><span class="ico">◀</span></div>
    <div class="action" id="btnMoveR"><span class="ico">▶</span></div>
    <div class="action" id="btnJump"><span class="ico">🦘</span><span class="lbl">JUMP</span></div>

    <div class="action" id="btnServe"><span class="ico">🎯</span><span class="lbl">SERVE</span></div>
    <div class="action" id="btnSmash"><span class="ico">💥</span><span class="lbl">SMASH</span></div>
    <div class="action" id="btnLob"><span class="ico">🏹</span><span class="lbl">LOB</span></div>
    <div class="action" id="btnTopspin"><span class="ico">⬆</span><span class="lbl">TOPSPIN</span></div>
    <div class="action" id="btnFlat"><span class="ico">🎾</span><span class="lbl">FLAT</span></div>
    <div class="action" id="btnSlice"><span class="ico">⚡</span><span class="lbl">SLICE</span></div>
  </div>

  <button id="pauseBtn">⏸</button>

  <div class="msg-banner" id="msgBanner"></div>

  <div id="menu">
    <h1>DHAKA TENNIS</h1>
    <div class="subtitle">Pro Tour</div>
    <button id="btnStart">▶ START MATCH</button>
    <div class="hint">
      SERVE with the ball toss · Return with FLAT or TOPSPIN<br>
      Jump + SMASH for winners · Move with ◀ ▶ or WASD
    </div>
  </div>
</div>

<script>
/* ============================================================
   COMPATIBILITY POLYFILLS (for older browsers)
   ============================================================ */
(function(){
  if (typeof CanvasRenderingContext2D === 'undefined') return;
  if (!CanvasRenderingContext2D.prototype.ellipse){
    CanvasRenderingContext2D.prototype.ellipse = function(x, y, rx, ry, rot, a1, a2, acw){
      this.save();
      this.translate(x, y);
      this.rotate(rot || 0);
      this.scale(rx, ry);
      this.arc(0, 0, 1, a1, a2 === undefined ? Math.PI * 2 : a2, acw || false);
      this.restore();
    };
  }
})();
(function(){
  if (!window.requestAnimationFrame){
    window.requestAnimationFrame = function(cb){ return setTimeout(function(){ cb(Date.now()); }, 16); };
  }
})();

/* ============================================================
   CANVAS
   ============================================================ */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

/* ============================================================
   CONSTANTS
   ============================================================ */
var W = 1280, H = 720;
var COURT_GROUND = 620;
var COURT_L = 60, COURT_R = 1220;
var NET_X = 640;
var NET_HEIGHT = 155;
var SERVICE_L = 240, SERVICE_R = 1040;

var BALL_R = 12;
var BALL_GRAVITY = 1350;
var BALL_DRAG = 0.18;
var BALL_BOUNCE = 0.68;

var HAND_Y = 95;
var MOVE_SPEED = 560;
var JUMP_V = 1050;
var PLAYER_GRAVITY = 2200;
var PLAYER_REACH = 140;

var SHOTS = {
  flat:  { vx: 900,  vy: 260 },
  top:   { vx: 800,  vy: 520 },
  slice: { vx: 1000, vy: 140 },
  lob:   { vx: 500,  vy: 900 },
  smash: { vx: 1150, vy: -280 }
};

/* ============================================================
   STATE
   ============================================================ */
var screen = 'menu';        /* 'menu' | 'match' | 'over' */
var match = null;
var lastTS = 0;

var keys = { left: false, right: false };
var manualTimer = 0;
var manualDir = 0;
var press = { jump: false, serve: false, flat: false, top: false, slice: false, lob: false, smash: false };

/* ============================================================
   DOM HELPERS
   ============================================================ */
function $(id){ return document.getElementById(id); }
function show(id, on){ $(id).style.display = on ? 'block' : 'none'; }

function showBanner(text, duration){
  var el = $('msgBanner');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(function(){ el.classList.remove('show'); }, (duration || 1.4) * 1000);
}

function updateHud(){
  if (!match) return;
  var su = match.score.u, so = match.score.o;
  $('hud-sets').textContent = 'SETS ' + su.sets + '-' + so.sets;
  $('hud-games').textContent = 'GAMES ' + su.games + '-' + so.games;

  var uLabel = pointLabel(su.pts, so.pts);
  var oLabel = pointLabel(so.pts, su.pts);
  var srvMark = match.server === 'user' ? ' ●' : '';
  var srvMark2 = match.server === 'opp' ? '● ' : '';
  $('hud-points').textContent = srvMark2 + uLabel + ' - ' + oLabel + srvMark;
}

function pointLabel(p, o){
  if (p >= 4 && p - o >= 2) return 'GAME';
  if (p >= 3 && o >= 3){
    if (p === o) return '40';
    return p > o ? 'AD' : '40';
  }
  return ['0', '15', '30', '40'][p] || '40';
}

/* ============================================================
   MATCH SETUP
   ============================================================ */
function createPerson(homeX, side){
  return {
    x: homeX, y: 0, vy: 0,
    homeX: homeX, side: side,
    onGround: true,
    pose: 'ready',
    swingT: 0, swing: false, hitCd: 0
  };
}

function newMatch(){
  var player = createPerson(260, 'left');
  var opp    = createPerson(1020, 'right');

  match = {
    ball: {
      x: 0, y: 0, vx: 0, vy: 0,
      active: false,
      lastHitter: null,
      bounceCount: 0,
      lastBounceSide: null,
      justServed: false
    },
    player: player,
    opp: opp,
    score: {
      u: { pts: 0, games: 0, sets: 0 },
      o: { pts: 0, games: 0, sets: 0 }
    },
    server: Math.random() < 0.5 ? 'user' : 'opp',
    state: 'serve',         /* serve | rally | point | set-over | match-over */
    stateTimer: 0,
    servePhase: 'idle',     /* idle | toss */
    serveTimer: 0,
    winner: null,
    matchStats: { aces: 0, winners: 0 }
  };

  resetPoint(match.server === 'user' ? 1.5 : 1.2);
  screen = 'match';

  show('menu', false);
  show('hud', true);
  $('controls').style.display = 'block';
  show('pauseBtn', true);

  updateHud();
  showBanner(match.server === 'user' ? 'YOUR SERVE' : 'OPPONENT SERVES', 1.6);
}

function resetPoint(timer){
  if (!match) return;
  var p = match.player;
  p.x = p.homeX; p.y = 0; p.vy = 0; p.onGround = true;
  p.pose = 'ready'; p.swing = false; p.swingT = 0; p.hitCd = 0;
  var o = match.opp;
  o.x = o.homeX; o.y = 0; o.vy = 0; o.onGround = true;
  o.pose = 'ready'; o.swing = false; o.swingT = 0; o.hitCd = 0;

  var b = match.ball;
  b.active = false;
  b.vx = 0; b.vy = 0;
  b.bounceCount = 0;
  b.lastBounceSide = null;
  b.lastHitter = null;
  b.justServed = false;

  if (match.server === 'user'){
    b.x = p.x + 30;
    b.y = HAND_Y - 5;
  } else {
    b.x = o.x - 30;
    b.y = HAND_Y - 5;
  }

  match.state = 'serve';
  match.servePhase = 'idle';
  match.serveTimer = 0;
  match.stateTimer = timer || 1.2;
  manualTimer = 0;
  manualDir = 0;
}

/* ============================================================
   INPUT BINDING
   ============================================================ */
function bindTap(id, key){
  var el = $(id);
  if (!el) return;
  function down(e){
    if (e.preventDefault) e.preventDefault();
    el.style.filter = 'brightness(1.3)';
    if (screen === 'match') press[key] = true;
  }
  function up(){ el.style.filter = ''; }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

function bindHold(id, dir){
  var el = $(id);
  if (!el) return;
  function down(e){
    if (e.preventDefault) e.preventDefault();
    el.classList.add('moving');
    manualDir = dir;
    manualTimer = 0.5;
  }
  function up(){
    el.classList.remove('moving');
    manualTimer = 0.1;
  }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

/* Bind action buttons */
bindTap('btnJump', 'jump');
bindTap('btnServe', 'serve');
bindTap('btnFlat', 'flat');
bindTap('btnTopspin', 'top');
bindTap('btnSlice', 'slice');
bindTap('btnLob', 'lob');
bindTap('btnSmash', 'smash');
bindHold('btnMoveL', -1);
bindHold('btnMoveR', 1);

/* Keyboard */
window.addEventListener('keydown', function(e){
  if (screen !== 'match') return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' '){ e.preventDefault(); press.flat = true; }
  if (e.key === 's' || e.key === 'S') press.serve = true;
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') press.jump = true;
  if (e.key === 'f' || e.key === 'F') press.smash = true;
  if (e.key === 'l' || e.key === 'L') press.lob = true;
  if (e.key === 't' || e.key === 'T') press.top = true;
  if (e.key === 'k' || e.key === 'K') press.slice = true;
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

/* Menu start */
$('btnStart').addEventListener('click', function(){ newMatch(); });

/* Pause button */
$('pauseBtn').addEventListener('click', function(){
  if (screen === 'match'){
    screen = 'paused';
    showBanner('PAUSED — CLICK ⏸ TO RESUME', 3);
  } else if (screen === 'paused'){
    screen = 'match';
    showBanner('RESUME!', 0.8);
  }
});

/* ============================================================
   PLAYER PHYSICS
   ============================================================ */
function stepPlayerPhysics(p, dt){
  if (!p.onGround){
    p.vy -= PLAYER_GRAVITY * dt;
    p.y += p.vy * dt;
    if (p.y <= 0){
      p.y = 0; p.vy = 0; p.onGround = true;
      if (p.pose === 'jump') p.pose = 'ready';
    }
  }
  if (p.swing){
    p.swingT += dt * 3.5;
    if (p.swingT >= 1){
      p.swingT = 1; p.swing = false;
      p.pose = 'ready';
    }
  }
  if (p.hitCd > 0) p.hitCd -= dt;
}

function movePlayerX(p, dt, dir, speed){
  p.x += dir * speed * dt;
  if (p.side === 'left') p.x = Math.max(COURT_L + 30, Math.min(NET_X - 40, p.x));
  else p.x = Math.max(NET_X + 40, Math.min(COURT_R - 30, p.x));
}

/* ============================================================
   BALL PHYSICS
   ============================================================ */
function stepBall(dt){
  var b = match.ball;
  if (!b.active) return;

  b.vy -= BALL_GRAVITY * dt;
  b.vx *= Math.pow(1 - BALL_DRAG, dt);
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  /* Net collision */
  if (b.x > NET_X - BALL_R && b.x < NET_X + BALL_R){
    if (b.y < NET_HEIGHT){
      if (b.vx > 0){ b.x = NET_X - BALL_R - 1; b.vx = -Math.abs(b.vx) * 0.3; }
      else         { b.x = NET_X + BALL_R + 1; b.vx =  Math.abs(b.vx) * 0.3; }
      b.vy *= 0.5;
    }
  }

  /* Ground */
  if (b.y <= BALL_R){
    b.y = BALL_R;
    b.vy = Math.abs(b.vy) * BALL_BOUNCE;
    b.vx *= 0.88;
    if (Math.abs(b.vy) < 50) b.vy = 0;

    var side = b.x < NET_X ? 'user' : 'opp';
    if (b.lastBounceSide !== side){
      b.bounceCount = 1;
      b.lastBounceSide = side;
    } else {
      b.bounceCount++;
    }

    /* Out of bounds? */
    if (b.x < COURT_L - 20 || b.x > COURT_R + 20){
      awardPoint(b.lastHitter === 'user' ? 'opp' : 'user');
      return;
    }

    /* Serve fault check */
    if (b.justServed){
      var serverSide = b.lastHitter === 'user' ? 'user' : 'opp';
      if (side === serverSide){
        /* Serve landed on server's own side — fault */
        awardPoint(b.lastHitter === 'user' ? 'opp' : 'user');
        return;
      }
      b.justServed = false;
    }

    /* Second bounce on same side — point to opponent of that side */
    if (b.bounceCount >= 2){
      awardPoint(side === 'user' ? 'opp' : 'user');
      return;
    }
  }
}

function predictLandingX(){
  var b = match.ball;
  if (!b.active) return b.x;
  var sx = b.x, sy = b.y, svx = b.vx, svy = b.vy;
  var step = 1 / 60;
  for (var i = 0; i < 300; i++){
    svy -= BALL_GRAVITY * step;
    svx *= Math.pow(1 - BALL_DRAG, step);
    sx += svx * step;
    sy += svy * step;
    if (sy <= BALL_R) break;
  }
  return sx;
}

/* ============================================================
   SHOTS
   ============================================================ */
function ballScreenY(){ return COURT_GROUND - match.ball.y; }
function handScreenX(p){ return p.x + (p.side === 'left' ? 15 : -15); }
function handScreenY(p){ return COURT_GROUND - p.y - HAND_Y; }

function ballInReach(p){
  var dx = match.ball.x - handScreenX(p);
  var dy = ballScreenY() - handScreenY(p);
  return Math.sqrt(dx * dx + dy * dy) < PLAYER_REACH;
}

function tryShot(p, kind){
  if (!p || p.hitCd > 0) return false;
  if (!ballInReach(p)) return false;
  if (kind === 'smash' && p.onGround) return false;

  var b = match.ball;
  var dir = p.side === 'left' ? 1 : -1;

  /* Snap ball to hand */
  b.x = handScreenX(p) + dir * 8;
  b.y = HAND_Y + p.y + 10;

  var s = SHOTS[kind] || SHOTS.flat;
  var jitter = 0.9 + Math.random() * 0.2;
  b.vx = dir * s.vx * jitter;
  b.vy = s.vy * (0.95 + Math.random() * 0.1);
  b.active = true;
  b.lastHitter = p.side === 'left' ? 'user' : 'opp';
  b.bounceCount = 0;
  b.lastBounceSide = null;
  b.justServed = false;

  p.swing = true;
  p.swingT = 0;
  p.pose = 'swing';
  p.hitCd = 0.30;

  match.state = 'rally';
  return true;
}

/* ============================================================
   USER CONTROLLER
   ============================================================ */
function updateUser(dt){
  var p = match.player;
  var b = match.ball;

  /* SERVE IDLE */
  if (match.state === 'serve' && match.servePhase === 'idle' && match.server === 'user'){
    p.pose = 'serve-ready';

    /* Movement */
    if (manualTimer > 0){ manualTimer -= dt; movePlayerX(p, dt, manualDir, MOVE_SPEED); }
    else if (keys.left) movePlayerX(p, dt, -1, MOVE_SPEED);
    else if (keys.right) movePlayerX(p, dt, 1, MOVE_SPEED);

    /* Trigger serve on button */
    if (press.serve){
      press.serve = false;
      p.vy = JUMP_V * 0.85;
      p.onGround = false;
      p.pose = 'jump';
      b.x = p.x + 30;
      b.y = HAND_Y + 5;
      b.vx = 0;
      b.vy = 500;                 /* toss UP */
      b.active = false;
      match.servePhase = 'toss';
      match.serveTimer = 0.32;
    }
    stepPlayerPhysics(p, dt);
    return;
  }

  /* SERVE TOSS + STRIKE */
  if (match.state === 'serve' && match.servePhase === 'toss' && match.server === 'user'){
    match.serveTimer -= dt;
    b.vy -= BALL_GRAVITY * dt;
    b.y += b.vy * dt;
    stepPlayerPhysics(p, dt);

    if (match.serveTimer <= 0){
      b.x = p.x + 30;
      b.y = Math.max(p.y + HAND_Y, 280);
      b.vx = 900;
      b.vy = 300;
      b.active = true;
      b.lastHitter = 'user';
      b.bounceCount = 0;
      b.lastBounceSide = null;
      b.justServed = true;
      p.swing = true;
      p.swingT = 0;
      p.pose = 'swing';
      p.hitCd = 0.45;
      match.state = 'rally';
      match.servePhase = 'idle';
      match.matchStats.aces++;
    }
    return;
  }

  /* RALLY */
  /* Movement */
  if (manualTimer > 0){ manualTimer -= dt; movePlayerX(p, dt, manualDir, MOVE_SPEED); }
  else if (keys.left) movePlayerX(p, dt, -1, MOVE_SPEED);
  else if (keys.right) movePlayerX(p, dt, 1, MOVE_SPEED);
  else if (b.active && b.x < NET_X + 100){
    var landing = predictLandingX();
    var target = Math.max(COURT_L + 40, Math.min(NET_X - 50, landing - 5));
    var dx = target - p.x;
    if (Math.abs(dx) > 5){
      var dir = dx > 0 ? 1 : -1;
      var speed = MOVE_SPEED * Math.min(1.05, Math.max(0.6, Math.abs(dx) / 100));
      movePlayerX(p, dt, dir, speed);
    }
  } else {
    var dh = p.homeX - p.x;
    if (Math.abs(dh) > 5) movePlayerX(p, dt, dh > 0 ? 1 : -1, MOVE_SPEED * 0.7);
  }

  /* Jump */
  if (press.jump && p.onGround){
    p.vy = JUMP_V;
    p.onGround = false;
    p.pose = 'jump';
  }
  press.jump = false;

  stepPlayerPhysics(p, dt);

  /* Shots */
  if (press.flat)  { tryShot(p, 'flat');  press.flat = false; }
  if (press.top)   { tryShot(p, 'top');   press.top = false; }
  if (press.slice) { tryShot(p, 'slice'); press.slice = false; }
  if (press.lob)   { tryShot(p, 'lob');   press.lob = false; }
  if (press.smash) { tryShot(p, 'smash'); press.smash = false; }
}

/* ============================================================
   OPPONENT AI
   ============================================================ */
function updateOpp(dt){
  var p = match.opp;
  var b = match.ball;

  /* SERVE IDLE */
  if (match.state === 'serve' && match.servePhase === 'idle' && match.server === 'opp'){
    p.pose = 'serve-ready';
    match.stateTimer -= dt;

    if (match.stateTimer <= 0){
      /* Start toss */
      p.vy = JUMP_V * 0.85;
      p.onGround = false;
      p.pose = 'jump';
      b.x = p.x - 30;
      b.y = HAND_Y + 5;
      b.vx = 0;
      b.vy = 500;
      b.active = false;
      match.servePhase = 'toss';
      match.serveTimer = 0.32;
    }
    stepPlayerPhysics(p, dt);
    return;
  }

  /* SERVE TOSS + STRIKE */
  if (match.state === 'serve' && match.servePhase === 'toss' && match.server === 'opp'){
    match.serveTimer -= dt;
    b.vy -= BALL_GRAVITY * dt;
    b.y += b.vy * dt;
    stepPlayerPhysics(p, dt);

    if (match.serveTimer <= 0){
      b.x = p.x - 30;
      b.y = Math.max(p.y + HAND_Y, 280);
      b.vx = -900;
      b.vy = 300;
      b.active = true;
      b.lastHitter = 'opp';
      b.bounceCount = 0;
      b.lastBounceSide = null;
      b.justServed = true;
      p.swing = true;
      p.swingT = 0;
      p.pose = 'swing';
      p.hitCd = 0.45;
      match.state = 'rally';
      match.servePhase = 'idle';
    }
    return;
  }

  /* RALLY MOVEMENT */
  if (b.active && b.x > NET_X - 100){
    var landing = predictLandingX();
    var target = Math.max(NET_X + 50, Math.min(COURT_R - 40, landing + 5));
    var dx = target - p.x;
    if (Math.abs(dx) > 6){
      var dir = dx > 0 ? 1 : -1;
      var speed = MOVE_SPEED * 1.35 * Math.min(1.05, Math.max(0.7, Math.abs(dx) / 100));
      movePlayerX(p, dt, dir, speed);
    }
    /* Jump for high balls */
    if (p.onGround && b.y > 200 && b.vy < 0 && Math.abs(b.x - p.x) < 130){
      p.vy = JUMP_V * 0.9;
      p.onGround = false;
      p.pose = 'jump';
    }
  } else {
    var dh = p.homeX - p.x;
    if (Math.abs(dh) > 8) movePlayerX(p, dt, dh > 0 ? 1 : -1, MOVE_SPEED);
  }

  stepPlayerPhysics(p, dt);

  /* SHOT */
  if (match.state === 'rally' && b.active && b.lastHitter !== 'opp' && p.hitCd <= 0){
    if (ballInReach(p)){
      var kind = 'flat';
      var highBall = b.y > 200;
      var inAir = !p.onGround;

      if (inAir && highBall) kind = 'smash';
      else if (highBall) kind = 'top';
      else if (b.y < 80) kind = 'slice';
      else kind = Math.random() < 0.5 ? 'flat' : 'top';

      tryShot(p, kind);
    }
  }
}

/* ============================================================
   SCORING
   ============================================================ */
function awardPoint(winner){
  if (!match || match.state === 'point') return;

  if (winner === 'user') match.score.u.pts++;
  else                   match.score.o.pts++;

  match.state = 'point';
  match.stateTimer = 1.6;

  updateHud();

  var su = match.score.u.pts, so = match.score.o.pts;
  var winnerPts = winner === 'user' ? su : so;
  var loserPts  = winner === 'user' ? so : su;

  /* Game won? */
  if (winnerPts >= 4 && winnerPts - loserPts >= 2){
    /* Reset points */
    match.score.u.pts = 0;
    match.score.o.pts = 0;
    if (winner === 'user') match.score.u.games++;
    else                   match.score.o.games++;

    var gu = match.score.u.games, go = match.score.o.games;
    var wG = winner === 'user' ? gu : go;
    var lG = winner === 'user' ? go : gu;

    /* Set won? */
    if (wG >= 4 && wG - lG >= 2){
      match.score.u.games = 0;
      match.score.o.games = 0;
      if (winner === 'user') match.score.u.sets++;
      else                   match.score.o.sets++;

      var uS = match.score.u.sets, oS = match.score.o.sets;

      /* Match won? */
      if (uS >= 2 || oS >= 2){
        match.winner = winner;
        match.state = 'match-over';
        match.stateTimer = 2.5;
        showBanner(winner === 'user' ? '🏆 CHAMPION!' : 'DEFEATED', 2.5);
        updateHud();
        return;
      }

      /* Set won, server switches */
      showBanner(winner === 'user' ? '🏆 SET WON!' : 'SET LOST', 2.0);
      match.server = match.server === 'user' ? 'opp' : 'user';
      match.state = 'set-over';
      match.stateTimer = 2.0;
      updateHud();
      return;
    }

    /* Game won, server switches */
    showBanner(winner === 'user' ? '🎾 GAME!' : 'GAME LOST', 1.6);
    match.server = match.server === 'user' ? 'opp' : 'user';
  } else {
    showBanner(winner === 'user' ? '⚡ POINT!' : 'OPPONENT SCORES', 1.2);
  }
  updateHud();
}

/* ============================================================
   MATCH UPDATE
   ============================================================ */
function updateMatch(dt){
  if (!match) return;

  if (match.state === 'point' || match.state === 'set-over'){
    match.stateTimer -= dt;
    stepPlayerPhysics(match.player, dt);
    stepPlayerPhysics(match.opp, dt);
    if (match.stateTimer <= 0){
      resetPoint(match.server === 'user' ? 1.0 : 0.7);
      showBanner(match.server === 'user' ? 'YOUR SERVE' : 'OPPONENT SERVES', 1.4);
    }
    return;
  }

  if (match.state === 'match-over'){
    match.stateTimer -= dt;
    if (match.stateTimer <= 0){
      endMatch();
    }
    return;
  }

  updateUser(dt);
  updateOpp(dt);
  stepBall(dt);
  updateHud();
}

/* ============================================================
   END MATCH
   ============================================================ */
function endMatch(){
  var m = match;
  var win = m.winner === 'user';

  /* Remove any existing overlay */
  var existing = document.querySelector('.screen-overlay');
  if (existing) existing.parentNode.removeChild(existing);

  var overlay = document.createElement('div');
  overlay.className = 'screen-overlay ' + (win ? 'win' : 'loss');
  overlay.innerHTML =
    '<h1>' + (win ? 'VICTORY' : 'DEFEAT') + '</h1>' +
    '<p>Sets: ' + m.score.u.sets + ' - ' + m.score.o.sets + '</p>' +
    '<div class="stat">Aces: ' + m.matchStats.aces + '</div>' +
    '<div class="stat">Coins: ' + (win ? '+100 🪙' : '+0') + '</div>' +
    '<button id="playAgain">PLAY AGAIN</button>';

  document.getElementById('app').appendChild(overlay);

  overlay.querySelector('#playAgain').addEventListener('click', function(){
    overlay.parentNode.removeChild(overlay);
    newMatch();
  });

  /* Turn off the HUD/controls while overlay is showing */
  show('hud', false);
  $('controls').style.display = 'none';
  show('pauseBtn', false);

  screen = 'menu';
  match = null;
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderCourt(){
  /* Sky */
  var sky = ctx.createLinearGradient(0, 0, 0, COURT_GROUND);
  sky.addColorStop(0, '#1a3a5a');
  sky.addColorStop(1, '#4a7a9a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, COURT_GROUND);

  /* Stands */
  ctx.fillStyle = 'rgba(10,20,30,.6)';
  ctx.fillRect(0, 100, W, COURT_GROUND - 220);

  /* Crowd dots */
  for (var cy = 120; cy < COURT_GROUND - 140; cy += 22){
    for (var cx = 20; cx < W; cx += 26){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.04 + Math.random() * 0.06) + ')';
      ctx.fillRect(cx, cy, 3, 3);
    }
  }

  /* Court wall */
  ctx.fillStyle = '#2a4a6a';
  ctx.fillRect(0, COURT_GROUND - 120, W, 120);
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  ctx.fillRect(0, COURT_GROUND - 120, W, 5);

  /* Grass */
  var grass = ctx.createLinearGradient(0, COURT_GROUND, 0, H);
  grass.addColorStop(0, '#2a6a3a');
  grass.addColorStop(1, '#1a4a2a');
  ctx.fillStyle = grass;
  ctx.fillRect(0, COURT_GROUND, W, H - COURT_GROUND);

  /* Court surface (slightly darker green rectangle) */
  ctx.fillStyle = 'rgba(20,50,30,.5)';
  ctx.fillRect(COURT_L, COURT_GROUND, COURT_R - COURT_L, 90);

  /* Court lines */
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;

  /* Baseline */
  ctx.beginPath();
  ctx.moveTo(COURT_L, COURT_GROUND);
  ctx.lineTo(COURT_R, COURT_GROUND);
  ctx.stroke();

  /* Service lines */
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(SERVICE_L, COURT_GROUND);
  ctx.lineTo(SERVICE_L, COURT_GROUND + 90);
  ctx.moveTo(SERVICE_R, COURT_GROUND);
  ctx.lineTo(SERVICE_R, COURT_GROUND + 90);
  ctx.stroke();

  /* Service line horizontal */
  ctx.beginPath();
  ctx.moveTo(SERVICE_L, COURT_GROUND + 90);
  ctx.lineTo(SERVICE_R, COURT_GROUND + 90);
  ctx.stroke();
}

function renderNet(){
  /* Net pole */
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(NET_X - 3, COURT_GROUND - NET_HEIGHT - 10, 6, NET_HEIGHT + 10);

  /* Net top band */
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(NET_X - 6, COURT_GROUND - NET_HEIGHT - 8, 12, 6);

  /* Net mesh */
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 1;
  for (var r = 0; r <= 12; r++){
    var y = COURT_GROUND - NET_HEIGHT + r * NET_HEIGHT / 12;
    ctx.beginPath(); ctx.moveTo(NET_X - 3, y); ctx.lineTo(NET_X + 3, y); ctx.stroke();
  }
  for (var c = 0; c <= 20; c++){
    var cy = COURT_GROUND - NET_HEIGHT + c * NET_HEIGHT / 20;
    ctx.beginPath(); ctx.moveTo(NET_X - 3, cy); ctx.lineTo(NET_X + 3, cy); ctx.stroke();
  }
}

function renderPlayer(p, isUser){
  var sx = p.x;
  var sy = COURT_GROUND - p.y;
  var facing = isUser ? 1 : -1;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(facing, 1);

  /* Shadow */
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, 3, 26, 7, 0, 0, Math.PI * 2); ctx.fill();

  /* Legs */
  ctx.strokeStyle = isUser ? '#ffffff' : '#c60b1e';
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-5, -32); ctx.lineTo(-12, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, -32);  ctx.lineTo(12, -4);  ctx.stroke();

  /* Shoes */
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(-15, -2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15, -2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();

  /* Shorts */
  ctx.fillStyle = isUser ? '#ffffff' : '#ffc400';
  ctx.fillRect(-14, -46, 28, 16);

  /* Torso */
  ctx.fillStyle = isUser ? '#ffffff' : '#c60b1e';
  ctx.fillRect(-16, -84, 32, 38);

  /* Number stripe */
  ctx.fillStyle = isUser ? '#1a1a1a' : '#ffffff';
  ctx.fillRect(-16, -68, 32, 4);

  /* Neck */
  ctx.fillStyle = '#f7dcc4';
  ctx.fillRect(-5, -92, 10, 8);

  /* Head */
  ctx.beginPath(); ctx.arc(0, -102, 11, 0, Math.PI * 2); ctx.fill();

  /* Hair */
  ctx.fillStyle = '#1b1b1b';
  ctx.beginPath(); ctx.arc(0, -104, 12, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();

  /* Eye */
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(5, -101, 1.6, 0, Math.PI * 2); ctx.fill();

  /* Arm pose */
  var armAngle = -0.3;
  var armLen = 28;
  if (p.pose === 'swing'){
    armAngle = -0.3 + (p.swingT * 2.2 - 1.1) * 1.6;
  } else if (p.pose === 'serve-ready'){
    armAngle = -1.6;
  } else if (p.pose === 'jump'){
    armAngle = -1.2;
  }

  /* Back arm */
  ctx.strokeStyle = isUser ? '#ffffff' : '#c60b1e';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(-11, -82);
  ctx.lineTo(-11 - 18, -82 + 6);
  ctx.stroke();

  /* Front arm */
  var rbx = 11, rby = -82;
  var rex = rbx + Math.sin(armAngle) * armLen;
  var rey = rby - Math.cos(armAngle) * armLen;
  ctx.beginPath(); ctx.moveTo(rbx, rby); ctx.lineTo(rex, rey); ctx.stroke();

  /* Hand */
  ctx.fillStyle = '#f7dcc4';
  ctx.beginPath(); ctx.arc(rex, rey, 5, 0, Math.PI * 2); ctx.fill();

  /* Racquet */
  ctx.save();
  ctx.translate(rex, rey);
  ctx.rotate(armAngle - 0.4);
  /* Handle */
  ctx.strokeStyle = '#3a2010';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -14); ctx.stroke();
  /* Frame */
  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, -30, 13, 17, 0, 0, Math.PI * 2); ctx.stroke();
  /* Strings */
  ctx.strokeStyle = 'rgba(200,200,200,.5)';
  ctx.lineWidth = 1;
  for (var s = 0; s < 4; s++){
    ctx.beginPath(); ctx.moveTo(-9 + s * 6, -42); ctx.lineTo(-9 + s * 6, -18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11, -36 + s * 6); ctx.lineTo(11, -36 + s * 6); ctx.stroke();
  }
  ctx.restore();

  /* YOU label + ring */
  if (isUser){
    ctx.strokeStyle = 'rgba(212,255,80,.85)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.ellipse(0, -55, 32, 62, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#d4ff50';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('YOU', 0, -130);
  }

  ctx.restore();
}

function renderBall(){
  var b = match.ball;
  if (!b.active && match.state !== 'serve') return;

  var sx = b.x;
  var sy = COURT_GROUND - b.y;

  /* Shadow */
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  var scale = Math.max(0.3, 1 - b.y / 900);
  ctx.beginPath();
  ctx.ellipse(sx, COURT_GROUND + 6, BALL_R * scale, 4 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  /* Glow */
  ctx.fillStyle = 'rgba(212,255,80,.35)';
  ctx.beginPath(); ctx.arc(sx, sy, BALL_R + 8, 0, Math.PI * 2); ctx.fill();

  /* Ball */
  ctx.fillStyle = '#d4ff50';
  ctx.beginPath(); ctx.arc(sx, sy, BALL_R, 0, Math.PI * 2); ctx.fill();

  /* Ball lines */
  ctx.strokeStyle = '#0a1a05';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sx - 6, sy, 8, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx + 6, sy, 8, Math.PI / 2, -Math.PI / 2, true); ctx.stroke();

  /* Outline */
  ctx.strokeStyle = 'rgba(0,0,0,.4)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx, sy, BALL_R, 0, Math.PI * 2); ctx.stroke();
}

function renderMatch(){
  if (!match) return;
  ctx.clearRect(0, 0, W, H);
  renderCourt();
  renderNet();
  renderPlayer(match.opp, false);
  renderPlayer(match.player, true);
  renderBall();

  /* Hint text on serve */
  if (match.state === 'serve' && match.servePhase === 'idle'){
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(0, 340, W, 70);
    ctx.fillStyle = match.server === 'user' ? '#d4ff50' : '#ff8a5c';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var txt = match.server === 'user' ? 'YOUR SERVE — TAP 🎯 SERVE' : 'OPPONENT SERVING...';
    ctx.fillText(txt, W / 2, 375);
    ctx.textBaseline = 'alphabetic';
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function loop(ts){
  var dt = Math.min(0.05, (ts - lastTS) / 1000 || 0);
  lastTS = ts;

  try {
    if (screen === 'match' && match){
      updateMatch(dt);
      renderMatch();
    } else if (screen === 'paused'){
      /* Frozen — keep last frame */
    } else {
      ctx.fillStyle = '#050810';
      ctx.fillRect(0, 0, W, H);
    }
  } catch (err) {
    /* Log but don't stop loop */
    if (window.console && console.error) console.error('LOOP ERROR:', err);
  }

  requestAnimationFrame(loop);
}

/* ============================================================
   RESPONSIVE SCALING
   ============================================================ */
function resize(){
  var scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  document.getElementById('app').style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   START
   ============================================================ */
requestAnimationFrame(loop);
</script>
</body>
</html></template>

var cv = document.getElementById('cv');

/* --- Polyfills for old browsers --- */
(function(){

  if (!CanvasRenderingContext2D.prototype.ellipse){
    CanvasRenderingContext2D.prototype.ellipse = function(x,y,rx,ry,rot,a1,a2,acw){
      this.save(); this.translate(x,y); this.rotate(rot||0); this.scale(rx,ry);
      this.arc(0,0,1,a1,a2===undefined?Math.PI*2:a2,acw||false); this.restore();
    };
  }
})();
if (!window.requestAnimationFrame){
  window.requestAnimationFrame = function(cb){ return setTimeout(function(){ cb(Date.now()); }, 16); };
}

var storage = (function(){

    window.localStorage.setItem('__t__','1');

    var m = {};
    return {
      getItem: function(k){ return m[k]===undefined?null:m[k]; },
      setItem: function(k,v){ m[k]=String(v); },
      removeItem: function(k){ delete m[k]; }
    };
  }
})();

function clamp(v,a,b){ if (v<a) return a; if (v>b) return b; return v; }
function rnd(a,b){ return a + Math.random()*(b-a); }

/* ============================================================

   ============================================================ */

var PLAYER_Z = 0.14;

/* ============================================================

var COUNTRIES = [

/* ============================================================
   GUEST
   ============================================================ */
var GUEST_KEY = 'dhakaPingPongPro.guest.v1';
function genId(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='DP-';
  for (var i=0;i<5;i++) s += c.charAt(Math.floor(Math.random()*c.length));
  return s;
}
function freshGuest(){
  return { id:genId(), coins:300, ownedKits:['classic'], equipped:'classic',
    rubber:0, handle:0, wins:0, losses:0, smashes:0, trophies:0, matches:0 };
}
function loadGuest(){
  try {
    var raw = storage.getItem(GUEST_KEY);
    if (raw){
      var u = JSON.parse(raw);
      if (u && u.id && u.id.indexOf('DP-')===0){
        if (!u.ownedKits) u.ownedKits = ['classic'];
        return u;
      }
    }
  } catch(e){}
  var f = freshGuest();
  try { storage.setItem(GUEST_KEY, JSON.stringify(f)); } catch(e){}
  return f;
}
function saveGuest(){ try { storage.setItem(GUEST_KEY, JSON.stringify(user)); } catch(e){} }

var user = loadGuest();
var screen = 'auth';
var match = null;
var lastTS = 0;
var selCourt = 'blue';
var selCountry = 'bd';
var tournament = null;

/* ============================================================
   TOUCH INPUT — continuous tracking + swipe detection
   ============================================================ */
var touch = {
  active: false,
  screenX: 640, screenY: 500,
  prevScreenY: 500,
  velY: 0,          /* screen pixels per second, negative = up */
  velX: 0,
  lastTime: 0
};

function canvasCoords(clientX, clientY){
  var r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (cv.width / r.width),
    y: (clientY - r.top) * (cv.height / r.height)
  };
}

function onPointerDown(clientX, clientY){
  if (screen !== 'match') return;
  var c = canvasCoords(clientX, clientY);
  touch.active = true;
  touch.screenX = c.x;
  touch.screenY = c.y;
  touch.prevScreenY = c.y;
  touch.velY = 0;
  touch.velX = 0;
  touch.lastTime = Date.now();
}

function onPointerMove(clientX, clientY){
  if (!touch.active) return;
  if (screen !== 'match') return;
  var c = canvasCoords(clientX, clientY);
  var now = Date.now();
  var dt = (now - touch.lastTime) / 1000;
  if (dt > 0 && dt < 0.2){
    touch.velX = (c.x - touch.screenX) / dt;
    touch.velY = (c.y - touch.prevScreenY) / dt;
  }
  touch.screenX = c.x;
  touch.screenY = c.y;
  touch.prevScreenY = c.y;
  touch.lastTime = now;
}

function onPointerUp(){
  touch.active = false;
  touch.velX = 0;
  touch.velY = 0;
}

/* Bind touch + mouse */
cv.addEventListener('touchstart', function(e){ e.preventDefault(); var t = e.touches[0]; onPointerDown(t.clientX, t.clientY); }, {passive:false});
cv.addEventListener('touchmove',  function(e){ e.preventDefault(); var t = e.touches[0]; onPointerMove(t.clientX, t.clientY); }, {passive:false});
cv.addEventListener('touchend',   function(e){ e.preventDefault(); onPointerUp(); }, {passive:false});
cv.addEventListener('touchcancel',function(e){ e.preventDefault(); onPointerUp(); }, {passive:false});

var mouseDown = false;
cv.addEventListener('mousedown', function(e){ mouseDown = true; onPointerDown(e.clientX, e.clientY); });
cv.addEventListener('mousemove', function(e){ if (mouseDown) onPointerMove(e.clientX, e.clientY); });
cv.addEventListener('mouseup',   function(e){ mouseDown = false; onPointerUp(); });
cv.addEventListener('mouseleave',function(e){ mouseDown = false; onPointerUp(); });

/* ============================================================
   PROJECTION — world (x,y,z) → screen
   ============================================================ */
function project(wx, wy, wz){
  var depth = wy / TABLE_LEN;
  var s = 1 - 0.40 * depth;
  var sx = 640 + wx * 500 * s;
  var sy = 700 - 400 * depth - wz * 400 * s;
  return { x: sx, y: sy, s: s };
}

/* ============================================================
   MATCH CREATION
   ============================================================ */
function newMatch(oppCountryId){
  var court = getCourt(selCourt);
  var countryA = getCountry(selCountry);
  var countryB;
  if (oppCountryId) countryB = getCountry(oppCountryId);
  else {
    var pool = [];
    for (var i=0;i<COUNTRIES.length;i++) if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
    countryB = pool[Math.floor(Math.random()*pool.length)];
  }
  var firstServer = Math.random() < 0.5 ? 'player' : 'opp';

  match = {
    court: court,
    countryA: countryA, countryB: countryB,

    ball: {
      x: 0, y: 0.15, z: 0.2,
      vx: 0, vy: 0, vz: 0,
      active: false,
      lastHitter: null,
      bouncePlayer: 0,
      bounceOpp: 0,
      trail: []
    },

    bat: { x: 0, tx: 0 },
    opp: { x: 0, tx: 0 },

    score: { p: 0, o: 0 },
    games: { p: 0, o: 0 },
    sets:  { p: 0, o: 0 },

    server: firstServer,
    state: 'serve',        /* serve | rally | point | ended */
    stateTimer: firstServer === 'player' ? 1.5 : 1.0,
    stats: { smashes: 0, pointsWon: 0 },
    winner: null
  };

  resetPoint(match.server === 'player' ? 1.2 : 0.8);
  screen = 'match';
  showScreen('');
  document.getElementById('hud').classList.remove('hidden');
  setHint(match.server === 'player' ? 'SWIPE UP TO SERVE' : 'OPPONENT SERVING');
  updateScoreboard();
}

function resetPoint(timer){
  var m = match;
  m.ball.x = m.server === 'player' ? m.bat.x : m.opp.x;
  m.ball.y = m.server === 'player' ? 0.05 : 1.95;
  m.ball.z = 0.15;
  m.ball.vx = 0;
  m.ball.vy = 0;
  m.ball.vz = 0;
  m.ball.active = false;
  m.ball.lastHitter = null;
  m.ball.bouncePlayer = 0;
  m.ball.bounceOpp = 0;
  m.ball.trail = [];
  m.state = 'serve';
  m.stateTimer = timer || 1.0;
}

function showScreen(id){
  var ids = ['scr-auth','scr-home','scr-shop','scr-setup','scr-tournament','scr-pause','scr-result'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (ids[i] === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  }
}

function setHint(txt){
  var el = document.getElementById('hint');
  if (!txt){ el.classList.remove('on'); return; }
  el.textContent = txt;
  el.classList.add('on');
}

function updateScoreboard(){
  if (!match) return;
  var sb = document.getElementById('scoreboard');
  var m = match;
  sb.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<div class="flag" style="background:linear-gradient(180deg,' + m.countryA.p + ' 50%,' + m.countryA.s + ' 50%)"></div>' +
      '<span class="name">' + m.countryA.code + '</span>' +
    '</div>' +
    '<span class="pt' + (m.server==='player'?' srv':'') + '">' + m.score.p + '</span>' +
    '<span class="sep">–</span>' +
    '<span class="pt' + (m.server==='opp'?' srv':'') + '">' + m.score.o + '</span>' +
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<span class="name">' + m.countryB.code + '</span>' +
      '<div class="flag" style="background:linear-gradient(180deg,' + m.countryB.p + ' 50%,' + m.countryB.s + ' 50%)"></div>' +
    '</div>' +
    '<span class="games">SETS ' + m.sets.p + '-' + m.sets.o + ' | GAMES ' + m.games.p + '-' + m.games.o + '</span>';
}

/* ============================================================
   BALL PHYSICS
   ============================================================ */
function stepBall(dt){
  var b = match.ball;
  if (!b.active) return;

  var prevY = b.y;
  b.vz -= GRAVITY * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.z += b.vz * dt;

  /* Trail */
  b.trail.push({ x: b.x, y: b.y, z: b.z, life: 0.35 });
  if (b.trail.length > 20) b.trail.shift();
  for (var i=0;i<b.trail.length;i++) b.trail[i].life -= dt;

  /* Net collision */
  var crossedNet = (prevY - NET_Y) * (b.y - NET_Y) <= 0;
  if (crossedNet && prevY !== b.y){
    if (b.z < NET_H + BALL_R){
      /* Ball hits net */
      b.y = prevY < NET_Y ? NET_Y - 0.02 : NET_Y + 0.02;
      b.vy = -b.vy * 0.15;
      b.vz *= 0.4;
      b.vx *= 0.5;
      /* Point to hitter's opponent */
      var winner = b.lastHitter === 'player' ? 'opp' : 'player';
      awardPoint(winner);
      return;
    }
  }

  /* Table bounce */
  if (b.z <= BALL_R && b.vz < 0){
    var onTable = (Math.abs(b.x) <= TABLE_HW && b.y >= 0 && b.y <= TABLE_LEN);
    if (onTable){
      b.z = BALL_R;
      b.vz = -b.vz * BOUNCE_DAMP;
      b.vx *= ROLL_DAMP;
      b.vy *= ROLL_DAMP;
      if (Math.abs(b.vz) < 0.25) b.vz = 0;

      /* Bounce tracking */
      if (b.y < NET_Y){
        b.bouncePlayer++;
        b.bounceOpp = 0;
        if (b.bouncePlayer >= 2){ awardPoint('opp'); return; }
      } else {
        b.bounceOpp++;
        b.bouncePlayer = 0;
        if (b.bounceOpp >= 2){ awardPoint('player'); return; }
      }
    }
  }

  /* Off table — past near edge */
  if (b.y < -0.4){
    awardPoint('opp');
    return;
  }

  /* Past far edge */
  if (b.y > TABLE_LEN + 0.4){
    awardPoint('player');
    return;
  }

  /* Off the sides */
  if (Math.abs(b.x) > TABLE_HW + 0.6){
    /* Was it hit out or did it just go sideways? Check last hitter */
    if (b.lastHitter === 'player') awardPoint('opp');
    else if (b.lastHitter === 'opp') awardPoint('player');
    else awardPoint('player');
    return;
  }

  /* Fell way below table = miss */
  if (b.z < -0.4){
    awardPoint(b.lastHitter === 'player' ? 'opp' : 'player');
    return;
  }
}

/* ============================================================
   PLAYER BAT CONTROL
   ============================================================ */
function updateBat(dt){
  var m = match;
  /* Map touch x → world x */
  if (touch.active){
    var wx = (touch.screenX - 640) / 500;
    m.bat.tx = clamp(wx, -1.1, 1.1);
  } else {
    /* Slowly return to center when not touching */
    m.bat.tx *= 0.92;
  }
  /* Fast lerp toward target */
  var factor = Math.min(1, dt * BAT_FOLLOW);
  m.bat.x += (m.bat.tx - m.bat.x) * factor;
}

/* ============================================================
   PLAYER HIT
   ============================================================ */
function tryPlayerHit(){
  var m = match;
  var b = m.ball;
  if (!b.active) return false;
  if (b.lastHitter === 'player') return false;

  /* Check ball is in player zone */
  if (b.y > PLAYER_HIT_Y) return false;
  if (Math.abs(b.x - m.bat.x) > HIT_X_RANGE) return false;
  if (b.z > 0.6) return false;

  /* Detect swipe */
  var vy = touch.velY;   /* negative = up */
  var vx = touch.velX;
  var speed = Math.sqrt(vy*vy + vx*vx);

  /* Must be swiping or touching */
  if (!touch.active) return false;

  /* Determine shot based on swipe */
  var kit = getKit(user.equipped);
  var baseVy = 3.0;
  var baseVz = 1.5;
  var baseVx = 0;

  var isSmash = false;

  if (vy < -500){
    /* Fast upward swipe = SMASH */
    baseVy = 4.3;
    baseVz = 1.1;
    isSmash = true;
    m.stats.smashes++;
  } else if (vy < -100){
    /* Medium upward swipe = drive / loop */
    baseVy = 3.2;
    baseVz = 1.6;
  } else if (vy > 200){
    /* Downward swipe = slice (high defensive) */
    baseVy = 2.4;
    baseVz = 2.2;
  } else {
    /* No clear swipe — light auto return */
    baseVy = 2.8;
    baseVz = 1.7;
  }

  /* Horizontal aim from swipe */
  baseVx = clamp(vx / 1500, -0.8, 0.8);

  /* Apply kit stats */
  baseVy *= kit.speed;
  baseVz *= (1.0 + (kit.spin - 1) * 0.3);
  baseVx *= kit.control;

  /* Set ball velocity — must be positive vy (toward opponent) */
  b.vx = baseVx;
  b.vy = baseVy;
  b.vz = baseVz;

  /* Snap ball to bat side so it looks clean */
  b.x = m.bat.x + baseVx * 0.03;
  b.y = Math.max(b.y, 0.05);
  b.z = Math.max(b.z, 0.1);

  b.lastHitter = 'player';
  b.bouncePlayer = 0;
  b.bounceOpp = 0;

  m.state = 'rally';
  return true;
}

/* Player serve */
function tryPlayerServe(){
  var m = match;
  if (m.state !== 'serve' || m.server !== 'player') return false;

  var vy = touch.velY;
  if (vy > -150) return false;   /* need upward swipe */

  var b = m.ball;
  var kit = getKit(user.equipped);
  var speed = Math.min(1, Math.abs(vy) / 1800);

  b.vx = clamp(touch.velX / 1500, -0.7, 0.7);
  b.vy = (2.6 + speed * 1.0) * kit.speed;
  b.vz = 1.6 + speed * 0.5;

  b.active = true;
  b.lastHitter = 'player';
  b.bouncePlayer = 0;
  b.bounceOpp = 0;

  m.state = 'rally';
  setHint('');
  return true;
}

/* ============================================================
   AI OPPONENT
   ============================================================ */
function updateOpp(dt){
  var m = match;
  var b = m.ball;
  var o = m.opp;

  /* AI serve */
  if (m.state === 'serve' && m.server === 'opp'){
    m.stateTimer -= dt;
    if (m.stateTimer <= 0){
      var kit = getKit(user.equipped);
      b.vx = rnd(-0.4, 0.4);
      b.vy = -3.1;
      b.vz = 1.6;
      b.active = true;
      b.lastHitter = 'opp';
      b.bouncePlayer = 0;
      b.bounceOpp = 0;
      b.x = o.x;
      b.y = 1.9;
      b.z = 0.15;
      m.state = 'rally';
      setHint('');
    }
    return;
  }

  if (m.state !== 'rally') return;

  /* Ball moving toward AI? */
  if (b.active && b.vy > 0 && b.lastHitter === 'player'){
    /* Predict landing X */
    var landing = predictLandingX();
    o.tx = clamp(landing, -1.0, 1.0);
  } else if (!b.active) {
    o.tx = 0;
  } else {
    /* Ball going away — drift to center */
    o.tx *= 0.95;
  }

  /* Move bat toward target */
  var dx = o.tx - o.x;
  var step = AI_SPEED * dt;
  if (Math.abs(dx) < step) o.x = o.tx;
  else o.x += (dx > 0 ? 1 : -1) * step;

  /* Hit the ball when in AI zone */
  if (b.active && b.lastHitter === 'player'){
    if (b.y > OPP_HIT_Y && b.z < 0.5 && Math.abs(b.x - o.x) < HIT_X_RANGE){
      aiHit();
    }
  }
}

function predictLandingX(){
  var b = match.ball;
  if (!b.active) return b.x;
  var sx = b.x, sy = b.y, sz = b.z;
  var svx = b.vx, svy = b.vy, svz = b.vz;
  var step = 1/60;
  for (var i=0;i<200;i++){
    svz -= GRAVITY * step;
    sx += svx * step;
    sy += svy * step;
    sz += svz * step;
    /* Stop at table or after time */
    if (sz <= BALL_R && svz < 0) break;
    if (sy > TABLE_LEN + 0.2) break;
  }
  return sx;
}

function aiHit(){
  var m = match;
  var b = m.ball;
  var o = m.opp;

  /* Random shot selection */
  var r = Math.random();
  var kit = getKit(user.equipped);
  var power = 0.8 + Math.random() * 0.4;

  var vy = -3.0, vz = 1.5, vx = 0;

  if (r < 0.20){
    /* Smash */
    vy = -4.3;
    vz = 1.1;
    vx = rnd(-0.6, 0.6);
  } else if (r < 0.70){
    /* Drive */
    vy = -3.2;
    vz = 1.5;
    vx = rnd(-0.8, 0.8);
  } else {
    /* Loop / topspin */
    vy = -2.4;
    vz = 2.2;
    vx = rnd(-0.6, 0.6);
  }

  b.vx = vx;
  b.vy = vy * power;
  b.vz = vz;
  b.x = o.x + vx * 0.03;
  b.y = Math.min(b.y, 1.95);
  b.z = Math.max(b.z, 0.12);

  b.lastHitter = 'opp';
  b.bouncePlayer = 0;
  b.bounceOpp = 0;
}

/* ============================================================
   SCORING
   ============================================================ */
function awardPoint(winner){
  if (!match || match.state === 'point' || match.state === 'ended') return;
  if (winner === 'player'){
    match.score.p++;
    match.stats.pointsWon++;
  } else {
    match.score.o++;
  }
  match.state = 'point';
  match.stateTimer = 1.5;
  match.ball.active = false;
  updateScoreboard();

  setHint(winner === 'player' ? '⚡ POINT!' : 'OPPONENT SCORES');

  /* Game won? First to 5, win by 2 */
  var wp = winner === 'player' ? match.score.p : match.score.o;
  var lp = winner === 'player' ? match.score.o : match.score.p;
  if (wp >= 5 && wp - lp >= 2){
    /* Reset score, increment game */
    match.score.p = 0;
    match.score.o = 0;
    if (winner === 'player') match.games.p++;
    else match.games.o++;

    /* Server rotates */
    match.server = match.server === 'player' ? 'opp' : 'player';

    /* Set won? First to 2 */
    if (match.games.p >= 2 || match.games.o >= 2){
      if (winner === 'player') match.sets.p++;
      else match.sets.o++;
      match.games.p = 0;
      match.games.o = 0;

      /* Match won? First to 2 sets */
      if (match.sets.p >= 2 || match.sets.o >= 2){
        match.winner = winner;
        match.state = 'ended';
        match.stateTimer = 2.0;
        setHint(winner === 'player' ? '🏆 MATCH WON!' : 'MATCH LOST');
        updateScoreboard();
        return;
      }
      setHint(winner === 'player' ? '🎾 SET WON!' : 'SET LOST');
      updateScoreboard();
      return;
    }
    setHint(winner === 'player' ? '🎾 GAME!' : 'GAME LOST');
  }
  updateScoreboard();
}

/* ============================================================
   MATCH UPDATE
   ============================================================ */
function updateMatch(dt){
  if (!match) return;

  if (match.state === 'point' || match.state === 'ended'){
    match.stateTimer -= dt;
    if (match.stateTimer <= 0){
      if (match.state === 'ended'){
        endMatch();
        return;
      }
      resetPoint(match.server === 'player' ? 1.2 : 0.8);
      setHint(match.server === 'player' ? 'SWIPE UP TO SERVE' : 'OPPONENT SERVING');
      updateScoreboard();
    }
    return;
  }

  /* Update bat tracking always */
  updateBat(dt);
  updateOpp(dt);

  if (match.state === 'serve'){
    /* Ball floats near server */
    var b = match.ball;
    if (match.server === 'player'){
      b.x = match.bat.x;
      b.y = 0.05;
      b.z = 0.15;
      /* Player serve on swipe */
      tryPlayerServe();
    } else {
      b.x = match.opp.x;
      b.y = 1.95;
      b.z = 0.15;
    }
    return;
  }

  if (match.state === 'rally'){
    /* Try player hit when ball approaching */
    if (match.ball.active && match.ball.lastHitter === 'opp'){
      tryPlayerHit();
    }
    stepBall(dt);
  }
}

/* ============================================================
   END MATCH
   ============================================================ */
function endMatch(){
  if (!match) return;
  var win = match.winner === 'player';
  user.matches = (user.matches || 0) + 1;
  if (win){
    user.wins = (user.wins || 0) + 1;
    user.coins += 100;
  } else {
    user.losses = (user.losses || 0) + 1;
  }
  user.smashes = (user.smashes || 0) + match.stats.smashes;
  saveGuest();

  document.getElementById('res-loc').textContent = match.court.name.toUpperCase();
  var o = document.getElementById('res-outcome');
  o.textContent = win ? 'VICTORY' : 'DEFEAT';
  o.className = 'res-outcome' + (win ? '' : ' loss');
  document.getElementById('res-score').textContent = match.sets.p + ' - ' + match.sets.o;
  document.getElementById('res-teams').textContent =
    match.countryA.name.toUpperCase() + '  vs  ' + match.countryB.name.toUpperCase();
  document.getElementById('res-smash').textContent = match.stats.smashes;
  document.getElementById('res-points').textContent = match.stats.pointsWon;

  var r = document.getElementById('res-reward');
  if (win){ r.textContent = '+100 🪙  Victory!'; r.className = 'reward'; }
  else { r.textContent = 'No reward — win to earn coins.'; r.className = 'reward none'; }

  if (tournament && tournament.active) tournament.recordResult(win);

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud').classList.add('hidden');
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderMatch(){
  if (!match) return;
  var m = match;
  var court = m.court;

  /* Background */
  var bg = ctx.createLinearGradient(0, 0, 0, 720);
  bg.addColorStop(0, court.bg);
  bg.addColorStop(0.6, shade(court.bg, 0.12));
  bg.addColorStop(1, shade(court.bg, -0.15));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1280, 720);

  /* Arena floor */
  var floorG = ctx.createLinearGradient(0, 700, 0, 720);
  floorG.addColorStop(0, court.floor);
  floorG.addColorStop(1, shade(court.floor, -0.4));
  ctx.fillStyle = floorG;
  ctx.fillRect(0, 700, 1280, 20);

  /* Glow behind table */
  var glow = ctx.createRadialGradient(640, 400, 100, 640, 400, 600);
  glow.addColorStop(0, 'rgba(212,255,80,.06)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 1280, 720);

  /* Table */
  drawTable(court);

  /* Net */
  drawNet();

  /* Ball trail */
  var b = m.ball;
  for (var i=0;i<b.trail.length;i++){
    var t = b.trail[i];
    var alpha = Math.max(0, t.life / 0.35) * 0.35;
    var p = project(t.x, t.y, t.z);
    ctx.fillStyle = 'rgba(255,180,60,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, BALL_R * 500 * p.s * 0.7, 0, Math.PI*2);
    ctx.fill();
  }

  /* Ball shadow */
  if (b.active || m.state === 'serve'){
    var sp = project(b.x, b.y, 0);
    var shadowAlpha = clamp(0.5 - b.z * 0.6, 0.05, 0.5);
    var shadowScale = clamp(1 - b.z * 1.5, 0.3, 1);
    ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha + ')';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y, BALL_R * 500 * sp.s * shadowScale, BALL_R * 250 * sp.s * shadowScale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  /* Opp bat (far side, drawn behind ball) */
  drawOppBat();

  /* Ball */
  if (b.active || m.state === 'serve'){
    var bp = project(b.x, b.y, b.z);
    var r = Math.max(6, BALL_R * 500 * bp.s);
    /* Glow */
    ctx.fillStyle = 'rgba(255,180,60,.5)';
    ctx.beginPath(); ctx.arc(bp.x, bp.y, r + 6, 0, Math.PI*2); ctx.fill();
    /* Ball */
    var ballGrad = ctx.createRadialGradient(bp.x - r*0.3, bp.y - r*0.3, r*0.1, bp.x, bp.y, r);
    ballGrad.addColorStop(0, '#fff8d0');
    ballGrad.addColorStop(0.5, '#ffd166');
    ballGrad.addColorStop(1, '#c8901a');
    ctx.fillStyle = ballGrad;
    ctx.beginPath(); ctx.arc(bp.x, bp.y, r, 0, Math.PI*2); ctx.fill();
    /* Outline */
    ctx.strokeStyle = 'rgba(120,60,0,.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bp.x, bp.y, r, 0, Math.PI*2); ctx.stroke();
  }

  /* Player bat (in front) */
  drawPlayerBat();

  /* Serve indicator */
  if (m.state === 'serve' && m.server === 'player'){
    ctx.fillStyle = 'rgba(212,255,80,.9)';
    ctx.font = 'bold 24px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SWIPE UP TO SERVE', 640, 400);
  } else if (m.state === 'serve' && m.server === 'opp'){
    ctx.fillStyle = 'rgba(255,209,102,.9)';
    ctx.font = 'bold 24px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('OPPONENT SERVING...', 640, 400);
  }
}

function drawTable(court){
  var nearL = project(-TABLE_HW, 0, 0);
  var nearR = project( TABLE_HW, 0, 0);
  var farL  = project(-TABLE_HW, TABLE_LEN, 0);
  var farR  = project( TABLE_HW, TABLE_LEN, 0);

  /* Table thickness (side edge) */
  var depthPx = 22;
  ctx.fillStyle = shade(court.table, -0.45);
  ctx.beginPath();
  ctx.moveTo(nearL.x, nearL.y);
  ctx.lineTo(nearR.x, nearR.y);
  ctx.lineTo(nearR.x, nearR.y + depthPx);
  ctx.lineTo(nearL.x, nearL.y + depthPx);
  ctx.closePath();
  ctx.fill();
  /* Left side edge */
  ctx.beginPath();
  ctx.moveTo(nearL.x, nearL.y);
  ctx.lineTo(farL.x, farL.y);
  ctx.lineTo(farL.x, farL.y + depthPx * 0.6);
  ctx.lineTo(nearL.x, nearL.y + depthPx);
  ctx.closePath();
  ctx.fill();
  /* Right side edge */
  ctx.beginPath();
  ctx.moveTo(nearR.x, nearR.y);
  ctx.lineTo(farR.x, farR.y);
  ctx.lineTo(farR.x, farR.y + depthPx * 0.6);
  ctx.lineTo(nearR.x, nearR.y + depthPx);
  ctx.closePath();
  ctx.fill();

  /* Table top */
  var tableGrad = ctx.createLinearGradient(0, farL.y, 0, nearL.y);
  tableGrad.addColorStop(0, shade(court.table, -0.15));
  tableGrad.addColorStop(0.5, court.table);
  tableGrad.addColorStop(1, shade(court.table, 0.10));
  ctx.fillStyle = tableGrad;
  ctx.beginPath();
  ctx.moveTo(nearL.x, nearL.y);
  ctx.lineTo(nearR.x, nearR.y);
  ctx.lineTo(farR.x, farR.y);
  ctx.lineTo(farL.x, farL.y);
  ctx.closePath();
  ctx.fill();

  /* Table lines */
  ctx.strokeStyle = court.line;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(nearL.x, nearL.y); ctx.lineTo(nearR.x, nearR.y);
  ctx.moveTo(farL.x, farL.y);  ctx.lineTo(farR.x, farR.y);
  ctx.moveTo(nearL.x, nearL.y); ctx.lineTo(farL.x, farL.y);
  ctx.moveTo(nearR.x, nearR.y); ctx.lineTo(farR.x, farR.y);
  /* Center line */
  var cNear = project(0, NET_Y, 0);
  var cFar = project(0, TABLE_LEN, 0);
  ctx.moveTo(cNear.x, cNear.y);
  ctx.lineTo(cFar.x, cFar.y);
  ctx.stroke();

  /* Service line on each side (short horizontal lines) */
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth = 1.5;
  var svcA = 0.25, svcB = 1.75;
  var a1 = project(-TABLE_HW, svcA, 0);
  var a2 = project( TABLE_HW, svcA, 0);
  var b1 = project(-TABLE_HW, svcB, 0);
  var b2 = project( TABLE_HW, svcB, 0);
  ctx.beginPath();
  ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y);
  ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
  ctx.stroke();
}

function drawNet(){
  var topL = project(-TABLE_HW, NET_Y, NET_H);
  var topR = project( TABLE_HW, NET_Y, NET_H);
  var botL = project(-TABLE_HW, NET_Y, 0);
  var botR = project( TABLE_HW, NET_Y, 0);

  /* Net body fill */
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath();
  ctx.moveTo(topL.x, topL.y);
  ctx.lineTo(topR.x, topR.y);
  ctx.lineTo(botR.x, botR.y);
  ctx.lineTo(botL.x, botL.y);
  ctx.closePath();
  ctx.fill();

  /* Net mesh */
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 1;
  var cols = 24;
  for (var i=1;i<cols;i++){
    var t = i / cols;
    var tx = topL.x + (topR.x - topL.x) * t;
    var ty = topL.y + (topR.y - topL.y) * t;
    var bx = botL.x + (botR.x - botL.x) * t;
    var by = botL.y + (botR.y - botL.y) * t;
    ctx.beginPath();
    ctx.moveTo(tx, ty); ctx.lineTo(bx, by);
    ctx.stroke();
  }
  var rows = 5;
  for (var r=1;r<rows;r++){
    var tr = r / rows;
    var lx = topL.x + (botL.x - topL.x) * tr;
    var ly = topL.y + (botL.y - topL.y) * tr;
    var rx = topR.x + (botR.x - topR.x) * tr;
    var ry = topR.y + (botR.y - topR.y) * tr;
    ctx.beginPath();
    ctx.moveTo(lx, ly); ctx.lineTo(rx, ry);
    ctx.stroke();
  }

  /* Net top band */
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(topL.x, topL.y);
  ctx.lineTo(topR.x, topR.y);
  ctx.stroke();

  /* Net posts */
  var postL = project(-TABLE_HW - 0.05, NET_Y, NET_H + 0.03);
  var postLBase = project(-TABLE_HW - 0.05, NET_Y, 0);
  var postR = project( TABLE_HW + 0.05, NET_Y, NET_H + 0.03);
  var postRBase = project( TABLE_HW + 0.05, NET_Y, 0);
  ctx.fillStyle = '#333';
  ctx.fillRect(postL.x - 3, postL.y, 6, postLBase.y - postL.y);
  ctx.fillRect(postR.x - 3, postR.y, 6, postRBase.y - postR.y);
}

function drawPlayerBat(){
  var m = match;
  var p = project(m.bat.x, PLAYER_Y, PLAYER_Z);
  var size = 110;
  var tilt = -0.15;

  var rub = getRubber(user.rubber);
  var handleCol = HANDLES[user.handle] || HANDLES[0];

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(tilt);

  /* Handle (below face) */
  ctx.fillStyle = handleCol;
  ctx.fillRect(-size * 0.20, size * 0.55, size * 0.40, size * 0.85);
  /* Wood grain */
  ctx.strokeStyle = 'rgba(0,0,0,.3)';
  ctx.lineWidth = 1;
  for (var g=0; g<3; g++){
    ctx.beginPath();
    ctx.moveTo(-size * 0.14 + g * size * 0.14, size * 0.58);
    ctx.lineTo(-size * 0.14 + g * size * 0.14, size * 1.35);
    ctx.stroke();
  }

  /* Wood edge ring */
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.fill();

  /* Rubber face */
  ctx.fillStyle = rub.front;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.94, 0, Math.PI * 2);
  ctx.fill();

  /* Rubber dots */
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  for (var i=0;i<11;i++){
    for (var j=0;j<11;j++){
      var dx = (i - 5) * size * 0.17;
      var dy = (j - 5) * size * 0.17;
      if (dx*dx + dy*dy < (size*0.85)*(size*0.85)){
        ctx.beginPath();
        ctx.arc(dx, dy, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* Outline */
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  /* Glow when ball incoming */
  if (m.ball.active && m.ball.y < 0.5 && m.ball.lastHitter === 'opp'){
    var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 100);
    ctx.strokeStyle = 'rgba(212,255,80,' + pulse * 0.85 + ')';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, size + 8, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawOppBat(){
  var m = match;
  var p = project(m.opp.x, OPP_Y, OPP_Z);
  var size = 55 * p.s;

  var rub = getRubber(user.rubber);
  var handleCol = HANDLES[user.handle] || HANDLES[0];

  ctx.save();
  ctx.translate(p.x, p.y);

  /* Handle */
  ctx.fillStyle = handleCol;
  ctx.fillRect(-size * 0.20, size * 0.5, size * 0.40, size * 0.8);

  /* Edge ring */
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.fill();

  /* Rubber face */
  ctx.fillStyle = rub.front;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.92, 0, Math.PI * 2);
  ctx.fill();

  /* Outline */
  ctx.strokeStyle = 'rgba(0,0,0,.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function shade(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(Math.round(((n>>16)&255) + amt*255), 0, 255);
  var g = clamp(Math.round(((n>>8)&255)  + amt*255), 0, 255);
  var b = clamp(Math.round((n&255)        + amt*255), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ============================================================
   HOME / SHOP / SETUP
   ============================================================ */
var prevCanvas = document.getElementById('prev');
var prevCtx = prevCanvas.getContext('2d');

function drawBatIcon(g, cx, cy, size, rubberIdx, handleIdx){
  var rub = getRubber(rubberIdx);
  var handleCol = HANDLES[handleIdx] || HANDLES[0];
  g.save();
  g.translate(cx, cy);
  g.fillStyle = handleCol;
  g.fillRect(-size*0.20, size*0.55, size*0.40, size*0.85);
  g.fillStyle = '#8b5a2b';
  g.beginPath(); g.arc(0, 0, size, 0, Math.PI*2); g.fill();
  g.fillStyle = rub.front;
  g.beginPath(); g.arc(0, 0, size*0.94, 0, Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.5)';
  g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, size, 0, Math.PI*2); g.stroke();
  g.restore();
}

function drawPreview(){
  var g = prevCtx;
  g.clearRect(0, 0, 380, 440);
  var grd = g.createRadialGradient(190, 220, 20, 190, 220, 220);
  grd.addColorStop(0, 'rgba(212,255,80,.18)');
  grd.addColorStop(1, 'rgba(212,255,80,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 380, 440);
  drawBatIcon(g, 190, 220, 120, user.rubber, user.handle);
}

function buildHome(){
  document.getElementById('home-coins').textContent = Math.floor(user.coins);
  document.getElementById('home-user').textContent = user.id;
  document.getElementById('equipped-name').textContent = getKit(user.equipped).name;
