<script>
/* ============================================================
   KHELO DHAKA — Auth + Hub
   ============================================================ */

/* ---------- Game registry ---------- */
var GAMES = [
  {id:'tennis',     name:'Dhaka Tennis',    sub:'Back-View Tennis',  icon:'🎾', accent:'#d4ff50'},
  {id:'pingpong',   name:'Dhaka Ping Pong', sub:'Table Tennis',      icon:'🏓', accent:'#ff9f1c'},
  {id:'basketball', name:'Dhaka Hoops',     sub:'Touch Basketball',  icon:'🏀', accent:'#ff7a1a'},
  {id:'boxing',     name:'Dhaka Boxing',    sub:'UFC Combat',        icon:'🥊', accent:'#ff3b3b'},
  {id:'runner',     name:'Dhaka Dour',      sub:'Urban Runner',      icon:'🏃‍♀️', accent:'#06d6a0'},
  {id:'swimming',   name:'Dhaka Saan',      sub:'River Swimming',    icon:'🏊', accent:'#4cc9f0'},
  {id:'hockey',     name:'Dhaka Hockey',    sub:'Field Championship',icon:'🏑', accent:'#8cdc8c'},
  {id:'derby',      name:'Dhaka Derby',     sub:'Horse Racing',      icon:'🐎', accent:'#e8c878'},
  {id:'volleyball', name:'Dhaka Volley',    sub:'Pro Volleyball',    icon:'🏐', accent:'#ffd166'}
];

/* Game local-storage keys used by each game to save its own progress */
var GAME_KEYS = [
  'dhakaTennis.guest.v1',
  'dhakaPingPongPro.guest.v1',
  'dhakaHoops.guest.v1',
  'dhakaBoxingUFC.guest.v1',
  'dhakaDour.guest.v3',
  'dhakaSaan.guest.v1',
  'dhakaHockey2.guest',
  'dhakaDerbyX.guest.v1',
  'dhakaVolleyPro.guest.v1'
];

/* ---------- Storage (safe on old browsers) ---------- */
var LS = (function(){
  try { var t='__k__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return localStorage; }
  catch(e){
    var m={};
    return { getItem:function(k){return m[k]===undefined?null:m[k];},
             setItem:function(k,v){m[k]=String(v);},
             removeItem:function(k){delete m[k];} };
  }
})();

/* ---------- Account storage ---------- */
var USERS_KEY   = 'kheloDhaka.users.v1';
var CURRENT_KEY = 'kheloDhaka.currentUser.v1';

function loadUsers(){
  try { return JSON.parse(LS.getItem(USERS_KEY) || '{}'); } catch(e){ return {}; }
}
function saveUsers(u){ try { LS.setItem(USERS_KEY, JSON.stringify(u)); } catch(e){} }

function hashPw(s){
  var h=5381;
  for (var i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))>>>0;
  return 'k'+h.toString(36);
}

/* ---------- Progress swap ---------- */
/* Snapshot current game data into account.progress */
function snapshotProgress(account){
  var p = {};
  for (var i=0;i<GAME_KEYS.length;i++){
    var v = LS.getItem(GAME_KEYS[i]);
    if (v !== null) p[GAME_KEYS[i]] = v;
  }
  account.progress = p;
}

/* Load account.progress back into game keys (clears any previous data) */
function loadProgress(account){
  for (var i=0;i<GAME_KEYS.length;i++) LS.removeItem(GAME_KEYS[i]);
  if (account.progress){
    for (var k in account.progress){
      if (account.progress.hasOwnProperty(k)) LS.setItem(k, account.progress[k]);
    }
  }
}

/* ============================================================
   AUTH UI
   ============================================================ */
var authMode = 'login';
var users = loadUsers();
var currentUser = null;   /* account object or null for guest */

var elUser = document.getElementById('inUser');
var elPass = document.getElementById('inPass');
var elMsg  = document.getElementById('authMsg');
var elAuthBtn = document.getElementById('btnAuth');

/* Tab switching */
var tabs = document.querySelectorAll('.tab');
for (var i=0;i<tabs.length;i++){
  (function(tab){
    tab.onclick = function(){
      authMode = tab.getAttribute('data-tab');
      for (var j=0;j<tabs.length;j++) tabs[j].classList.toggle('active', tabs[j]===tab);
      elAuthBtn.textContent = authMode === 'login' ? 'LOG IN' : 'CREATE ACCOUNT';
      elMsg.textContent = ''; elMsg.className = 'amsg';
    };
  })(tabs[i]);
}

/* Login / Sign up */
elAuthBtn.onclick = function(){
  var name = elUser.value.trim();
  var pw = elPass.value;

  if (authMode === 'signup'){
    if (name.length < 3){ showMsg('Username must be 3+ characters', false); return; }
    if (pw.length < 4){ showMsg('Password must be 4+ characters', false); return; }
    if (users[name]){ showMsg('Username already taken', false); return; }
    users[name] = {
      name: name,
      pw: hashPw(pw),
      created: Date.now(),
      progress: {}
    };
    saveUsers(users);
    currentUser = users[name];
    LS.setItem(CURRENT_KEY, name);
    loginSuccess();
  } else {
    var u = users[name];
    if (!u){ showMsg('No account with that username', false); return; }
    if (u.pw !== hashPw(pw)){ showMsg('Wrong password', false); return; }
    currentUser = u;
    LS.setItem(CURRENT_KEY, name);
    loginSuccess();
  }
};

/* Guest */
document.getElementById('guestBtn').onclick = function(){
  currentUser = null;
  LS.removeItem(CURRENT_KEY);
  /* Clear game progress for guest */
  for (var i=0;i<GAME_KEYS.length;i++) LS.removeItem(GAME_KEYS[i]);
  loginSuccess();
};

/* Google Sign-In — only works when hosted on http/https, NOT file:// */
document.getElementById('gbtn').onclick = function(){
  if (location.protocol === 'file:'){
    alert(
      'Google Sign-In requires the app to be online.\n\n' +
      'Your file is running from your PC (file://), so Google blocks it.\n\n' +
      'Options:\n' +
      '1. Use "Continue as Guest" or create a local account now.\n' +
      '2. To enable real Google login: upload KHELO-DHAKA-COMPLETE.html to Netlify (free), then add your Client ID.\n\n' +
      'Everything else works perfectly offline.'
    );
    return;
  }
  alert('Google Sign-In: to enable this, you need to set up a Google OAuth Client ID. See the Khelo Dhaka guide.');
};

function showMsg(txt, ok){
  elMsg.textContent = txt;
  elMsg.className = 'amsg' + (ok ? ' ok' : '');
}

function loginSuccess(){
  document.getElementById('auth').classList.add('off');
  document.getElementById('hub').classList.remove('off');
  updateProfileBadge();
  buildGrid();
  updateStats();
}

/* ============================================================
   PROFILE UI
   ============================================================ */
function updateProfileBadge(){
  var name = currentUser ? currentUser.name : 'Guest';
  document.getElementById('unameLbl').textContent = name;
  document.getElementById('avatar').textContent = (name.charAt(0) || 'G').toUpperCase();
}

/* Dropdown menu */
var dd = document.getElementById('dropdown');
document.getElementById('userBtn').onclick = function(e){
  e.stopPropagation();
  dd.classList.toggle('on');
};
document.addEventListener('click', function(){ dd.classList.remove('on'); });
dd.onclick = function(e){ e.stopPropagation(); };

    alert('You are playing as Guest.\n\nSign up to save your progress.');
    return;
  }
  alert('Account: ' + currentUser.name +
        '\nCreated: ' + new Date(currentUser.created).toLocaleString() +
        '\n\nGames Played: ' + (currentUser.progress ? Object.keys(currentUser.progress).length : 0));
};

document.getElementById('ddSwitch').onclick = function(){
  dd.classList.remove('on');
  if (currentUser){
    snapshotProgress(currentUser);
    saveUsers(users);
  }
  document.getElementById('hub').classList.add('off');
  document.getElementById('auth').classList.remove('off');
  elUser.value = ''; elPass.value = '';
  elMsg.textContent = '';
  currentUser = null;
};

document.getElementById('ddLogout').onclick = function(){
  dd.classList.remove('on');
  if (currentUser){
    snapshotProgress(currentUser);
    saveUsers(users);
  }
  for (var i=0;i<GAME_KEYS.length;i++) LS.removeItem(GAME_KEYS[i]);
  LS.removeItem(CURRENT_KEY);
  document.getElementById('hub').classList.add('off');
  document.getElementById('auth').classList.remove('off');
  elUser.value = ''; elPass.value = '';
  elMsg.textContent = '';
  currentUser = null;
};

/* ============================================================
   HUB GRID + STATS
   ============================================================ */
function hexA(h,a){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function readStats(k){try{var r=LS.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function hasGame(id){var t=document.getElementById('game-'+id);if(!t)return false;return t.innerHTML.trim().length>100}

function buildGrid(){
  var g=document.getElementById('grid');
  g.innerHTML='';
  for (var i=0;i<GAMES.length;i++){
    (function(gm){
      var played = !!readStats(gm.key || ('dhaka'+gm.id+'.guest'));
      var ready = hasGame(gm.id);
      var card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--ac', gm.accent);
      card.style.setProperty('--acg', hexA(gm.accent, 0.35));
      card.innerHTML =
        (played ? '<div class="badge">PLAYED</div>' : '') +
        '<span class="ico">' + gm.icon + '</span>' +
        '<h3>' + gm.name + '</h3>' +
        '<div class="sub">' + gm.sub + '</div>' +
        (ready ? '' : '<div class="empty">NOT READY</div>');
      card.onclick = function(){ launch(gm); };
      g.appendChild(card);
    })(GAMES[i]);
  }
}

function updateStats(){
  var w=0, p=0, t=0, u=0, coins=0;
  for (var i=0;i<GAME_KEYS.length;i++){
    var s = readStats(GAME_KEYS[i]);
    if (s){
      u++;
      w += (s.wins || 0);
      p += (s.matches || s.races || s.games || 0);
      t += (s.trophies || s.belts || s.titles || 0);
      coins += (s.coins || 0);
    }
  }
  document.getElementById('sW').textContent = w;
  document.getElementById('sP').textContent = p;
  document.getElementById('sT').textContent = '🏆 ' + t;
  document.getElementById('sS').textContent = u + ' / 9';
  document.getElementById('pCoins').textContent = Math.floor(coins);
}

/* ============================================================
   LAUNCH GAME
   ============================================================ */
function launch(gm){
  if (!hasGame(gm.id)){ alert(gm.name + ' is not embedded. Run merge.bat.'); return; }
  var t = document.getElementById('game-' + gm.id);
  document.getElementById('gameFrame').srcdoc = t.innerHTML;
  document.getElementById('viewer').classList.add('on');
  document.getElementById('backBtn').classList.add('on');
}
function closeGame(){
  document.getElementById('gameFrame').srcdoc = '';
  document.getElementById('viewer').classList.remove('on');
  document.getElementById('backBtn').classList.remove('on');
  setTimeout(function(){
    if (currentUser){
      snapshotProgress(currentUser);
      saveUsers(users);
    }
    updateStats();
    buildGrid();
  }, 300);
}
document.getElementById('backBtn').onclick = closeGame;

/* ============================================================
   AUTO-LOGIN ON START
   ============================================================ */
(function auto(){
  var s = LS.getItem(CURRENT_KEY);
  if (s && users[s]){
    currentUser = users[s];
    loadProgress(currentUser);
    loginSuccess();
  }
})();

/* ============================================================
   BACKGROUND PARTICLES
   ============================================================ */
var bg = document.getElementById('bg');
var bx = bg.getContext('2d');
function szBg(){ bg.width = innerWidth; bg.height = innerHeight; }
addEventListener('resize', szBg); szBg();
var parts = [];
for (var i=0;i<65;i++){
  parts.push({
    x: Math.random()*bg.width, y: Math.random()*bg.height,
    vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
    r: 1 + Math.random()*2,
    c: ['#4cc9f0','#a06cd5','#ffd166','#06d6a0'][Math.floor(Math.random()*4)]
  });
}
function drawBg(){
  bx.clearRect(0,0,bg.width,bg.height);
  var md = 140;
  for (var i=0;i<parts.length;i++){
    for (var j=i+1;j<parts.length;j++){
      var dx = parts[i].x - parts[j].x, dy = parts[i].y - parts[j].y;
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d < md){
        bx.strokeStyle = 'rgba(76,201,240,' + ((1 - d/md)*0.18) + ')';
        bx.lineWidth = 1;
        bx.beginPath();
        bx.moveTo(parts[i].x, parts[i].y);
        bx.lineTo(parts[j].x, parts[j].y);
        bx.stroke();
      }
    }
  }
  for (var k=0;k<parts.length;k++){
    var pp = parts[k];
    pp.x += pp.vx; pp.y += pp.vy;
    if (pp.x<0) pp.x = bg.width;
    if (pp.x>bg.width) pp.x = 0;
    if (pp.y<0) pp.y = bg.height;
    if (pp.y>bg.height) pp.y = 0;
    bx.fillStyle = pp.c; bx.shadowColor = pp.c; bx.shadowBlur = 8;
    bx.beginPath(); bx.arc(pp.x, pp.y, pp.r, 0, Math.PI*2); bx.fill();
  }
  bx.shadowBlur = 0;
  requestAnimationFrame(drawBg);
}
drawBg();
</script>
