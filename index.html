  document.getElementById('stat-losses').textContent = user.losses || 0;
  document.getElementById('stat-smash').textContent = user.smashes || 0;
  document.getElementById('stat-trophies').textContent = '🏆' + (user.trophies || 0);

  var rb = document.getElementById('rubber-swatches');
  rb.innerHTML = '';
  for (var i=0;i<RUBBERS.length;i++){
    (function(idx){
      var d = document.createElement('div');
      d.className = 'sw' + (user.rubber === idx ? ' on' : '');
      d.style.background = RUBBERS[idx].front;
      d.onclick = function(){ user.rubber = idx; saveGuest(); buildHome(); };
      rb.appendChild(d);
    })(i);
  }

  var hb = document.getElementById('handle-swatches');
  hb.innerHTML = '';
  for (var j=0;j<HANDLES.length;j++){
    (function(idx){
      var d = document.createElement('div');
      d.className = 'sw' + (user.handle === idx ? ' on' : '');
      d.style.background = HANDLES[idx];
      d.onclick = function(){ user.handle = idx; saveGuest(); buildHome(); };
      hb.appendChild(d);
    })(j);
  }

  var kr = document.getElementById('kit-row');
  kr.innerHTML = '';
  for (var m=0;m<user.ownedKits.length;m++){
    (function(id){
      var K = getKit(id);
      var card = document.createElement('div');
      card.style.cssText = 'width:110px;padding:8px 6px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid ' +
        (user.equipped === id ? '#d4ff50' : 'rgba(255,255,255,.09)') + ';cursor:pointer;text-align:center';
      var c = document.createElement('canvas');
      c.width = 100; c.height = 100;
      var cg = c.getContext('2d');
      drawBatIcon(cg, 50, 50, 32, user.rubber, user.handle);
      var span = document.createElement('span');
      span.style.cssText = 'display:block;font-size:10px;color:#9fb2c8;margin-top:3px';
      span.textContent = K.name;
      card.appendChild(c); card.appendChild(span);
      card.onclick = function(){ user.equipped = id; saveGuest(); buildHome(); };
      kr.appendChild(card);
    })(user.ownedKits[m]);
  }
  drawPreview();
}

function buildShop(){
  document.getElementById('shop-coins').textContent = Math.floor(user.coins);
  var grid = document.getElementById('shop-grid');
  grid.innerHTML = '';
  for (var i=0;i<KITS.length;i++){
    (function(K){
      var owned = user.ownedKits.indexOf(K.id) !== -1;
      var equipped = user.equipped === K.id;
      var card = document.createElement('div');
      card.className = 'bcard' + (owned?' owned':'') + (equipped?' equipped':'');
      var c = document.createElement('canvas');
      c.width = 120; c.height = 120;
      var cg = c.getContext('2d');
      drawBatIcon(cg, 60, 60, 40, user.rubber, user.handle);
      var h4 = document.createElement('h4'); h4.textContent = K.name;
      var p = document.createElement('p'); p.textContent = K.desc;
      var price = document.createElement('div'); price.className = 'price';
      price.textContent = K.price === 0 ? 'FREE' : ('🪙 ' + K.price);
      var btn = document.createElement('button'); btn.className = 'buybtn';
      if (equipped){ btn.textContent = 'EQUIPPED'; btn.disabled = true; }
      else if (owned){
        btn.textContent = 'EQUIP';
        btn.onclick = function(){ user.equipped = K.id; saveGuest(); buildShop(); };
      } else {
        btn.textContent = 'BUY'; btn.disabled = user.coins < K.price;
        btn.onclick = function(){
          if (user.coins < K.price) return;
          user.coins -= K.price;
          user.ownedKits.push(K.id);
          user.equipped = K.id;
          saveGuest(); buildShop();
        };
      }
      card.appendChild(c); card.appendChild(h4); card.appendChild(p);
      card.appendChild(price); card.appendChild(btn);
      grid.appendChild(card);
    })(KITS[i]);
  }
}

function buildSetup(){
  document.getElementById('setup-coins').textContent = Math.floor(user.coins);
  var cg = document.getElementById('court-grid');
  cg.innerHTML = '';
  for (var i=0;i<COURTS.length;i++){
    (function(C){
      var card = document.createElement('div');
      card.className = 'court-card' + (selCourt === C.id ? ' on' : '');
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = 'linear-gradient(180deg,' + C.bg + ' 0%,' + C.table + ' 60%,' + C.table + ' 100%)';
      var info = document.createElement('div');
      info.innerHTML = '<h5>' + C.name + '</h5><small>' + C.sub + '</small>';
      card.appendChild(sw); card.appendChild(info);
      card.onclick = function(){ selCourt = C.id; buildSetup(); };
      cg.appendChild(card);
    })(COURTS[i]);
  }
  var ctyG = document.getElementById('country-grid');
  ctyG.innerHTML = '';
  for (var j=0;j<COUNTRIES.length;j++){
    (function(C){
      var card = document.createElement('div');
      card.className = 'country-card' + (selCountry === C.id ? ' on' : '');
      var fl = document.createElement('div');
      fl.className = 'flag';
      fl.style.background = 'linear-gradient(180deg,' + C.p + ' 50%,' + C.s + ' 50%)';
      var info = document.createElement('div');
      info.innerHTML = '<h5>' + C.name + '</h5><small>' + C.code + '</small>';
      card.appendChild(fl); card.appendChild(info);
      card.onclick = function(){ selCountry = C.id; buildSetup(); };
      ctyG.appendChild(card);
    })(COUNTRIES[j]);
  }
}

/* ============================================================
   TOURNAMENT
   ============================================================ */
function buildTournament(){
  var pool = [];
  for (var i=0;i<COUNTRIES.length;i++){
    if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
  }
  for (var s=0;s<pool.length;s++){
    var r = Math.floor(Math.random()*pool.length);
    var tmp = pool[s]; pool[s] = pool[r]; pool[r] = tmp;
  }
  var teams = [getCountry(selCountry)].concat(pool.slice(0, 7));
  var r0 = [];
  for (var q=0;q<8;q+=2) r0.push({ a: teams[q], b: teams[q+1], winner: null, played: false });
  var rounds = [r0,
    [{a:null,b:null,winner:null,played:false},{a:null,b:null,winner:null,played:false}],
    [{a:null,b:null,winner:null,played:false}]];

  tournament = {
    active: true, rounds: rounds,
    userCountry: getCountry(selCountry),
    userMatchRound: 0, userMatchIdx: -1,
    champion: null,
    recordResult: function(userWon){
      var r = this.userMatchRound, i = this.userMatchIdx;
      if (r < 0 || i < 0) return;
      var m = this.rounds[r][i];
      m.winner = userWon ? this.userCountry : (m.a === this.userCountry ? m.b : m.a);
      m.played = true;
      this.simulateRound(r);
      if (r < this.rounds.length - 1){
        this.userMatchRound = r + 1;
        this.userMatchIdx = -1;
        var next = this.rounds[r+1];
        for (var k=0;k<next.length;k++){
          if (next[k].a === this.userCountry || next[k].b === this.userCountry){
            this.userMatchIdx = k; break;
          }
        }
        if (this.userMatchIdx === -1) this.userMatchIdx = 0;
      }
      if (r === this.rounds.length - 1){
        this.champion = m.winner;
        if (this.champion === this.userCountry){
          user.trophies = (user.trophies || 0) + 1;
          user.coins += 500;
          saveGuest();
        }
      }
    },
    simulateRound: function(r){
      var matches = this.rounds[r];
      for (var i=0;i<matches.length;i++){
        var m = matches[i];
        if (m.played) continue;
        if (m.a === this.userCountry || m.b === this.userCountry) continue;
        if (!m.a || !m.b) continue;
        m.winner = Math.random() < 0.5 ? m.a : m.b;
        m.played = true;
      }
      if (r < this.rounds.length - 1){
        var next = this.rounds[r+1];
        for (var j=0;j<matches.length;j++){
          var winner = matches[j].winner;
          var slot = next[Math.floor(j/2)];
          if (j % 2 === 0) slot.a = winner;
          else slot.b = winner;
        }
      }
    }
  };

  var r0check = tournament.rounds[0];
  for (var x=0;x<r0check.length;x++){
    if (r0check[x].a === tournament.userCountry || r0check[x].b === tournament.userCountry){
      tournament.userMatchIdx = x; break;
    }
  }
}

function renderTournament(){
  var body = document.getElementById('bracket-body');
  body.innerHTML = '';
  var rounds = tournament.rounds;
  var titles = ['QUARTER-FINALS','SEMI-FINALS','FINAL'];
  for (var r=0;r<rounds.length;r++){
    var col = document.createElement('div');
    col.className = 'bracket-col';
    var title = document.createElement('div');
    title.className = 'bracket-title';
    title.textContent = titles[r];
    col.appendChild(title);
    for (var i=0;i<rounds[r].length;i++){
      var m = rounds[r][i];
      var el = document.createElement('div');
      el.className = 'bracket-match';
      if (r === tournament.userMatchRound && i === tournament.userMatchIdx && !m.played && !tournament.champion) el.className += ' current';
      else if (m.played) el.className += ' done';
      else if (!m.a || !m.b) el.className += ' locked';
      var nameA = m.a ? m.a.name : 'TBD';
      var nameB = m.b ? m.b.name : 'TBD';
      var winA = (m.winner && m.a === m.winner) ? ' win' : '';
      var winB = (m.winner && m.b === m.winner) ? ' win' : '';
      el.innerHTML =
        '<div class="bm-team' + winA + '">' + nameA + '<span class="code">' + (m.a?m.a.code:'—') + '</span></div>' +
        '<div class="bm-team' + winB + '">' + nameB + '<span class="code">' + (m.b?m.b.code:'—') + '</span></div>';
      col.appendChild(el);
    }
    body.appendChild(col);
  }
  document.getElementById('tour-coins').textContent = Math.floor(user.coins);
  var btn = document.getElementById('btn-next-tour-match');
  if (tournament.champion){
    btn.textContent = '🏆  NEW TOURNAMENT';
    btn.onclick = function(){ buildTournament(); renderTournament(); };
  } else {
    btn.textContent = '▶  PLAY NEXT MATCH';
    btn.onclick = startTournamentMatch;
  }
}

function startTournamentMatch(){
  if (!tournament || tournament.champion) return;
  var m = tournament.rounds[tournament.userMatchRound][tournament.userMatchIdx];
  if (!m || !m.a || !m.b) return;
  var opp = (m.a === tournament.userCountry) ? m.b : m.a;
  newMatch(opp.id);
}

/* ============================================================
   UI WIRING
   ============================================================ */
document.getElementById('btn-enter').addEventListener('click', function(){
  buildHome(); screen = 'home'; showScreen('scr-home');
});
document.getElementById('btn-play').onclick = function(){
  tournament = null; buildSetup(); screen = 'setup'; showScreen('scr-setup');
};
document.getElementById('btn-tournament').onclick = function(){
  buildTournament(); renderTournament(); screen = 'tournament'; showScreen('scr-tournament');
};
document.getElementById('btn-shop').onclick = function(){
  buildShop(); screen = 'shop'; showScreen('scr-shop');
};
document.getElementById('btn-shop-back').onclick = function(){ buildHome(); screen = 'home'; showScreen('scr-home'); };
document.getElementById('btn-setup-back').onclick = function(){ buildHome(); screen = 'home'; showScreen('scr-home'); };
document.getElementById('btn-tour-back').onclick = function(){ tournament = null; buildHome(); screen = 'home'; showScreen('scr-home'); };
document.getElementById('btn-start-match').onclick = function(){ newMatch(null); };
document.getElementById('btn-newid').onclick = function(){
  if (!window.confirm('Start a new player ID?\nThis resets your coins and stats.')) return;
  storage.removeItem(GUEST_KEY);
  user = loadGuest();
  buildHome();
};
document.getElementById('btn-rematch').onclick = function(){
  if (tournament && tournament.active){
    renderTournament(); screen = 'tournament'; showScreen('scr-tournament');
  } else {
    newMatch(null);
  }
};
document.getElementById('btn-result-home').onclick = function(){
  match = null;
  if (tournament && tournament.active){
    renderTournament(); screen = 'tournament'; showScreen('scr-tournament');
  } else {
    buildHome(); screen = 'home'; showScreen('scr-home');
  }
};
document.getElementById('btnPause').addEventListener('click', function(){
  if (screen !== 'match') return;
  screen = 'pause'; showScreen('scr-pause');
});
document.getElementById('btn-resume').addEventListener('click', function(){
  if (screen !== 'pause') return;
  screen = 'match'; showScreen(''); lastTS = 0;
});
document.getElementById('btn-quit').addEventListener('click', function(){
  match = null; tournament = null;
  buildHome(); screen = 'home'; showScreen('scr-home');
  document.getElementById('hud').classList.add('hidden');
});

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function resizeApp(){
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

function loop(ts){
  var dt = Math.min(0.05, (ts - lastTS) / 1000 || 0);
  lastTS = ts;
  try {
    if (screen === 'match' && match){
      updateMatch(dt);
      renderMatch();
    } else if (screen === 'home'){
      drawPreview();
    } else {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, 1280, 720);
    }
  } catch (err){
    if (window.console && console.error) console.error('Loop error:', err);
  }
  requestAnimationFrame(loop);
}

document.getElementById('guest-id-display').textContent = user.id;
drawPreview();
requestAnimationFrame(loop);
</script>

<title>Dhaka Hoops</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0510;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
  #app{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin-left:-640px;margin-top:-360px;transform-origin:center center;overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
  canvas#cv{position:absolute;inset:0;width:1280px;height:720px;display:block;touch-action:none}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;z-index:20}
  .hidden{display:none !important}

  #scr-auth{align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%,#3a1a1a,#0a0510 60%),linear-gradient(160deg,#1a0820,#0a0510)}
  .auth-box{position:relative;width:460px;padding:30px 36px 26px;border-radius:22px;
    background:rgba(22,14,26,.94);border:1px solid rgba(255,180,120,.25);
    box-shadow:0 24px 60px rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center}
  .logo-full{font-size:52px;font-weight:900;letter-spacing:6px;
    background:linear-gradient(90deg,#ff9f1c,#ff5722);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-small{font-size:22px;font-weight:900;letter-spacing:3px;
    background:linear-gradient(90deg,#ff9f1c,#ff5722);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{text-align:center;color:#c89ac8;font-size:11px;letter-spacing:5px;margin:8px 0 20px;text-transform:uppercase}
  .guest-id-card{width:100%;background:linear-gradient(135deg,rgba(255,159,28,.12),rgba(255,87,34,.08));
    border:1px solid rgba(255,159,28,.4);border-radius:16px;padding:16px;margin-bottom:16px;text-align:center}
  .gid-label{font-size:10px;letter-spacing:3px;color:#c89a78;text-transform:uppercase;margin-bottom:6px}
  .gid-value{font-family:'Courier New',monospace;font-size:28px;font-weight:900;letter-spacing:4px;color:#ff9f1c;
    margin-bottom:6px;text-shadow:0 0 20px rgba(255,159,28,.5)}
  .gid-note{font-size:11px;color:#c89a78}
  .primary{width:100%;padding:15px;border:0;border-radius:11px;font-size:16px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,#ff9f1c,#ff5722);color:#1a0805;letter-spacing:1px}

  .topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
    background:linear-gradient(180deg,rgba(22,10,20,.95),rgba(22,10,20,.55));border-bottom:1px solid rgba(255,255,255,.07)}
  .acct{display:flex;align-items:center;gap:12px}
  .coin{background:rgba(255,159,28,.14);border:1px solid rgba(255,159,28,.4);padding:6px 14px;border-radius:20px;font-size:14px;color:#ff9f1c;font-weight:700}
  .uname{font-family:'Courier New',monospace;font-size:13px;color:#ff9f1c;font-weight:800;letter-spacing:2px;
    background:rgba(255,159,28,.10);border:1px solid rgba(255,159,28,.3);padding:5px 12px;border-radius:8px}
  .mini{padding:6px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
    color:#c3d3e4;font-size:12px;cursor:pointer;font-weight:600}
  .mini:hover{background:rgba(255,159,28,.18);border-color:#ff9f1c;color:#ff9f1c}

  #scr-home{background:linear-gradient(160deg,#140a18,#0a0510 70%)}
  .home-body{flex:1;display:flex;gap:18px;padding:16px 22px;overflow:hidden}
  .char-panel{width:420px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(255,159,28,.15),rgba(22,10,20,.7) 70%);
    border:1px solid rgba(255,159,28,.25)}
  #prev{display:block}
  .char-name{margin-top:8px;font-size:13px;color:#ff9f1c;font-weight:700;letter-spacing:1px}
  .ctrl-panel{flex:1;display:flex;flex-direction:column;gap:11px;overflow-y:auto;padding-right:6px}
  .ctrl-panel h3{font-size:11px;letter-spacing:2px;color:#8a6a8a;text-transform:uppercase;margin-top:5px}
  .row{display:flex;align-items:center;gap:12px}
  .row label{width:110px;font-size:12px;color:#9fb2c8;font-weight:600}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
  .sw.on{border-color:#ff9f1c;box-shadow:0 0 12px rgba(255,159,28,.6)}
  .bottom-bar{height:88px;display:flex;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(0deg,rgba(22,10,20,.96),transparent);flex-wrap:wrap}
  .big{padding:14px 34px;border:0;border-radius:14px;font-size:16px;font-weight:800;letter-spacing:1.5px;cursor:pointer;
    background:linear-gradient(135deg,#ff9f1c,#ff5722);color:#1a0805;box-shadow:0 8px 26px rgba(255,159,28,.3)}
  .big.ghost{background:rgba(255,255,255,.07);color:#c3d3e4;border:1px solid rgba(255,255,255,.16);box-shadow:none}
  .big.gold{background:linear-gradient(135deg,#ffd166,#ff9f1c);color:#1a1205}

  #scr-shop{background:linear-gradient(160deg,#1a0e1a,#0a0510 70%)}
  .shop-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:18px 22px;overflow-y:auto}
  .bcard{border-radius:16px;padding:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    display:flex;flex-direction:column;align-items:center;gap:7px}
  .bcard.owned{border-color:rgba(255,159,28,.5)}
  .bcard.equipped{border-color:#ff9f1c;box-shadow:0 0 22px rgba(255,159,28,.25)}
  .bcard h4{font-size:13px;font-weight:700;color:#e3eefb}
  .bcard p{font-size:10px;color:#7d90a8;text-align:center;min-height:26px}
  .price{font-size:13px;font-weight:800;color:#ff9f1c}
  .buybtn{width:100%;padding:8px;border-radius:9px;border:0;font-size:11px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff9f1c,#ff5722);color:#1a0805}
  .buybtn:disabled{background:rgba(255,255,255,.09);color:#6b7c8f;cursor:default}

  #scr-setup{background:linear-gradient(160deg,#1a0c2e,#0a0510 70%)}
  .setup-body{flex:1;display:flex;gap:14px;padding:14px 20px;overflow:hidden}
  .setup-col{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .setup-col h3{font-size:11px;letter-spacing:2px;color:#8a6a8a;text-transform:uppercase;font-weight:800;
    display:flex;align-items:center;gap:8px}
  .setup-col h3 .num{background:rgba(255,159,28,.18);border:1px solid rgba(255,159,28,.4);
    color:#ff9f1c;font-size:10px;padding:2px 7px;border-radius:6px}
  .setup-scroll{flex:1;overflow-y:auto;padding-right:6px;display:grid;gap:8px;align-content:start}
  .country-grid,.court-grid{grid-template-columns:repeat(2,1fr)}
  .court-card,.country-card{border-radius:12px;padding:8px;cursor:pointer;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);display:flex;gap:8px;align-items:center}
  .court-card.on,.country-card.on{border-color:#ff9f1c;background:rgba(255,159,28,.14)}
  .court-card .swatch{width:48px;height:34px;border-radius:6px;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
  .court-card h5,.country-card h5{font-size:12px;font-weight:800}
  .court-card small,.country-card small{font-size:9px;color:#7d90a8;text-transform:uppercase}
  .country-card .flag{width:34px;height:22px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}

  #hud{position:absolute;inset:0;z-index:15;pointer-events:none}
  .scoreboard{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(20,10,20,.9);border:1px solid rgba(255,159,28,.35);border-radius:14px;
    padding:8px 24px;display:flex;align-items:center;gap:22px;font-weight:800}
  .scoreboard .flag{width:28px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
  .scoreboard .name{font-family:'Courier New',monospace;letter-spacing:2px;font-size:14px}
  .scoreboard .pt{font-size:26px;font-weight:900;color:#ff9f1c;letter-spacing:2px;min-width:38px;text-align:center}
  .scoreboard .sep{color:#5a6a7c;font-size:16px}
  .scoreboard .timer{font-family:'Courier New',monospace;font-size:18px;color:#ffd166;letter-spacing:2px;
    padding-left:16px;border-left:1px solid rgba(255,255,255,.15);margin-left:6px}
  .scoreboard .timer.low{color:#ff5722;animation:pulse .6s infinite}
  @keyframes pulse{50%{opacity:.5}}
  #btnPause{position:absolute;top:14px;left:20px;width:44px;height:44px;border-radius:12px;
    background:rgba(20,10,20,.85);border:1px solid rgba(255,255,255,.2);pointer-events:auto;z-index:25;
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#c3d3e4}
  #hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
    background:rgba(20,10,20,.85);border:1px solid rgba(255,159,28,.4);border-radius:20px;
    padding:8px 22px;font-size:13px;color:#ff9f1c;letter-spacing:2px;font-weight:800;
    opacity:0;transition:opacity .25s;pointer-events:none}
  #hint.on{opacity:1}

  #scr-pause,#scr-result{align-items:center;justify-content:center;background:rgba(10,4,12,.9);backdrop-filter:blur(9px);z-index:30}
  .pause-box,.res-box{width:520px;padding:30px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(30,18,30,.97),rgba(15,8,18,.97));border:1px solid rgba(255,159,28,.28)}
  .pause-box h2,.res-box h2{font-size:22px;font-weight:900;letter-spacing:4px;color:#ff9f1c;margin-bottom:20px}
  .pause-box button,.res-actions button{display:block;width:100%;padding:13px;margin-bottom:10px;border:0;border-radius:12px;
    font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px;
    background:linear-gradient(135deg,#ff9f1c,#ff5722);color:#1a0805}
  .pause-box button.ghost,.res-actions .home{background:rgba(255,255,255,.08);color:#c3d3e4;border:1px solid rgba(255,255,255,.16)}
  .res-box .res-loc{font-size:12px;color:#ff9f1c;letter-spacing:2px;font-weight:700;margin-bottom:10px}
  .res-outcome{font-size:52px;font-weight:900;line-height:1;margin:6px 0;
    background:linear-gradient(90deg,#ff9f1c,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-outcome.loss{background:linear-gradient(90deg,#ff5a3c,#c93010);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-score{font-size:30px;font-weight:900;color:#ffd166;letter-spacing:4px;margin:14px 0 6px;font-family:'Courier New',monospace}
  .res-teams{font-size:13px;color:#9fb2c8;letter-spacing:1.5px;margin-bottom:16px}
  .res-stats{display:flex;justify-content:center;gap:22px;margin-bottom:16px;font-size:11px;color:#9fb2c8}
  .res-stats b{display:block;color:#ff9f1c;font-size:17px;font-weight:800;margin-bottom:2px}
  .reward{font-size:17px;font-weight:800;color:#ff9f1c;margin-bottom:14px}
  .reward.none{color:#6b7c8f;font-size:13px}
  .res-actions{display:flex;gap:12px}
  .res-actions button{margin-bottom:0}

  #scr-tournament{background:linear-gradient(160deg,#1a0c2e,#0a0510 70%)}
  .bracket{flex:1;display:flex;align-items:center;justify-content:center;gap:44px;padding:20px;overflow-y:auto}
  .bracket-col{display:flex;flex-direction:column;gap:14px}
  .bracket-match{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:12px;
    padding:10px 14px;min-width:220px}
  .bracket-match.done{border-color:rgba(255,159,28,.4);background:rgba(255,159,28,.08)}
  .bracket-match.current{border-color:#ffd166;background:rgba(255,209,102,.12)}
  .bracket-match.locked{opacity:.35}
  .bracket-match .bm-team{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:3px 0}
  .bracket-match .bm-team.win{color:#ff9f1c}
  .bracket-match .bm-team .code{font-family:'Courier New',monospace;font-size:11px;color:#7d90a8;margin-left:auto}
  .bracket-title{text-align:center;font-size:11px;letter-spacing:3px;color:#8a6a8a;text-transform:uppercase;
    margin-bottom:6px;font-weight:800}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div class="screen" id="scr-auth">
    <div class="auth-box">
      <div class="logo-full">DHAKA</div>
      <div class="logo-full" style="font-size:42px;letter-spacing:14px;margin-top:-8px">HOOPS</div>
      <div class="tag">Touch Basketball</div>
      <div class="guest-id-card">
        <div class="gid-label">Your Player ID</div>
        <div class="gid-value" id="guest-id-display">DH-XXXXX</div>
        <div class="gid-note">No sign-up needed. Progress auto-saves on this device.</div>
      </div>
      <button class="primary" id="btn-enter">▶  ENTER THE COURT</button>
    </div>
  </div>

  <div class="screen hidden" id="scr-home">
    <div class="topbar">
      <div class="logo-small">DHAKA HOOPS</div>
      <div class="acct">
        <span class="coin">🪙 <b id="home-coins">0</b></span>
        <span class="uname" id="home-user">DH-XXXXX</span>
        <button class="mini" id="btn-newid">New ID</button>
      </div>
    </div>
    <div class="home-body">
      <div class="char-panel">
        <canvas id="prev" width="380" height="440"></canvas>
        <div class="char-name" id="equipped-name">Classic Ball</div>
      </div>
      <div class="ctrl-panel">
        <h3>Your Ball</h3>
        <div class="row"><label>Ball Colour</label><div class="swatches" id="ball-swatches"></div></div>
        <h3>Your Basketballs</h3>
        <div id="kit-row" style="display:flex;gap:10px;flex-wrap:wrap"></div>
        <h3>Career Stats</h3>
        <div style="display:flex;gap:22px;align-items:center">
          <div style="text-align:center"><div id="stat-wins" style="font-size:22px;font-weight:800;color:#ff9f1c">0</div><div style="font-size:10px;color:#7d90a8;letter-spacing:1px">WINS</div></div>
          <div style="text-align:center"><div id="stat-losses" style="font-size:22px;font-weight:800;color:#ff5a3c">0</div><div style="font-size:10px;color:#7d90a8;letter-spacing:1px">LOSSES</div></div>
          <div style="text-align:center"><div id="stat-baskets" style="font-size:22px;font-weight:800;color:#8ac8ff">0</div><div style="font-size:10px;color:#7d90a8;letter-spacing:1px">BASKETS</div></div>
          <div style="text-align:center"><div id="stat-swish" style="font-size:22px;font-weight:800;color:#ffd166">0</div><div style="font-size:10px;color:#7d90a8;letter-spacing:1px">SWISHES</div></div>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="big" id="btn-play">▶  QUICK MATCH</button>
      <button class="big gold" id="btn-tournament">🏆  TOURNAMENT</button>
      <button class="big ghost" id="btn-shop">🛍  SHOP</button>
    </div>
  </div>

  <div class="screen hidden" id="scr-shop">
    <div class="topbar">
      <div class="logo-small">🛍 BALL SHOP</div>
      <div class="acct">
        <span class="coin">🪙 <b id="shop-coins">0</b></span>
        <button class="mini" id="btn-shop-back">← Back</button>
      </div>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </div>

  <div class="screen hidden" id="scr-setup">
    <div class="topbar">
      <div class="logo-small">⚙ MATCH SETUP</div>
      <div class="acct">
        <span class="coin">🪙 <b id="setup-coins">0</b></span>
        <button class="mini" id="btn-setup-back">← Home</button>
      </div>
    </div>
    <div class="setup-body">
      <div class="setup-col">
        <h3><span class="num">01</span> Your Country</h3>
        <div class="setup-scroll country-grid" id="country-grid"></div>
      </div>
      <div class="setup-col">
        <h3><span class="num">02</span> Court</h3>
        <div class="setup-scroll court-grid" id="court-grid"></div>
      </div>
      <div class="setup-col">
        <h3><span class="num">03</span> Controls</h3>
        <div class="setup-scroll" style="grid-template-columns:1fr">
          <div style="background:linear-gradient(135deg,rgba(255,159,28,.15),rgba(255,87,34,.08));
            border:1px solid rgba(255,159,28,.4);border-radius:12px;padding:14px">
            <h5 style="font-size:14px;font-weight:900;color:#ff9f1c;letter-spacing:2px;margin-bottom:8px">👆 TOUCH CONTROLS</h5>
            <div style="font-size:11px;color:#c8d8e8;line-height:1.8">
              <b style="color:#ff9f1c">DRAG UP</b><br>Set the shot power<br>
              <b style="color:#ff9f1c">DRAG LEFT / RIGHT</b><br>Aim at the hoop<br>
              <b style="color:#ff9f1c">RELEASE</b><br>Shoot the ball<br><br>
              A dashed preview shows your shot<br>
              arc while aiming. Line it up with<br>
              the hoop and release!
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="big" id="btn-start-match">▶  START MATCH</button>
    </div>
  </div>

  <div class="screen hidden" id="scr-tournament">
    <div class="topbar">
      <div class="logo-small">🏆 TOURNAMENT</div>
      <div class="acct">
        <span class="coin">🪙 <b id="tour-coins">0</b></span>
        <button class="mini" id="btn-tour-back">← Home</button>
      </div>
    </div>
    <div class="bracket" id="bracket-body"></div>
    <div class="bottom-bar">
      <button class="big" id="btn-next-tour-match">▶  PLAY NEXT MATCH</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="scoreboard" id="scoreboard"></div>
    <button id="btnPause">⏸</button>
    <div id="hint"></div>
  </div>

  <div class="screen hidden" id="scr-pause">
    <div class="pause-box">
      <h2>PAUSED</h2>
      <button id="btn-resume">▶  RESUME</button>
      <button class="ghost" id="btn-quit">QUIT MATCH</button>
    </div>
  </div>

  <div class="screen hidden" id="scr-result">
    <div class="res-box">
      <h2>Match Finished</h2>
      <div class="res-loc" id="res-loc">COURT 1</div>
      <div class="res-outcome" id="res-outcome">VICTORY</div>
      <div class="res-score" id="res-score">0 - 0</div>
      <div class="res-teams" id="res-teams">BANGLADESH vs INDIA</div>
      <div class="res-stats">
        <div><b id="res-baskets">0</b>Baskets</div>
        <div><b id="res-swish">0</b>Swishes</div>
        <div><b id="res-attempts">0</b>Attempts</div>
      </div>
      <div class="reward" id="res-reward">+100 🪙</div>
      <div class="res-actions" style="display:flex;gap:12px">
        <button id="btn-rematch" style="flex:1">REMATCH</button>
        <button class="home" id="btn-result-home" style="flex:1">HOME</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DHAKA HOOPS — Back-view touch basketball
   Windows 7 safe (var, no arrows, no template literals)
   ============================================================ */

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

/* Polyfills */
(function(){
  if (typeof CanvasRenderingContext2D === 'undefined') return;
  if (!CanvasRenderingContext2D.prototype.ellipse){
    CanvasRenderingContext2D.prototype.ellipse = function(x,y,rx,ry,rot,a1,a2,acw){
      this.save(); this.translate(x,y); this.rotate(rot||0); this.scale(rx,ry);
      this.arc(0,0,1,a1,a2===undefined?Math.PI*2:a2,acw||false); this.restore();
    };
  }
})();
if (!window.requestAnimationFrame){
  window.requestAnimationFrame = function(cb){ return setTimeout(function(){ cb(Date.now()); }, 16); };
}

var storage = (function(){
  try {
    window.localStorage.setItem('__h__','1');
    window.localStorage.removeItem('__h__');
    return window.localStorage;
  } catch(e){
    var m = {};
    return {
      getItem: function(k){ return m[k]===undefined?null:m[k]; },
      setItem: function(k,v){ m[k]=String(v); },
      removeItem: function(k){ delete m[k]; }
    };
  }
})();

function clamp(v,a,b){ if (v<a) return a; if (v>b) return b; return v; }
function rnd(a,b){ return a + Math.random()*(b-a); }

/* ============================================================
   WORLD CONSTANTS
   ============================================================ */
var HOOP_Y = 5.0;              /* world y of hoop */
var HOOP_Z = 3.05;             /* world z of rim (regulation height) */
var HOOP_R = 0.35;             /* rim radius */
var BALL_R_WORLD = 0.18;
var GRAVITY = 20;
var PLAYER_Z = 2.0;            /* release height */
var MATCH_TIME = 60;

/* ============================================================
   DATA
   ============================================================ */
var BALL_COLORS = [
  {id:'orange',  body:'#ff7a1a', seam:'#1a0808'},
  {id:'brown',   body:'#8b5a2b', seam:'#1a0a05'},
  {id:'red',     body:'#d41e1e', seam:'#0a0808'},
  {id:'blue',    body:'#1a5a9a', seam:'#ffffff'},
  {id:'green',   body:'#0a7a3a', seam:'#ffffff'},

/* ============================================================
   PROJECTION
   ============================================================ */
function project(wx, wy, wz){
  var t = clamp(wy / HOOP_Y, 0, 1.3);
  var baseY = 700 - 350 * t;
  var scale = Math.max(0.30, 1 - 0.55 * t);
  var sx = 640 + wx * 260 * scale;
  var sy = baseY - wz * 110 * scale;
  return { x: sx, y: sy, s: scale };
}

/* ============================================================
   MATCH
   ============================================================ */
function newMatch(oppCountryId){
  var court = getCourt(selCourt);
  var countryA = getCountry(selCountry);
  var countryB;
  if (oppCountryId) countryB = getCountry(oppCountryId);
  else {
    var pool = [];
    for (var i=0;i<COUNTRIES.length;i++) if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
    countryB = pool[Math.floor(Math.random()*pool.length)];

  match = {
    court: court,

    ball: {
      x: 0, y: 0, z: PLAYER_Z,
      vx: 0, vy: 0, vz: 0,
      active: false,
      touchedRim: false,
      touchedBoard: false,
      scored: false,
      trail: [],
      flightTime: 0
    },

    score: { p: 0, o: 0 },
    stats: { p: { baskets: 0, swishes: 0, attempts: 0 }, o: { baskets: 0, swishes: 0, attempts: 0 } },

    timeLeft: MATCH_TIME,
    state: 'playing',    /* playing | pointScored | ended */

function updateScoreboard(){

/* ============================================================
   INPUT — drag to aim, release to shoot
   ============================================================ */
var drag = {
  active: false,
  startX: 0, startY: 0,
  curX: 0, curY: 0,
  preview: [],
  vx: 0, vy: 0, vz: 0,
  power: 0
};

function canvasCoords(clientX, clientY){
  var r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (cv.width / r.width),
    y: (clientY - r.top) * (cv.height / r.height)
  };
}

function startDrag(clientX, clientY){
  if (screen !== 'match' || !match) return;
  if (match.ball.active) return;   /* ball in flight */
  var c = canvasCoords(clientX, clientY);
  drag.active = true;
  drag.startX = c.x;
  drag.startY = c.y;
  drag.curX = c.x;
  drag.curY = c.y;
  updatePreview();
}

function moveDrag(clientX, clientY){
  if (!drag.active) return;
  if (screen !== 'match') return;
  var c = canvasCoords(clientX, clientY);
  drag.curX = c.x;
  drag.curY = c.y;
  updatePreview();
}

function releaseDrag(){
  if (!drag.active) return;
  drag.active = false;
  if (screen !== 'match' || !match) return;
  if (match.ball.active) return;

  /* Need enough power */
  if (drag.power < 0.15){
    drag.preview = [];
    return;
  }

  /* Fire the ball */
  var b = match.ball;
  b.x = 0; b.y = 0; b.z = PLAYER_Z;
  b.vx = drag.vx;
  b.vy = drag.vy;
  b.vz = drag.vz;
  b.active = true;
  b.touchedRim = false;
  b.touchedBoard = false;
  b.scored = false;
  b.flightTime = 0;
  b.trail = [];
  match.stats.p.attempts++;
  match.state = 'playing';
  drag.preview = [];
  setHint('');
}

function updatePreview(){
  var dx = drag.curX - drag.startX;
  var dy = drag.curY - drag.startY;

  /* Compute shot velocity */
  var up = Math.max(0, -dy);
  var power = clamp(up / 250, 0, 1.3);
  var vy = 4.5 + power * 2.0;
  var vz = 6.5 + power * 2.5;
  var vx = (dx / 300) * 3.0;

  drag.vx = vx; drag.vy = vy; drag.vz = vz;
  drag.power = power;

  /* Simulate trajectory */
  drag.preview = simulateTrajectory(vx, vy, vz, 200);
}

function simulateTrajectory(vx, vy, vz, maxSteps){
  var pts = [];
  var x = 0, y = 0, z = PLAYER_Z;
  var dt = 1/60;
  for (var i = 0; i < maxSteps; i++){
    pts.push({ x: x, y: y, z: z });
    vz -= GRAVITY * dt;
    x += vx * dt;
    y += vy * dt;
    z += vz * dt;
    if (z < -1) break;
    if (y > HOOP_Y * 1.6) break;
  }
  return pts;
}

/* Bind touch */
cv.addEventListener('touchstart', function(e){
  e.preventDefault();
  var t = e.touches[0];
  startDrag(t.clientX, t.clientY);
}, {passive:false});
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  var t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
}, {passive:false});
cv.addEventListener('touchend', function(e){
  e.preventDefault();
  releaseDrag();
}, {passive:false});
cv.addEventListener('touchcancel', function(e){
  e.preventDefault();
  releaseDrag();
}, {passive:false});

/* Mouse */
var mouseDown = false;
cv.addEventListener('mousedown', function(e){ mouseDown = true; startDrag(e.clientX, e.clientY); });
cv.addEventListener('mousemove', function(e){ if (mouseDown) moveDrag(e.clientX, e.clientY); });
cv.addEventListener('mouseup', function(e){ mouseDown = false; releaseDrag(); });
cv.addEventListener('mouseleave', function(e){ if (mouseDown){ mouseDown = false; releaseDrag(); } });

/* ============================================================
   BALL PHYSICS
   ============================================================ */
function stepBall(dt){
  var m = match;
  var b = m.ball;
  if (!b.active) return;

  b.flightTime += dt;
  var prevY = b.y;
  var prevZ = b.z;

  b.vz -= GRAVITY * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.z += b.vz * dt;

  /* Trail */
  b.trail.push({ x: b.x, y: b.y, z: b.z, life: 0.4 });
  if (b.trail.length > 25) b.trail.shift();
  for (var i=0;i<b.trail.length;i++) b.trail[i].life -= dt;

  /* Backboard collision (y = 5.4, x in [-1, 1], z in [2.5, 4.3]) */
  if (b.y + BALL_R_WORLD >= 5.4 && b.y - BALL_R_WORLD < 5.4 && b.vy > 0){
    if (Math.abs(b.x) < 1.0 && b.z > 2.5 && b.z < 4.3){
      b.y = 5.4 - BALL_R_WORLD;
      b.vy = -b.vy * 0.55;
      b.vx *= 0.85;
      b.vz *= 0.85;
      b.touchedBoard = true;
    }
  }

  /* Rim/scoring check: when ball crosses z = HOOP_Z going down */
  if (prevZ > HOOP_Z && b.z <= HOOP_Z && b.vz < 0){
    /* Interpolate x, y at z = HOOP_Z */
    var frac = (prevZ - HOOP_Z) / (prevZ - b.z);
    var crossX = b.x - b.vx * dt * (1 - frac);
    var crossY = b.y - b.vy * dt * (1 - frac);

    /* Distance from hoop center */
    var dx = crossX - 0;
    var dy = crossY - HOOP_Y;
    var distFromHoop = Math.sqrt(dx*dx + dy*dy);

    if (distFromHoop < HOOP_R - 0.05){
      /* SCORE! */
      b.scored = true;
      var points = b.touchedRim || b.touchedBoard ? 2 : 3;
      if (!b.touchedRim && !b.touchedBoard){
        m.stats.p.swishes++;
      }
      m.stats.p.baskets++;
      m.score.p += points;
      m.state = 'pointScored';
      m.stateTimer = 1.2;
      m.message = (points === 3 ? '🔥 SWISH! +3' : '⚡ BASKET! +2');
      setHint(m.message);
      updateScoreboard();
      return;
    } else if (distFromHoop < HOOP_R + BALL_R_WORLD){
      /* Hit rim edge - bounce off */
      b.touchedRim = true;
      /* Random rim bounce */
      var rimAngle = Math.atan2(dy, dx);
      b.vx = Math.cos(rimAngle) * 1.5 + rnd(-0.5, 0.5);
      b.vy = -1.5 + rnd(-0.5, 0.5);
      b.vz = -2;
      b.x = crossX + Math.cos(rimAngle) * 0.15;
      b.y = crossY + Math.sin(rimAngle) * 0.15;
      b.z = HOOP_Z;
    }
  }

  /* Ball fell below floor */
  if (b.z < -1){
    missShot('MISS');
  }

  /* Ball too far past hoop */
  if (b.y > HOOP_Y + 3){
    missShot('LONG');
  }

  /* Ball bounced off backboard then went to floor without scoring — miss */
  if (b.y > 6 && b.y < 8 && b.z < 0 && b.vy > 0){
    missShot('MISS');
  }
}

function missShot(msg){
  var m = match;
  if (m.state === 'pointScored') return;
  m.state = 'pointScored';
  m.stateTimer = 1.0;
  m.message = msg;
  setHint(msg);
  m.ball.active = false;
}

function resetBall(){
  var m = match;
  var b = m.ball;
  b.x = 0; b.y = 0; b.z = PLAYER_Z;
  b.vx = 0; b.vy = 0; b.vz = 0;
  b.active = false;
  b.touchedRim = false;
  b.touchedBoard = false;
  b.scored = false;
  b.trail = [];
  b.flightTime = 0;
}

/* ============================================================
   AI OPPONENT
   ============================================================ */
var AI_ACCURACY = 0.62;
var AI_INTERVAL = 3.5;

function updateAI(dt){
  var m = match;
  if (m.state !== 'playing') return;

  m.aiNextIn -= dt;
  if (m.aiNextIn <= 0){
    m.aiNextIn = AI_INTERVAL + rnd(-0.5, 0.8);
    m.stats.o.attempts++;

    var made = Math.random() < AI_ACCURACY;
    if (made){
      var swish = Math.random() < 0.35;
      var pts = swish ? 3 : 2;
      m.stats.o.baskets++;
      if (swish) m.stats.o.swishes++;
      m.score.o += pts;
      flashMessage((swish ? '🔥 AI SWISH +3' : 'AI BASKET +2'), 1.2);
    } else {
      flashMessage('AI MISS', 0.9);
    }
    updateScoreboard();
  }
}

var flashMsg = { text: '', timer: 0 };
function flashMessage(txt, dur){
  flashMsg.text = txt;
  flashMsg.timer = dur;
}

/* ============================================================
   MATCH UPDATE
   ============================================================ */
function updateMatch(dt){
  var m = match;
  if (!m) return;

  /* Timer */
  if (m.state !== 'ended'){
    m.timeLeft -= dt;
    if (m.timeLeft <= 0){
      m.timeLeft = 0;
      m.state = 'ended';
      m.stateTimer = 2.0;
    }
  }

  /* Flash message */
  if (flashMsg.timer > 0) flashMsg.timer -= dt;

  /* Point scored pause */
  if (m.state === 'pointScored'){
    m.stateTimer -= dt;
    if (m.stateTimer <= 0){
      resetBall();
      m.state = 'playing';
      setHint('DRAG UP TO SHOOT');
    }
  }

  /* Ball flight */
  if (m.ball.active) stepBall(dt);

  /* AI shooting */
  updateAI(dt);

  /* Tick scoreboard every frame for timer */
  updateScoreboard();

  /* Match end */
  if (m.state === 'ended'){
    m.stateTimer -= dt;
    if (m.stateTimer <= 0) endMatch();
  }
}

/* ============================================================
   END MATCH
   ============================================================ */
function endMatch(){
  if (!match) return;
  var win = match.score.p > match.score.o;
  var draw = match.score.p === match.score.o;

  user.matches = (user.matches || 0) + 1;
  if (win){
    user.wins = (user.wins || 0) + 1;
    user.coins += 100;
  } else if (!draw){
    user.losses = (user.losses || 0) + 1;
  }
  user.baskets = (user.baskets || 0) + match.stats.p.baskets;
  user.swish = (user.swish || 0) + match.stats.p.swishes;
  saveGuest();

  document.getElementById('res-loc').textContent = match.court.name.toUpperCase();
  var o = document.getElementById('res-outcome');
  o.textContent = win ? 'VICTORY' : (draw ? 'DRAW' : 'DEFEAT');
  o.className = 'res-outcome' + (win || draw ? '' : ' loss');
  document.getElementById('res-score').textContent = match.score.p + ' - ' + match.score.o;
  document.getElementById('res-teams').textContent =
    match.countryA.name.toUpperCase() + '  vs  ' + match.countryB.name.toUpperCase();
  document.getElementById('res-baskets').textContent = match.stats.p.baskets;
  document.getElementById('res-swish').textContent = match.stats.p.swishes;
  document.getElementById('res-attempts').textContent = match.stats.p.attempts;

  var r = document.getElementById('res-reward');
  if (win){ r.textContent = '+100 🪙  Victory!'; r.className = 'reward'; }
  else if (draw){ r.textContent = 'Draw — no reward.'; r.className = 'reward none'; }
  else { r.textContent = 'No reward — win to earn coins.'; r.className = 'reward none'; }

  if (tournament && tournament.active) tournament.recordResult(win);

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud').classList.add('hidden');
}

/* ============================================================
   RENDER
   ============================================================ */
function renderMatch(){
  if (!match) return;
  var m = match;
  var court = m.court;

  /* Sky / back wall */
  var sky = ctx.createLinearGradient(0, 0, 0, 400);
  sky.addColorStop(0, court.bg);
  sky.addColorStop(1, shade(court.bg, 0.20));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 1280, 400);

  /* Crowd dots on far wall */
  for (var cy = 40; cy < 340; cy += 18){
    for (var cx = 20; cx < 1260; cx += 24){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.03 + Math.random()*0.05) + ')';
      ctx.fillRect(cx, cy, 4, 4);
    }
  }

  /* Court floor */
  var floorG = ctx.createLinearGradient(0, 350, 0, 720);
  floorG.addColorStop(0, shade(court.court, -0.10));
  floorG.addColorStop(1, shade(court.court, 0.15));
  ctx.fillStyle = floorG;
  ctx.fillRect(0, 350, 1280, 370);

  /* Floor plank lines */
  ctx.strokeStyle = 'rgba(0,0,0,.15)';
  ctx.lineWidth = 1;
  for (var py = 360; py < 720; py += 22){
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(1280, py);
    ctx.stroke();
  }

  /* Court markings */
  drawCourtMarkings(court);

  /* 3-point arc */
  drawThreePointArc(court);

  /* Free throw line */
  var ftL = project(-1.2, 3.5, 0);
  var ftR = project( 1.2, 3.5, 0);
  ctx.strokeStyle = court.line;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ftL.x, ftL.y);
  ctx.lineTo(ftR.x, ftR.y);
  ctx.stroke();

  /* Backboard */
  drawBackboard();

  /* Net (behind ball) */
  drawNet();

  /* Ball trail */
  var b = m.ball;
  for (var i=0;i<b.trail.length;i++){
    var tr = b.trail[i];
    if (tr.life <= 0) continue;
    var alpha = (tr.life / 0.4) * 0.5;
    var p = project(tr.x, tr.y, tr.z);
    var r = BALL_R_WORLD * 110 * p.s * 0.7;
    ctx.fillStyle = 'rgba(255,159,28,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fill();
  }

  /* Ball shadow */
  if (b.active || (!b.active && m.state !== 'ended')){
    var sp = project(b.x, b.y, 0);
    var shadowAlpha = clamp(0.55 - b.z * 0.15, 0.05, 0.5);
    var shScale = clamp(1 - b.z * 0.15, 0.25, 1);
    ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha + ')';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y, BALL_R_WORLD * 110 * sp.s * shScale, BALL_R_WORLD * 55 * sp.s * shScale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  /* Ball */
  if (b.active || (!b.active && m.state !== 'ended')){
    var bp = project(b.x, b.y, b.z);
    var r = BALL_R_WORLD * 110 * bp.s;
    drawBall(bp.x, bp.y, r, m.ballColor);
  }

  /* Aim preview */
  if (drag.active && drag.preview.length > 1){
    ctx.strokeStyle = 'rgba(255,209,102,.75)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    var started = false;
    for (var i=0;i<drag.preview.length;i+=2){
      var pt = drag.preview[i];
      var sp2 = project(pt.x, pt.y, pt.z);
      if (!started){ ctx.moveTo(sp2.x, sp2.y); started = true; }
      else ctx.lineTo(sp2.x, sp2.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    /* Power indicator */
    var powerPct = clamp(drag.power / 1.0, 0, 1);
    var idealLow = 0.85, idealHigh = 1.15;
    var inSweet = drag.power >= idealLow && drag.power <= idealHigh;

    /* Power meter bar */
    var meterX = 580, meterY = 40, meterW = 120, meterH = 12;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(meterX, meterY, meterW, meterH);
    /* Sweet spot */
    ctx.fillStyle = 'rgba(255,209,102,.4)';
    ctx.fillRect(meterX + meterW * idealLow, meterY, meterW * (idealHigh - idealLow), meterH);
    /* Current power */
    ctx.fillStyle = inSweet ? '#8ac926' : '#ff9f1c';
    ctx.fillRect(meterX, meterY, meterW * powerPct, meterH);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(meterX, meterY, meterW, meterH);
  }

  /* Flash message */
  if (flashMsg.timer > 0){
    ctx.fillStyle = 'rgba(255,159,28,.9)';
    ctx.font = 'bold 22px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(flashMsg.text, 640, 340);
  }

  /* Hint when idle */
  if (!b.active && m.state === 'playing' && !drag.active){
    ctx.fillStyle = 'rgba(255,209,102,.6)';
    ctx.font = 'bold 16px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DRAG UP + RELEASE TO SHOOT', 640, 620);
  }
}

function drawCourtMarkings(court){
  /* Painted area under hoop */
  var paintL = project(-0.9, 4.2, 0);
  var paintR = project( 0.9, 4.2, 0);
  var paintFarL = project(-0.9, 5.2, 0);
  var paintFarR = project( 0.9, 5.2, 0);
  ctx.fillStyle = shade(court.accent, -0.10);
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(paintL.x, paintL.y);
  ctx.lineTo(paintR.x, paintR.y);
  ctx.lineTo(paintFarR.x, paintFarR.y);
  ctx.lineTo(paintFarL.x, paintFarL.y);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.strokeStyle = court.line;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(paintL.x, paintL.y);
  ctx.lineTo(paintR.x, paintR.y);
  ctx.moveTo(paintFarL.x, paintFarL.y);
  ctx.lineTo(paintFarR.x, paintFarR.y);
  ctx.moveTo(paintL.x, paintL.y);
  ctx.lineTo(paintFarL.x, paintFarL.y);
  ctx.moveTo(paintR.x, paintR.y);
  ctx.lineTo(paintFarR.x, paintFarR.y);
  ctx.stroke();
}

function drawThreePointArc(court){
  ctx.strokeStyle = court.line;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  var first = true;
  /* Arc: for angle from -60 to +60 degrees around hoop, at radius 3 */
  for (var deg = -70; deg <= 70; deg += 4){
    var rad = deg * Math.PI / 180;
    var R = 3.2;
    var wx = R * Math.sin(rad);
    var wy = HOOP_Y - R * Math.cos(rad);
    if (wy < 0.3) wy = 0.3;   /* don't go past player */
    var p = project(wx, wy, 0);
    if (first){ ctx.moveTo(p.x, p.y); first = false; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
}

function drawBackboard(){
  /* Four corners of backboard */
  var tl = project(-1.1, 5.4, 4.3);
  var tr = project( 1.1, 5.4, 4.3);
  var bl = project(-1.1, 5.4, 2.5);
  var br = project( 1.1, 5.4, 2.5);

  /* Backboard frame */
  ctx.fillStyle = 'rgba(240,240,240,.95)';
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(br.x, br.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.closePath();
  ctx.fill();

  /* Border */
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3;
  ctx.stroke();

  /* Red square target */
  var tl2 = project(-0.4, 5.4, 3.7);
  var tr2 = project( 0.4, 5.4, 3.7);
  var bl2 = project(-0.4, 5.4, 2.9);
  var br2 = project( 0.4, 5.4, 2.9);
  ctx.strokeStyle = '#e63946';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tl2.x, tl2.y);
  ctx.lineTo(tr2.x, tr2.y);
  ctx.lineTo(br2.x, br2.y);
  ctx.lineTo(bl2.x, bl2.y);
  ctx.closePath();
  ctx.stroke();

  /* Pole (behind backboard) */
  var poleTop = project(0, 6.2, 4.3);
  var poleTopL = project(-0.1, 6.2, 4.3);
  var poleTopR = project( 0.1, 6.2, 4.3);
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(poleTopL.x, poleTopL.y);
  ctx.lineTo(poleTopR.x, poleTopR.y);
  ctx.lineTo(poleTopR.x + 30, poleTopR.y - 40);
  ctx.lineTo(poleTopL.x + 30, poleTopL.y - 40);
  ctx.closePath();
  ctx.fill();
}

function drawNet(){
  /* Net hangs from rim */
  var rimTop = project(0, HOOP_Y, HOOP_Z);
  var netBottom = project(0, HOOP_Y, HOOP_Z - 0.55);

  var rimRx = HOOP_R * 260 * rimTop.s;
  var rimRy = rimRx * 0.28;
  var netRx = rimRx * 0.55;
  var netRy = netRx * 0.28;

  /* Rim ellipse */
  ctx.strokeStyle = '#ff5722';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(rimTop.x, rimTop.y, rimRx, rimRy, 0, 0, Math.PI*2);
  ctx.stroke();

  /* Net - vertical lines */
  var segments = 12;
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 1;
  for (var i=0;i<segments;i++){
    var t = i / segments;
    var angle = t * Math.PI * 2;
    var sx = rimTop.x + Math.cos(angle) * rimRx;
    var sy = rimTop.y + Math.sin(angle) * rimRy;
    var ex = netBottom.x + Math.cos(angle) * netRx;
    var ey = netBottom.y + Math.sin(angle) * netRy;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }

  /* Net horizontal rings */
  var rings = 3;
  for (var r=1; r<=rings; r++){
    var tr = r / (rings + 1);
    var rr = rimRx * (1 - tr * 0.45);
    var ry = rimTop.y + (netBottom.y - rimTop.y) * tr;
    ctx.beginPath();
    ctx.ellipse(rimTop.x, ry, rr, rr * 0.28, 0, 0, Math.PI*2);
    ctx.stroke();
  }

  /* Net bottom ring */
  ctx.beginPath();
  ctx.ellipse(netBottom.x, netBottom.y, netRx, netRy, 0, 0, Math.PI*2);
  ctx.stroke();
}

function drawBall(cx, cy, r, ballColor){
  /* Shadow */
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.arc(cx, cy + r*0.15, r, 0, Math.PI*2);
  ctx.fill();

  /* Ball body */
  var grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
  grad.addColorStop(0, shade(ballColor.body, 0.25));
  grad.addColorStop(0.6, ballColor.body);
  grad.addColorStop(1, shade(ballColor.body, -0.25));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();

  /* Seams */
  ctx.strokeStyle = ballColor.seam;
  ctx.lineWidth = Math.max(1, r * 0.08);
  /* Vertical seam */
  ctx.beginPath();
  ctx.ellipse(cx, cy, r*0.35, r, 0, 0, Math.PI*2);
  ctx.stroke();
  /* Horizontal seam */
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r*0.35, 0, 0, Math.PI*2);
  ctx.stroke();
  /* Two curved seams */
  ctx.beginPath();
  ctx.arc(cx, cy, r*0.85, -Math.PI*0.9, -Math.PI*0.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r*0.85, Math.PI*0.1, Math.PI*0.9);
  ctx.stroke();

  /* Highlight */
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.arc(cx - r*0.35, cy - r*0.35, r*0.28, 0, Math.PI*2);
  ctx.fill();
}

function shade(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(Math.round(((n>>16)&255) + amt*255), 0, 255);
  var g = clamp(Math.round(((n>>8)&255)  + amt*255), 0, 255);
  var b = clamp(Math.round((n&255)        + amt*255), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function buildTournament(){
  var pool = [];
  for (var i=0;i<COUNTRIES.length;i++){
    if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
  }
  for (var s=0;s<pool.length;s++){
    var r = Math.floor(Math.random()*pool.length);
    var tmp = pool[s]; pool[s] = pool[r]; pool[r] = tmp;
  }
  var teams = [getCountry(selCountry)].concat(pool.slice(0, 7));
  var r0 = [];
  for (var q=0;q<8;q+=2) r0.push({ a: teams[q], b: teams[q+1], winner: null, played: false });
  var rounds = [r0,
    [{a:null,b:null,winner:null,played:false},{a:null,b:null,winner:null,played:false}],
    [{a:null,b:null,winner:null,played:false}]];

  tournament = {
    active: true, rounds: rounds,
    userCountry: getCountry(selCountry),
    userMatchRound: 0, userMatchIdx: -1,
    champion: null,
    recordResult: function(userWon){
      var r = this.userMatchRound, i = this.userMatchIdx;
      if (r < 0 || i < 0) return;
      var m = this.rounds[r][i];
      m.winner = userWon ? this.userCountry : (m.a === this.userCountry ? m.b : m.a);
      m.played = true;
      this.simulateRound(r);
      if (r < this.rounds.length - 1){
        this.userMatchRound = r + 1;
        this.userMatchIdx = -1;
        var next = this.rounds[r+1];
        for (var k=0;k<next.length;k++){
          if (next[k].a === this.userCountry || next[k].b === this.userCountry){
            this.userMatchIdx = k; break;
          }
        }
        if (this.userMatchIdx === -1) this.userMatchIdx = 0;
      }
      if (r === this.rounds.length - 1){
        this.champion = m.winner;
        if (this.champion === this.userCountry){
          user.trophies = (user.trophies || 0) + 1;
          user.coins += 500;
          saveGuest();
        }
      }
    },
    simulateRound: function(r){
      var matches = this.rounds[r];
      for (var i=0;i<matches.length;i++){
        var m = matches[i];
        if (m.played) continue;
        if (m.a === this.userCountry || m.b === this.userCountry) continue;
        if (!m.a || !m.b) continue;
        m.winner = Math.random() < 0.5 ? m.a : m.b;
        m.played = true;
      }
      if (r < this.rounds.length - 1){
        var next = this.rounds[r+1];
        for (var j=0;j<matches.length;j++){
          var winner = matches[j].winner;
          var slot = next[Math.floor(j/2)];
          if (j % 2 === 0) slot.a = winner;
          else slot.b = winner;
        }
      }
    }
  };

  var r0check = tournament.rounds[0];
  for (var x=0;x<r0check.length;x++){
    if (r0check[x].a === tournament.userCountry || r0check[x].b === tournament.userCountry){
      tournament.userMatchIdx = x; break;
    }
  }
}

function renderTournament(){
  var body = document.getElementById('bracket-body');
  body.innerHTML = '';
  var rounds = tournament.rounds;
  var titles = ['QUARTER-FINALS','SEMI-FINALS','FINAL'];
  for (var r=0;r<rounds.length;r++){
    var col = document.createElement('div');
    col.className = 'bracket-col';
    var title = document.createElement('div');
    title.className = 'bracket-title';
    title.textContent = titles[r];
    col.appendChild(title);
    for (var i=0;i<rounds[r].length;i++){
      var m = rounds[r][i];
      var el = document.createElement('div');
      el.className = 'bracket-match';
      if (r === tournament.userMatchRound && i === tournament.userMatchIdx && !m.played && !tournament.champion) el.className += ' current';
      else if (m.played) el.className += ' done';
      else if (!m.a || !m.b) el.className += ' locked';
      var nameA = m.a ? m.a.name : 'TBD';
      var nameB = m.b ? m.b.name : 'TBD';
      var winA = (m.winner && m.a === m.winner) ? ' win' : '';
      var winB = (m.winner && m.b === m.winner) ? ' win' : '';
      el.innerHTML =
        '<div class="bm-team' + winA + '">' + nameA + '<span class="code">' + (m.a?m.a.code:'—') + '</span></div>' +
        '<div class="bm-team' + winB + '">' + nameB + '<span class="code">' + (m.b?m.b.code:'—') + '</span></div>';
      col.appendChild(el);
    }
    body.appendChild(col);
  }
  document.getElementById('tour-coins').textContent = Math.floor(user.coins);
  var btn = document.getElementById('btn-next-tour-match');
  if (tournament.champion){
    btn.textContent = '🏆  NEW TOURNAMENT';
    btn.onclick = function(){ buildTournament(); renderTournament(); };
  } else {
    btn.textContent = '▶  PLAY NEXT MATCH';
    btn.onclick = startTournamentMatch;
  }
}

function startTournamentMatch(){
  if (!tournament || tournament.champion) return;
  var m = tournament.rounds[tournament.userMatchRound][tournament.userMatchIdx];
  if (!m || !m.a || !m.b) return;
  var opp = (m.a === tournament.userCountry) ? m.b : m.a;
  newMatch(opp.id);
}

document.getElementById('btn-setup-back').onclick = function(){ buildHome(); screen = 'home'; showScreen('scr-home'); };
document.getElementById('btn-tour-back').onclick = function(){ tournament = null; buildHome(); screen = 'home'; showScreen('scr-home'); };
document.getElementById('btn-start-match').onclick = function(){ newMatch(null); };

};

});
document.getElementById('btn-resume').addEventListener('click', function(){

});

  document.getElementById('hud').classList.add('hidden');

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function resizeApp(){
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

function loop(ts){
  var dt = Math.min(0.05, (ts - lastTS) / 1000 || 0);
  lastTS = ts;
  try {
    if (screen === 'match' && match){
      updateMatch(dt);
      renderMatch();
    } else if (screen === 'home'){
      drawPreview();
    } else {
      ctx.fillStyle = '#0a0510';
      ctx.fillRect(0, 0, 1280, 720);
    }
  } catch (err){
    if (window.console && console.error) console.error('Loop error:', err);
  }
  requestAnimationFrame(loop);
}

document.getElementById('guest-id-display').textContent = user.id;
drawPreview();
requestAnimationFrame(loop);
</script>

function clamp(v,a,b){ if (v<a) return a; if (v>b) return b; return v; }

function shade(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(Math.round(((n>>16)&255) + amt*255), 0, 255);
  var g = clamp(Math.round(((n>>8)&255)  + amt*255), 0, 255);
  var b = clamp(Math.round((n&255)        + amt*255), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

  var court = getCourt(selCourt);

  else {

    countryB = pool[Math.floor(Math.random()*pool.length)];
  }
  var diff = getDiff(diffOverride || selDiff);

  var player = makeBoxer('left', countryA, getKit(user.equipped), SKINS[user.skin], TRUNK_COLORS[user.trunks], GLOVE_COLORS[user.gloves], true);
  var ai = makeBoxer('right', countryB, getKit(user.equipped), SKINS[2], TRUNK_COLORS[2], GLOVE_COLORS[2], false);

  match = {
    court: court,
    countryA: countryA, countryB: countryB,

    player: player,

    roundTimer: ROUND_TIME,

    stateTimer: 3.2,

function fmtTime(secs){
  var s = Math.max(0, Math.ceil(secs));
  var m = Math.floor(s / 60);
  var r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
