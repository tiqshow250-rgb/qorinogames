/* ============================================================
   INPUT — Joystick + Buttons + Keyboard
   ============================================================ */
var joy = { active: false, dx: 0, dy: 0 };
var press = { jab: false, hook: false, upper: false, super: false, block: false };
var heldBlock = false;

/* --- Joystick --- */
var joyEl = document.getElementById('joystick');
var knobEl = document.getElementById('knob');

function joyStart(e){
  if (e.preventDefault) e.preventDefault();
  joy.active = true;
  joyUpdate(e);
  if (joyEl.setPointerCapture) try { joyEl.setPointerCapture(e.pointerId); } catch(err){}
}
function joyUpdate(e){
  var rect = joyEl.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  var dx = (e.clientX - cx) / (rect.width/2);
  var dy = (e.clientY - cy) / (rect.height/2);
  var m = Math.sqrt(dx*dx + dy*dy);
  if (m > 1){ dx /= m; dy /= m; }
  joy.dx = dx;
  joy.dy = dy;
  knobEl.style.transform = 'translate(' + (dx * (rect.width/2 - 40)) + 'px,' + (dy * (rect.height/2 - 40)) + 'px)';
}
function joyEnd(){
  joy.active = false;
  joy.dx = 0;
  joy.dy = 0;
  knobEl.style.transform = 'translate(0,0)';
}
joyEl.addEventListener('pointerdown', joyStart);
window.addEventListener('pointermove', function(e){ if (joy.active) joyUpdate(e); });
window.addEventListener('pointerup', joyEnd);
window.addEventListener('pointercancel', joyEnd);

/* --- Action buttons --- */
function bindTap(id, key){
  var el = document.getElementById(id);
  if (!el) return;
  function down(e){
    if (e.preventDefault) e.preventDefault();
    el.classList.add('active');
    if (screen === 'match' && match && match.state === 'fight'){
      press[key] = true;
    }
  }
  function up(e){
    el.classList.remove('active');
  }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

bindTap('btnJab', 'jab');
bindTap('btnHook', 'hook');
bindTap('btnUpper', 'upper');
bindTap('btnSuper', 'super');

/* Block = hold */
var blockEl = document.getElementById('btnBlock');
blockEl.addEventListener('pointerdown', function(e){
  e.preventDefault();
  blockEl.classList.add('active');
  if (screen === 'match' && match && match.state === 'fight') heldBlock = true;
});
function blockRelease(){ blockEl.classList.remove('active'); heldBlock = false; }
blockEl.addEventListener('pointerup', blockRelease);
blockEl.addEventListener('pointercancel', blockRelease);
blockEl.addEventListener('pointerleave', blockRelease);
blockEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* Keyboard */
window.addEventListener('keydown', function(e){
  if (screen !== 'match' || !match || match.state !== 'fight') return;
  if (e.key === 'j' || e.key === 'J') press.jab = true;
  if (e.key === 'k' || e.key === 'K') press.hook = true;
  if (e.key === 'l' || e.key === 'L') press.upper = true;
  if (e.key === 'u' || e.key === 'U') press.super = true;
  if (e.key === ' '){ e.preventDefault(); heldBlock = true; }
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') joy.dx = -1;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') joy.dx = 1;
});
window.addEventListener('keyup', function(e){
  if (e.key === ' ') heldBlock = false;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') joy.dx = 0;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') joy.dx = 0;
});

/* ============================================================
   PUNCH LOGIC
   ============================================================ */
function startPunch(boxer, type){
  if (boxer.punch !== 'idle') return false;
  if (boxer.stunTimer > 0) return false;
  if (boxer.punchCd > 0) return false;

  if (type === 'upper' && boxer.combo < 3) return false;   /* needs 3-hit combo */
  if (type === 'super' && boxer.super < SUPER_MAX) return false;

  var data = PUNCH_DATA[type];
  boxer.punch = type;
  boxer.punchProgress = 0;
  boxer._hitDone = false;

  if (type === 'upper') boxer.combo = 0;
  if (type === 'super') boxer.super = 0;
  if (boxer.isPlayer) match.stats.punches++;

  return true;
}

function tryPunchHit(attacker, defender){
  if (attacker._hitDone) return;
  var data = PUNCH_DATA[attacker.punch];
  if (!data) return;

  var t = attacker.punchProgress;
  if (t < data.hitWindow[0] || t > data.hitWindow[1]) return;

  var dist = Math.abs(attacker.x - defender.x);
  if (dist > data.range) return;

  /* Outcome */
  var outcome = 'hit';
  if (defender.dodgeTimer > 0) outcome = 'miss';
  else if (defender.blocking) outcome = 'blocked';

  attacker._hitDone = true;

  if (outcome === 'miss'){
    attacker.punch = 'idle';
    attacker.punchProgress = 0;
    attacker.punchCd = 0.22;
    if (attacker.isPlayer) setHint('MISSED');
    return;
  }

  var dmg = HP_PER_HIT;
  if (attacker.punch === 'super') dmg = HP_PER_HIT * SUPER_MULTIPLIER;
  if (attacker.punch === 'hook') dmg = HP_PER_HIT;
  if (attacker.punch === 'upper') dmg = HP_PER_HIT;

  if (outcome === 'blocked'){
    dmg *= 0.25 / defender.kit.def;
    defender.hp -= dmg;
    pushBoxer(defender, data.knockback * 0.35 * (defender.side === 'right' ? 1 : -1));
    attacker.punch = 'idle';
    attacker.punchProgress = 0;
    attacker.punchCd = 0.12;
    /* Small super gain on block */
    if (attacker.isPlayer) attacker.super = Math.min(SUPER_MAX, attacker.super + 4 * attacker.kit.superGain);
    return;
  }

  /* Clean hit */
  dmg = dmg / defender.kit.def;
  defender.hp -= dmg;
  defender.hitFlash = 0.28;
  defender.stunTimer = data.stun;
  pushBoxer(defender, data.knockback * (defender.side === 'right' ? 1 : -1));

  spawnHitParticles(defender.x, 460, attacker.punch === 'super' ? '#ffd166' : '#ffffff', attacker.punch === 'super' ? 20 : 10);
  shake = Math.max(shake, attacker.punch === 'super' ? 22 : (attacker.punch === 'upper' ? 12 : 6));

  if (attacker.isPlayer){
    match.stats.lands++;
    match.stats.damage += dmg;
    attacker.combo++;
    attacker.comboTimer = 2.2;
    if (attacker.combo > match.stats.maxCombo) match.stats.maxCombo = attacker.combo;
    showCombo(attacker.combo);
    attacker.super = Math.min(SUPER_MAX, attacker.super + SUPER_GAIN_PER_HIT * attacker.kit.superGain);
  }

  /* HP hit flash on the bar */
  var barId = defender.side === 'right' ? 'hpBar-b' : 'hpBar-a';
  flashBar(barId);

  attacker.punch = 'idle';
  attacker.punchProgress = 0;
  attacker.punchCd = 0.05;
}

function flashBar(id){
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.add('hit');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('hit'); }, 120);
}

function pushBoxer(b, force){
  b.x += force;
  if (b.x < 200) b.x = 200;
  if (b.x > 1080) b.x = 1080;
}

var shake = 0;
function spawnHitParticles(x, y, color, count){
  count = count || 10;
  for (var i=0;i<count;i++){
    match.particles.push({
      x: x, y: y,
      vx: rnd(-280, 280),
      vy: rnd(-320, -80),
      life: 0.6,
      maxLife: 0.6,
      size: rnd(3, 9),
      color: color
    });
  }
}

function showCombo(n){
  var el = document.getElementById('comboDisplay');
  el.textContent = n + 'x COMBO!';
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 1200);
}

function triggerKOFlash(){
  var el = document.getElementById('koFlash');
  el.classList.add('on');
  setTimeout(function(){ el.classList.remove('on'); }, 200);
}

/* ============================================================
   AI
   ============================================================ */
var aiDecisionTimer = 0;

function updateAI(dt){
  var m = match;
  var ai = m.ai;
  var player = m.player;
  var d = m.diff;

  /* Movement toward player if too far */
  var dist = Math.abs(ai.x - player.x);
  if (dist > 200){
    ai.x += (player.x < ai.x ? -1 : 1) * 100 * d.speed * dt;
  } else if (dist < 90){
    ai.x += (player.x < ai.x ? 1 : -1) * 30 * d.speed * dt;
  }

  aiDecisionTimer -= dt;
  if (aiDecisionTimer > 0) return;
  aiDecisionTimer = 0.30 + Math.random() * 0.35 - d.speed * 0.12;

  /* If player punching, chance to block or dodge */
  if (player.punch !== 'idle' && dist < 150){
    if (Math.random() < d.react * 1.8){
      if (Math.random() < 0.55){
        ai.blocking = true;
        ai.blockTimer = 0.45;
      } else {
        ai.dodgeTimer = 0.35;
      }
      return;
    }
  }
  ai.blocking = false;

  if (dist > 150) return;

  /* Choose attack */
  var r = Math.random();
  if (ai.super >= SUPER_MAX && r < 0.15){
    startPunch(ai, 'super');
    return;
  }
  if (ai.combo >= 3 && r < 0.35){
    startPunch(ai, 'upper');
    return;
  }
  if (r < 0.55){
    startPunch(ai, 'jab');
  } else {
    startPunch(ai, 'hook');
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function updateMatch(dt){
  var m = match;
  if (!m) return;

  if (shake > 0) shake = Math.max(0, shake - dt * 45);

  /* Particles */
  for (var i=m.particles.length-1; i>=0; i--){
    var p = m.particles[i];
    p.life -= dt;
    if (p.life <= 0){ m.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 700 * dt;
  }

  /* KO animation pause */
  if (m.state === 'ko'){
    m.koTimer -= dt;
    m.player.bodyBob += dt * 3;
    m.ai.bodyBob += dt * 3;
    if (m.koTimer <= 0){
      endMatch();
    }
    return;
  }

  /* Countdown */
  if (m.state === 'countdown'){
    m.stateTimer -= dt;
    m.player.bodyBob += dt * 4;
    m.ai.bodyBob += dt * 4;
    if (m.stateTimer <= 0){
      m.state = 'fight';
      setHint('FIGHT!');
      setTimeout(function(){ setHint(''); }, 900);
    }
    return;
  }

  if (m.state !== 'fight') return;

  /* Round timer */
  m.roundTimer -= dt;
  if (m.roundTimer <= 0){
    m.roundTimer = 0;
    /* Time's up — higher HP wins */
    if (m.player.hp > m.ai.hp){
      m.winner = 'player';
    } else if (m.ai.hp > m.player.hp){
      m.winner = 'ai';
    } else {
      m.winner = 'draw';
    }
    m.state = 'ko';
    m.koTimer = 2.0;
    setHint('TIME UP');
    return;
  }

  /* Player input */
  updatePlayerInput(dt);

  /* AI */
  updateAI(dt);

  /* Update punches */
  updatePunch(m.player, m.ai, dt);
  updatePunch(m.ai, m.player, dt);

  /* Timers */
  updateTimers(m.player, dt);
  updateTimers(m.ai, dt);

  /* Movement from joystick (player only) */
  var moveSpeed = 260 * m.player.kit.speed;
  m.player.x += joy.dx * moveSpeed * dt;
  /* Small vertical influence translates to x lean, ignore for 2D */
  m.player.x = clamp(m.player.x, 200, 1080);

  /* Auto-separate */
  var dist = Math.abs(m.player.x - m.ai.x);
  if (dist < 80){
    var push = (80 - dist) * 0.6;
    if (m.player.x < m.ai.x){
      m.player.x -= push * dt * 8;
      m.ai.x += push * dt * 8;
    } else {
      m.player.x += push * dt * 8;
      m.ai.x -= push * dt * 8;
    }
    m.player.x = clamp(m.player.x, 200, 1080);
    m.ai.x = clamp(m.ai.x, 200, 1080);
  }

  /* KO check */
  if (m.player.hp <= 0){
    m.player.hp = 0;
    m.winner = 'ai';
    m.state = 'ko';
    m.koTimer = 2.0;
    triggerKOFlash();
    setHint('KO!');
    return;
  }
  if (m.ai.hp <= 0){
    m.ai.hp = 0;
    m.winner = 'player';
    m.state = 'ko';
    m.koTimer = 2.0;
    triggerKOFlash();
    setHint('K.O.!');
    return;
  }

  /* Bob */
  m.player.bodyBob += dt * 6;
  m.ai.bodyBob += dt * 6;

  updateHUD();
}

function updatePlayerInput(dt){
  var p = match.player;
  if (p.stunTimer > 0) return;

  if (press.jab && startPunch(p, 'jab')) press.jab = false;
  if (press.hook && startPunch(p, 'hook')) press.hook = false;
  if (press.upper && startPunch(p, 'upper')) press.upper = false;
  if (press.super && startPunch(p, 'super')) press.super = false;
  press.jab = press.hook = press.upper = press.super = false;

  p.blocking = heldBlock;
}

function updatePunch(boxer, target, dt){
  if (boxer.punch === 'idle') return;
  var data = PUNCH_DATA[boxer.punch];
  if (!data){ boxer.punch = 'idle'; return; }

  boxer.punchProgress += dt / data.duration;

  if (!boxer._hitDone && boxer.punchProgress >= data.hitWindow[0] && boxer.punchProgress <= data.hitWindow[1]){
    tryPunchHit(boxer, target);
  }

  if (boxer.punchProgress >= 1){
    boxer.punch = 'idle';
    boxer.punchProgress = 0;
    boxer._hitDone = false;
  }
}

function updateTimers(b, dt){
  if (b.punchCd > 0) b.punchCd -= dt;
  if (b.dodgeTimer > 0) b.dodgeTimer -= dt;
  if (b.dodgeCd > 0) b.dodgeCd -= dt;
  if (b.stunTimer > 0) b.stunTimer -= dt;
  if (b.hitFlash > 0) b.hitFlash -= dt;
  if (b.comboTimer > 0){
    b.comboTimer -= dt;
    if (b.comboTimer <= 0) b.combo = 0;
  }
  if (b.blockTimer > 0){
    b.blockTimer -= dt;
    if (b.blockTimer <= 0) b.blocking = false;
  }
}

/* ============================================================
   END MATCH
   ============================================================ */
function endMatch(){
  if (!match) return;
  var m = match;
  var win = m.winner === 'player';
  var draw = m.winner === 'draw';

  user.matches = (user.matches || 0) + 1;
  if (win){
    user.wins = (user.wins || 0) + 1;
    user.coins += 100;
    if (m.ai.hp <= 0) user.kos = (user.kos || 0) + 1;
  } else if (!draw){
    user.losses = (user.losses || 0) + 1;
  }
  saveGuest();

  document.getElementById('res-loc').textContent = m.court.name.toUpperCase();
  var o = document.getElementById('res-outcome');
  o.textContent = win ? 'VICTORY' : (draw ? 'DRAW' : 'DEFEAT');
  o.className = 'res-outcome' + (win || draw ? '' : ' loss');
  var scoreTxt = '';
  if (m.ai.hp <= 0) scoreTxt = 'K.O.!';
  else if (m.player.hp <= 0) scoreTxt = 'KO — LOST';
  else scoreTxt = Math.ceil(m.player.hp) + ' HP vs ' + Math.ceil(m.ai.hp) + ' HP';
  document.getElementById('res-score').textContent = scoreTxt;
  document.getElementById('res-teams').textContent =
    m.countryA.name.toUpperCase() + '  vs  ' + m.countryB.name.toUpperCase();
  document.getElementById('res-punches').textContent = m.stats.punches;
  document.getElementById('res-lands').textContent = m.stats.lands;
  document.getElementById('res-damage').textContent = Math.round(m.stats.damage);

  var r = document.getElementById('res-reward');
  if (win){ r.textContent = '+100 🪙  Victory!'; r.className = 'reward'; }
  else { r.textContent = 'No reward — win to earn coins.'; r.className = 'reward none'; }

  if (tournament && tournament.active) tournament.recordResult(win);

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
}

/* ============================================================
   RENDER
   ============================================================ */
function renderMatch(){
  if (!match) return;
  var m = match;
  var court = m.court;

  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  /* Sky */
  var sky = ctx.createLinearGradient(0, 0, 0, 720);
  sky.addColorStop(0, court.bg);
  sky.addColorStop(1, shade(court.bg, 0.12));
  ctx.fillStyle = sky;
  ctx.fillRect(-40, -40, 1360, 800);

  /* Crowd dots */
  for (var cy = 30; cy < 260; cy += 16){
    for (var cx = 20; cx < 1260; cx += 22){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.03 + Math.random()*0.06) + ')';
      ctx.fillRect(cx, cy, 4, 4);
    }
  }

  /* Arena floor */
  var floorY = 620;
  ctx.fillStyle = shade(court.canvas, -0.20);
  ctx.fillRect(-40, floorY, 1360, 140);

  /* Octagon floor */
  var ringX1 = 140, ringX2 = 1140;
  var ringY1 = 440;
  ctx.fillStyle = court.canvas;
  ctx.beginPath();
  ctx.moveTo(ringX1, floorY);
  ctx.lineTo(ringX2, floorY);
  ctx.lineTo(ringX2 - 70, ringY1);
  ctx.lineTo(ringX1 + 70, ringY1);
  ctx.closePath();
  ctx.fill();

  /* Canvas texture */
  ctx.strokeStyle = 'rgba(0,0,0,.10)';
  ctx.lineWidth = 1;
  for (var py = ringY1 + 10; py < floorY; py += 15){
    ctx.beginPath(); ctx.moveTo(ringX1, py); ctx.lineTo(ringX2, py); ctx.stroke();
  }

  /* Cage fence */
  drawCage(court, ringX1, ringX2, ringY1, floorY);

  /* Corner posts */
  drawCornerPost(ringX1 + 15, ringY1, floorY, court);
  drawCornerPost(ringX2 - 15, ringY1, floorY, court);

  /* Shadows */
  var groundY = 600;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(m.player.x, groundY + 5, 55, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(m.ai.x, groundY + 5, 55, 10, 0, 0, Math.PI*2); ctx.fill();

  /* Boxers */
  drawBoxer(m.player, 1, groundY);
  drawBoxer(m.ai, -1, groundY);

  /* Particles */
  for (var i=0;i<m.particles.length;i++){
    var p = m.particles[i];
    var a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* Countdown overlay */
  if (m.state === 'countdown'){
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (m.stateTimer > 0.5){
      var n = Math.ceil(m.stateTimer - 0.5);
      ctx.fillStyle = '#ff9f1c';
      ctx.font = 'bold 200px system-ui,sans-serif';
      ctx.fillText(n, 640, 360);
    } else {
      ctx.fillStyle = '#ff3b3b';
      ctx.font = 'bold 150px system-ui,sans-serif';
      ctx.fillText('FIGHT!', 640, 360);
    }
    ctx.textBaseline = 'alphabetic';
  }

  /* KO overlay */
  if (m.state === 'ko'){
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var koText = m.winner === 'player' ? 'K.O.!' : (m.winner === 'ai' ? 'DEFEAT' : 'DRAW');
    var koColor = m.winner === 'player' ? '#ffd166' : '#ff3b3b';
    ctx.fillStyle = koColor;
    ctx.font = 'bold 180px system-ui,sans-serif';
    ctx.shadowColor = 'rgba(255,209,102,.8)';
    ctx.shadowBlur = 40;
    ctx.fillText(koText, 640, 360);
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
  }

  ctx.restore();
}

function drawCage(court, x1, x2, y1, y2){
  /* Cage mesh — diamond pattern */
  ctx.strokeStyle = 'rgba(200,200,200,.35)';
  ctx.lineWidth = 1.2;

  /* Vertical lines */
  for (var x = x1; x <= x2; x += 26){
    ctx.beginPath();
    ctx.moveTo(x, y1 - 20);
    ctx.lineTo(x, y2);
    ctx.stroke();
  }
  /* Horizontal lines */
  for (var y = y1 - 20; y <= y2; y += 22){
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
  }
  /* Diagonal cross-hatch effect */
  ctx.strokeStyle = 'rgba(150,150,150,.15)';
  for (var xx = x1 - 100; xx <= x2; xx += 26){
    ctx.beginPath();
    ctx.moveTo(xx, y1 - 20);
    ctx.lineTo(xx + 100, y2);
    ctx.stroke();
  }

  /* Cage top rail */
  ctx.strokeStyle = court.rope;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x1, y1 - 20);
  ctx.lineTo(x2, y1 - 20);
  ctx.stroke();

  /* Cage bottom rail */
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x1, y2);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawCornerPost(x, y1, y2, court){
  ctx.fillStyle = '#2a1a1a';
  ctx.fillRect(x - 10, y1 - 30, 20, y2 - y1 + 40);
  ctx.fillStyle = court.rope;
  ctx.fillRect(x - 10, y1 - 30, 20, 22);
  ctx.fillStyle = '#5a2a2a';
  ctx.fillRect(x - 15, y1 - 40, 30, 14);
}

function drawBoxer(b, facing, groundY){
  var x = b.x;
  var y = groundY;
  var bob = Math.sin(b.bodyBob) * 4;
  if (b.stunTimer > 0) bob += 8;
  if (b.hitFlash > 0) bob -= 4;

  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(facing, 1);

  /* Legs */
  var legSpread = 22;
  ctx.strokeStyle = b.skin;
  ctx.lineWidth = 22;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -80); ctx.lineTo(-legSpread, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, -80); ctx.lineTo(legSpread, 0); ctx.stroke();

  /* Shoes */
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-legSpread - 5, 6, 14, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(legSpread + 5, 6, 14, 7, 0, 0, Math.PI*2); ctx.fill();

  /* Trunks */
  ctx.fillStyle = b.trunks;
  ctx.fillRect(-22, -130, 44, 55);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(-22, -130, 44, 8);
  ctx.fillStyle = shade(b.trunks, -0.30);
  ctx.fillRect(-22, -135, 44, 8);

  /* Torso */
  ctx.fillStyle = b.skin;
  ctx.beginPath();
  ctx.moveTo(-24, -132);
  ctx.lineTo(-22, -220);
  ctx.quadraticCurveTo(0, -235, 22, -220);
  ctx.lineTo(24, -132);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = shade(b.skin, -0.12);
  ctx.beginPath();
  ctx.ellipse(0, -180, 20, 30, 0, 0, Math.PI*2);
  ctx.fill();

  /* Head */
  var headBob = 0;
  if (b.stunTimer > 0) headBob = Math.sin(Date.now() / 40) * 4;

  ctx.fillStyle = b.skin;
  ctx.fillRect(-8, -238, 16, 20);
  ctx.beginPath();
  ctx.arc(0, -258 + headBob, 24, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = shade(b.skin, -0.15);
  ctx.beginPath();
  ctx.ellipse(6, -258 + headBob, 8, 16, 0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(11, -262 + headBob, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ff9f1c';
  ctx.fillRect(8, -250 + headBob, 12, 4);

  /* Arms */
  drawArms(b);

  /* Hit flash */
  if (b.hitFlash > 0){
    ctx.globalAlpha = b.hitFlash * 3;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -258, 24, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  /* Super aura */
  if (b.super >= SUPER_MAX){
    ctx.strokeStyle = 'rgba(255,209,102,' + (0.55 + 0.35 * Math.sin(Date.now()/110)) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(b.x, y - 130, 110, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,159,28,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x, y - 130, 120, 0, Math.PI*2);
    ctx.stroke();
  }
  /* Combo aura */
  else if (b.combo >= 3){
    ctx.strokeStyle = 'rgba(255,209,102,' + (0.4 + 0.3 * Math.sin(Date.now()/140)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, y - 130, 85 + b.combo * 3, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawArms(b){
  var isPunching = b.punch !== 'idle';
  var prog = b.punchProgress;

  var guardL = { hand: { x: 30, y: -215 } };
  var guardR = { hand: { x: 34, y: -230 } };

  if (b.blocking){
    guardL.hand = { x: 22, y: -235 };
    guardR.hand = { x: 26, y: -245 };
  }

  var punchExtend = 0;
  if (isPunching){
    punchExtend = Math.sin(prog * Math.PI);
  }

  drawArm(b, guardL, 0.7);
  drawArm(b, guardR, 1.0, isPunching ? punchExtend : 0);
}

function drawArm(b, guard, alpha, punchExtend){
  punchExtend = punchExtend || 0;
  var shoulder = { x: 0, y: -220 };
  var hand = {
    x: guard.hand.x + punchExtend * 80,
    y: guard.hand.y + (b.punch === 'upper' ? -25 * punchExtend : 5 * punchExtend)
  };
  if (b.punch === 'hook') hand.y += 10 * punchExtend;
  if (b.punch === 'super') hand.x += punchExtend * 40;

  var elbow = {
    x: (shoulder.x + hand.x) / 2 + 5,
    y: (shoulder.y + hand.y) / 2 + 10
  };

  ctx.globalAlpha = alpha;
  ctx.strokeStyle = b.skin;
  ctx.lineWidth = 20;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(shoulder.x, shoulder.y);
  ctx.lineTo(elbow.x, elbow.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(elbow.x, elbow.y);
  ctx.lineTo(hand.x, hand.y);
  ctx.stroke();

  /* Glove */
  ctx.fillStyle = b.gloves;
  ctx.beginPath();
  ctx.arc(hand.x, hand.y, 17, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.arc(hand.x - 5, hand.y - 5, 7, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = shade(b.gloves, -0.3);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(hand.x, hand.y, 17, 0, Math.PI*2);
  ctx.stroke();

  /* Super glow on glove */
  if (b.punch === 'super' && punchExtend > 0.4){
    ctx.strokeStyle = 'rgba(255,209,102,' + (punchExtend) + ')';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(hand.x, hand.y, 26, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
}

/* ============================================================
   PREVIEW
   ============================================================ */
var prevCanvas = document.getElementById('prev');
var prevCtx = prevCanvas.getContext('2d');
var prevBob = 0;

function drawPreview(){
  var g = prevCtx;
  g.clearRect(0, 0, 380, 440);
  var grd = g.createRadialGradient(190, 240, 30, 190, 240, 240);
  grd.addColorStop(0, 'rgba(255,59,59,.20)');
  grd.addColorStop(1, 'rgba(255,59,59,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 380, 440);

  var savedCtx = ctx;
  ctx = g;
  var b = {
    x: 190, y: 380,
    skin: SKINS[user.skin],
    trunks: TRUNK_COLORS[user.trunks],
    gloves: GLOVE_COLORS[user.gloves],
    punch: 'idle', punchProgress: 0,
    blocking: false, dodgeTimer: 0, stunTimer: 0, hitFlash: 0,
    combo: 0, super: 0, bodyBob: prevBob, side: 'left', isPlayer: true
  };
  g.save();
  g.scale(1.3, 1.3);
  g.translate(-30, -30);
  drawBoxer(b, 1, 380);
  g.restore();
  ctx = savedCtx;
  prevBob += 0.05;
}

function buildHome(){

function buildShop(){

};
document.getElementById('btn-shop').onclick = function(){

};

};

};

});

});

  document.getElementById('controls').classList.add('hidden');
});

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function resizeApp(){
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

function loop(ts){
  var dt = Math.min(0.05, (ts - lastTS) / 1000 || 0);
  lastTS = ts;
  try {
    if (screen === 'match' && match){
      updateMatch(dt);
      renderMatch();
      updateHUD();
    } else if (screen === 'home'){
      drawPreview();
    } else {
      ctx.fillStyle = '#0a0508';
      ctx.fillRect(0, 0, 1280, 720);
    }
  } catch (err){
    if (window.console && console.error) console.error('Loop error:', err);
  }
  requestAnimationFrame(loop);
}

document.getElementById('guest-id-display').textContent = user.id;
drawPreview();
requestAnimationFrame(loop);
</script>

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function mod(n,m){ return ((n%m)+m)%m; }
function hashStr(s){
  var h = 5381;
  for (var i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))>>>0;
  return h;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shadeHex(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1), 16);

  var g = clamp(Math.round(((n>>8)&255)  + amt*255), 0, 255);

  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

  r = Math.min(r, w/2, h/2);

  g.moveTo(x+r,y);

}

/* =========================================================
   RUNNER DRAWING (360°)
   ========================================================= */
function drawRunner(g, sx, sy, ppm, r){
  var viewAngle = r.viewAngle || 0;
  var depth = Math.cos(viewAngle);
  var absDepth = Math.max(0.16, Math.abs(depth));
  var isBack = depth < 0;

  var B = getBundle(r.bundleId || 'starter');
  var skin  = SKINS[r.skinIdx != null ? r.skinIdx : 0] || SKINS[0];
  var hairC = HAIRS[r.hairIdx != null ? r.hairIdx : 0] || HAIRS[0];
  var style = HAIR_STYLES[r.styleIdx != null ? r.styleIdx : 0] || 'ponytail';
  var phase = r.phase || 0;
  var lean  = r.lean  || 0;

  g.save();
  g.translate(sx, sy);
  g.scale(ppm * absDepth, ppm);
  g.rotate(-lean);
  g.lineCap = 'round';
  g.lineJoin = 'round';

  function lift(v){ return Math.max(0, v); }

  /* back leg */
  {
    var ph = phase + Math.PI;
    var s = Math.sin(ph), c = Math.cos(ph);
    var lf = lift(c);
    var fx = s*0.26, fy = -lf*0.22;
    var kx = fx*0.45 + 0.05, ky = -0.42 + lf*0.03;
    g.strokeStyle = shadeHex(B.pants,-0.18);
    g.lineWidth = 0.155;
    g.beginPath(); g.moveTo(0,-0.85); g.lineTo(kx,ky); g.lineTo(fx, fy-0.035); g.stroke();
    g.fillStyle = shadeHex(B.shoe,-0.22);
    g.beginPath(); g.ellipse(fx+0.055, fy-0.03, 0.135, 0.058, 0, 0, 7); g.fill();
  }

  /* torso */
  g.fillStyle = B.shirt;
  g.beginPath();
  g.moveTo(-0.175,-0.78);
  g.quadraticCurveTo(-0.215,-1.08,-0.185,-1.34);
  g.quadraticCurveTo(0,-1.45, 0.185,-1.34);
  g.quadraticCurveTo(0.215,-1.08, 0.175,-0.78);
  g.closePath(); g.fill();

  g.fillStyle = shadeHex(B.pants,0.06);
  g.beginPath();
  g.moveTo(-0.178,-0.80); g.lineTo(0.178,-0.80); g.lineTo(0.168,-0.92); g.lineTo(-0.168,-0.92);
  g.closePath(); g.fill();

  /* back arm */
  {
    var ph2 = phase + Math.PI;
    var s2 = Math.sin(ph2);
    var ex = s2*0.30 + 0.04, ey = -1.05 + Math.abs(s2)*0.05;
    var mx = 0.04 + (ex-0.04)*0.5, my = -1.22;
    g.strokeStyle = shadeHex(skin,-0.18);
    g.lineWidth = 0.105;
    g.beginPath(); g.moveTo(0.01,-1.31); g.lineTo(mx,my); g.lineTo(ex,ey); g.stroke();
  }

  /* neck + head */
  g.fillStyle = skin;
  g.fillRect(-0.048,-1.48,0.096,0.13);
  g.beginPath(); g.arc(0.02,-1.585,0.145,0,7); g.fillStyle = skin; g.fill();

  if (style === 'long' || style === 'ponytail'){
    g.fillStyle = shadeHex(hairC,-0.12);
    g.beginPath();
    g.ellipse(style==='long' ? -0.10 : -0.13, -1.53, style==='long'?0.085:0.065, 0.17, 0.15, 0, 7);
    g.fill();
  }
  if (style === 'bun'){
    g.fillStyle = shadeHex(hairC,-0.12);
    g.beginPath(); g.arc(-0.11,-1.70,0.085,0,7); g.fill();
  }

  if (isBack){
    g.fillStyle = hairC;
    g.beginPath(); g.arc(0.02,-1.585,0.148,0,7); g.fill();
    g.fillStyle = shadeHex(hairC, 0.12);
    g.beginPath();
    g.arc(-0.02,-1.60,0.10, Math.PI*1.1, Math.PI*1.7);
    g.lineTo(-0.02,-1.60); g.fill();
    if (style === 'ponytail'){
      g.fillStyle = shadeHex(hairC,-0.05);
      g.beginPath(); g.ellipse(0.02,-1.44,0.055,0.14,0,0,7); g.fill();
    }
  } else {
    g.fillStyle = hairC;
    g.beginPath(); g.arc(0.02,-1.60,0.152, Math.PI*0.98, Math.PI*2.12); g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(-0.11,-1.60);
    g.quadraticCurveTo(0.02,-1.72, 0.15,-1.58);
    g.quadraticCurveTo(0.06,-1.66, -0.11,-1.60);
    g.fill();
    g.fillStyle = '#1a1a1a';
    g.beginPath(); g.arc(0.105,-1.575,0.021,0,7); g.fill();
  }

  /* accessories */
  if (B.acc === 'cap'){
    g.fillStyle = shadeHex(B.shirt,-0.25);
    g.beginPath(); g.arc(0.02,-1.635,0.15,Math.PI,Math.PI*2); g.closePath(); g.fill();
    if (isBack){
      g.fillStyle = shadeHex(B.shirt,-0.35);
      g.beginPath(); g.arc(0.02,-1.635,0.152,Math.PI*1.05,Math.PI*1.95); g.closePath(); g.fill();
    } else g.fillRect(0.02,-1.645,0.235,0.045);
  } else if (B.acc === 'visor'){
    if (isBack){
      g.fillStyle = shadeHex(B.shirt,-0.2);
      g.fillRect(-0.14,-1.62,0.30,0.045);
    } else {
      g.fillStyle = 'rgba(30,220,255,.85)';
      g.beginPath(); g.arc(0.02,-1.615,0.152,Math.PI*1.02,Math.PI*1.98); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,.35)';
      g.fillRect(-0.12,-1.63,0.12,0.03);
    }
  } else if (B.acc === 'headband'){
    g.fillStyle = B.shoe; g.fillRect(-0.14,-1.645,0.30,0.052);
  } else if (B.acc === 'crown'){
    g.fillStyle = '#ffd166';
    g.beginPath();
    g.moveTo(-0.13,-1.68); g.lineTo(-0.09,-1.80); g.lineTo(-0.03,-1.72);
    g.lineTo(0.03,-1.82); g.lineTo(0.09,-1.72); g.lineTo(0.14,-1.80);
    g.lineTo(0.16,-1.66); g.closePath(); g.fill();
  } else if (B.acc === 'flower' && !isBack){
    g.fillStyle = '#ff6b9d';
    for (var i=0;i<5;i++){
      var a = i/5*Math.PI*2;
      g.beginPath(); g.arc(0.13+Math.cos(a)*0.045, -1.68+Math.sin(a)*0.045, 0.035, 0, 7); g.fill();
    }
    g.fillStyle = '#ffe066';
    g.beginPath(); g.arc(0.13,-1.68,0.028,0,7); g.fill();
  }

  /* front arm */
  {
    var ph3 = phase;
    var s3 = Math.sin(ph3);
    var ex2 = s3*0.30 + 0.04, ey2 = -1.05 + Math.abs(s3)*0.05;
    var mx2 = 0.04 + (ex2-0.04)*0.5, my2 = -1.22;
    g.strokeStyle = skin; g.lineWidth = 0.11;
    g.beginPath(); g.moveTo(0.01,-1.31); g.lineTo(mx2,my2); g.lineTo(ex2,ey2); g.stroke();
    g.strokeStyle = B.shirt; g.lineWidth = 0.155;
    g.beginPath(); g.moveTo(0.01,-1.31); g.lineTo(0.01+(mx2-0.01)*0.5, -1.31+(my2+1.31)*0.5); g.stroke();
    g.fillStyle = skin;
    g.beginPath(); g.arc(ex2,ey2,0.055,0,7); g.fill();
  }

  /* front leg */
  {
    var ph4 = phase;
    var s4 = Math.sin(ph4), c4 = Math.cos(ph4);
    var lf4 = lift(c4);
    var fx4 = s4*0.26, fy4 = -lf4*0.22;
    var kx4 = fx4*0.45 + 0.05, ky4 = -0.42 + lf4*0.03;
    g.strokeStyle = B.pants; g.lineWidth = 0.16;
    g.beginPath(); g.moveTo(0,-0.85); g.lineTo(kx4,ky4); g.lineTo(fx4, fy4-0.035); g.stroke();
    g.fillStyle = B.shoe;
    g.beginPath(); g.ellipse(fx4+0.06, fy4-0.03, 0.14, 0.06, 0, 0, 7); g.fill();
  }

  g.restore();
}

function wheel(g,x,y,r){
  g.fillStyle = '#151515'; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  g.fillStyle = '#9a9a9a'; g.beginPath(); g.arc(x,y,r*0.42,0,7); g.fill();
}
function drawVehicle(g, sx, sy, ppm, v){
  g.save(); g.translate(sx, sy); g.scale(ppm, ppm);
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(0, 0.03, v.len*0.5, 0.16, 0, 0, 7); g.fill();
  switch(v.type){
    case 'bus': drawBus(g,v); break;
    case 'truck': drawTruck(g,v); break;
    case 'car': drawCar(g,v); break;
    case 'cng': drawCNG(g,v); break;
    case 'rickshaw': drawRickshaw(g,v); break;
    case 'bike': drawBike(g,v); break;
  }
  g.restore();
}
function drawBus(g,v){
  var L = v.len, Hh = 3.0;
  g.fillStyle = v.c1; rr(g,-L/2,-Hh,L,Hh-0.42,0.32); g.fill();
  g.fillStyle = v.c2; g.fillRect(-L/2, -1.0, L, 0.52);
  g.fillStyle = shadeHex(v.c1,-0.22); g.fillRect(-L/2+0.25,-Hh-0.14, L-0.5, 0.22);
  g.fillStyle = '#cfeaf7';
  var n = 6, seg = (L-1.4)/n;
  for (var i=0;i<n;i++) g.fillRect(-L/2+0.7+i*seg, -Hh+0.52, seg-0.32, 0.92);
  g.fillStyle = '#0e1a24'; g.fillRect(-L/2+0.4,-1.7,0.7,0.55);
  wheel(g,-L/2+2.0,-0.5,0.5); wheel(g, L/2-2.0,-0.5,0.5); wheel(g,-L/2+3.4,-0.5,0.5);
}
function drawTruck(g,v){
  var L = v.len, Hh = 2.9;
  g.fillStyle = shadeHex(v.c1,-0.15); rr(g,-L/2,-Hh,L*0.62,Hh-0.45,0.22); g.fill();
  g.fillStyle = v.c1; rr(g,-L/2+L*0.60,-Hh*0.92,L*0.42,Hh*0.92-0.45,0.22); g.fill();
  g.fillStyle = '#b8dcf0'; g.fillRect(-L/2+L*0.66,-Hh*0.85,L*0.28,0.85);

  wheel(g,-L/2+1.5,-0.5,0.52); wheel(g, L/2-1.4,-0.5,0.52);
}
function drawCar(g,v){

function makeBuildings(seed, baseY, hMul){
  var rng = mulberry32(seed);
  var arr = [], x = 0;
  while (x < 3200){
    var w = 55 + rng()*120;
    var h = (70 + rng()*140) * hMul;
    arr.push({
      x: x, w: w, h: h,
      tone: (rng()-0.5)*0.30,
      lit: rng(),
      cols: Math.max(2, Math.floor(w/24)),
      rows: Math.max(2, Math.floor(h/30)),
      seed: rng()
    });
    x += w + 6 + rng()*34;
  }
  return arr;
}
var defaultFar = makeBuildings(1337, 300, 0.55);
var defaultMid = makeBuildings(9021, 300, 1.0);

function drawSkyline(g, arr, par, baseY, colorHex, camX){
  var off = -mod(camX*par, 3200);
  for (var rep=0; rep<2; rep++){
    for (var bi=0; bi<arr.length; bi++){
      var b = arr[bi];
      var x = b.x + off + rep*3200;
      if (x < -260 || x > W+260) continue;
      g.fillStyle = shadeHex(colorHex, b.tone);
      g.fillRect(x, baseY-b.h, b.w, b.h);
      g.fillStyle = shadeHex(colorHex, b.tone-0.12);
      g.fillRect(x, baseY-b.h, b.w, 4);
      if (b.lit > 0.25){
        var rng = mulberry32(Math.floor(b.seed*100000));
        var cw = b.w/b.cols, ch = b.h/b.rows;
        for (var r=1;r<b.rows;r++){
          for (var cc=0;cc<b.cols;cc++){
            if (rng() > 0.55){
              g.fillStyle = rng() > 0.5 ? 'rgba(255,225,150,.5)' : 'rgba(180,220,255,.35)';
              g.fillRect(x + cc*cw + cw*0.25, baseY - b.h + r*ch + ch*0.2, cw*0.5, ch*0.42);
            }
          }
        }
      }
    }
  }
}

function drawVerticalMarker(g, worldX, color, camX, checkered){

  grd.addColorStop(1, 'rgba(255,255,255,0)');

    for (var y = ROAD_TOP; y < ROAD_BOT; y += size){
      for (var k=0;k<2;k++){
        var idx = Math.floor((y-ROAD_TOP)/size) + k;
        g.fillStyle = (idx % 2 === 0) ? '#ffffff' : '#1b1b1b';
        g.fillRect(sx - size + k*size, y, size, size);
      }
    }
  }
}

var VEH_TYPES = [
  {type:'bus',      len:11.0, w:2, speed:[1.4,3.2], c1:['#1f7a3f','#c0392b','#2b6cb0'], c2:['#f4d35e','#f7f7f7','#e8eef5']},
  {type:'truck',    len:8.0,  w:1, speed:[1.4,2.8], c1:['#d97706','#0e7490','#7c3aed'], c2:['#3f3f46','#f1f5f9','#fbbf24']},
  {type:'car',      len:4.2,  w:4, speed:[2.8,5.5], c1:['#e63946','#457b9d','#f1faee','#2a9d8f','#e9c46a','#8d99ae'], c2:['#a8dadc']},
  {type:'cng',      len:2.6,  w:3, speed:[2.2,4.6], c1:['#1faa59','#16a34a','#15803d'], c2:['#0f172a']},
  {type:'rickshaw', len:2.4,  w:3, speed:[0.9,2.2], c1:['#c0392b','#e07a5f','#2a9d8f'], c2:['#f4a261','#e63946','#ffd166','#457b9d']},
  {type:'bike',     len:1.9,  w:2, speed:[3.5,6.5], c1:['#e11d48','#0ea5e9','#111827'], c2:['#f59e0b']}
];
var VEH_WEIGHT = 0;
for (var vt=0; vt<VEH_TYPES.length; vt++) VEH_WEIGHT += VEH_TYPES[vt].w;
function pickVehicleType(){
  var r = Math.random()*VEH_WEIGHT;
  for (var i=0;i<VEH_TYPES.length;i++){
    r -= VEH_TYPES[i].w;
    if (r <= 0) return VEH_TYPES[i];
  }
  return VEH_TYPES[2];
}
function generateTraffic(loc){
  var list = [];
  var dens = loc.dens;
  for (var lane=0; lane<LANES; lane++){
    var x = 34 + Math.random()*24;
    while (x < RACE_LEN + 60){
      var t = pickVehicleType();
      var c1 = t.c1[Math.floor(Math.random()*t.c1.length)];
      var c2 = t.c2[Math.floor(Math.random()*t.c2.length)];
      list.push({
        lane: lane, x: x, type: t.type, len: t.len,
        speed: t.speed[0] + Math.random()*(t.speed[1]-t.speed[0]),
        c1: c1, c2: c2
      });
      x += t.len + (10 + Math.random()*38)/dens;
    }
  }
  return list;
}

/* =========================================================
   RACE
   ========================================================= */
function startRace(cityId, areaId){
  var loc = getRaceLocation(cityId, areaId);
  var seed = hashStr(loc.id);
  var skyFar = makeBuildings(seed ^ 0x1234, 300, 0.55);
  var skyMid = makeBuildings(seed ^ 0x5678, 300, 1.0);

  var aiLanes = [0,1,2,3,5,6,7,8,9];

  var player = {
    isPlayer:true, name: user.id,
    lane: 4, laneTarget: 4, x: 0, speed: 0, phase: 0,
    stun: 0, finishTime: null, place: null,
    bundleId: user.equipped, skinIdx: user.skin, hairIdx: user.hair, styleIdx: user.style || 0,
    lean: 0
  };

  var ai = [];
  for (var k=0;k<aiLanes.length;k++){
    var ln = aiLanes[k];
    var bid = BUNDLES[1 + Math.floor(Math.random()*(BUNDLES.length-1))].id;
    ai.push({
      isPlayer:false, name: AI_NAMES[k] || ('Runner '+(k+1)),
      lane: ln, laneTarget: ln, x: 0, speed: 0,
      phase: Math.random()*6.28,
      stun: 0, finishTime: null, place: null,
      base: 6.8 + Math.random()*2.3,
      seed: Math.random()*100,
      laneTimer: 0,
      bundleId: bid,
      skinIdx: Math.floor(Math.random()*SKINS.length),
      hairIdx: Math.floor(Math.random()*HAIRS.length),
      styleIdx: Math.floor(Math.random()*HAIR_STYLES.length),
      lean: 0
    });
  }

  var vehicles = generateTraffic(loc);
  var byLane = [];
  for (var l=0;l<LANES;l++) byLane.push([]);
  for (var vi=0; vi<vehicles.length; vi++) byLane[vehicles[vi].lane].push(vehicles[vi]);
  for (var la=0; la<byLane.length; la++) byLane[la].sort(function(a,b){ return a.x-b.x; });

  race = {
    loc: loc,
    skyFar: skyFar, skyMid: skyMid,
    runners: [player].concat(ai),
    player: player, ai: ai,
    vehicles: vehicles, byLane: byLane,
    t: 0, countdown: 3.6, state: 'countdown', cameraX: -9,
    resultShown: false
  };
}

function findBlocker(r){
  var lane = Math.round(r.lane);
  var arr = race.byLane[lane];
  if (!arr) return null;
  var look = 5 + r.speed*0.45;
  for (var i=0;i<arr.length;i++){
    var v = arr[i];
    var d = v.x - r.x;
    if (d > 0.4 && d < look && v.speed < r.speed - 0.3) return v;
  }
  return null;
}
function laneClear(lane, x, range){
  var arr = race.byLane[lane];
  if (!arr) return true;
  for (var i=0;i<arr.length;i++){
    var v = arr[i];
    var d = v.x - x;
    if (d > -v.len*0.5 - 1.5 && d < range) return false;
  }
  return true;
}
function updateAI(r, dt){
  r.laneTimer -= dt;
  var blocker = findBlocker(r);
  if (blocker){
    if (r.laneTimer <= 0){
      var opts = [Math.round(r.lane)-1, Math.round(r.lane)+1].filter(function(l){ return l>=0 && l<LANES; });
      opts.sort(function(){ return Math.random()-0.5; });
      for (var i=0;i<opts.length;i++){
        var l = opts[i];
        if (laneClear(l, r.x, 10 + r.speed*0.6)){ r.laneTarget = l; r.laneTimer = 0.8; break; }
      }
    }
    if (Math.round(r.lane) === blocker.lane){
      var d = blocker.x - r.x;
      if (d < 4.5) r.speed = Math.min(r.speed, blocker.speed*0.92);
    }
  }
  var target = r.base * (1 + 0.045*Math.sin(race.t*0.6 + r.seed));
  if (r.x > 300) target *= 0.96;
  if (r.stun > 0){ r.stun -= dt; target = 0.6; }
  var accel = target > r.speed ? 5.5 : 12;
  r.speed += clamp(target - r.speed, -accel*dt, accel*dt);
  r.lane = lerp(r.lane, r.laneTarget, 1-Math.pow(0.0008, dt));
  r.x += r.speed*dt;
  r.phase += (r.speed*1.1 + 2.5) * dt * 2.2;
  r.lean = clamp(r.speed/14, 0, 0.24);
}
function updatePlayer(dt){
  var p = race.player;
  if (p.stun > 0){
    p.stun -= dt;
    p.speed = lerp(p.speed, 0.4, dt*5);
  } else {
    var target;
    if (ctrl.stop) target = 0;
    else if (ctrl.left) target = Math.max(1.0, MODES[ctrl.mode]*0.32);
    else if (ctrl.right) target = MODES[ctrl.mode];
    else target = MODES[ctrl.mode]*0.82;

    if (ctrl.mode === 'boost' && ctrl.right && !ctrl.stop && p.speed > 5){
      var cost = BOOST_COST*dt;
      if (user.coins > 0) user.coins = Math.max(0, user.coins - cost);
      if (user.coins <= 0){ ctrl.mode = 'run'; updateModeButtons(); }
    }
    var accel = target > p.speed ? 11 : 15;
    p.speed += clamp(target - p.speed, -accel*dt, accel*dt);
  }
  p.x += p.speed*dt;
  p.phase += (p.speed*1.15 + 2.5) * dt * 2.2;
  p.lean = clamp(p.speed/14, 0, 0.24);
  p.lane = lerp(p.lane, p.laneTarget, 1-Math.pow(0.0004, dt));

  if (p.stun <= 0){
    var lane = Math.round(p.lane);
    var arr = race.byLane[lane] || [];
    for (var i=0;i<arr.length;i++){
      var v = arr[i];
      var d = Math.abs(v.x - p.x);
      if (d < v.len*0.5 + 0.55){ p.stun = 1.15; p.speed = 0.3; shakeScreen(14); break; }
    }
  }
}
var shake = 0;
function shakeScreen(v){ shake = Math.max(shake, v); }

function updateRace(dt){
  if (!race) return;
  if (race.state === 'countdown'){
    race.countdown -= dt;
    if (race.countdown <= 0) race.state = 'racing';
    return;
  }
  race.t += dt;
  updatePlayer(dt);
  for (var i=0;i<race.ai.length;i++) updateAI(race.ai[i], dt);
  for (var v=0;v<race.vehicles.length;v++) race.vehicles[v].x += race.vehicles[v].speed*dt;
  race.cameraX = lerp(race.cameraX, race.player.x - 9, 1-Math.pow(0.00005, dt));
  if (shake > 0) shake = Math.max(0, shake - dt*45);

  for (var r=0;r<race.runners.length;r++){
    var run = race.runners[r];
    if (run.finishTime === null && run.x >= RACE_LEN){
      var overshoot = run.x - RACE_LEN;
      run.finishTime = race.t - (run.speed > 0.01 ? overshoot/run.speed : 0);
    }
  }
  var finished = race.runners.filter(function(r){ return r.finishTime !== null; })
                              .sort(function(a,b){ return a.finishTime-b.finishTime; });
  for (var f=0; f<finished.length; f++){
    if (finished[f].place === null) finished[f].place = f+1;
  }

  if (race.player.finishTime !== null && !race.resultShown){
    race.resultShown = true; resultTimer = 1.6; pendingResult = true;
  }
  if (pendingResult){
    resultTimer -= dt;
    if (resultTimer <= 0){ pendingResult = false; finishRace(); }
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  var g = ctx;
  var loc = race ? race.loc : null;
  var sky1 = loc ? loc.sky1 : '#4a9fd0';
  var sky2 = loc ? loc.sky2 : '#cdeaf9';
  var farC = loc ? loc.far : '#8ba3bf';
  var midC = loc ? loc.mid : '#6a83a0';
  var roadC = loc ? loc.road : '#3b3b45';
  var accent = loc ? loc.accent : '#ffb703';
  var camX = race ? race.cameraX*PPM : menuCam;
  var camXU = race ? race.cameraX : -9;

  g.save();
  if (shake > 0) g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  /* sky */
  var sky = g.createLinearGradient(0,0,0,ROAD_TOP+20);
  sky.addColorStop(0, sky1); sky.addColorStop(1, sky2);
  g.fillStyle = sky; g.fillRect(-40,-40,W+80,ROAD_TOP+60);

  /* sun */
  g.fillStyle = 'rgba(255,240,200,.55)';
  g.beginPath(); g.arc(1010, 110, 52, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,245,220,.9)';
  g.beginPath(); g.arc(1010, 110, 32, 0, 7); g.fill();

  var farArr = race ? race.skyFar : defaultFar;
  var midArr = race ? race.skyMid : defaultMid;

  drawSkyline(g, farArr, 0.12, 302, farC, camX);
  drawFarProps(g, loc, camX);
  drawMetro(g, camX);
  drawSkyline(g, midArr, 0.36, 302, midC, camX);
  drawFlyover(g, camX);
  drawRoad(g, loc || {road:roadC, accent:accent}, camX);

  var viewL = camXU - 12, viewR = camXU + 36;

  for (var lane=LANES-1; lane>=0; lane--){
    var gy = laneY(lane);
    var sc = laneScale(lane);
    var ppm = PPM * sc;

    if (race){
      var traffic = race.byLane[lane];
      for (var t=0;t<traffic.length;t++){
        var v = traffic[t];
        if (v.x < viewL - 14 || v.x > viewR + 14) continue;
        drawVehicle(g, (v.x - camXU)*PPM, gy, ppm, v);
      }
    }

    if (race){
      for (var ri=0; ri<race.runners.length; ri++){
        var r = race.runners[ri];
        if (Math.round(r.lane) !== lane) continue;
        if (r.x < viewL - 4 || r.x > viewR + 4) continue;
        var sx = (r.x - camXU)*PPM;

        g.fillStyle = 'rgba(0,0,0,.3)';
        g.beginPath(); g.ellipse(sx, gy+2, 18*sc, 5*sc, 0, 0, 7); g.fill();

        if (r.isPlayer && r.speed > 10){
          var fl = 20 + Math.random()*22;
          var grd = g.createLinearGradient(sx-fl, gy-20*sc, sx, gy-20*sc);
          grd.addColorStop(0,'rgba(255,140,0,0)');
          grd.addColorStop(1,'rgba(255,220,120,.85)');
          g.fillStyle = grd;
          g.beginPath();
          g.moveTo(sx-14*sc, gy-38*sc);
          g.lineTo(sx-fl, gy-24*sc);
          g.lineTo(sx-14*sc, gy-10*sc);
          g.closePath(); g.fill();
        }

        drawRunner(g, sx, gy, ppm, r);

        if (!r.isPlayer){
          g.fillStyle = 'rgba(0,0,0,.5)';
          g.font = 'bold ' + Math.round(11*sc+3) + 'px system-ui,sans-serif';
          g.textAlign = 'center';
          g.fillText(r.name, sx, gy - 82*sc);
        }
      }
    }
  }

  if (race && race.player.x > RACE_LEN - 60 && race.player.x < RACE_LEN + 30){
    g.fillStyle = 'rgba(255,209,102,.9)';
    g.font = 'bold 46px system-ui,sans-serif';
    g.textAlign = 'center';
    g.fillText('FINISH', W/2, 260);
  }

  if (race && race.state === 'countdown'){
    var c = race.countdown;
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0,0,W,H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (c > 0.6){
      g.fillStyle = '#ffd166';
      g.font = 'bold 180px system-ui,sans-serif';
      g.fillText(Math.ceil(c - 0.6), W/2, H/2);
    } else {
      g.fillStyle = '#06d6a0';
      g.font = 'bold 150px system-ui,sans-serif';
      g.fillText('GO!', W/2, H/2);
    }
    g.textBaseline = 'alphabetic';
  }

  g.restore();
}

/* =========================================================
   GAME LOOP
   ========================================================= */
function loop(ts){
  var dt = Math.min(0.05, (ts - lastTS)/1000 || 0);
  lastTS = ts;

  if (screen === 'game'){
    updateRace(dt);
    render();
    updateHUD();
  } else {
    menuCam += dt * 40;
    render();
    if (screen === 'home'){
      if (previewAutoRotate){
        previewAngle += dt * 0.7;
      } else {
        previewAngle += previewVelocity * dt;
        previewVelocity *= Math.pow(0.01, dt);
        if (Math.abs(previewVelocity) < 0.05) previewVelocity = 0;
        previewResumeTimer -= dt;
        if (previewResumeTimer <= 0 && !previewDragging) previewAutoRotate = true;
      }
      drawPreview();
    }
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   HUD
   ========================================================= */
var elHudPos   = document.getElementById('hud-pos');
var elHudTime  = document.getElementById('hud-time');
var elHudCoins = document.getElementById('hud-coins');
var elHudProg  = document.getElementById('hud-prog');
var elHudLoc   = document.getElementById('hud-loc');
var elLaneInd  = document.getElementById('lane-ind');

for (var li=LANES-1; li>=0; li--){
  var dot = document.createElement('div');
  dot.className = 'lane-dot';
  dot.setAttribute('data-lane', li);
  elLaneInd.appendChild(dot);
}

function updateHUD(){
  if (!race) return;
  var p = race.player;
  var finished = race.runners.filter(function(r){ return r.finishTime !== null; })
                              .sort(function(a,b){ return a.finishTime-b.finishTime; });
  var pos = finished.indexOf(p) + 1;
  if (pos === 0){
    pos = 1;
    for (var i=0;i<race.runners.length;i++){
      var r = race.runners[i];
      if (r !== p && r.x > p.x) pos++;
    }
  }
  elHudPos.textContent = pos;
  elHudTime.textContent = race.t.toFixed(2);
  elHudCoins.textContent = Math.floor(user.coins);
  elHudProg.style.width = clamp(p.x/RACE_LEN*100, 0, 100) + '%';
  elHudLoc.textContent = race.loc.fullLabel;
  var lane = Math.round(p.lane);
  var dots = elLaneInd.querySelectorAll('.lane-dot');
  for (var d=0; d<dots.length; d++){
    dots[d].classList.toggle('on', parseInt(dots[d].getAttribute('data-lane'),10) === lane);
  }
}

/* =========================================================
   RESULT
   ========================================================= */
function finishRace(){
  var p = race.player;
  var place = p.place || 10;
  var time = p.finishTime || race.t;
  var loc = race.loc;

  var reward = place === 1 ? WIN_COINS : 0;
  user.coins += reward;
  user.races = (user.races || 0) + 1;
  if (place === 1) user.wins = (user.wins || 0) + 1;
  if (!user.best) user.best = {};
  var prevBest = user.best[loc.id];
  if (!prevBest || time < prevBest) user.best[loc.id] = time;
  saveGuest();

  var suffixes = ['th','st','nd','rd'];
  var v = place % 100;
  var suffix = suffixes[(v-20)%10] || suffixes[v] || suffixes[0];
  var el = document.getElementById('res-place');
  el.textContent = place + suffix;
  el.className = 'place';
  if (place === 1) el.classList.add('gold');
  else if (place === 2) el.classList.add('silver');
  else if (place === 3) el.classList.add('bronze');
  else el.classList.add('none');

  document.getElementById('res-loc').textContent = loc.fullLabel;
  document.getElementById('res-time').textContent = time.toFixed(2) + 's';
  document.getElementById('res-best').textContent = user.best[loc.id].toFixed(2) + 's';
  document.getElementById('res-pos').textContent = place + ' / 10';

  var rEl = document.getElementById('res-reward');
  if (reward > 0){
    rEl.textContent = '+100 🪙  First Place Prize!';
    rEl.className = 'reward';
  } else {
    rEl.textContent = 'No reward — only 1st place earns coins.';
    rEl.className = 'reward none';
  }

  var list = document.getElementById('res-list');
  list.innerHTML = '';
  var sorted = race.runners.filter(function(r){ return r.finishTime !== null; })
                           .sort(function(a,b){ return a.finishTime-b.finishTime; });
  for (var i=0;i<sorted.length;i++){
    var r = sorted[i];
    var row = document.createElement('div');
    if (r.isPlayer) row.classList.add('me');
    row.innerHTML = '<span>' + (i+1) + '. ' + (r.isPlayer ? user.id : r.name) + '</span><span>' + r.finishTime.toFixed(2) + 's</span>';
    list.appendChild(row);
  }

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
}

    if (ids[i] === id) el.classList.remove('hidden');
    else el.classList.add('hidden');

}

function drawPreview(){
  var g = prevCtx;
  g.clearRect(0,0,prevCanvas.width, prevCanvas.height);

  var grd = g.createRadialGradient(190, 250, 10, 190, 250, 180);
  grd.addColorStop(0, 'rgba(76,201,240,.20)');
  grd.addColorStop(1, 'rgba(76,201,240,0)');
  g.fillStyle = grd; g.fillRect(0,0,prevCanvas.width, prevCanvas.height);

  var depth = Math.cos(previewAngle);
  var absDepth = Math.max(0.16, Math.abs(depth));
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(190, 402, 62*absDepth, 14, 0, 0, 7); g.fill();

  g.save();
  g.translate(190, 240);
  g.strokeStyle = 'rgba(120,200,255,.10)';
  g.lineWidth = 1;
  g.beginPath(); g.ellipse(0, 0, 96, 168, 0, 0, 7); g.stroke();
  g.restore();

  drawRunner(g, 190, 402, 175, {
    bundleId: user.equipped,
    skinIdx: user.skin,
    hairIdx: user.hair,
    styleIdx: user.style || 0,
    phase: 0.6,
    lean: 0.02,
    viewAngle: previewAngle
  });

  var deg = (mod(previewAngle, Math.PI*2) * 180 / Math.PI).toFixed(0);
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.font = '600 11px system-ui,sans-serif';
  g.textAlign = 'center';
  g.fillText(deg + '°', 190, 432);
}

/* ---------- DRAG ROTATION ---------- */
var pointerActive = false;
function onPointerDown(e){
  pointerActive = true; previewDragging = true; previewAutoRotate = false;
  previewLastX = e.clientX; previewVelocity = 0;
  if (charPanel.setPointerCapture) charPanel.setPointerCapture(e.pointerId);
}
function onPointerMove(e){
  if (!pointerActive) return;
  var dx = e.clientX - previewLastX;
  previewLastX = e.clientX;
  var delta = dx * 0.014;
  previewAngle += delta;
  previewVelocity = delta * 60;
}
function onPointerUp(){
  if (!pointerActive) return;
  pointerActive = false; previewDragging = false;
  previewResumeTimer = 2.2; previewVelocity *= 0.4;
}
charPanel.addEventListener('pointerdown', onPointerDown);
charPanel.addEventListener('pointermove', onPointerMove);
charPanel.addEventListener('pointerup', onPointerUp);
charPanel.addEventListener('pointercancel', onPointerUp);
charPanel.addEventListener('pointerleave', onPointerUp);

function buildSwatches(){
  var skinBox = document.getElementById('skin-swatches');

  for (var si=0; si<SKINS.length; si++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'sw' + (user.skin === i ? ' on' : '');
      d.style.background = SKINS[i];
      d.onclick = function(){ user.skin = i; saveGuest(); buildSwatches(); drawPreview(); };
      skinBox.appendChild(d);
    })(si);
  }

  var hairBox = document.getElementById('hair-swatches');
  hairBox.innerHTML = '';
  for (var hi=0; hi<HAIRS.length; hi++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'sw' + (user.hair === i ? ' on' : '');
      d.style.background = HAIRS[i];
      d.onclick = function(){ user.hair = i; saveGuest(); buildSwatches(); drawPreview(); };
      hairBox.appendChild(d);
    })(hi);
  }

  var styleBox = document.getElementById('style-swatches');
  styleBox.innerHTML = '';
  for (var sti=0; sti<HAIR_STYLES.length; sti++){
    (function(i){
      var b = document.createElement('button');

      b.textContent = s.charAt(0).toUpperCase() + s.slice(1);

      styleBox.appendChild(b);
    })(sti);

}

/* =========================================================
   SHOP
   ========================================================= */
function buildShop(){
  document.getElementById('shop-coins').textContent = Math.floor(user.coins);
  var grid = document.getElementById('shop-grid');
  grid.innerHTML = '';

  for (var bi=0; bi<BUNDLES.length; bi++){
    (function(B){
      var owned = user.owned.indexOf(B.id) !== -1;
      var equipped = user.equipped === B.id;
      var card = document.createElement('div');
      card.className = 'bcard' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '');

      var c = document.createElement('canvas');
      c.width = 110; c.height = 140;
      var cg = c.getContext('2d');
      cg.fillStyle = 'rgba(255,255,255,.03)'; cg.fillRect(0,0,110,140);
      drawRunner(cg, 55, 128, 66, {
        bundleId: B.id, skinIdx: user.skin, hairIdx: user.hair, styleIdx: user.style||0,
        phase: 0.6, lean: 0
      });

      var h4 = document.createElement('h4'); h4.textContent = B.name;
      var p = document.createElement('p'); p.textContent = B.desc;
      var price = document.createElement('div'); price.className = 'price';
      price.textContent = B.price === 0 ? 'FREE' : ('🪙 ' + B.price);
      var btn = document.createElement('button');
      btn.className = 'buybtn';
      if (equipped){
        btn.textContent = 'EQUIPPED'; btn.disabled = true;
      } else if (owned){
        btn.textContent = 'EQUIP'; btn.classList.add('eq');
        btn.onclick = function(){ user.equipped = B.id; saveGuest(); buildShop(); };
      } else {
        btn.textContent = 'BUY'; btn.disabled = user.coins < B.price;
        btn.onclick = function(){
          if (user.coins < B.price) return;
          user.coins -= B.price;
          user.owned.push(B.id);
          user.equipped = B.id;
          saveGuest(); buildShop();
        };
      }
      card.appendChild(c); card.appendChild(h4); card.appendChild(p);
      card.appendChild(price); card.appendChild(btn);
      grid.appendChild(card);
    })(BUNDLES[bi]);
  }
}

   CONTROLS
   ========================================================= */
function bindHold(el, on, off){
  function start(e){ if (e.preventDefault) e.preventDefault(); on(); el.classList.add('active'); }
  function end(){ off(); el.classList.remove('active'); }
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindHold(document.getElementById('btnLeft'),  function(){ ctrl.left=true; },  function(){ ctrl.left=false; });
bindHold(document.getElementById('btnRight'), function(){ ctrl.right=true; }, function(){ ctrl.right=false; });
bindHold(document.getElementById('btnStop'),  function(){ ctrl.stop=true; },  function(){ ctrl.stop=false; });
bindHold(document.getElementById('btnUp'),    function(){ changeLane(1); },   function(){});
bindHold(document.getElementById('btnDown'),  function(){ changeLane(-1); },  function(){});

function changeLane(dir){
  if (!race || race.state === 'countdown') return;
  var p = race.player;
  p.laneTarget = clamp(p.laneTarget + dir, 0, LANES-1);
}

var modeBtns = document.querySelectorAll('.modebtn');
for (var mbi=0; mbi<modeBtns.length; mbi++){
  (function(b){
    b.addEventListener('click', function(){
      if (b.getAttribute('data-mode') === 'boost' && user.coins < 5) return;
      ctrl.mode = b.getAttribute('data-mode');
      updateModeButtons();
    });
  })(modeBtns[mbi]);
}
function updateModeButtons(){
  for (var i=0;i<modeBtns.length;i++){
    modeBtns[i].classList.toggle('on', modeBtns[i].getAttribute('data-mode') === ctrl.mode);
  }
}

window.addEventListener('keydown', function(e){
  if (screen !== 'game') return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ctrl.right = true;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') ctrl.left  = true;
  if (e.key === ' ') { ctrl.stop = true; if (e.preventDefault) e.preventDefault(); }
  if (e.key === 'ArrowUp'    || e.key === 'w' || e.key === 'W') changeLane(1);
  if (e.key === 'ArrowDown'  || e.key === 's' || e.key === 'S') changeLane(-1);
  if (e.key === '1'){ ctrl.mode='walk'; updateModeButtons(); }
  if (e.key === '2'){ ctrl.mode='run';  updateModeButtons(); }
  if (e.key === '3'){ if(user.coins>=5){ ctrl.mode='boost'; updateModeButtons(); } }
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ctrl.right = false;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') ctrl.left  = false;
  if (e.key === ' ') ctrl.stop = false;
});

/* =========================================================
   RESULT BUTTONS
   ========================================================= */
document.getElementById('btn-again').onclick = function(){
  if (race){
    var loc = race.loc;
    if (loc.id.indexOf('dhaka_') === 0){
      enterRace('dhaka', loc.id.replace('dhaka_',''));
    } else {
      enterRace(loc.id, null);
    }
  }
};
document.getElementById('btn-result-home').onclick = function(){
  race = null;
  enterHome();
};

/* =========================================================
   RESIZE
   ========================================================= */
function resizeApp(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('guest-id-display').textContent = user.id;
race = null;
menuCam = 0;
requestAnimationFrame(loop);
</script>
</body>

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function mod(n,m){ return ((n%m)+m)%m; }
function hashStr(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shadeHex(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(Math.round(((n>>16)&255) + amt*255), 0, 255);
  var g = clamp(Math.round(((n>>8)&255)  + amt*255), 0, 255);
  var b = clamp(Math.round((n&255)        + amt*255), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

/* =========================================================
