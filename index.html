/* =========================================================
   RACE UPDATE
   ========================================================= */
function updateRace(dt){
  if (!race) return;

  /* Countdown */
  if (race.state === 'countdown'){
    race.countdown -= dt;
    if (race.countdown <= 0){
      race.state = 'racing';
      var n = document.getElementById('notice');
      n.textContent = 'GO!';
      n.classList.add('on');
      setTimeout(function(){ n.classList.remove('on'); }, 700);
    }
    /* Still animate idle gallop */
    for (var i=0;i<race.horses.length;i++){
      race.horses[i].phase += dt * 4;
    }
    return;
  }

  if (race.state === 'ended') return;

  race.t += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 40);

  /* Update player */
  updatePlayer(dt);

  /* Update AI */
  for (var j=0;j<race.horses.length;j++){
    if (race.horses[j].isPlayer) continue;
    updateAIHorse(race.horses[j], dt);
  }

  /* Check finish */
  for (var k=0;k<race.horses.length;k++){
    var h = race.horses[k];
    if (h.finishTime === null && h.x >= RACE_LEN){
      var overshoot = h.x - RACE_LEN;
      h.finishTime = race.t - (h.speed > 0.01 ? overshoot/h.speed : 0);
    }
  }

  /* Assign places by finish order */
  var finished = race.horses.slice().filter(function(h){ return h.finishTime !== null; });
  finished.sort(function(a,b){ return a.finishTime - b.finishTime; });
  for (var p=0;p<finished.length;p++){
    if (finished[p].place === null) finished[p].place = p+1;
  }

  /* Player finished → result */
  if (race.player.finishTime !== null && !race.resultShown){
    race.resultShown = true;
    resultTimer = 1.3;
    pendingResult = true;
  }
  if (pendingResult){
    resultTimer -= dt;
    if (resultTimer <= 0){
      pendingResult = false;
      finishRace();
    }
  }

  /* Particles */
  updateParticles(dt);

  /* Dust trail (player) */
  if (race.player.stun <= 0 && race.player.jumpT < 0){
    race.dustTimer -= dt;
    if (race.dustTimer <= 0){
      race.dustTimer = 0.05;
      var p = race.player;
      race.particles.push({
        x: p.x - 1.5,
        y: 0,
        vx: -2 - Math.random()*2,
        vy: Math.random() * 1.5,
        life: 0.5,
        maxLife: 0.5,
        size: 3 + Math.random()*3,
        color: '200,180,140'
      });
    }
  }

  /* Speed lines when boosting */
  if (boostHeld && user.coins > 0 && race.player.stun <= 0){
    race.speedLines.push({
      x: W + 50,
      y: 200 + Math.random() * 320,
      len: 60 + Math.random() * 80,
      life: 0.6,
      maxLife: 0.6
    });
  }
  for (var sl=race.speedLines.length-1; sl>=0; sl--){
    var line = race.speedLines[sl];
    line.life -= dt;
    line.x -= 1400 * dt;
    if (line.life <= 0 || line.x < -200) race.speedLines.splice(sl, 1);
  }
}

function updatePlayer(dt){
  var p = race.player;

  if (p.stun > 0){
    p.stun -= dt;
    p.speed = lerp(p.speed, HIT_SPEED, dt * 5);
  } else {
    var target = BASE_SPEED;
    if (boostHeld && user.coins > 0){
      target = BOOST_SPEED;
      user.coins = Math.max(0, user.coins - BOOST_COST * dt);
    }
    var accel = target > p.speed ? 14 : 20;
    p.speed += clamp(target - p.speed, -accel * dt, accel * dt);
  }

  /* Jump physics */
  if (p.jumpT < 0 && jumpQueued && p.stun <= 0){
    p.vy = JUMP_V;
    p.jumpT = 0;
  }
  jumpQueued = false;

  if (p.jumpT >= 0){
    p.vy -= GRAVITY * dt;
    p.height += p.vy * dt;
    if (p.height <= 0){
      p.height = 0;
      p.vy = 0;
      p.jumpT = -1;
      /* Landing dust */
      for (var i=0;i<6;i++){
        race.particles.push({
          x: p.x,
          y: 0,
          vx: (Math.random()-0.5)*4,
          vy: 1 + Math.random()*3,
          life: 0.45,
          maxLife: 0.45,
          size: 4 + Math.random()*3,
          color: '220,200,160'
        });
      }
      shakeScreen(4);
    }
  }

  p.x += p.speed * dt;
  p.phase += (p.speed * 0.45 + 3.5) * dt * 2.2;

  /* Obstacle collision */
  checkPlayerCollisions();
}

function checkPlayerCollisions(){
  var p = race.player;
  if (p.stun > 0) return;

  for (var i=0;i<race.obstacles.length;i++){
    var ob = race.obstacles[i];
    if (ob.checkedBy.player === ob) continue;

    var obFront = ob.x + ob.type.width/2;
    var obBack = ob.x - ob.type.width/2;
    var pFront = p.x + HORSE_LEN/2;
    var pBack = p.x - HORSE_LEN/2;

    /* Already passed */
    if (pBack > obFront + 0.5) continue;

    if (pFront > obBack && pBack < obFront){
      /* Overlap in X. Check height */
      if (p.height < ob.type.height * 0.96){
        /* Hit */
        p.stun = STUN_TIME;
        p.speed = HIT_SPEED;
        p.hits++;
        shakeScreen(14);
        /* Impact particles */
        for (var k=0;k<10;k++){
          race.particles.push({
            x: p.x + 1,
            y: 0.6,
            vx: (Math.random()-0.5)*8,
            vy: 2 + Math.random()*5,
            life: 0.7,
            maxLife: 0.7,
            size: 5 + Math.random()*4,
            color: '180,140,90'
          });
        }
        ob.checkedBy.player = ob;
      }
    }
  }
}

function updateAIHorse(h, dt){
  if (h.stun > 0){
    h.stun -= dt;
    h.speed = lerp(h.speed, HIT_SPEED, dt*5);
  } else {
    h.surgeTimer -= dt;
    if (h.surgeTimer <= 0){
      h.surgeTimer = 3 + Math.random()*4;
      h.surgeDir = Math.random() < 0.5 ? -1 : 1;
    }
    var surge = 1.0 + (h.surgeDir || 0) * 0.05;
    var target = h.baseSpeed * surge;
    if (h.x > 320) target *= 0.985;
    var accel = target > h.speed ? 6 : 10;
    h.speed += clamp(target - h.speed, -accel*dt, accel*dt);
  }

  /* AI jump */
  if (h.jumpT < 0 && h.stun <= 0){
    for (var i=0;i<race.obstacles.length;i++){
      var ob = race.obstacles[i];
      var dx = ob.x - h.x;
      /* Look ahead ~2-3m at higher speeds */
      var lookAhead = 2.0 + h.speed * 0.10;
      if (dx > lookAhead - 0.15 && dx < lookAhead + 0.4){
        /* Jump skill check */
        if (Math.random() < 0.94){
          h.vy = JUMP_V;
          h.jumpT = 0;
        }
        break;
      }
    }
  }

  /* AI jump physics */
  if (h.jumpT >= 0){
    h.vy -= GRAVITY * dt;
    h.height += h.vy * dt;
    if (h.height <= 0){
      h.height = 0;
      h.vy = 0;
      h.jumpT = -1;
    }
  }

  /* AI collision */
  for (var j=0;j<race.obstacles.length;j++){
    var ob = race.obstacles[j];
    if (ob.checkedBy[h.name]) continue;
    var obFront = ob.x + ob.type.width/2;
    var obBack = ob.x - ob.type.width/2;
    var pFront = h.x + HORSE_LEN/2;
    var pBack = h.x - HORSE_LEN/2;
    if (pBack > obFront + 0.5) continue;
    if (pFront > obBack && pBack < obFront){
      if (h.height < ob.type.height * 0.96){
        h.stun = STUN_TIME;
        h.speed = HIT_SPEED;
        h.hits++;
        ob.checkedBy[h.name] = ob;
      }
    }
  }

  h.x += h.speed * dt;
  h.phase += (h.speed * 0.45 + 3.5) * dt * 2.2;
}

function updateParticles(dt){
  for (var i=race.particles.length-1; i>=0; i--){
    var p = race.particles[i];
    p.life -= dt;
    if (p.life <= 0){ race.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy -= 8 * dt;
    if (p.y < 0) p.y = 0;
  }
}

function shakeScreen(v){ shake = Math.max(shake, v); race.shake = shake; }

/* =========================================================
   RENDER RACE
   ========================================================= */
var skylineCache = {};
function getSkyline(mapId, mul){
  var key = mapId + '_' + mul;
  if (skylineCache[key]) return skylineCache[key];
  var seed = hashStr(mapId + mul);
  var rng = mulberry32(seed);
  var arr = [], x = 0;
  while (x < 3200){
    var w = 60 + rng()*140;
    var h = (60 + rng()*160) * mul;
    arr.push({ x:x, w:w, h:h, tone:(rng()-0.5)*0.3 });
    x += w + 8 + rng()*40;
  }
  skylineCache[key] = arr;
  return arr;
}

function renderRace(){
  if (!race) return;
  var g = ctx;
  var map = race.map;

  g.save();
  if (shake > 0){
    g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  var camMeters = race.player.x;

  /* ---- SKY ---- */
  var skyG = g.createLinearGradient(0, 0, 0, GROUND_Y);
  skyG.addColorStop(0, map.sky1);
  skyG.addColorStop(1, map.sky2);
  g.fillStyle = skyG;
  g.fillRect(-40, -40, W+80, GROUND_Y+80);

  /* Sun / glow */
  g.fillStyle = 'rgba(255,240,200,.55)';
  g.beginPath(); g.arc(1010, 100, 46, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,245,220,.92)';
  g.beginPath(); g.arc(1010, 100, 26, 0, 7); g.fill();

  /* ---- FAR SKYLINE (parallax) ---- */
  drawSkylineLayer(g, getSkyline(map.id, 0.55), 0.10, GROUND_Y-60, shade(map.far, -0.10), camMeters);
  drawFarProps(g, map, camMeters, 0.15);
  drawSkylineLayer(g, getSkyline(map.id, 1.0), 0.25, GROUND_Y-35, shade(map.mid, -0.05), camMeters);

  /* ---- GROUND FILL ---- */
  var groundG = g.createLinearGradient(0, GROUND_Y, 0, H);
  groundG.addColorStop(0, shade(map.track, 0.10));
  groundG.addColorStop(1, shade(map.track, -0.20));
  g.fillStyle = groundG;
  g.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  /* Top grass line */
  g.fillStyle = shade(map.track, 0.20);
  g.fillRect(0, GROUND_Y - 2, W, 4);

  /* ---- GROUND TEXTURE (scrolling) ---- */
  drawGroundTexture(g, map, camMeters);

  /* ---- DISTANCE MARKERS ---- */
  for (var d = 0; d <= RACE_LEN; d += 25){
    if (d === 0) continue;
    var sxm = (d - camMeters) * HORIZONTAL_PPM + PLAYER_SCREEN_X;
    if (sxm < -60 || sxm > W + 60) continue;
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.fillRect(sxm-1, GROUND_Y - 40, 2, 40);
    g.fillStyle = 'rgba(232,200,120,.85)';
    g.font = 'bold 13px system-ui,sans-serif';
    g.textAlign = 'center';
    g.fillText(d + 'm', sxm, GROUND_Y - 50);
  }

  /* ---- FINISH LINE ---- */
  drawFinishLine(g, camMeters);

  /* ---- OBSTACLES ---- */
  for (var i=0;i<race.obstacles.length;i++){
    var ob = race.obstacles[i];
    var sx = (ob.x - camMeters) * HORIZONTAL_PPM + PLAYER_SCREEN_X;
    if (sx < -220 || sx > W + 220) continue;
    drawObstacle(g, sx, GROUND_Y, ob.type);
  }

  /* ---- OTHER HORSES (drawn behind player for depth if ahead, in front if behind) ---- */
  var sorted = race.horses.slice();
  /* Sort so player's own horse is drawn last (on top) */
  sorted.sort(function(a,b){
    if (a.isPlayer) return 1;
    if (b.isPlayer) return -1;
    return b.x - a.x;
  });

  for (var h=0; h<sorted.length; h++){
    var horse = sorted[h];
    var hsx = (horse.x - camMeters) * HORIZONTAL_PPM + PLAYER_SCREEN_X;
    if (hsx < -240 || hsx > W + 240) continue;

    var jumpH = horse.height * VERTICAL_PPM;
    var hsGroundY = GROUND_Y - jumpH;
    var scale = horse.isPlayer ? 0.92 : 0.82;   /* Rivals slightly smaller for depth */
    var lean = horse.stun > 0 ? 0.12 : 0;
    if (horse.jumpT >= 0) lean += 0.08;

    /* Small vertical stagger for depth (rivals "behind") */
    if (!horse.isPlayer) hsGroundY -= 6;

    drawHorse(g, hsx, hsGroundY, scale, {
      coat: horse.coat,
      mane: horse.mane,
      kit: horse.kit,
      phase: horse.phase,
      jumpT: horse.jumpT,
      isPlayer: horse.isPlayer,
      lean: lean
    });

    /* Name tag for rivals */
    if (!horse.isPlayer && hsx > -100 && hsx < W + 100){
      g.fillStyle = 'rgba(8,14,10,.75)';
      g.font = 'bold 11px system-ui,sans-serif';
      g.textAlign = 'center';
      var tagY = hsGroundY - 145;
      var tw = g.measureText(horse.name).width + 12;
      g.fillRect(hsx - tw/2, tagY - 11, tw, 15);
      g.fillStyle = '#e8c878';
      g.fillText(horse.name, hsx, tagY);
    }
  }

  /* ---- SPEED LINES ---- */
  for (var sl=0; sl<race.speedLines.length; sl++){
    var line = race.speedLines[sl];
    var alpha = line.life / line.maxLife * 0.7;
    var lg = g.createLinearGradient(line.x, line.y, line.x + line.len, line.y);
    lg.addColorStop(0, 'rgba(255,220,140,0)');
    lg.addColorStop(0.5, 'rgba(255,220,140,' + alpha + ')');
    lg.addColorStop(1, 'rgba(255,220,140,0)');
    g.strokeStyle = lg;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(line.x, line.y);
    g.lineTo(line.x + line.len, line.y);
    g.stroke();
  }

  /* ---- PARTICLES ---- */
  for (var pi=0; pi<race.particles.length; pi++){
    var p = race.particles[pi];
    var pa = p.life / p.maxLife;
    var psx = (p.x - camMeters) * HORIZONTAL_PPM + PLAYER_SCREEN_X;
    var psy = GROUND_Y - p.y * VERTICAL_PPM;
    g.fillStyle = 'rgba(' + p.color + ',' + (pa * 0.85) + ')';
    g.beginPath();
    g.arc(psx, psy, p.size * pa, 0, 7);
    g.fill();
  }

  /* ---- COUNTDOWN ---- */
  if (race.state === 'countdown'){
    g.fillStyle = 'rgba(0,0,0,.5)';
    g.fillRect(0, 0, W, H);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    var c = race.countdown;
    if (c > 0.5){
      g.fillStyle = '#e8c878';
      g.font = 'bold 180px system-ui,sans-serif';
      g.fillText(Math.ceil(c - 0.5), W/2, H/2);
    } else {
      g.fillStyle = '#8cdc8c';
      g.font = 'bold 150px system-ui,sans-serif';
      g.fillText('GO!', W/2, H/2);
    }
    g.textBaseline = 'alphabetic';
  }

  /* ---- PLAYER POSITION & GAP OVERLAY ---- */
  /* Draw a subtle highlight behind player horse to make it stand out */
  if (race.state === 'racing'){
    var p = race.player;
    var psx = PLAYER_SCREEN_X;
    var pJumpH = p.height * VERTICAL_PPM;
    var pGroundY = GROUND_Y - pJumpH;

    /* Soft highlight glow behind player */
    g.save();
    g.globalAlpha = 0.35;
    var glow = g.createRadialGradient(psx, pGroundY - 80, 20, psx, pGroundY - 80, 130);
    glow.addColorStop(0, 'rgba(232,200,120,.35)');
    glow.addColorStop(1, 'rgba(232,200,120,0)');
    g.fillStyle = glow;
    g.fillRect(psx - 160, pGroundY - 220, 320, 320);
    g.restore();
  }

  g.restore();
}

function drawSkylineLayer(g, arr, par, baseY, colorHex, camMeters){
  var camX = camMeters * HORIZONTAL_PPM;
  var off = -mod(camX * par, 3200);
  for (var rep=0; rep<2; rep++){
    for (var i=0;i<arr.length;i++){
      var b = arr[i];
      var x = b.x + off + rep*3200;
      if (x < -260 || x > W+260) continue;
      g.fillStyle = shade(colorHex, b.tone);
      g.fillRect(x, baseY-b.h, b.w, b.h);
      g.fillStyle = shade(colorHex, b.tone-0.12);
      g.fillRect(x, baseY-b.h, b.w, 4);
    }
  }
}

function drawFarProps(g, map, camMeters, par){
  var camX = camMeters * HORIZONTAL_PPM;
  var spacing = 300;
  var off = -mod(camX * par, spacing);
  var col = shade(map.far, -0.20);
  for (var i=-1; i<7; i++){
    drawProp(g, i*spacing + off, GROUND_Y - 60, map.prop, col, map.accent);
  }
}

function drawProp(g, x, baseY, type, color, accent){
  g.fillStyle = color;
  switch(type){
    case 'city':
      g.fillRect(x, baseY-90, 34, 90);
      g.fillRect(x+40, baseY-130, 30, 130);
      g.fillRect(x+76, baseY-70, 36, 70);
      g.fillRect(x+118, baseY-110, 28, 110);
      break;
    case 'palm':
      g.fillRect(x+8, baseY-70, 6, 70);
      g.fillStyle = accent;
      for (var i=0;i<5;i++){
        var a = i * Math.PI*2/5;
        g.beginPath();
        g.ellipse(x+11+Math.cos(a)*26, baseY-78+Math.sin(a)*14, 26, 8, a*0.5, 0, 7);
        g.fill();
      }
      break;
    case 'jungle':
      for (var j=0;j<4;j++){
        g.fillStyle = j%2===0 ? color : shade(color, 0.15);
        g.beginPath();
        g.arc(x+j*22+10, baseY-30, 26, 0, 7);
        g.fill();
        g.fillRect(x+j*22+7, baseY-30, 6, 30);
      }
      break;
    case 'tea':
      for (var t=0;t<5;t++){
        g.fillStyle = t%2===0 ? color : shade(color, 0.12);
        g.beginPath();
        g.ellipse(x+t*24+12, baseY-8, 14, 8, 0, 0, 7);
        g.fill();
      }
      break;
    case 'mountain':
      g.beginPath();
      g.moveTo(x, baseY);
      g.lineTo(x+40, baseY-100);
      g.lineTo(x+80, baseY-40);
      g.lineTo(x+120, baseY-120);
      g.lineTo(x+180, baseY);
      g.closePath(); g.fill();
      break;
    case 'river':
      g.fillRect(x, baseY-5, 200, 5);
      g.fillStyle = accent;
      g.fillRect(x+20, baseY-15, 40, 4);
      break;
    case 'mulberry':
      for (var m=0;m<3;m++){
        g.fillStyle = color;
        g.beginPath();
        g.arc(x+m*40+15, baseY-34, 22, 0, 7);
        g.fill();
        g.fillRect(x+m*40+12, baseY-34, 6, 34);
      }
      break;
    case 'wheat':
      g.fillRect(x, baseY-3, 160, 3);
      for (var w=0;w<12;w++){
        g.fillStyle = w%2===0 ? color : shade(color, 0.15);
        g.fillRect(x+w*13+5, baseY-42, 3, 42);
        g.beginPath(); g.arc(x+w*13+6, baseY-44, 5, 0, 7); g.fill();
      }
      break;
    case 'bamboo':
      for (var bb=0;bb<5;bb++){
        g.fillStyle = color;
        g.fillRect(x+bb*16, baseY-95, 6, 95);
        g.fillStyle = shade(color, 0.15);
        g.fillRect(x+bb*16, baseY-70, 6, 3);
        g.fillRect(x+bb*16, baseY-40, 6, 3);
      }
      break;
    case 'dune':
      g.beginPath();
      g.moveTo(x, baseY);
      g.quadraticCurveTo(x+60, baseY-50, x+140, baseY);
      g.quadraticCurveTo(x+200, baseY-30, x+240, baseY);
      g.closePath();
      g.fill();
      break;
  }
}

function drawGroundTexture(g, map, camMeters){
  var camX = camMeters * HORIZONTAL_PPM;
  /* Small dashes on the track surface */
  var off = -mod(camX, 60);
  g.strokeStyle = 'rgba(255,255,255,.08)';
  g.lineWidth = 2;
  for (var x = off; x < W + 60; x += 60){
    g.beginPath();
    g.moveTo(x, GROUND_Y + 30);
    g.lineTo(x + 30, GROUND_Y + 30);
    g.stroke();
  }
  /* Cracks */
  var off2 = -mod(camX * 1.05, 180);
  g.strokeStyle = 'rgba(0,0,0,.20)';
  g.lineWidth = 1.5;
  for (var x2 = off2; x2 < W + 180; x2 += 180){
    g.beginPath();
    g.moveTo(x2, GROUND_Y + 5);
    g.lineTo(x2 + 12, GROUND_Y + 18);
    g.lineTo(x2 + 8, GROUND_Y + 40);
    g.stroke();
  }
  /* Crowd dots along the top of the ground (like spectators) */
  var off3 = -mod(camX * 0.85, 40);
  for (var cx = off3; cx < W + 40; cx += 40){
    g.fillStyle = 'rgba(255,255,255,.10)';
    g.beginPath();
    g.arc(cx, GROUND_Y - 8, 3, 0, 7);
    g.fill();
  }
}

function drawFinishLine(g, camMeters){
  var sx = (RACE_LEN - camMeters) * HORIZONTAL_PPM + PLAYER_SCREEN_X;
  if (sx < -60 || sx > W + 60) return;

  /* Glow */
  var gl = g.createLinearGradient(sx-30, 0, sx+30, 0);
  gl.addColorStop(0, 'rgba(232,200,120,0)');
  gl.addColorStop(0.5, 'rgba(232,200,120,.55)');
  gl.addColorStop(1, 'rgba(232,200,120,0)');
  g.fillStyle = gl;
  g.fillRect(sx-30, GROUND_Y-160, 60, 160);

  /* Checkered pole */
  var size = 14;
  for (var y = GROUND_Y - 140; y < GROUND_Y; y += size){
    for (var k=0;k<2;k++){
      var idx = Math.floor((y - (GROUND_Y-140))/size) + k;
      g.fillStyle = (idx % 2 === 0) ? '#ffffff' : '#1a1008';
      g.fillRect(sx - size + k*size, y, size, size);
    }
  }
  /* Pole line */
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.fillRect(sx-1, GROUND_Y - 160, 2, 160);
}

function drawObstacle(g, sx, groundY, t){
  var w = t.width * HORIZONTAL_PPM;
  var h = t.height * VERTICAL_PPM;
  var topY = groundY - h;

  /* Shadow */
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath();
  g.ellipse(sx, groundY + 3, w * 0.65, 6, 0, 0, 7);
  g.fill();

  switch(t.type){
    case 'stone':
      g.fillStyle = t.c2;
      g.beginPath();
      g.ellipse(sx, groundY - h*0.35, w*0.55, h*0.55, 0, 0, 7);
      g.fill();
      g.fillStyle = t.c1;
      g.beginPath();
      g.ellipse(sx - w*0.15, groundY - h*0.5, w*0.42, h*0.45, -0.15, 0, 7);
      g.fill();
      /* highlight */
      g.fillStyle = 'rgba(255,255,255,.25)';
      g.beginPath();
      g.ellipse(sx - w*0.25, groundY - h*0.62, w*0.12, h*0.10, -0.3, 0, 7);
      g.fill();
      break;

    case 'wood':
      /* Log cylinder lying horizontally */
      g.fillStyle = t.c2;
      g.fillRect(sx - w/2, topY, w, h);
      g.fillStyle = t.c1;
      g.fillRect(sx - w/2, topY, w, h * 0.85);
      /* End caps */
      g.fillStyle = '#6a4a28';
      g.beginPath(); g.ellipse(sx - w/2, topY + h*0.5, w*0.06, h*0.5, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(sx + w/2, topY + h*0.5, w*0.06, h*0.5, 0, 0, 7); g.fill();
      /* Bark lines */
      g.strokeStyle = 'rgba(0,0,0,.28)';
      g.lineWidth = 1.5;
      for (var bk=0; bk<3; bk++){
        g.beginPath();
        g.moveTo(sx - w/2 + 6, topY + h*(bk+1)/4);
        g.lineTo(sx + w/2 - 6, topY + h*(bk+1)/4);
        g.stroke();
      }
      break;

    case 'hay':
      /* Round hay bale */
      g.fillStyle = t.c2;
      g.beginPath();
      g.ellipse(sx, groundY - h*0.5, w*0.55, h*0.5, 0, 0, 7);
      g.fill();
      g.fillStyle = t.c1;
      g.beginPath();
      g.ellipse(sx, groundY - h*0.5, w*0.50, h*0.45, 0, 0, 7);
      g.fill();
      /* Lines */
      g.strokeStyle = 'rgba(140,110,40,.55)';
      g.lineWidth = 1.5;
      for (var hl=0; hl<6; hl++){
        var hx = sx - w*0.48 + hl * w * 0.16;
        g.beginPath();
        g.moveTo(hx, groundY - h*0.95);
        g.lineTo(hx, groundY - h*0.05);
        g.stroke();
      }
      break;

    case 'barrel':
      g.fillStyle = t.c2;
      g.fillRect(sx - w*0.45, topY, w*0.9, h);
      g.fillStyle = t.c1;
      g.fillRect(sx - w*0.42, topY + 2, w*0.84, h - 4);
      /* Bands */
      g.fillStyle = '#1a1a1a';
      g.fillRect(sx - w*0.45, topY + h*0.15, w*0.9, h*0.08);
      g.fillRect(sx - w*0.45, topY + h*0.75, w*0.9, h*0.08);
      /* Top ellipse */
      g.fillStyle = shade(t.c1, 0.15);
      g.beginPath();
      g.ellipse(sx, topY, w*0.42, 6, 0, 0, 7);
      g.fill();
      break;

    case 'barricade':
      /* Two vertical legs + horizontal striped board */
      g.fillStyle = '#5a5a5a';
      g.fillRect(sx - w*0.5, topY, w*0.10, h);
      g.fillRect(sx + w*0.4, topY, w*0.10, h);
      /* Striped board (top 60% of height) */
      var boardH = h * 0.55;
      var boardY = topY + h * 0.10;
      var stripes = 6;
      for (var s=0; s<stripes; s++){
        g.fillStyle = (s % 2 === 0) ? t.c1 : t.c2;
        g.fillRect(sx - w*0.5 + s*(w/stripes), boardY, w/stripes, boardH);
      }
      g.strokeStyle = 'rgba(0,0,0,.5)';
      g.lineWidth = 2;
      g.strokeRect(sx - w*0.5, boardY, w, boardH);
      break;

    case 'metal':
      /* Three horizontal rails + vertical posts */
      g.fillStyle = t.c2;
      g.fillRect(sx - w*0.5, topY, w, 6);
      g.fillRect(sx - w*0.5, topY + h*0.4, w, 6);
      g.fillRect(sx - w*0.5, topY + h*0.8, w, 6);
      g.fillStyle = t.c1;
      /* 4 vertical posts */
      for (var vp=0; vp<4; vp++){
        g.fillRect(sx - w*0.5 + vp * (w/3), topY, 5, h);
      }
      /* Top spikes */
      g.beginPath();
      for (var sp=0; sp<4; sp++){
        var spx = sx - w*0.5 + sp * (w/3) + 2;
        g.moveTo(spx, topY);
        g.lineTo(spx + 3, topY - 8);
        g.lineTo(spx + 6, topY);
      }
      g.fillStyle = t.c1;
      g.fill();
      break;
  }
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  if (!race) return;
  var p = race.player;

  /* Position */
  var sorted = race.horses.slice().sort(function(a,b){
    var fa = a.finishTime !== null ? a.finishTime : 9999;
    var fb = b.finishTime !== null ? b.finishTime : 9999;
    if (fa !== fb) return fa - fb;
    return b.x - a.x;
  });
  var pos = sorted.indexOf(p) + 1;

  /* Gap to nearest rival */
  var nearestAhead = null;
  var nearestBehind = null;
  for (var i=0;i<race.horses.length;i++){
    var h = race.horses[i];
    if (h.isPlayer) continue;
    if (h.x > p.x){
      if (nearestAhead === null || h.x < nearestAhead.x) nearestAhead = h;
    } else {
      if (nearestBehind === null || h.x > nearestBehind.x) nearestBehind = h;
    }
  }
  var gapText = '--';
  if (nearestAhead !== null && (p.x - nearestAhead.x) > -50){
    var gapA = nearestAhead.x - p.x;
    if (gapA < 0.5) gapText = 'EVEN';
    else gapText = '+' + gapA.toFixed(1) + 'm';
  } else if (nearestBehind !== null){
    var gapB = p.x - nearestBehind.x;
    gapText = '-' + gapB.toFixed(1) + 'm';
  }

  document.getElementById('hud-pos').textContent = pos;
  document.getElementById('hud-time').textContent = race.t.toFixed(2);
  document.getElementById('hud-coins').textContent = Math.floor(user.coins);
  document.getElementById('hud-loc').textContent = race.map.name.toUpperCase();
  document.getElementById('hud-gap').textContent = gapText;
  document.getElementById('hud-prog').style.width = clamp(p.x / RACE_LEN * 100, 0, 100) + '%';
}

function renderLeaderboard(){
  if (!race) return;
  var lb = document.getElementById('leaderboard');
  lb.innerHTML = '';
  var sorted = race.horses.slice().sort(function(a,b){
    var fa = a.finishTime !== null ? a.finishTime : 9999;
    var fb = b.finishTime !== null ? b.finishTime : 9999;
    if (fa !== fb) return fa - fb;
    return b.x - a.x;
  });
  for (var i=0;i<sorted.length;i++){
    var h = sorted[i];
    var row = document.createElement('div');
    row.className = 'lb-row' + (h.isPlayer ? ' me' : '');
    var dist = h.finishTime !== null ? h.finishTime.toFixed(2) + 's' : Math.floor(h.x) + 'm';
    var cls = h.finishTime !== null ? 'dist fin' : 'dist';
    row.innerHTML = '<span class="pos">' + (i+1) + '</span>' +
                    '<span class="name">' + (h.isPlayer ? 'YOU' : h.name) + '</span>' +
                    '<span class="' + cls + '">' + dist + '</span>';
    lb.appendChild(row);
  }
}

/* =========================================================
   FINISH
   ========================================================= */
function finishRace(){
  if (!race) return;
  var p = race.player;
  var place = p.place || 8;
  var time = p.finishTime || race.t;
  var map = race.map;

  var reward = place === 1 ? WIN_COINS : 0;
  user.coins += reward;
  user.races = (user.races || 0) + 1;
  if (place === 1) user.wins = (user.wins || 0) + 1;
  if (!user.best) user.best = {};
  var prevBest = user.best[map.id];
  if (!prevBest || time < prevBest) user.best[map.id] = time;
  saveGuest();

  var suffixes = ['th','st','nd','rd'];
  var v = place % 100;
  var suffix = suffixes[(v-20)%10] || suffixes[v] || suffixes[0];
  var el = document.getElementById('res-place');
  el.textContent = place + suffix;
  el.className = 'place';
  if (place === 1) el.classList.add('gold');
  else if (place === 2) el.classList.add('silver');
  else if (place === 3) el.classList.add('bronze');
  else el.classList.add('none');

  document.getElementById('res-loc').textContent = map.name.toUpperCase();
  document.getElementById('res-time').textContent = time.toFixed(2) + 's';
  document.getElementById('res-best').textContent = user.best[map.id].toFixed(2) + 's';
  document.getElementById('res-hits').textContent = p.hits;

  var rEl = document.getElementById('res-reward');
  if (reward > 0){
    rEl.textContent = '+100 🪙  First Place!';
    rEl.className = 'reward';
  } else {
    rEl.textContent = 'No reward — only 1st place earns coins.';
    rEl.className = 'reward none';
  }

  var list = document.getElementById('res-list');
  list.innerHTML = '';
  var sorted = race.horses.slice().sort(function(a,b){
    var fa = a.finishTime !== null ? a.finishTime : 9999;
    var fb = b.finishTime !== null ? b.finishTime : 9999;
    return fa - fb;
  });
  for (var i=0;i<sorted.length;i++){
    var h = sorted[i];
    var row = document.createElement('div');
    if (h.isPlayer) row.classList.add('me');
    var t = h.finishTime !== null ? h.finishTime.toFixed(2) + 's' : 'DNF';
    row.innerHTML = '<span>' + (i+1) + '. ' + (h.isPlayer ? user.id : h.name) + '</span><span>' + t + '</span>';
    list.appendChild(row);
  }

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud-match').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
}

/* =========================================================
   SCREEN MANAGEMENT
   ========================================================= */
function showScreen(id){
  var ids = ['scr-auth','scr-home','scr-shop','scr-map','scr-pause','scr-result'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (ids[i] === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  }
}

/* =========================================================
   INPUT
   ========================================================= */
function bindTap(id, action){
  var el = document.getElementById(id);
  var lastFire = 0;
  function down(e){
    if (e.preventDefault) e.preventDefault();
    el.classList.add('active');
    var now = Date.now();
    if (now - lastFire > 150){
      lastFire = now;
      try { action(); } catch(err){ if (window.console) console.error(err); }
    }
  }
  function up(){ el.classList.remove('active'); }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindTap('btnJump', function(){ if (screen === 'match') jumpQueued = true; });

var boostEl = document.getElementById('btnBoost');
function boostDown(e){
  if (e.preventDefault) e.preventDefault();
  boostEl.classList.add('active');
  boostHeld = true;
}
function boostUp(){
  boostEl.classList.remove('active');
  boostHeld = false;
}
boostEl.addEventListener('pointerdown', boostDown);
boostEl.addEventListener('pointerup', boostUp);
boostEl.addEventListener('pointercancel', boostUp);
boostEl.addEventListener('pointerleave', boostUp);
boostEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if (screen !== 'match') return;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    if (e.preventDefault) e.preventDefault();
    if (race && race.player.jumpT < 0 && race.player.stun <= 0){
      jumpQueued = true;
    }
  }
  if (e.key === 'Shift' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
    boostHeld = true;
  }
  if (e.key === 'Escape') pauseRace();
});
window.addEventListener('keyup', function(e){
  if (e.key === 'Shift' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
    boostHeld = false;
  }
});

/* =========================================================
   PAUSE
   ========================================================= */
function pauseRace(){
  if (screen !== 'match') return;
  screen = 'pause';
  showScreen('scr-pause');
}
function resumeRace(){
  if (screen !== 'pause') return;
  screen = 'match';
  showScreen('');
  lastTS = 0;
}
function quitRace(){
  race = null;
  buildHome();
  screen = 'home';
  showScreen('scr-home');
  document.getElementById('hud-match').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
}
document.getElementById('btnPause').addEventListener('click', pauseRace);
document.getElementById('btn-resume').addEventListener('click', resumeRace);
document.getElementById('btn-quit').addEventListener('click', quitRace);

/* =========================================================
   UI WIRING
   ========================================================= */
document.getElementById('btn-enter').addEventListener('click', function(){
  buildHome();
  screen = 'home';
  showScreen('scr-home');
});

document.getElementById('btn-play').onclick = function(){
  buildMapGrid();
  screen = 'map';
  showScreen('scr-map');
};

document.getElementById('btn-shop').onclick = function(){
  buildShop();
  screen = 'shop';
  showScreen('scr-shop');
};

document.getElementById('btn-shop-back').onclick = function(){
  buildHome();
  screen = 'home';
  showScreen('scr-home');
};

document.getElementById('btn-map-back').onclick = function(){
  buildHome();
  screen = 'home';
  showScreen('scr-home');
};

document.getElementById('btn-newid').onclick = function(){
  if (!window.confirm('Start a new rider ID?\nThis will reset your coins, kits and best times.')) return;
  storage.removeItem(GUEST_KEY);
  user = loadGuest();
  buildHome();
};

document.getElementById('btn-again').onclick = function(){
  if (race) startRace(race.map.id);
};

document.getElementById('btn-result-home').onclick = function(){
  race = null;
  buildHome();
  screen = 'home';
  showScreen('scr-home');
};

/* =========================================================
   RESIZE
   ========================================================= */
function resizeApp(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

/* =========================================================
   MAIN LOOP
   ========================================================= */
function loop(ts){
  try {
    var dt = Math.min(0.05, (ts - lastTS)/1000 || 0);
    lastTS = ts;

    if (screen === 'match' && race){
      updateRace(dt);
      renderRace();
      updateHUD();
      renderLeaderboard();
    } else if (screen === 'home'){
      drawPreview(dt);
    } else {
      ctx.fillStyle = '#0a0f08';
      ctx.fillRect(0, 0, W, H);
    }
  } catch(err){
    if (window.console && console.error) console.error('Loop error:', err);
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('guest-id-display').textContent = user.id;
requestAnimationFrame(loop);
</script>
</body>
</html></template>

<script>

var storage = (function(){
  try {
    var t = '__dvp__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return window.localStorage;
  } catch(e){
    var mem = {};
    return {
      getItem: function(k){ return mem[k]===undefined?null:mem[k]; },
      setItem: function(k,v){ mem[k]=String(v); },
      removeItem: function(k){ delete mem[k]; }
    };
  }
})();

function clamp(v,a,b){ if (v<a) return a; if (v>b) return b; return v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function dist(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function shade(hex, amt){
  if (hex.charAt(0) !== '#') return hex;
  var n = parseInt(hex.slice(1),16);
  var r = clamp(Math.round(((n>>16)&255)+amt*255),0,255);
  var g = clamp(Math.round(((n>>8)&255)+amt*255),0,255);
  var b = clamp(Math.round((n&255)+amt*255),0,255);
  return 'rgb('+r+','+g+','+b+')';
}

/* =========================================================
   PLAYER DRAWING
   ========================================================= */
function drawPlayer(g, x, feetY, scale, opts){
  var kit = opts.kit;
  var skin = opts.skin;
  var hair = opts.hair;
  var facing = opts.facing || 1;
  var pose = opts.pose || 'ready';
  var isPlayer = opts.isPlayer;

  g.save();
  g.translate(x, feetY);
  g.scale(scale * facing, scale);

  /* Shadow */
  g.fillStyle = 'rgba(0,0,0,.30)';
  g.beginPath(); g.ellipse(0, 2, 26, 6, 0, 0, 7); g.fill();

  var legSpread = (pose === 'ready' || pose === 'jump' || pose === 'block') ? 10 : 5;
  var crouch = (pose === 'jump') ? -5 : 0;

  /* Legs */
  g.strokeStyle = kit.p;
  g.lineWidth = 10;
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-5, -30 + crouch); g.lineTo(-legSpread, -4); g.stroke();
  g.beginPath(); g.moveTo(5, -30 + crouch);  g.lineTo(legSpread, -4);  g.stroke();

  /* Shoes */
  g.fillStyle = kit.shoe;
  g.beginPath(); g.ellipse(-legSpread-3, -2, 9, 4, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(legSpread+3, -2, 9, 4, 0, 0, 7); g.fill();

  /* Shorts */
  g.fillStyle = shade(kit.p, -0.15);
  g.fillRect(-14, -40 + crouch, 28, 15);

  /* Torso */
  g.fillStyle = kit.p;
  g.beginPath();
  g.moveTo(-16, -42 + crouch);
  g.lineTo(-17, -78 + crouch);
  g.quadraticCurveTo(0, -85 + crouch, 17, -78 + crouch);
  g.lineTo(16, -42 + crouch);
  g.closePath(); g.fill();

  /* Jersey stripes */
  g.fillStyle = kit.s;
  g.fillRect(-16, -68 + crouch, 32, 6);
  g.fillRect(-16, -52 + crouch, 32, 3);

  /* Neck */
  g.fillStyle = skin;
  g.fillRect(-5, -88 + crouch, 10, 8);

  /* Head */
  g.beginPath(); g.arc(0, -98 + crouch, 11, 0, 7); g.fill();

  /* Hair */
  g.fillStyle = hair;
  g.beginPath(); g.arc(0, -100 + crouch, 12, Math.PI, Math.PI * 2); g.closePath(); g.fill();

  /* Eye */
  g.fillStyle = '#1a1a1a';
  g.beginPath(); g.arc(5, -97 + crouch, 1.8, 0, 7); g.fill();

  /* Arms based on pose */
  var armL = { angle: 0.3, len: 26 };
  var armR = { angle: -0.3, len: 26 };
  if (pose === 'jump'){   armL.angle = -0.9;  armR.angle = -1.2; }
  if (pose === 'hit'){    armL.angle = -1.6;  armR.angle = -1.9; armR.len = 30; }
  if (pose === 'block'){  armL.angle = -2.2;  armR.angle = -2.2; armL.len = 34; armR.len = 34; }
  if (pose === 'serve'){  armL.angle = 0.6;   armR.angle = -1.6; armR.len = 30; }

  g.strokeStyle = kit.p;
  g.lineWidth = 9;
  g.lineCap = 'round';

  /* Back arm */
  var lbx = -11, lby = -78 + crouch;
  var lex = lbx + Math.sin(armL.angle) * armL.len;
  var ley = lby - Math.cos(armL.angle) * armL.len;
  g.beginPath(); g.moveTo(lbx, lby); g.lineTo(lex, ley); g.stroke();
  g.fillStyle = skin;
  g.beginPath(); g.arc(lex, ley, 5, 0, 7); g.fill();

  /* Front arm */
  var rbx = 11, rby = -78 + crouch;
  var rex = rbx + Math.sin(armR.angle) * armR.len;
  var rey = rby - Math.cos(armR.angle) * armR.len;
  g.beginPath(); g.moveTo(rbx, rby); g.lineTo(rex, rey); g.stroke();
  g.fillStyle = skin;
  g.beginPath(); g.arc(rex, rey, 5, 0, 7); g.fill();

  /* Player highlight */
  if (isPlayer){
    g.strokeStyle = 'rgba(255,209,102,.85)';
    g.lineWidth = 3;
    g.setLineDash([6,4]);
    g.beginPath();
    g.ellipse(0, -50 + crouch, 32, 58, 0, 0, 7);
    g.stroke();
    g.setLineDash([]);
    g.fillStyle = '#ffd166';
    g.font = 'bold 13px system-ui,sans-serif';
    g.textAlign = 'center';
    g.fillText('YOU', 0, -122 + crouch);
  }

  g.restore();
}

var prevCanvas = document.getElementById('prev');
var prevCtx = prevCanvas.getContext('2d');

function drawPreview(dt){
  var g = prevCtx;
  g.clearRect(0,0,prevCanvas.width,prevCanvas.height);

  var grd = g.createRadialGradient(190, 300, 30, 190, 300, 220);
  grd.addColorStop(0, 'rgba(255,209,102,.20)');
  grd.addColorStop(1, 'rgba(255,209,102,0)');
  g.fillStyle = grd; g.fillRect(0,0,prevCanvas.width,prevCanvas.height);

  g.fillStyle = 'rgba(200,168,106,.35)';
  g.fillRect(0, 380, prevCanvas.width, 60);
  g.fillStyle = 'rgba(255,255,255,.10)';
  g.fillRect(0, 380, prevCanvas.width, 2);

  prevPhase += dt;
  var pose = 'ready';
  if (prevJump >= 0){
    prevJump += dt / 0.7;
    if (prevJump >= 1) prevJump = -1;
    pose = 'jump';
  } else if (prevJumpTimer > 2.5){
    prevJumpTimer = 0;
    prevJump = 0;
  } else {
    prevJumpTimer += dt;
  }

  var jumpH = 0;
  if (prevJump >= 0) jumpH = Math.sin(prevJump * Math.PI) * 90;

  drawPlayer(g, 190, 380 - jumpH, 1.5, {
    kit: getKit(user.equipped),
    skin: SKINS[user.skin],
    hair: HAIRS[user.hair],
    facing: 1, pose: pose, isPlayer: false
  });

  g.fillStyle = 'rgba(255,255,255,.35)';
  g.font = '600 11px system-ui,sans-serif';
  g.textAlign = 'center';
  g.fillText(POSITIONS[user.position || 0].toUpperCase(), 190, 425);
}

function createPlayer(team, role, homeX, country, kit, num){
  return {
    team: team, role: role,
    x: homeX, y: 0, vx: 0, vy: 0,
    homeX: homeX, onGround: true,
    isControlled: false, num: num,
    country: country, kit: kit,
    hasTouched: false, pose: 'ready', poseTimer: 0,
    hitCooldown: 0
  };
}

function startMatch(oppCountryId, courtId){
  var court = getCourt(courtId || selCourt);
  var countryA = getCountry(selCountry);
  var countryB;
  if (oppCountryId) countryB = getCountry(oppCountryId);
  else {
    var pool = [];
    for (var i=0;i<COUNTRIES.length;i++) if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
    countryB = pool[Math.floor(Math.random()*pool.length)];
  }

  var userTeam = [
    createPlayer('user', 'setter', 420, countryA, getKit(user.equipped), 7),
    createPlayer('user', 'spiker', 540, countryA, getKit(user.equipped), 10),
    createPlayer('user', 'libero', 260, countryA, getKit(user.equipped), 4)
  ];
  var oppKit = { p: countryB.p, s: countryB.s, shoe:'#1a1a1a' };
  var oppTeam = [
    createPlayer('opp', 'setter', 860, countryB, oppKit, 7),
    createPlayer('opp', 'spiker', 740, countryB, oppKit, 10),
    createPlayer('opp', 'libero', 1020, countryB, oppKit, 4)
  ];

  var ctrlIdx = 1;
  for (var ci=0; ci<userTeam.length; ci++) userTeam[ci].isControlled = (ci === ctrlIdx);

  match = {
    court: court,
    countryA: countryA, countryB: countryB,
    userTeam: userTeam, oppTeam: oppTeam,
    allPlayers: userTeam.concat(oppTeam),
    ctrlIdx: ctrlIdx,
    ball: { x: 0, y: 0, vx: 0, vy: 0, active: false, lastHitTeam: null, serveOrigin: false },
    scoreA: 0, scoreB: 0,
    touches: { user: 0, opp: 0 },
    state: 'serve',
    stateTimer: 1.6,
    servingTeam: Math.random() < 0.5 ? 'user' : 'opp',
    servePhase: 'idle',   /* idle | tossing */
    serveTossTimer: 0,
    spikeCountA: 0, spikeCountB: 0,
    blockCountA: 0, blockCountB: 0,
    aceCountA: 0, aceCountB: 0,
    playerPoints: 0,
    errorFlash: 0
  };

  resetRally('serve');
  screen = 'match';
  showScreen('');
  document.getElementById('hud-match').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  press.jump = press.spike = press.set = press.pass = press.block = press.serve = false;
  updateScoreboard();
  updateCtrlLabel();
  updateHint();
  setNotice(match.servingTeam === 'user' ? 'YOUR SERVE' : '🔥 OPPONENT SERVES');
}

function resetRally(state){
  if (!match) return;
  for (var i=0;i<match.allPlayers.length;i++){
    var p = match.allPlayers[i];
    p.x = p.homeX;
    p.y = 0; p.vx = 0; p.vy = 0;
    p.onGround = true;
    p.hasTouched = false;
    p.pose = 'ready';
    p.poseTimer = 0;
    p.hitCooldown = 0;
  }

  /* Place ball at server's hand (waist height) */
  if (match.servingTeam === 'user'){
    var srv = match.userTeam[1];
    match.ball.x = srv.x + 22;
    match.ball.y = COURT_GROUND - HAND_OFFSET - 10;
  } else {
    var srv2 = match.oppTeam[1];
    match.ball.x = srv2.x - 22;
    match.ball.y = COURT_GROUND - HAND_OFFSET - 10;
  }
  match.ball.vx = 0;
  match.ball.vy = 0;
  match.ball.active = false;
  match.ball.lastHitTeam = null;
  match.ball.serveOrigin = true;
  match.touches.user = 0;
  match.touches.opp = 0;
  match.state = state || 'serve';
  match.stateTimer = state === 'serve' ? 1.5 : 0.9;
  match.servePhase = 'idle';
  match.serveTossTimer = 0;
  manualMoveTimer = 0;
  manualDir = 0;
}

  n.textContent = txt;
  n.classList.add('on');
  clearTimeout(n._t);
  n._t = setTimeout(function(){ n.classList.remove('on'); }, 1200);

function updateCtrlLabel(){

function updateHint(){
  var el = document.getElementById('hud-hint');
  if (!match) return;
  if (match.state === 'serve'){
    if (match.servingTeam === 'user') el.textContent = '🏐 TAP SERVE';
    else el.textContent = 'OPPONENT SERVING';
    return;
  }
  if (match.state === 'rally' && match.touches.user === 0){
    el.textContent = '➤ TAP PASS';
  } else if (match.state === 'rally' && match.touches.user === 1){
    el.textContent = '⬆ TAP SET';
  } else if (match.state === 'rally' && match.touches.user === 2){
    el.textContent = '⚡ TAP SPIKE';
  } else {
    el.textContent = 'FIGHT!';
  }
}

function controlledPlayer(){
  if (!match) return null;
  return match.userTeam[match.ctrlIdx];
}

/* =========================================================
   BALL PHYSICS
   ========================================================= */
function stepBall(dt){
  var b = match.ball;
  b.vy += BALL_GRAVITY * dt;
  b.vx *= Math.pow(1 - BALL_DRAG, dt);
  b.x += b.vx * dt;
  b.y += b.vy * dt;
}

function predictBall(dt){
  var b = match.ball;
  if (!b.active) return { x: b.x, y: b.y };
  var sx = b.x, sy = b.y, svx = b.vx, svy = b.vy;
  var step = 1/60;
  var n = Math.max(1, Math.ceil(dt / step));
  for (var i=0;i<n;i++){
    svy += BALL_GRAVITY * step;
    svx *= Math.pow(1 - BALL_DRAG, step);
    sx += svx * step;
    sy += svy * step;
  }
  return { x: sx, y: sy };
}

function predictLandingX(){
  var b = match.ball;
  if (!b.active) return b.x;
  var sx = b.x, sy = b.y, svx = b.vx, svy = b.vy;
  var step = 1/60;
  for (var i=0;i<300;i++){
    svy += BALL_GRAVITY * step;
    svx *= Math.pow(1 - BALL_DRAG, step);
    sx += svx * step;
    sy += svy * step;
    if (sy >= COURT_GROUND - BALL_R) break;
  }
  return sx;
}

/* =========================================================
   HIT LOGIC — uses screen-space distance
   ========================================================= */
function playerHandY(p){
  return COURT_GROUND - p.y - HAND_OFFSET;
}

function ballInReach(p, kind){
  var b = match.ball;
  var handX = p.x + (p.team === 'user' ? 15 : -15);
  var handY = playerHandY(p) - 20;   /* raised hand during hit */
  var reach = (kind === 'block') ? BLOCK_REACH : HIT_REACH;
  var d = dist(handX, handY, b.x, b.y);
  return d < reach;
}

function tryHit(p, kind){
  if (!p) return false;
  if (p.hitCooldown > 0) return false;
  if (!ballInReach(p, kind)) return false;

  var team = p.team;
  if (team === 'user' && match.touches.user >= MAX_TOUCHES) return false;
  if (team === 'opp' && match.touches.opp >= MAX_TOUCHES) return false;

  var b = match.ball;
  var dir = (team === 'user') ? 1 : -1;

  /* Move ball to contact point (player's hand) so it looks clean */
  b.x = p.x + dir * 20;
  b.y = playerHandY(p) - 30;

  if (kind === 'spike'){
    b.vx = dir * rnd(680, 820);
    b.vy = rnd(240, 360);                /* strong downward */
    if (team === 'user') match.spikeCountA++;
    else match.spikeCountB++;
  } else if (kind === 'set'){
    b.vx = dir * rnd(90, 160);
    b.vy = -1000;                         /* very high arc */
  } else if (kind === 'pass'){
    b.vx = dir * rnd(360, 460);
    b.vy = -820;                          /* decent arc over net */
  } else if (kind === 'block'){
    b.vx = -dir * rnd(300, 420);
    b.vy = rnd(-200, -60);
    if (team === 'user') match.blockCountA++;
    else match.blockCountB++;
  }

  p.hasTouched = true;
  p.pose = (kind === 'block') ? 'block' : 'hit';
  p.poseTimer = 0;
  p.hitCooldown = 0.30;

  if (team === 'user') match.touches.user++;
  else match.touches.opp++;

  b.active = true;
  b.lastHitTeam = team;
  b.serveOrigin = false;
  match.state = 'rally';
  match.errorFlash = 0.08;
  updateHint();
  return true;
}

/* =========================================================
   UPDATE BALL & CHECK POINTS
   ========================================================= */
function updateBall(dt){
  var b = match.ball;
  if (!b.active) return;

  stepBall(dt);

  /* Net collision */
  if (b.x + BALL_R > NET_X - 4 && b.x - BALL_R < NET_X + 4){
    if (b.y > NET_TOP){
      var prevX = b.x - b.vx * dt;
      if (prevX < NET_X && b.x >= NET_X - 4){
        b.x = NET_X - BALL_R - 4;
        b.vx = -Math.abs(b.vx) * 0.30;
      } else if (prevX > NET_X && b.x <= NET_X + 4){
        b.x = NET_X + BALL_R + 4;
        b.vx = Math.abs(b.vx) * 0.30;
      }
    }
  }

  /* Ground */
  if (b.y + BALL_R >= COURT_GROUND){
    b.y = COURT_GROUND - BALL_R;
    var lastTeam = b.lastHitTeam;
    var side = (b.x < NET_X) ? 'user' : 'opp';

    if (b.serveOrigin){
      if (lastTeam === 'opp' && side === 'user') match.aceCountB++;
      else if (lastTeam === 'user' && side === 'opp') match.aceCountA++;
    }

    if (lastTeam){
      if (side === lastTeam) awardPoint(lastTeam === 'user' ? 'opp' : 'user');
      else awardPoint(lastTeam);
    } else {
      awardPoint(side === 'user' ? 'opp' : 'user');
    }
    return;
  }

  /* Side out */
  if (b.x < COURT_L - 40){ awardPoint('opp'); return; }
  if (b.x > COURT_R + 40){ awardPoint('user'); return; }
  if (b.y < -80){ b.y = -80; b.vy = Math.abs(b.vy) * 0.3; }
}

function awardPoint(team){
  if (match.state === 'point') return;
  if (team === 'user'){ match.scoreA++; match.playerPoints += 1; }
  else match.scoreB++;
  match.state = 'point';
  match.stateTimer = 1.3;
  setNotice(team === 'user' ? '⚡ POINT!' : '🔥 OPPONENT SCORES');
  updateScoreboard();
  match.servingTeam = team;

  var aWon = match.scoreA >= POINTS_TO_WIN && (match.scoreA - match.scoreB) >= WIN_BY;
  var bWon = match.scoreB >= POINTS_TO_WIN && (match.scoreB - match.scoreA) >= WIN_BY;
  if (aWon || bWon){
    match.state = 'ended';
    match.winner = aWon ? 'user' : 'opp';
    match.stateTimer = 1.8;
  }
}

/* =========================================================
   UPDATE PLAYER PHYSICS (JUMP FIX)
   ========================================================= */
function stepPlayerPhysics(p, dt){
  if (!p.onGround){
    p.vy -= PLAYER_GRAVITY * dt;
    p.y += p.vy * dt;
    if (p.y <= 0){
      p.y = 0;
      p.vy = 0;
      p.onGround = true;
      if (p.pose === 'jump' || p.pose === 'block') p.pose = 'ready';
    }
  }
}

function movePlayerX(p, dt, dir, speed){
  p.vx = dir * speed;
  p.x += p.vx * dt;
  if (p.team === 'user') p.x = clamp(p.x, COURT_L + 30, NET_X - 34);
  else p.x = clamp(p.x, NET_X + 34, COURT_R - 30);
}

/* =========================================================
   AUTO-MOVE (user's controlled player)
   ========================================================= */
function autoMoveUser(p, dt){
  if (manualMoveTimer > 0){
    manualMoveTimer -= dt;
    movePlayerX(p, dt, manualDir, MOVE_SPEED * 1.05);
    return;
  }
  if (keys.left){ movePlayerX(p, dt, -1, MOVE_SPEED); return; }
  if (keys.right){ movePlayerX(p, dt, 1, MOVE_SPEED); return; }

  var b = match.ball;
  var ballActive = b.active || match.state === 'rally';
  var ballOnMySide = b.x < NET_X + 20;

  if (ballActive && ballOnMySide){
    var landX = predictLandingX();
    /* Aim a bit behind the landing so player is under the ball */
    var targetX = clamp(landX - 5, COURT_L + 40, NET_X - 40);
    var dx = targetX - p.x;
    if (Math.abs(dx) > 5){
      var dir = dx > 0 ? 1 : -1;
      var speed = MOVE_SPEED * clamp(Math.abs(dx) / 100, 0.65, 1.05);
      movePlayerX(p, dt, dir, speed);
      return;
    }
    /* At position — auto-jump if ball is high and falling */
    if (p.onGround && b.vy > 0){
      var pred = predictBall(0.2);
      if (pred.y > playerHandY(p) - 140 && pred.y < playerHandY(p) + 20){
        /* Don't auto-jump — let user press JUMP */
      }
    }
  } else {
    var dxh = p.homeX - p.x;
    if (Math.abs(dxh) > 5){
      movePlayerX(p, dt, dxh > 0 ? 1 : -1, MOVE_SPEED * 0.7);
    } else {
      p.vx = 0;
    }
  }
}

/* =========================================================
   AI TEAMMATES + OPPONENT
   ========================================================= */
var HARD = { speedMult: 1.55, accuracy: 0.96, jumpChance: 0.98, reachBonus: 25 };

function updateAI(p, dt){
  if (p.team === 'user' && p.isControlled) return;

  var b = match.ball;
  var team = p.team;
  var myTeam = (team === 'user') ? match.userTeam : match.oppTeam;
  var speedMult = (team === 'opp') ? HARD.speedMult : 1.15;

  var ballOnMySide = (team === 'user') ? (b.x < NET_X + 20) : (b.x > NET_X - 20);
  var ballActive = b.active || match.state === 'rally';

  var targetX = p.homeX;

  if (ballOnMySide && ballActive){
    var landX = predictLandingX();
    var lookX = clamp(landX - 5, COURT_L + 40, COURT_R - 40);

    /* Only the closest player moves to intercept */
    var closest = null, closestD = Infinity;
    for (var i=0;i<myTeam.length;i++){
      var t = myTeam[i];
      var d = Math.abs(t.x - lookX);
      if (d < closestD){ closestD = d; closest = t; }
    }
    if (closest === p){
      targetX = lookX;
    } else {
      /* Support position: others spread out */
      if (team === 'user') targetX = p.homeX + (p.role === 'setter' ? -20 : 40);
      else targetX = p.homeX + (p.role === 'setter' ? 20 : -40);
    }
  }

  var dx = targetX - p.x;
  if (Math.abs(dx) > 3){
    var dir = dx > 0 ? 1 : -1;
    var urgency = clamp(Math.abs(dx) / 90, 0.7, 1.5);
    movePlayerX(p, dt, dir, MOVE_SPEED * speedMult * urgency);
  } else {
    p.vx *= 0.75;
  }

  /* Jump decision */
  if (p.onGround && ballOnMySide && ballActive){
    var pred = predictBall(0.15);
    var ballClose = Math.abs(pred.x - p.x) < 90;
    var ballHigh = pred.y < playerHandY(p) - 20;
    var falling = b.vy > 0;
    if (ballClose && ballHigh && falling && Math.random() < HARD.jumpChance * dt * 12){
      p.vy = JUMP_V;
      p.onGround = false;
      p.pose = 'jump';
    }
  }

  stepPlayerPhysics(p, dt);

  /* Hit decision */
  if (p.hitCooldown > 0){ p.hitCooldown -= dt; return; }

  if (match.state === 'rally' && b.active){
    var teamTouches = (team === 'user') ? match.touches.user : match.touches.opp;
    if (teamTouches >= MAX_TOUCHES) return;

    /* Ball in reach? */
    var handX = p.x + (team === 'user' ? 15 : -15);
    var handY = playerHandY(p) - 20;
    var d = dist(handX, handY, b.x, b.y);
    if (d > HIT_REACH + HARD.reachBonus) return;

    /* Roll for accuracy */
    if (Math.random() > HARD.accuracy) { p.hitCooldown = 0.15; return; }

    /* Pick hit type based on touch count */
    var dir2 = (team === 'user') ? 1 : -1;
    var inAir = !p.onGround;
    var nearNet = (team === 'user') ? (p.x > NET_X - 280) : (p.x < NET_X + 280);

    var kind;
    if (teamTouches === 0) kind = 'pass';
    else if (teamTouches === 1) kind = 'set';
    else {
      if (inAir && nearNet) kind = 'spike';
      else if (nearNet) kind = 'spike';
      else kind = 'pass';
    }

    /* Apply */
    b.x = p.x + dir2 * 20;
    b.y = playerHandY(p) - 30;
    if (kind === 'spike'){
      b.vx = dir2 * rnd(700, 840);
      b.vy = rnd(260, 380);
      if (team === 'user') match.spikeCountA++;
      else match.spikeCountB++;
    } else if (kind === 'set'){
      b.vx = dir2 * rnd(90, 160);
      b.vy = -1000;
    } else {
      b.vx = dir2 * rnd(380, 480);
      b.vy = -840;
    }

    p.hasTouched = true;
    p.pose = 'hit';
    p.poseTimer = 0;
    if (team === 'user') match.touches.user++;
    else match.touches.opp++;
    b.active = true;
    b.lastHitTeam = team;
    b.serveOrigin = false;
    match.state = 'rally';
    p.hitCooldown = 0.32;
  }
}

/* =========================================================
   MATCH UPDATE
   ========================================================= */
function updateMatch(dt){
  if (!match) return;
  if (match.errorFlash > 0) match.errorFlash -= dt;

  /* Auto-switch control to nearest teammate when ball is incoming */
  if ((match.state === 'rally' || match.ball.active) && match.ball.x < NET_X + 100){
    var landX = predictLandingX();
    var bestIdx = match.ctrlIdx, bestD = Math.abs(match.userTeam[match.ctrlIdx].x - landX);
    for (var i=0;i<match.userTeam.length;i++){
      var d = Math.abs(match.userTeam[i].x - landX);
      if (d < bestD - 30){ bestD = d; bestIdx = i; }
    }
    if (bestIdx !== match.ctrlIdx){
      match.ctrlIdx = bestIdx;
      for (var j=0;j<match.userTeam.length;j++) match.userTeam[j].isControlled = (j === bestIdx);
      updateCtrlLabel();
    }
  }

  /* ---------- SERVE STATE ---------- */
  if (match.state === 'serve'){
    match.stateTimer -= dt;

    /* Controlled player can move */
    var cp0 = controlledPlayer();
    if (cp0){
      autoMoveUser(cp0, dt);
      stepPlayerPhysics(cp0, dt);
    }
    /* Other players just stand */
    for (var s=0;s<match.userTeam.length;s++){
      if (match.userTeam[s] !== cp0) stepPlayerPhysics(match.userTeam[s], dt);
    }
    for (var s2=0;s2<match.oppTeam.length;s2++) stepPlayerPhysics(match.oppTeam[s2], dt);

    /* Handle toss phase */
    if (match.servePhase === 'tossing'){
      match.serveTossTimer -= dt;
      stepBall(dt);
      if (match.serveTossTimer <= 0){
        /* Hit the ball over the net */
        var server = (match.servingTeam === 'user') ? match.userTeam[1] : match.oppTeam[1];
        var dir = (match.servingTeam === 'user') ? 1 : -1;
        match.ball.x = server.x + dir * 22;
        match.ball.y = Math.max(match.ball.y, 280);
        match.ball.vx = dir * 620;
        match.ball.vy = -280;
        match.ball.active = true;
        match.ball.serveOrigin = true;
        server.pose = 'hit';
        server.poseTimer = 0;
        match.state = 'rally';
        if (match.servingTeam === 'user') match.touches.user = 1;
        else match.touches.opp = 1;
        match.servePhase = 'idle';
        setNotice('RALLY!');
        updateHint();
      }
      press.serve = false;
      return;
    }

    /* AI auto-serve when timer expires */
    if (match.stateTimer <= 0 && match.servingTeam === 'opp' && match.servePhase === 'idle'){
      var ai = match.oppTeam[1];
      ai.vy = JUMP_V;
      ai.onGround = false;
      ai.pose = 'jump';
      match.ball.x = ai.x - 22;
      match.ball.y = COURT_GROUND - HAND_OFFSET - 10;
      match.ball.vx = 0;
      match.ball.vy = -520;
      match.ball.active = false;
      match.servePhase = 'tossing';
      match.serveTossTimer = 0.30;
      return;
    }

    /* User serve press */
    if (match.servingTeam === 'user' && press.serve && match.servePhase === 'idle'){
      var serverU = match.userTeam[1];
      serverU.vy = JUMP_V;
      serverU.onGround = false;
      serverU.pose = 'jump';
      match.ball.x = serverU.x + 22;
      match.ball.y = COURT_GROUND - HAND_OFFSET - 10;
      match.ball.vx = 0;
      match.ball.vy = -520;
      match.ball.active = false;
      match.servePhase = 'tossing';
      match.serveTossTimer = 0.30;
      setNotice('JUMP SERVE!');
    }
    press.serve = false;
    press.jump = press.spike = press.set = press.pass = press.block = false;
    return;
  }

  /* ---------- POINT STATE ---------- */
  if (match.state === 'point'){
    match.stateTimer -= dt;
    for (var pi=0;pi<match.allPlayers.length;pi++) stepPlayerPhysics(match.allPlayers[pi], dt);
    if (match.stateTimer <= 0){
      resetRally('serve');
      setNotice(match.servingTeam === 'user' ? 'YOUR SERVE' : '🔥 OPPONENT SERVES');
      updateHint();
    }
    return;
  }

  /* ---------- ENDED ---------- */
  if (match.state === 'ended'){
    match.stateTimer -= dt;
    if (match.stateTimer <= 0) endMatch();
    return;
  }

  /* ---------- RALLY ---------- */
  var cp = controlledPlayer();

  /* User input */
  if (cp){
    autoMoveUser(cp, dt);

    if (press.jump && cp.onGround){
      cp.vy = JUMP_V;
      cp.onGround = false;
      cp.pose = 'jump';
      press.jump = false;
    }
    if (press.spike){ tryHit(cp, 'spike'); press.spike = false; }
    if (press.set){ tryHit(cp, 'set'); press.set = false; }
    if (press.pass){ tryHit(cp, 'pass'); press.pass = false; }
    if (press.block){ tryHit(cp, 'block'); press.block = false; }
    press.jump = false;
  }

  /* AI players */
  for (var k=0;k<match.userTeam.length;k++){
    if (match.userTeam[k] === cp) continue;
    updateAI(match.userTeam[k], dt);
  }
  for (var k2=0;k2<match.oppTeam.length;k2++) updateAI(match.oppTeam[k2], dt);

  /* Player physics for controlled */
  if (cp) stepPlayerPhysics(cp, dt);

  /* Ball */
  updateBall(dt);

  /* Pose timers */
  for (var pz=0;pz<match.allPlayers.length;pz++){
    var pl = match.allPlayers[pz];
    if (pl.pose === 'hit' || pl.pose === 'block'){
      pl.poseTimer += dt;
      if (pl.poseTimer > 0.28){
        pl.pose = pl.onGround ? 'ready' : 'jump';
        pl.poseTimer = 0;
      }
    }
  }

  updateScoreboard();
  updateHint();
}

/* =========================================================
   END MATCH
   ========================================================= */
function endMatch(){
  if (!match) return;
  var win = (match.winner === 'user');
  var reward = win ? WIN_COINS : 0;
  user.coins += reward;
  user.matches = (user.matches || 0) + 1;
  if (win) user.wins = (user.wins || 0) + 1;
  else user.losses = (user.losses || 0) + 1;
  user.pointsWon = (user.pointsWon || 0) + match.playerPoints;
  saveGuest();

  document.getElementById('res-loc').textContent = match.court.name.toUpperCase();
  var outcomeEl = document.getElementById('res-outcome');
  outcomeEl.textContent = win ? 'VICTORY' : 'DEFEAT';
  outcomeEl.className = 'res-outcome' + (win ? '' : ' loss');
  document.getElementById('res-score').textContent = match.scoreA + ' – ' + match.scoreB;
  document.getElementById('res-teams').textContent =
    match.countryA.name.toUpperCase() + '  vs  ' + match.countryB.name.toUpperCase();

  document.getElementById('res-spikes').textContent = match.spikeCountA;
  document.getElementById('res-aces').textContent = match.aceCountA;
  document.getElementById('res-blocks').textContent = match.blockCountA;
  document.getElementById('res-points').textContent = match.playerPoints;

  var rewardEl = document.getElementById('res-reward');
  if (reward > 0){
    rewardEl.textContent = '+100 🪙  Victory!';
    rewardEl.className = 'reward';
  } else {
    rewardEl.textContent = 'No reward — win to earn coins.';
    rewardEl.className = 'reward none';
  }

  if (tournament && tournament.active){
    tournament.recordResult(match.scoreA, match.scoreB);
  }

  screen = 'result';
  showScreen('scr-result');
  document.getElementById('hud-match').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('notice').classList.remove('on');
}

/* =========================================================
   RENDER
   ========================================================= */
function renderMatch(){
  if (!match) return;
  var g = ctx;
  var court = match.court;

  var bgGrad = g.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0, court.bg);
  bgGrad.addColorStop(1, shade(court.bg, -0.25));
  g.fillStyle = bgGrad;
  g.fillRect(0,0,W,H);

  /* Arena grid */
  g.strokeStyle = 'rgba(255,255,255,.04)';
  g.lineWidth = 1;
  for (var w = 100; w < W; w += 100){
    g.beginPath(); g.moveTo(w, 0); g.lineTo(w, COURT_GROUND); g.stroke();
  }
  for (var hh = 100; hh < COURT_GROUND; hh += 100){
    g.beginPath(); g.moveTo(0, hh); g.lineTo(W, hh); g.stroke();
  }

  /* Floor */
  var floorGrad = g.createLinearGradient(0, COURT_GROUND, 0, H);
  floorGrad.addColorStop(0, shade(court.floor, 0.10));
  floorGrad.addColorStop(1, shade(court.floor, -0.20));
  g.fillStyle = floorGrad;
  g.fillRect(0, COURT_GROUND, W, H - COURT_GROUND);
  g.fillStyle = shade(court.floor, 0.20);
  g.fillRect(0, COURT_GROUND - 3, W, 5);

  /* Court boundary */
  g.strokeStyle = court.line;
  g.lineWidth = 3;
  g.strokeRect(COURT_L, COURT_TOP, COURT_R - COURT_L, COURT_GROUND - COURT_TOP);

  /* Attack lines */
  g.strokeStyle = 'rgba(255,255,255,.35)';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(NET_X - 260, COURT_TOP); g.lineTo(NET_X - 260, COURT_GROUND);
  g.moveTo(NET_X + 260, COURT_TOP); g.lineTo(NET_X + 260, COURT_GROUND);
  g.stroke();

  /* Landing prediction */
  var b = match.ball;
  if (b.active && b.vy > 0){
    var landX = predictLandingX();
    if (landX > COURT_L && landX < COURT_R){
      g.strokeStyle = 'rgba(255,209,102,.55)';
      g.lineWidth = 2;
      g.beginPath();
      g.ellipse(landX, COURT_GROUND - 2, 22, 6, 0, 0, 7);
      g.stroke();
    }
  }

  drawNet(g);

  /* Ball shadow */
  if (b.active || match.state === 'serve'){
    g.fillStyle = 'rgba(0,0,0,.25)';
    var shScale = clamp(1 - (COURT_GROUND - b.y) / 800, 0.3, 1);
    g.beginPath();
    g.ellipse(b.x, COURT_GROUND + 3, 14 * shScale, 4 * shScale, 0, 0, 7);
    g.fill();
  }

  /* Players — controlled last */
  var sorted = match.allPlayers.slice().sort(function(a,b2){
    if (a.isControlled) return 1;
    if (b2.isControlled) return -1;
    return a.x - b2.x;
  });
  for (var i=0;i<sorted.length;i++){
    var p = sorted[i];
    var feetY = COURT_GROUND - p.y;
    var skinIdx = (p.team === 'user') ? user.skin : (i % SKINS.length);
    var hairIdx = (p.team === 'user') ? user.hair : (i % HAIRS.length);
    drawPlayer(g, p.x, feetY, 1.0, {
      kit: p.kit,
      skin: SKINS[skinIdx],
      hair: HAIRS[hairIdx],
      facing: (p.team === 'user') ? 1 : -1,
      pose: p.pose,
      isPlayer: p.isControlled
    });
  }

  /* Ball */
  if (b.active || match.state === 'serve'){
    /* Trail */
    if (Math.abs(b.vx) + Math.abs(b.vy) > 200){
      g.fillStyle = 'rgba(255,209,102,.15)';
      g.beginPath(); g.arc(b.x - b.vx * 0.02, b.y - b.vy * 0.02, BALL_R * 0.8, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(255,209,102,.30)';
    g.beginPath(); g.arc(b.x, b.y, BALL_R + 8, 0, 7); g.fill();

    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(b.x, b.y, BALL_R, 0, 7); g.fill();

    g.strokeStyle = '#ffd166';
    g.lineWidth = 2;
    g.beginPath(); g.arc(b.x, b.y - 4, BALL_R * 0.9, Math.PI*0.1, Math.PI*0.9); g.stroke();
    g.beginPath(); g.arc(b.x, b.y + 4, BALL_R * 0.9, Math.PI*1.1, Math.PI*1.9); g.stroke();
    g.strokeStyle = '#4cc9f0';
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(b.x - 5, b.y, BALL_R * 0.6, 0, 7); g.stroke();
    g.beginPath(); g.arc(b.x + 5, b.y, BALL_R * 0.6, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.35)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(b.x, b.y, BALL_R, 0, 7); g.stroke();
  }

  /* Serve prompt */
  if (match.state === 'serve' && match.servePhase === 'idle'){
    g.fillStyle = 'rgba(0,0,0,.40)';
    g.fillRect(0, H/2 - 60, W, 120);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (match.servingTeam === 'user'){
      g.fillStyle = '#ffd166';
      g.font = 'bold 54px system-ui,sans-serif';
      g.fillText('YOUR SERVE', W/2, H/2);
      g.fillStyle = 'rgba(255,255,255,.75)';
      g.font = 'bold 18px system-ui,sans-serif';
      g.fillText('Tap 🏐 SERVE for a jump serve', W/2, H/2 + 44);
    } else {
      g.fillStyle = '#ff8a5c';
      g.font = 'bold 54px system-ui,sans-serif';
      g.fillText('🔥 OPPONENT SERVES', W/2, H/2);
    }
    g.textBaseline = 'alphabetic';
  }

  /* Error flash */
  if (match.errorFlash > 0){
    g.fillStyle = 'rgba(255,255,255,' + (match.errorFlash * 3) + ')';
    g.fillRect(0,0,W,H);
  }
}

function drawNet(g){
  g.fillStyle = '#3a3a3a';
  g.fillRect(NET_X - 4, NET_TOP - 12, 8, NET_BOTTOM - NET_TOP + 20);
  g.fillStyle = '#ffffff';
  g.fillRect(NET_X - 6, NET_TOP - 10, 12, 6);

  g.strokeStyle = 'rgba(255,255,255,.55)';
  g.lineWidth = 1;
  var rows = 10;
  for (var r=0; r<=rows; r++){
    var y = NET_TOP + r * (NET_BOTTOM - NET_TOP) / rows;
    g.beginPath(); g.moveTo(NET_X - 4, y); g.lineTo(NET_X + 4, y); g.stroke();
  }
  var cols = 16;
  for (var c=0; c<=cols; c++){
    var cy = NET_TOP + c * (NET_BOTTOM - NET_TOP) / cols;
    g.beginPath(); g.moveTo(NET_X - 4, cy); g.lineTo(NET_X + 4, cy); g.stroke();
  }
  var ngl = g.createLinearGradient(NET_X - 20, 0, NET_X + 20, 0);
  ngl.addColorStop(0, 'rgba(255,255,255,0)');
  ngl.addColorStop(0.5, 'rgba(255,255,255,.08)');
  ngl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = ngl;
  g.fillRect(NET_X - 20, NET_TOP - 10, 40, NET_BOTTOM - NET_TOP + 10);
}

/* =========================================================
   TOURNAMENT (kept from before)
   ========================================================= */
function buildTournament(){
  var pool = [];
  for (var i=0;i<COUNTRIES.length;i++){
    if (COUNTRIES[i].id !== selCountry) pool.push(COUNTRIES[i]);
  }
  for (var s=0;s<pool.length;s++){
    var r = Math.floor(Math.random()*pool.length);
    var tmp = pool[s]; pool[s] = pool[r]; pool[r] = tmp;
  }
  var teams = [getCountry(selCountry)].concat(pool.slice(0, 7));

  var r0 = [];
  for (var q=0;q<8;q+=2){
    r0.push({ a: teams[q], b: teams[q+1], scoreA:null, scoreB:null, winner:null, played:false });
  }
  var rounds = [r0,
    [{a:null,b:null,winner:null,played:false},{a:null,b:null,winner:null,played:false}],
    [{a:null,b:null,winner:null,played:false}]];

  tournament = {
    active: true, rounds: rounds,
    userCountry: getCountry(selCountry),
    userMatchRound: 0, userMatchIdx: -1,
    court: selCourt, reward: 0, champion: null,
    recordResult: function(sA, sB){
      var r = this.userMatchRound, i = this.userMatchIdx;
      if (r < 0 || i < 0) return;
      var m = this.rounds[r][i];
      m.scoreA = sA; m.scoreB = sB;
      m.played = true;
      m.winner = (sA > sB) ? m.a : m.b;
      this.simulateRound(r);
      if (r < this.rounds.length - 1){
        this.userMatchRound = r + 1;
        this.userMatchIdx = -1;
        var nextRound = this.rounds[r+1];
        for (var k=0;k<nextRound.length;k++){
          if (nextRound[k].a === this.userCountry || nextRound[k].b === this.userCountry){
            this.userMatchIdx = k; break;
          }
        }
        if (this.userMatchIdx === -1) this.userMatchIdx = 0;
      }
      if (r === this.rounds.length - 1){
        this.champion = m.winner;
        if (this.champion === this.userCountry){
          user.trophies = (user.trophies || 0) + 1;
          this.reward = 500;
          user.coins += 500;
          saveGuest();
        }
      }
    },
    simulateRound: function(r){
      var matches = this.rounds[r];
      for (var i=0;i<matches.length;i++){
        var m = matches[i];
        if (m.played) continue;
        if (m.a === this.userCountry || m.b === this.userCountry) continue;
        if (!m.a || !m.b) continue;
        var sA = 15 + Math.floor(Math.random() * 4);
        var sB = 15 + Math.floor(Math.random() * 4);
        while (sA === sB) sB = 15 + Math.floor(Math.random() * 4);
        m.scoreA = sA; m.scoreB = sB;
        m.played = true;
        m.winner = (sA > sB) ? m.a : m.b;
      }
      if (r < this.rounds.length - 1){
        var next = this.rounds[r + 1];
        for (var j=0;j<matches.length;j++){
          var winner = matches[j].winner;
          var slot = next[Math.floor(j / 2)];
          if (j % 2 === 0) slot.a = winner;
          else slot.b = winner;
        }
      }
    }
  };

  var round0 = tournament.rounds[0];
  for (var x=0;x<round0.length;x++){
    if (round0[x].a === tournament.userCountry || round0[x].b === tournament.userCountry){
      tournament.userMatchRound = 0;
      tournament.userMatchIdx = x;
      break;
    }
  }
}

function renderTournament(){
  var body = document.getElementById('bracket-body');
  body.innerHTML = '';
  var rounds = tournament.rounds;
  var titles = ['QUARTER-FINALS','SEMI-FINALS','FINAL'];
  for (var r=0;r<rounds.length;r++){
    var col = document.createElement('div');
    col.className = 'bracket-col';
    var title = document.createElement('div');
    title.className = 'bracket-title';
    title.textContent = titles[r];
    col.appendChild(title);
    for (var i=0;i<rounds[r].length;i++){
      var m = rounds[r][i];
      var el = document.createElement('div');
      el.className = 'bracket-match';
      var isCurrent = (r === tournament.userMatchRound && i === tournament.userMatchIdx && !m.played && tournament.champion === null);
      var isDone = m.played;
      var isLocked = !m.a || !m.b;
      if (isCurrent) el.className += ' current';
      else if (isDone) el.className += ' done';
      else if (isLocked) el.className += ' locked';
      var nameA = m.a ? m.a.name : 'TBD';
      var codeA = m.a ? m.a.code : '—';
      var nameB = m.b ? m.b.name : 'TBD';
      var codeB = m.b ? m.b.code : '—';
      var winA = (m.winner && m.a === m.winner) ? ' win' : '';
      var winB = (m.winner && m.b === m.winner) ? ' win' : '';
      el.innerHTML =
        '<div class="bm-team' + winA + '">' + nameA + '<span class="code">' + codeA + '</span></div>' +
        '<div class="bm-team' + winB + '">' + nameB + '<span class="code">' + codeB + '</span></div>';
      col.appendChild(el);
    }
    body.appendChild(col);
  }
  if (tournament.champion){
    var trophy = document.createElement('div');
    trophy.className = 'trophy';
    var won = (tournament.champion === tournament.userCountry);
    trophy.innerHTML =
      '<div class="emoji">' + (won ? '🏆' : '🥈') + '</div>' +
      '<h3>' + (won ? 'CHAMPION!' : tournament.champion.name.toUpperCase()) + '</h3>' +
      '<p>' + (won ? '+' + tournament.reward + ' 🪙  TROPHY EARNED' : 'Better luck next time') + '</p>';
    body.appendChild(trophy);
  }
  document.getElementById('tour-coins').textContent = Math.floor(user.coins);
  var btn = document.getElementById('btn-next-tour-match');
  if (tournament.champion){
    btn.textContent = '🏆  NEW TOURNAMENT';
    btn.onclick = function(){ buildTournament(); renderTournament(); };
  } else {
    btn.textContent = '▶  PLAY NEXT MATCH';
    btn.onclick = startTournamentMatch;
  }
}

function startTournamentMatch(){
  if (!tournament) return;
  if (tournament.champion) return;
  var m = tournament.rounds[tournament.userMatchRound][tournament.userMatchIdx];
  if (!m || !m.a || !m.b) return;
  var opp = (m.a === tournament.userCountry) ? m.b : m.a;
  startMatch(opp.id, tournament.court);
}

function showScreen(id){

function bindTap(id, key){

function bindHold(id, dir){

}
bindHold('btnMoveL', -1);
bindHold('btnMoveR', 1);

/* Keyboard */
window.addEventListener('keydown', function(e){
  if (screen !== 'match') return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' '){ if (e.preventDefault) e.preventDefault(); press.spike = true; }
  if (e.key === 'e' || e.key === 'E') press.set = true;
  if (e.key === 'q' || e.key === 'Q') press.pass = true;
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') press.jump = true;
  if (e.key === 'f' || e.key === 'F') press.block = true;
  if (e.key === 'r' || e.key === 'R') press.serve = true;
  if (e.key === 'Tab'){ e.preventDefault(); document.getElementById('btnSwitch').click(); }
  if (e.key === 'Escape') pauseMatch();
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.right = false;
});

/* =========================================================
   PAUSE
   ========================================================= */
function pauseMatch(){ if (screen !== 'match') return; screen = 'pause'; showScreen('scr-pause'); }
function resumeMatch(){ if (screen !== 'pause') return; screen = 'match'; showScreen(''); lastTS = 0; }

/* =========================================================
   RESIZE
   ========================================================= */
function resizeApp(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H);
  document.getElementById('app').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resizeApp);
resizeApp();

/* =========================================================
   MAIN LOOP
   ========================================================= */
function loop(ts){
  try {
    var dt = Math.min(0.05, (ts - lastTS)/1000 || 0);
    lastTS = ts;

    if (screen === 'match' && match){
      updateMatch(dt);
      renderMatch();
    } else if (screen === 'home'){
      drawPreview(dt);
    } else {
      ctx.fillStyle = '#050810';
      ctx.fillRect(0,0,W,H);
    }
  } catch(err){
    if (window.console && console.error) console.error('Loop error:', err);
  }
  requestAnimationFrame(loop);
}
